  {"id":"Q09-013","ch":10,"q":"次の文の「権利の請願」の部分を正しく直すと？　――1215年、イングランド王は貴族に迫られ、権利の請願を認めた","a":"大憲章（マグナ＝カルタ）","d":["権利の請願","権利の章典","国王至上法"],"x":"ジョンは「欠地王」と呼ばれた王で、フランスにあった領地の多くをフィリップ2世に奪われているんだ。大憲章の原本は、今もイギリスにいくつか残ってるよ。","v":"MED"},
  {"id":"Q09-014","ch":10,"q":"次の文の「聖職者だけによる会議」の部分を正しく直すと？　――1265年、ヘンリ3世に反乱を起こした貴族は、聖職者だけによる会議を開かせた","a":"州や都市の代表も加えた議会","d":["聖職者だけによる会議","貴族だけによる会議","王の側近だけによる会議"],"x":"シモン自身はフランス生まれの貴族なんだ。この議会のあと、王太子エドワードとの戦いで戦死しているよ。","v":"MED"},
  {"id":"Q09-015","ch":10,"q":"次の文の「ビザンツ帝国」の部分を正しく直すと？　――フランス王ルイ9世の使節として、修道士がビザンツ帝国を訪れた","a":"モンゴル帝国","d":["ビザンツ帝国","マムルーク朝","マリ王国"],"x":"ルブルックはカラコルムまで行って、モンケ＝ハンに会っているんだ。そこでは、仏教徒やイスラーム教徒と宗教の討論もしたらしいよ。","v":"MED"},
  {"id":"Q09-016","ch":10,"q":"次の文の「騎士の突撃」の部分を正しく直すと？　――百年戦争の初期、イギリス軍は騎士の突撃によってフランス軍を破った","a":"長弓兵","d":["騎士の突撃","火砲","傭兵の海軍"],"x":"長弓兵の多くは、イギリスの農民出身だったんだ。黒太子というあだ名は、黒い鎧を着ていたから、という説があるよ。","v":"MED"},
  {"id":"Q09-017","ch":10,"q":"次の文の「イギリス王」の部分を正しく直すと？　――1429年、包囲されたオルレアンを解放した少女は、のちにイギリス王の戴冠を実現させた","a":"フランス王シャルル7世","d":["イギリス王","神聖ローマ皇帝","ブルゴーニュ公"],"x":"戴冠式はランスの大聖堂で行われたんだ。ジャンヌはそのあとイギリス側に引き渡されて、19歳で火刑になっているよ。","v":"MED"},
  {"id":"EAS-Q01-001","ch":11,"q":"唐の滅亡から宋の統一まで、華北に5つの王朝が交代した時代は？","a":"五代十国","d":["五胡十六国","南北朝","三国"],"x":"後唐をのぞく四つの王朝が、開封を都にしたんだ。","v":"EAS"},
  {"id":"EAS-Q01-002","ch":11,"q":"五代十国の時代から台頭した、武力などで土地を手に入れた新興の地主層を何という？","a":"形勢戸","d":["門閥貴族","節度使","郷紳"],"x":"唐までの名門貴族は、戦乱の中でほとんど滅んでしまったんだ。かわりに出てきたのがこの人たちだよ。","v":"EAS"},
  {"id":"EAS-Q01-003","ch":11,"q":"960年、陳橋の変で部下に推されて即位し、宋を建てたのは？","a":"趙匡胤","d":["朱全忠","王安石","李淵"],"x":"酔って寝ている間に、部下たちに皇帝の黄色い服を着せられていた、という話が伝わっているんだ。","v":"EAS"},
  {"id":"EAS-Q01-004","ch":11,"q":"趙匡胤（太祖）が建てた王朝は、のちの南宋と区別して何と呼ばれる？","a":"北宋","d":["後周","南宋","遼"],"x":"都は開封だよ。夜遅くまでにぎわう町のようすが、「清明上河図」という絵巻に描かれているんだ。","v":"EAS"},
  {"id":"EAS-Q01-005","ch":11,"q":"宋がとった、武人ではなく文人官僚に政治を任せる政策は？","a":"文治主義","d":["武断政治","郡国制","羈縻政策"],"x":"節度使の時代に懲りて、軍人の力を抑えたんだ。そのかわり、軍は弱くなってしまったよ。","v":"EAS"},
  {"id":"EAS-Q01-006","ch":11,"q":"1004年、宋が遼に毎年銀や絹を贈ることで結んだ和約は？","a":"澶淵の盟","d":["慶暦の和約","紹興の和議","ネルチンスク条約"],"x":"宋が兄、遼が弟という建前だったんだ。でもお金を払っているのは、兄のほうだったんだよ。","v":"EAS"},
  {"id":"EAS-Q01-007","ch":11,"q":"宋の神宗に仕え、青苗法・募役法などの新法で改革を進めた宰相は？","a":"王安石","d":["司馬光","蘇軾","張居正"],"x":"身なりに無頓着で、何日も顔を洗わなかったと言われているんだ。でも詩や文章の名手で、唐宋八大家の一人だよ。","v":"EAS"},
  {"id":"EAS-Q01-008","ch":11,"q":"王安石が率いた改革派を何という？","a":"新法党","d":["旧法党","東林派","主戦派"],"x":"改革と反対が、何十年も行ったり来たりしたんだ。その争いで、宋の政治は疲れきってしまったよ。","v":"EAS"},
  {"id":"EAS-Q01-009","ch":11,"q":"王安石の改革に反対した保守派の指導者は？","a":"司馬光","d":["王安石","蘇軾","朱熹"],"x":"子どものころ、水がめに落ちた友だちを、かめを石で割って助けたという話が有名なんだ。","v":"EAS"},
  {"id":"EAS-Q01-010","ch":11,"q":"司馬光が率いた保守派を何という？","a":"旧法党","d":["新法党","主戦派","和平派"],"x":"昔からの決まりを守るのが一番、という人たちだね。","v":"EAS"},
  {"id":"EAS-Q01-011","ch":11,"q":"司馬光が著した、編年体の歴史書は？","a":"『資治通鑑』","d":["『史記』","『漢書』","『四庫全書』"],"x":"「政治の参考になる鏡」という意味の題名なんだ。完成までに19年かかったよ。","v":"EAS"},
  {"id":"EAS-Q02-001","ch":11,"q":"前8世紀ごろ、周の都・鎬京を攻め落とした北西の遊牧民は？","a":"犬戎","d":["匈奴","鮮卑","柔然"],"x":"この侵入で周は東の洛邑に都を移したんだ。西周の終わりだね。","v":"EAS"},
  {"id":"EAS-Q02-002","ch":11,"q":"冒頓単于のもとでモンゴル高原を統一し、漢の高祖を破った遊牧民は？","a":"匈奴","d":["鮮卑","突厥","契丹"],"x":"のちに南北に分かれて、北匈奴は西へ去っていったんだ。ヨーロッパに現れたフン人がその子孫だという説もあるけど、確かではないよ。","v":"EAS"},
  {"id":"EAS-Q02-003","ch":11,"q":"匈奴のあとにモンゴル高原で台頭し、その一派の拓跋氏が北魏を建てた民族は？","a":"鮮卑","d":["柔然","突厥","女真"],"x":"北魏のあと、隋や唐の皇帝の一族にも、鮮卑の血が入っているんだ。","v":"EAS"},
  {"id":"EAS-Q02-004","ch":11,"q":"6世紀に柔然を倒し、モンゴル高原から中央アジアに大帝国を築いたトルコ系遊牧民は？","a":"突厥","d":["ウイグル","キルギス","契丹"],"x":"「テュルク」の音を漢字で写した名前なんだ。トルコという国名の語源だよ。","v":"EAS"},
  {"id":"EAS-Q02-005","ch":11,"q":"安史の乱で唐を助け、マニ教を国教としたトルコ系遊牧民は？","a":"ウイグル","d":["突厥","キルギス","タングート"],"x":"モンゴル高原に、城壁のある町まで築いていたんだ。遊牧民としては珍しいことだよ。","v":"EAS"},
  {"id":"EAS-Q02-006","ch":11,"q":"840年、ウイグルを滅ぼしてモンゴル高原を支配した遊牧民は？","a":"キルギス","d":["突厥","契丹","鮮卑"],"x":"もとはシベリアのエニセイ川のあたりにいた人たちなんだ。ウイグルの人々は、このあと西へ散っていったよ。","v":"EAS"},
  {"id":"EAS-Q02-007","ch":11,"q":"11世紀、タングートの李元昊が中国西北部に建てた国は？","a":"西夏","d":["遼","金","吐蕃"],"x":"西夏文字は漢字に似ているけど、もっと画数が多くて複雑なんだ。今は研究者が少しずつ解読しているよ。","v":"EAS"},
  {"id":"EAS-Q02-008","ch":11,"q":"916年、耶律阿保機が建てた契丹人の国は？","a":"遼","d":["金","西夏","渤海"],"x":"ロシア語では、今でも中国のことを「キタイ」と呼ぶんだ。契丹の名前が、そのまま残っているんだね。","v":"EAS"},
  {"id":"EAS-Q02-009","ch":11,"q":"遼が926年に滅ぼした、中国東北地方から朝鮮半島北部にあった国は？","a":"渤海","d":["高句麗","新羅","高麗"],"x":"日本とも盛んに使節を送り合った国なんだ。","v":"EAS"},
  {"id":"EAS-Q02-010","ch":11,"q":"遼が後晋の建国を助けた見返りに得た、北京・大同周辺の地域は？","a":"燕雲十六州","d":["河西回廊","華北平原","淮河流域"],"x":"農業が盛んで漢人が多く住む土地なんだ。宋は、この地域を取り返すのが悲願だったよ。","v":"EAS"},
  {"id":"EAS-Q02-011","ch":11,"q":"遼で、漢字をもとにつくられた文字は？","a":"契丹文字","d":["西夏文字","パスパ文字","女真文字"],"x":"まだ完全には読めていない文字なんだ。","v":"EAS"},
  {"id":"EAS-Q02-012","ch":11,"q":"遼から自立して金を建てた、ツングース系の民族は？","a":"女真","d":["契丹","タングート","モンゴル"],"x":"のちに清を建てるのも、この女真の人たちなんだ。","v":"EAS"},
  {"id":"EAS-Q02-013","ch":11,"q":"1115年、女真の完顔阿骨打が建てた国は？","a":"金","d":["遼","西夏","清"],"x":"「遼は鉄という意味だが、鉄はさびる。金はさびない」と言って、国号を金にしたと伝えられているよ。","v":"EAS"},
  {"id":"EAS-Q02-014","ch":11,"q":"遼の滅亡後、耶律大石が中央アジアに建てた国は？","a":"西遼（カラ＝キタイ）","d":["西夏","遼","カラ＝ハン朝"],"x":"東方のキリスト教国の王「プレスター・ジョン」の伝説は、この国のうわさが元になったとも言われているんだ。","v":"EAS"},
  {"id":"EAS-Q03-001","ch":11,"q":"書画にすぐれ「桃鳩図」を描いたが、靖康の変で金に連れ去られた北宋の上皇は？","a":"徽宗","d":["欽宗","高宗","太祖"],"x":"皇帝としてはだめだったけど、芸術家としては一流なんだ。「痩金体」という、細くてするどい字の書き方も編み出しているよ。","v":"EAS"},
  {"id":"EAS-Q03-002","ch":11,"q":"靖康の変で、上皇徽宗とともに金に連れ去られた北宋の皇帝は？","a":"欽宗","d":["高宗","神宗","太祖"],"x":"二人とも、金の国で亡くなるまで帰ってこられなかったんだ。","v":"EAS"},
  {"id":"EAS-Q03-003","ch":11,"q":"1126〜27年、金が開封を攻め落とし、北宋の上皇と皇帝を連れ去った事件は？","a":"靖康の変","d":["靖難の役","土木の変","安史の乱"],"x":"明の「靖難の役」と名前が似ているから、気をつけてね。","v":"EAS"},
  {"id":"EAS-Q03-004","ch":11,"q":"靖康の変ののち、江南に逃れて臨安を都に宋を再建したのは？","a":"高宗","d":["徽宗","欽宗","太宗"],"x":"欽宗の弟なんだ。兄が帰ってくると自分の立場が危なくなるから、本気で取り返す気はなかった、という見方もあるよ。","v":"EAS"},
  {"id":"EAS-Q03-005","ch":11,"q":"高宗が臨安を都として再建した王朝を何という？","a":"南宋","d":["北宋","後周","西遼"],"x":"臨安は今の杭州だよ。景色のきれいな西湖があって、マルコ＝ポーロも「世界一すばらしい町」と書いているんだ。","v":"EAS"},
  {"id":"EAS-Q03-006","ch":11,"q":"南宋で、金に対して徹底抗戦を主張した岳飛らの一派は？","a":"主戦派","d":["和平派","新法党","東林派"],"x":"岳飛の背中には、母が「尽忠報国」と入れ墨したと言われているんだ。","v":"EAS"},
  {"id":"EAS-Q03-007","ch":11,"q":"南宋で、秦檜らが中心となって金との和議を進めた一派は？","a":"和平派","d":["主戦派","旧法党","非東林派"],"x":"秦檜は岳飛を処刑させたから、今でも悪者扱いなんだ。岳飛の廟には、ひざまずく秦檜夫妻の像が置かれているよ。","v":"EAS"},
  {"id":"EAS-Q03-008","ch":11,"q":"1279年の厓山の戦いで南宋を滅ぼしたときの、モンゴル（元）の君主は？","a":"フビライ＝ハン","d":["チンギス＝ハン","オゴデイ＝ハン","モンケ＝ハン"],"x":"追いつめられた南宋の家臣は、幼い皇帝を背負って海に身を投げたんだ。","v":"EAS"},
  {"id":"EAS-Q03-009","ch":11,"q":"宋代の長江下流域の豊かさを表した言葉は？","a":"蘇湖（江浙）熟すれば天下足る","d":["湖広熟すれば天下足る","南船北馬","江南の春"],"x":"この地方で米がとれれば、国中が食べていける。それくらいの穀倉地帯になったんだ。","v":"EAS"},
  {"id":"EAS-Q03-010","ch":11,"q":"宋代以降、陶磁器の代表的な生産地となった江西省の町は？","a":"景徳鎮","d":["開封","臨安","泉州"],"x":"町の名前は、宋の年号「景徳」から取っているんだ。今も陶磁器の町だよ。","v":"EAS"},
  {"id":"EAS-Q03-011","ch":11,"q":"宋代の陶磁器で、青緑色の釉薬をかけたものは？","a":"青磁","d":["白磁","染付","唐三彩"],"x":"日本のお茶の席でも、宋の青磁は大切にされてきたんだ。","v":"EAS"},
  {"id":"EAS-Q03-012","ch":11,"q":"宋代の陶磁器で、白い素地に透明な釉薬をかけたものは？","a":"白磁","d":["青磁","赤絵","唐三彩"],"x":"すっきりとした白さが、宋の人の好みに合ったんだ。","v":"EAS"},
  {"id":"EAS-Q03-013","ch":11,"q":"宋代の都市で、商人がつくった同業組合を何という？","a":"行","d":["作","ギルド","公行"],"x":"「銀行」の「行」は、ここから来ているんだ。","v":"EAS"},
  {"id":"EAS-Q03-014","ch":11,"q":"宋代の都市で、手工業者がつくった同業組合を何という？","a":"作","d":["行","会館","ツンフト"],"x":"ものを作る人たちの組合だから「作」なんだ。","v":"EAS"},
  {"id":"EAS-Q03-015","ch":11,"q":"北宋で使われた、世界初の紙幣とされるものは？","a":"交子","d":["会子","交鈔","宝鈔"],"x":"もとは、重い鉄銭のかわりに商人が使っていた預かり証なんだ。","v":"EAS"},
  {"id":"EAS-Q03-016","ch":11,"q":"南宋で使われた紙幣は？","a":"会子","d":["交子","交鈔","開元通宝"],"x":"紙幣を刷りすぎて、物の値段が上がってしまったこともあったんだ。","v":"EAS"},
  {"id":"EAS-Q03-017","ch":11,"q":"『太極図説』を著し、宋学の祖とされる学者は？","a":"周敦頤","d":["朱熹","王陽明","程頤"],"x":"ハスの花を愛した「愛蓮説」という文章でも知られているよ。泥の中から生えても、汚れないからね。","v":"EAS"},
  {"id":"EAS-Q03-018","ch":11,"q":"宋学を大成し、四書を重んじた南宋の学者は？","a":"朱熹","d":["周敦頤","王陽明","司馬光"],"x":"朱熹の学問は、のちに江戸幕府の公式の学問にもなったんだ。","v":"EAS"},
  {"id":"EAS-Q03-019","ch":11,"q":"朱熹が大成した宋学を何という？","a":"朱子学","d":["陽明学","考証学","訓詁学"],"x":"身分の上下や君臣の区別を大切にする考え方だから、支配する側に好まれたんだ。","v":"EAS"},
  {"id":"EAS-Q03-020","ch":11,"q":"唐宋八大家の一人で、王安石の新法に反対して流罪となった北宋の文人は？","a":"蘇軾","d":["欧陽脩","司馬光","韓愈"],"x":"料理も好きで、豚の角煮の「東坡肉（トンポーロー）」は、彼の号の東坡から名づけられたんだ。","v":"EAS"},
  {"id":"EAS-Q04-001","ch":11,"q":"モンゴルで、ハンの選出など重要事項を決めた有力者の集会は？","a":"クリルタイ","d":["ジルガ","民会","三部会"],"x":"ハンが亡くなるとクリルタイを開くから、遠征中の皇族もみんな帰ってきたんだ。そのおかげで、ヨーロッパは助かったんだよ。","v":"EAS"},
  {"id":"EAS-Q04-002","ch":11,"q":"1206年のクリルタイでハンに選ばれ、モンゴル帝国を建てたテムジンの称号は？","a":"チンギス＝ハン","d":["フビライ＝ハン","オゴデイ＝ハン","ティムール"],"x":"若いころは父を殺され、家族と草の根を食べて暮らすほど貧しかったんだ。","v":"EAS"},
  {"id":"EAS-Q04-003","ch":11,"q":"チンギス＝ハンが行った、遊牧民を1000戸ごとにまとめて兵を出させる制度は？","a":"千戸制","d":["猛安・謀克","八旗","衛所制"],"x":"部族のつながりを切って、ハンに直接従う組織に作りかえたんだ。","v":"EAS"},
  {"id":"EAS-Q04-004","ch":11,"q":"モンゴル帝国第2代のオゴデイ＝ハンが建設した都は？","a":"カラコルム","d":["大都","サライ","サマルカンド"],"x":"今はほとんど何も残っていない草原なんだ。世界中から人や物が集まった都だったのにね。","v":"EAS"},
  {"id":"EAS-Q04-005","ch":11,"q":"1241年、バトゥ率いるモンゴル軍がドイツ・ポーランド連合軍を破った戦いは？","a":"ワールシュタットの戦い","d":["アンカラの戦い","タラス河畔の戦い","ニコポリスの戦い"],"x":"オゴデイが亡くなった知らせで、モンゴル軍は急に引き返していったんだ。","v":"EAS"},
  {"id":"EAS-Q04-006","ch":11,"q":"第4代モンケ＝ハンの弟で、南宋を滅ぼし元を建てたのは？","a":"フビライ（クビライ）","d":["フラグ","バトゥ","オゴデイ"],"x":"マルコ＝ポーロが仕えたとされる皇帝だね。","v":"EAS"},
  {"id":"EAS-Q04-007","ch":11,"q":"第4代モンケ＝ハンの弟で、バグダードを陥落させてアッバース朝を滅ぼしたのは？","a":"フラグ（フレグ）","d":["フビライ","バトゥ","チャガタイ"],"x":"妻がキリスト教徒だったから、バグダードのキリスト教徒は殺されずにすんだ、とも言われているよ。","v":"EAS"},
  {"id":"EAS-Q04-008","ch":11,"q":"フラグがイラン地域に建てた国は？","a":"イル＝ハン国","d":["キプチャク＝ハン国","チャガタイ＝ハン国","ティムール朝"],"x":"のちに、イスラームを国の宗教にするんだ。","v":"EAS"},
  {"id":"EAS-Q05-001","ch":11,"q":"1271年、フビライが国号を定め、大都を都とした王朝は？","a":"元","d":["金","明","西遼"],"x":"「元」は、易経の「大いなるかな乾元」という言葉から取ったんだ。中国風の名前をつけたんだね。","v":"EAS"},
  {"id":"EAS-Q05-002","ch":11,"q":"元の末期、白蓮教徒が中心となって起こした農民反乱は？","a":"紅巾の乱","d":["黄巾の乱","赤眉の乱","黄巣の乱"],"x":"目印に赤い布を頭に巻いたんだ。漢の黄巾の乱と混ぜないようにね。","v":"EAS"},
  {"id":"EAS-Q05-003","ch":11,"q":"元の中国支配で、行政の中心を担った中央アジア・西アジア出身の人々を何という？","a":"色目人","d":["漢人","南人","モンゴル人"],"x":"「いろいろな種類の人」という意味なんだ。計算が得意で、財政の仕事を任されることが多かったよ。","v":"EAS"},
  {"id":"EAS-Q05-004","ch":11,"q":"イスラームの天文学を取り入れ、授時暦をつくった元の学者は？","a":"郭守敬","d":["徐光啓","耶律楚材","宋応星"],"x":"授時暦は、のちに日本でも江戸時代の暦づくりの手本にされたんだ。","v":"EAS"},
  {"id":"EAS-Q05-005","ch":11,"q":"郭守敬がつくった暦は？","a":"授時暦","d":["崇禎暦書","太陰暦","ユリウス暦"],"x":"1年を365.2425日としていて、今の暦とほとんど同じ精度なんだ。","v":"EAS"},
  {"id":"EAS-Q05-006","ch":11,"q":"元の時代に流行した、歌と台詞からなる演劇は？","a":"元曲","d":["京劇","能","雑劇の詞"],"x":"科挙が止まって役人になれなかった知識人たちが、脚本を書いたんだ。","v":"EAS"},
  {"id":"EAS-Q05-007","ch":11,"q":"梁山泊に集まった108人の好漢を描いた小説は？","a":"『水滸伝』","d":["『三国志演義』","『西遊記』","『紅楼夢』"],"x":"「天に替わって道を行う」が合い言葉なんだ。悪役の宰相の高俅は、実在の人物だよ。","v":"EAS"},
  {"id":"EAS-Q05-008","ch":11,"q":"唐の玄奘をモデルにした三蔵法師が、孫悟空らとともに天竺へ経典を取りに行く小説は？","a":"『西遊記』","d":["『水滸伝』","『三国志演義』","『金瓶梅』"],"x":"本当の玄奘は、一人で国の禁を破って出かけたんだ。お供の猿はいなかったよ。","v":"EAS"},
  {"id":"EAS-Q05-009","ch":11,"q":"三国時代の蜀の劉備陣営を中心に描いた歴史小説は？","a":"『三国志演義』","d":["『水滸伝』","『西遊記』","『漢宮秋』"],"x":"正史の『三国志』とは別物なんだ。こちらは小説だから、関羽や諸葛亮がかなり格好よく描かれているよ。","v":"EAS"},
  {"id":"EAS-Q05-010","ch":11,"q":"元の時代にイスラームから伝わったコバルト顔料を使い、白地に青で絵付けした磁器は？","a":"染付","d":["青磁","白磁","唐三彩"],"x":"ペルシアの青い顔料と、景徳鎮の白い磁器が出会って生まれたんだ。モンゴルが東西をつないだからこそだね。","v":"EAS"},
  {"id":"EAS-Q05-011","ch":11,"q":"元で整備された、公用の旅行者に馬や食料を提供した駅伝制は？","a":"ジャムチ","d":["王の道","牌符","千戸制"],"x":"およそ40キロごとに駅が置かれていたんだ。","v":"EAS"},
  {"id":"EAS-Q05-012","ch":11,"q":"元の駅伝制で、公用の旅行者が身分証明として持った札は？","a":"牌符","d":["交鈔","勘合","魚鱗図冊"],"x":"金や銀でできた板で、文字が刻まれていたんだ。これを見せれば、どこの駅でも馬を出してもらえたよ。","v":"EAS"},
  {"id":"EAS-Q05-013","ch":11,"q":"元で発行された紙幣は？","a":"交鈔","d":["交子","会子","宝鈔"],"x":"マルコ＝ポーロは、紙がお金になることにとても驚いているんだ。","v":"EAS"},
  {"id":"EAS-Q05-014","ch":11,"q":"元の時代、海の道で陶磁器が大量に運ばれたことから、海の道は何と呼ばれた？","a":"陶磁の道","d":["絹の道","草原の道","王の道"],"x":"割れやすくて重い陶磁器は、陸より船で運ぶほうが向いていたんだ。","v":"EAS"},
  {"id":"EAS-Q05-015","ch":11,"q":"ヴェネツィアの商人で、フビライに仕えたとされ、見聞録を残したのは？","a":"マルコ＝ポーロ","d":["イブン＝バットゥータ","ルブルック","プラノ＝カルピニ"],"x":"帰国後に戦争で捕虜になって、牢屋の中で同じ囚人に旅の話を語ったんだ。それが本になったんだよ。","v":"EAS"},
  {"id":"EAS-Q05-016","ch":11,"q":"マルコ＝ポーロの見聞をまとめた書物は？","a":"『世界の記述（東方見聞録）』","d":["『三大陸周遊記』","『大唐西域記』","『集史』"],"x":"日本を「黄金の国ジパング」として紹介しているんだ。コロンブスもこの本を読んで、航海に出たよ。","v":"EAS"},
  {"id":"EAS-Q05-017","ch":11,"q":"14世紀後半、サマルカンドを都に中央アジアに建てられた国は？","a":"ティムール朝","d":["イル＝ハン国","オスマン帝国","ムガル帝国"],"x":"ティムールはチンギス＝ハンの子孫ではないから、ハンを名乗らなかったんだ。","v":"EAS"},
  {"id":"EAS-Q05-018","ch":11,"q":"1402年、ティムールがオスマン帝国を破った戦いは？","a":"アンカラの戦い","d":["ワールシュタットの戦い","ニコポリスの戦い","モハーチの戦い"],"x":"オスマンの皇帝バヤジット1世は捕まって、まもなく亡くなったんだ。","v":"EAS"},
  {"id":"EAS-Q05-019","ch":11,"q":"ティムール朝に使者を送ったカスティリャ王国が望んだことは？","a":"オスマン帝国に対抗する同盟","d":["元との交易","キリスト教の布教","ジャムチの利用"],"x":"敵の敵は味方、ということだね。ただ使者が着いたとき、ティムールはもう亡くなる直前だったんだ。","v":"EAS"},
  {"id":"EAS-Q06-001","ch":12,"q":"紅巾の乱から台頭し、1368年に明を建てたのは？","a":"朱元璋（洪武帝）","d":["朱棣（永楽帝）","李自成","張居正"],"x":"貧しい農家の生まれで、食べるために一時は寺の小僧になっていたんだ。","v":"EAS"},
  {"id":"EAS-Q06-002","ch":12,"q":"朱元璋が建てた王朝は？","a":"明","d":["元","清","宋"],"x":"モンゴルを追い出して、漢人の王朝を取り戻したんだ。","v":"EAS"},
  {"id":"EAS-Q06-003","ch":12,"q":"明が建国された年は？","a":"1368年","d":["1271年","1402年","1644年"],"x":"元が北へ退いた年でもあるよ。","v":"EAS"},
  {"id":"EAS-Q06-004","ch":12,"q":"明の最初の都は？","a":"南京","d":["北京","開封","臨安"],"x":"長江のほとりにある町で、昔は金陵や建康とも呼ばれていたんだ。","v":"EAS"},
  {"id":"EAS-Q06-005","ch":12,"q":"洪武帝が、皇帝の独裁を強めるために廃止した中央官庁は？","a":"中書省","d":["門下省","尚書省","御史台"],"x":"宰相の役所をなくして、六部を皇帝が直接動かすようにしたんだ。","v":"EAS"},
  {"id":"EAS-Q06-006","ch":12,"q":"洪武帝が中書省を廃止したあと、皇帝に直属させた行政機関は？","a":"六部","d":["三省","内閣","軍機処"],"x":"宰相がいなくなったぶん、皇帝の仕事はものすごく増えたんだ。洪武帝は一日に何百件もの書類を自分で見ていたらしいよ。","v":"EAS"},
  {"id":"EAS-Q06-007","ch":12,"q":"明で、皇帝を補佐するために置かれた官職は？","a":"内閣大学士","d":["宰相","節度使","色目人"],"x":"もとは皇帝の秘書のような役目だったんだ。だんだん、実質的な宰相になっていったよ。","v":"EAS"},
  {"id":"EAS-Q06-008","ch":12,"q":"明で、軍戸と呼ばれる家から兵士を出させた兵制は？","a":"衛所制","d":["府兵制","募兵制","八旗"],"x":"軍人の家は、代々軍人と決められていたんだ。","v":"EAS"},
  {"id":"EAS-Q06-009","ch":12,"q":"明で、110戸を一里として徴税や治安維持にあたらせた村落制度は？","a":"里甲制","d":["保甲法","千戸制","郷挙里選"],"x":"10戸ずつの甲を10組と、とりまとめ役の10戸で一里なんだ。","v":"EAS"},
  {"id":"EAS-Q06-010","ch":12,"q":"明で作成された、土地の面積や所有者を記した土地台帳は？","a":"魚鱗図冊","d":["賦役黄冊","永楽大典","皇輿全覧図"],"x":"区切られた土地の図が、魚のうろこのように見えたからこの名前なんだ。","v":"EAS"},
  {"id":"EAS-Q06-011","ch":12,"q":"明で作成された、戸籍と租税の台帳は？","a":"賦役黄冊","d":["魚鱗図冊","性理大全","四庫全書"],"x":"表紙に黄色い紙を使ったから「黄冊」なんだ。10年ごとに作り直したよ。","v":"EAS"},
  {"id":"EAS-Q06-012","ch":12,"q":"洪武帝が民衆に示した、親孝行など6か条の教えは？","a":"六諭","d":["十戒","五経","四書"],"x":"江戸時代の日本でも、寺子屋の教科書として広く使われたんだ。","v":"EAS"},
  {"id":"EAS-Q06-013","ch":12,"q":"明で官学とされた儒学は？","a":"朱子学","d":["陽明学","考証学","訓詁学"],"x":"科挙の答えも、朱子学の解釈で書かなければいけなかったんだ。","v":"EAS"},
  {"id":"EAS-Q06-014","ch":12,"q":"洪武帝の死後、建文帝に対して反乱を起こして即位した燕王は？","a":"朱棣","d":["朱元璋","朱全忠","李自成"],"x":"即位したあと、建文帝の時代の記録を消させたんだ。建文帝の最期も、はっきりとはわかっていないよ。","v":"EAS"},
  {"id":"EAS-Q06-015","ch":12,"q":"燕王朱棣が即位して名乗った称号は？","a":"永楽帝","d":["洪武帝","万暦帝","正統帝"],"x":"都を自分の本拠地の北京に移して、紫禁城を建てたんだ。","v":"EAS"},
  {"id":"EAS-Q06-016","ch":12,"q":"燕王朱棣が建文帝から帝位を奪った内乱は？","a":"靖難の役","d":["靖康の変","土木の変","三藩の乱"],"x":"「帝室の難を靖んずる」という名目で兵を挙げたんだ。宋の「靖康の変」と混ぜないようにね。","v":"EAS"},
  {"id":"EAS-Q06-017","ch":12,"q":"永楽帝の命で、大艦隊を率いてアフリカ東岸まで遠征したムスリムの宦官は？","a":"鄭和","d":["王直","張居正","郭守敬"],"x":"長さ100メートルを超える大きな船もあったと言われているんだ。アフリカから、キリンを連れて帰ってきたよ。","v":"EAS"},
  {"id":"EAS-Q06-018","ch":12,"q":"中国の皇帝が周辺国の君主に称号を与え、君臣関係を結ぶ国際秩序を何という？","a":"冊封体制","d":["羈縻政策","海禁政策","朝貢貿易"],"x":"形の上では家来になるけど、貢ぎ物よりたくさんの返礼品がもらえたんだ。","v":"EAS"},
  {"id":"EAS-Q06-019","ch":12,"q":"周辺国が中国の皇帝に貢ぎ物を献上し、返礼品を受け取る形の貿易は？","a":"朝貢貿易","d":["勘合貿易","互市","中継貿易"],"x":"国と国との正式な貿易は、この形しか認められなかったんだ。","v":"EAS"},
  {"id":"EAS-Q06-020","ch":12,"q":"倭寇を防ぐため、明が民間の海上貿易を禁じた政策は？","a":"海禁政策","d":["鎖国","羈縻政策","文治主義"],"x":"禁じられても、密貿易はなくならなかったんだ。かえって倭寇が増えてしまったよ。","v":"EAS"},
  {"id":"EAS-Q06-021","ch":12,"q":"明と日本の室町幕府の間で、正式な船の証明となる割符を使って行われた貿易は？","a":"勘合貿易","d":["朝貢貿易","朱印船貿易","南蛮貿易"],"x":"割符をぴったり合わせて、本物の使いか確かめたんだ。","v":"EAS"},
  {"id":"EAS-Q06-022","ch":12,"q":"永楽帝が編纂させた、四書の注釈書は？","a":"『四書大全』","d":["『四書集注』","『五経正義』","『性理大全』"],"x":"科挙の受験生のための、国が定めた教科書のようなものだね。","v":"EAS"},
  {"id":"EAS-Q06-023","ch":12,"q":"永楽帝が編纂させた、五経の注釈書は？","a":"『五経大全』","d":["『五経正義』","『四書大全』","『古今図書集成』"],"x":"唐の『五経正義』と名前が似ているから、気をつけてね。","v":"EAS"},
  {"id":"EAS-Q06-024","ch":12,"q":"永楽帝が編纂させた、宋学（朱子学）の学説を集めた書物は？","a":"『性理大全』","d":["『永楽大典』","『四庫全書』","『資治通鑑』"],"x":"人の本性と天の理について、宋の学者たちの説をまとめた本なんだ。","v":"EAS"},
  {"id":"EAS-Q06-025","ch":12,"q":"永楽帝が編纂させた、1万冊を超える大百科事典は？","a":"『永楽大典』","d":["『四庫全書』","『古今図書集成』","『性理大全』"],"x":"本物はほとんど失われて、今は写本の一部が世界各地に残っているだけなんだ。","v":"EAS"},
  {"id":"EAS-Q07-001","ch":12,"q":"15〜16世紀、明を苦しめた北方のモンゴルと南方の倭寇の侵入を合わせて何という？","a":"北虜南倭","d":["南船北馬","北狄南蛮","内憂外患"],"x":"北と南、両方から攻められて、明のお金はどんどん減っていったんだ。","v":"EAS"},
  {"id":"EAS-Q07-002","ch":12,"q":"明の沿岸を荒らした海賊集団は？","a":"倭寇","d":["ヴァイキング","私掠船","海の民"],"x":"後期の倭寇は、日本人よりも中国人のほうが多かったんだ。","v":"EAS"},
  {"id":"EAS-Q07-003","ch":12,"q":"後期倭寇の首領で、五島列島などを拠点に活動した中国人は？","a":"王直","d":["鄭和","鄭成功","李自成"],"x":"種子島に鉄砲を伝えたポルトガル人の船には、この王直が乗っていたと言われているんだ。","v":"EAS"},
  {"id":"EAS-Q07-004","ch":12,"q":"万暦帝の初期に政治を担い、財政を立て直した内閣大学士は？","a":"張居正","d":["徐光啓","王陽明","鄭和"],"x":"厳しい人で、幼い万暦帝の先生でもあったんだ。亡くなったとたん、恨みを買っていた人たちに家を取りつぶされたよ。","v":"EAS"},
  {"id":"EAS-Q07-005","ch":12,"q":"張居正が全国に広めた、各種の税や労役を銀でまとめて納めさせる税制は？","a":"一条鞭法","d":["両税法","地丁銀制","租庸調"],"x":"日本とメキシコから大量の銀が入ってきたから、できた税制なんだ。","v":"EAS"},
  {"id":"EAS-Q07-006","ch":12,"q":"明末、宦官と結んだ官僚たちと対立した、無錫の書院を拠点とする官僚・学者のグループは？","a":"東林派","d":["旧法党","主戦派","新法党"],"x":"政治を正そうとした人たちだけど、宦官の側に激しく弾圧されてしまったんだ。","v":"EAS"},
  {"id":"EAS-Q07-007","ch":12,"q":"16世紀末、李氏朝鮮に出兵し、明も援軍を送った日本の人物は？","a":"豊臣秀吉","d":["足利義満","織田信長","徳川家康"],"x":"朝鮮と明の両方が大きな負担を負って、明の衰えにつながったんだ。","v":"EAS"},
  {"id":"EAS-Q07-008","ch":12,"q":"1644年、農民反乱を率いて北京を占領し、明を滅ぼしたのは？","a":"李自成","d":["呉三桂","張献忠","黄巣"],"x":"皇帝を名乗ったけど、北京にいられたのはほんの40日ほどだったんだ。","v":"EAS"},
  {"id":"EAS-Q07-009","ch":12,"q":"明代、穀倉地帯が長江中流域に移ったことを表した言葉は？","a":"湖広熟すれば天下足る","d":["蘇湖熟すれば天下足る","天下の台所","南船北馬"],"x":"長江の下流では綿や桑づくりが盛んになって、米は中流域から運ばれるようになったんだ。","v":"EAS"},
  {"id":"EAS-Q07-010","ch":12,"q":"明代の四大奇書の一つで、『水滸伝』の登場人物を主役にした小説は？","a":"『金瓶梅』","d":["『紅楼夢』","『聊斎志異』","『儒林外史』"],"x":"『水滸伝』では早々に死ぬはずの二人が、生き延びていたら、という話なんだ。","v":"EAS"},
  {"id":"EAS-Q07-011","ch":12,"q":"朱子学を批判し、「知行合一」を説いて陽明学を始めた明の学者は？","a":"王陽明（王守仁）","d":["朱熹","李贄","顧炎武"],"x":"竹をじっと見つめて「理」を知ろうとして、7日目に病気になってしまったんだ。それで、朱子学のやり方に疑問を持ったと言われているよ。","v":"EAS"},
  {"id":"EAS-Q07-012","ch":12,"q":"王陽明が始めた儒学は？","a":"陽明学","d":["朱子学","考証学","宋学"],"x":"幕末の日本で、吉田松陰や西郷隆盛も影響を受けたんだ。","v":"EAS"},
  {"id":"EAS-Q07-013","ch":12,"q":"陽明学で重視された、「知ることと行うことは一つ」という考えは？","a":"知行合一","d":["心即理","性即理","格物致知"],"x":"知っているのにやらないのは、本当は知らないのと同じ、ということだね。","v":"EAS"},
  {"id":"EAS-Q07-014","ch":12,"q":"マテオ＝リッチに学び、『農政全書』を著した明の学者・官僚は？","a":"徐光啓","d":["宋応星","李時珍","王陽明"],"x":"上海の出身なんだ。今の上海の「徐家匯」という地名は、彼の一族が住んでいたことから来ているよ。","v":"EAS"},
  {"id":"EAS-Q07-015","ch":12,"q":"李時珍が著した、薬になる動植物を集めた書物は？","a":"『本草綱目』","d":["『天工開物』","『農政全書』","『崇禎暦書』"],"x":"30年近くかけて、1800種以上の薬をまとめたんだ。","v":"EAS"},
  {"id":"EAS-Q07-016","ch":12,"q":"宋応星が著した、図入りの産業技術書は？","a":"『天工開物』","d":["『本草綱目』","『農政全書』","『幾何原本』"],"x":"中国ではいったん忘れられて、日本に残っていた本から再発見されたんだ。","v":"EAS"},
  {"id":"EAS-Q08-001","ch":12,"q":"1673年、呉三桂ら漢人の藩王が清に対して起こした反乱は？","a":"三藩の乱","d":["靖難の役","紅巾の乱","太平天国の乱"],"x":"康熙帝はまだ20歳くらいだったけど、8年かけてこれを鎮めたんだ。","v":"EAS"},
  {"id":"EAS-Q08-002","ch":12,"q":"1689年、清の康熙帝がロシアのピョートル1世と結んだ国境条約は？","a":"ネルチンスク条約","d":["キャフタ条約","北京条約","アイグン条約"],"x":"ラテン語で書かれていて、間に入って訳したのはイエズス会の宣教師だったんだ。","v":"EAS"},
  {"id":"EAS-Q08-003","ch":12,"q":"雍正帝がロシアと結び、モンゴル方面の国境を定めた条約は？","a":"キャフタ条約","d":["ネルチンスク条約","イリ条約","南京条約"],"x":"キャフタは国境の町で、ここで両国の商人が取り引きをしたんだ。","v":"EAS"},
  {"id":"EAS-Q08-004","ch":12,"q":"雍正帝の時代に全国に広まった、人頭税を土地税に組み込んで銀で納めさせる税制は？","a":"地丁銀制","d":["一条鞭法","両税法","租庸調"],"x":"人頭税がなくなったから、戸籍に届け出る人が増えて、清の人口は急に増えて見えたんだ。","v":"EAS"},
  {"id":"EAS-Q08-005","ch":12,"q":"イエズス会の宣教師カスティリオーネが設計にかかわった、西洋式の庭園を持つ清の離宮は？","a":"円明園","d":["紫禁城","頤和園","避暑山荘"],"x":"噴水やバロック風の建物もあったんだ。でも19世紀に英仏の軍に焼かれて、今は廃墟だよ。","v":"EAS"},
  {"id":"EAS-Q08-006","ch":12,"q":"円明園の西洋風の建物に取り入れられた建築様式は？","a":"バロック式","d":["ゴシック式","ロマネスク式","ビザンツ式"],"x":"ヨーロッパの宮殿のような建物が、中国の庭の中にあったんだ。","v":"EAS"},
  {"id":"EAS-Q08-007","ch":12,"q":"円明園を英仏軍が破壊した戦争は？","a":"アロー戦争","d":["アヘン戦争","清仏戦争","日清戦争"],"x":"中国の人たちにとって、今も忘れられない出来事なんだ。","v":"EAS"},
  {"id":"EAS-Q08-008","ch":12,"q":"乾隆帝がジュンガルや回部を平定して名づけた、「新しい領土」を意味する地域は？","a":"新疆","d":["青海","西蔵","満州"],"x":"今の中国の、新疆ウイグル自治区のあたりだよ。","v":"EAS"},
  {"id":"EAS-Q08-009","ch":12,"q":"清で、モンゴル・チベット・新疆などの藩部を統括した役所は？","a":"理藩院","d":["軍機処","六部","都護府"],"x":"藩部には、それぞれの土地の首長や宗教指導者による自治を認めていたんだ。","v":"EAS"},
  {"id":"EAS-Q08-010","ch":12,"q":"1757年、乾隆帝がヨーロッパ船との貿易港として限定した港は？","a":"広州","d":["上海","泉州","寧波"],"x":"イギリスはこの制限に不満を持って、のちにアヘン戦争を起こすことになるんだ。","v":"EAS"},
  {"id":"EAS-Q08-011","ch":12,"q":"清で、広州での外国貿易を独占した特許商人の組合は？","a":"公行","d":["行","会館","東インド会社"],"x":"特許をもらった商人たちが、貿易をすべて取り仕切ったんだ。","v":"EAS"},
  {"id":"EAS-Q08-012","ch":12,"q":"清で、八旗を補うために漢人で編成された正規軍は？","a":"緑営","d":["八旗","衛所","府兵"],"x":"旗の色が緑だったから、この名前なんだ。","v":"EAS"},
  {"id":"EAS-Q08-013","ch":12,"q":"清で官吏を登用するために引き続き行われた試験は？","a":"科挙","d":["九品中正","郷挙里選","殿試のみの試験"],"x":"清は漢人の知識人を味方につけるため、科挙を続けたんだ。","v":"EAS"},
  {"id":"EAS-Q08-014","ch":12,"q":"清が漢人の男性に強制した、満州人の髪形は？","a":"辮髪","d":["ちょんまげ","髷","総髪"],"x":"頭の前を剃って、後ろを長く編むんだ。「頭を残す者は髪を残さず、髪を残す者は頭を残さず」と言われるほど、厳しく強制されたよ。","v":"EAS"},
  {"id":"EAS-Q08-015","ch":12,"q":"康熙帝の命で編纂が始まり、雍正帝の時代に完成した、中国最大の類書（百科事典）は？","a":"『古今図書集成』","d":["『永楽大典』","『四庫全書』","『康熙字典』"],"x":"全部で1万巻もあるんだ。","v":"EAS"},
  {"id":"EAS-Q08-016","ch":12,"q":"乾隆帝が全国の書物を集めて4つの部門に分けた叢書は？","a":"『四庫全書』","d":["『永楽大典』","『古今図書集成』","『四書大全』"],"x":"集めるついでに、清を批判する本は焼いてしまったんだ。","v":"EAS"},
  {"id":"EAS-Q09-001","ch":12,"q":"教皇インノケンティウス4世の命でモンゴルに派遣され、グユク＝ハンに謁見した修道士は？","a":"プラノ＝カルピニ","d":["ルブルック","モンテ＝コルヴィノ","マルコ＝ポーロ"],"x":"60歳を超えてから、馬で草原を何千キロも旅したんだ。","v":"EAS"},
  {"id":"EAS-Q09-002","ch":12,"q":"フランス王ルイ9世の命でカラコルムを訪れ、モンケ＝ハンに謁見した修道士は？","a":"ルブルック","d":["プラノ＝カルピニ","モンテ＝コルヴィノ","ザビエル"],"x":"カラコルムで、ほかの宗教の人たちと討論会をしたんだ。旅行記はとても正確で、今でも貴重な史料だよ。","v":"EAS"},
  {"id":"EAS-Q09-003","ch":12,"q":"元の大都で初めてカトリックを布教した修道士は？","a":"モンテ＝コルヴィノ","d":["ルブルック","マテオ＝リッチ","ザビエル"],"x":"大都に教会を建てて、何千人もの信者を得たんだ。でも元が滅びると、信者もいなくなってしまったよ。","v":"EAS"},
  {"id":"EAS-Q09-004","ch":12,"q":"スペインの植民者による先住民への虐待を告発した聖職者は？","a":"ラス＝カサス","d":["ザビエル","マテオ＝リッチ","コルテス"],"x":"もとは自分も先住民を使う農場主だったんだ。その罪を悔いて、生涯をかけて先住民を守ろうとしたよ。","v":"EAS"},
  {"id":"EAS-Q09-005","ch":12,"q":"インド・東南アジア・日本で布教したイエズス会の宣教師は？","a":"フランシスコ＝ザビエル","d":["マテオ＝リッチ","アダム＝シャール","フェルビースト"],"x":"中国に入ろうとして、すぐ近くの島で病気になって亡くなったんだ。","v":"EAS"},
  {"id":"EAS-Q09-006","ch":12,"q":"明で布教し、中国初の本格的な世界地図をつくったイエズス会の宣教師は？","a":"マテオ＝リッチ","d":["アダム＝シャール","ザビエル","ブーヴェ"],"x":"中国の人が見やすいように、地図の真ん中に中国を置いたんだ。","v":"EAS"},
  {"id":"EAS-Q09-007","ch":12,"q":"マテオ＝リッチが作成した世界地図は？","a":"「坤輿万国全図」","d":["「皇輿全覧図」","「清明上河図」","「女史箴図」"],"x":"日本にも伝わって、江戸時代の人たちが世界の形を知るのに役立ったんだ。","v":"EAS"},
  {"id":"EAS-Q09-008","ch":12,"q":"徐光啓とともに『崇禎暦書』を編纂したイエズス会の宣教師は？","a":"アダム＝シャール","d":["マテオ＝リッチ","フェルビースト","カスティリオーネ"],"x":"明が滅んだあとも、清に仕えて暦をつくり続けたんだ。","v":"EAS"},
  {"id":"EAS-Q09-009","ch":12,"q":"康熙帝に仕え、大砲をつくって三藩の乱の鎮圧に貢献したイエズス会の宣教師は？","a":"フェルビースト","d":["アダム＝シャール","ブーヴェ","マテオ＝リッチ"],"x":"もとは天文学者で、北京の天文台の器具もつくっているんだ。今も北京に残っているよ。","v":"EAS"},
  {"id":"EAS-Q09-010","ch":12,"q":"康熙帝に仕え、実測による中国全図の作成にかかわったフランス人宣教師は？","a":"ブーヴェ","d":["フェルビースト","カスティリオーネ","ザビエル"],"x":"ルイ14世が送り出した宣教師の一人なんだ。","v":"EAS"},
  {"id":"EAS-Q09-011","ch":12,"q":"ブーヴェらが作成した、清の実測地図は？","a":"「皇輿全覧図」","d":["「坤輿万国全図」","「大清一統志」","「東方見聞録」"],"x":"10年以上かけて、中国全土を実際に測って回ったんだ。","v":"EAS"},
  {"id":"EAS-Q09-012","ch":12,"q":"雍正帝・乾隆帝に仕え、西洋画法を伝えたイタリア人宣教師は？","a":"カスティリオーネ","d":["マテオ＝リッチ","アダム＝シャール","ブーヴェ"],"x":"中国名は郎世寧。中国の絵と西洋の遠近法を組み合わせた、不思議な絵を描いたんだ。","v":"EAS"},
  {"id":"EAS-Q09-013","ch":12,"q":"中国の伝統儀礼を認めるイエズス会の布教方法をめぐって起きた論争は？","a":"典礼問題","d":["叙任権闘争","文字の獄","東林党の争い"],"x":"孔子や祖先を拝むのは、宗教なのか習慣なのか。それが争いのもとになったんだ。","v":"EAS"},
  {"id":"EAS-Q09-014","ch":12,"q":"明末から清で盛んになった、陶磁器に赤などの色で絵付けしたものは？","a":"赤絵","d":["染付","青磁","唐三彩"],"x":"日本の有田焼の色絵も、この影響を受けているんだ。","v":"EAS"},
  {"id":"Q11-001","ch":13,"q":"普遍（神や人間といった概念）は実在するのかをめぐる、スコラ学の論争は？","a":"普遍論争","d":["叙任権闘争","聖像崇拝論争","三位一体論争"],"x":"実在論のアンセルムス、唯名論のオッカムが代表です。","v":"MED"},
  {"id":"Q11-002","ch":13,"q":"高い尖塔とステンドグラスを特徴とする建築様式は？","a":"ゴシック様式","d":["ロマネスク様式","ビザンツ様式","バロック様式"],"x":"ロマネスク様式は厚い壁と小さな窓が特徴です。","v":"MED"},
  {"id":"Q11-003","ch":13,"q":"中世のイタリアのボローニャ大学で特に有名だった学問は？","a":"法学","d":["医学","神学","天文学"],"x":"医学はサレルノ大学、神学はパリ大学が有名でした。","v":"MED"},
  {"id":"Q11-004","ch":13,"q":"フィレンツェでルネサンスの芸術家を保護した大富豪の一族は？","a":"メディチ家","d":["フッガー家","ハプスブルク家","ヴァロワ家"],"x":"銀行業で富を築きました。","v":"MED"},
  {"id":"Q11-005","ch":13,"q":"12世紀、アラビア語文献のラテン語訳の中心となったスペインの都市は？","a":"トレド","d":["コルドバ","グラナダ","セビリャ"],"x":"イスラーム世界の知が、ここからヨーロッパへ流れ込みました。","v":"MED"},
  {"id":"Q11-006","ch":13,"q":"医学で有名だった、南イタリアの大学は？","a":"サレルノ大学","d":["ボローニャ大学","パリ大学","オックスフォード大学"],"x":"イスラーム医学の影響を強く受けました。","v":"MED"},
  {"id":"Q11-007","ch":13,"q":"神学で有名だった、フランスの大学は？","a":"パリ大学","d":["サレルノ大学","ボローニャ大学","プラハ大学"],"x":"トマス＝アクィナスも教えました。","v":"MED"},
  {"id":"Q11-008","ch":13,"q":"中世の大学で最も重視され、「哲学はその婢（はしため）」とまで言われた学問は？","a":"神学","d":["法学","医学","天文学"],"x":"すべての学問は神学のためにある、という考え方です。","v":"MED"},
  {"id":"Q11-009","ch":13,"q":"実在論を唱え、「スコラ学の父」と呼ばれる神学者は？","a":"アンセルムス","d":["アベラール","ウィリアム＝オブ＝オッカム","ロジャー＝ベーコン"],"x":"普遍（神や人間という概念）は実在する、という立場です。","v":"MED"},
  {"id":"Q11-010","ch":13,"q":"12世紀に唯名論を唱えた、フランスの神学者は？","a":"アベラール","d":["アンセルムス","トマス＝アクィナス","ロジャー＝ベーコン"],"x":"普遍は名前にすぎない、という立場です。","v":"MED"},
  {"id":"Q11-011","ch":13,"q":"唯名論を唱え、近代の合理的な考え方につながったとされる14世紀のイギリスの神学者は？","a":"ウィリアム＝オブ＝オッカム","d":["アンセルムス","トマス＝アクィナス","ウィクリフ"],"x":"「オッカムのかみそり」でも知られます。","v":"MED"},
  {"id":"Q11-012","ch":13,"q":"実験や観察を重視し、近代科学の先駆者とされるイギリスの学者は？","a":"ロジャー＝ベーコン","d":["アベラール","ウィリアム＝オブ＝オッカム","アンセルムス"],"x":"オックスフォード大学で学びました。","v":"MED"},
  {"id":"Q11-013","ch":13,"q":"12世紀ルネサンスの説明として正しいものは？","a":"イスラーム世界から伝わったギリシアの古典がラテン語に翻訳された","d":["イタリアで古代ローマの彫刻が掘り出された","ビザンツ帝国からギリシア人学者が亡命してきた","活版印刷で聖書が普及した"],"x":"中世は暗黒時代ではない、という見方の根拠の一つです。","v":"MED"},
  {"id":"Q11-014","ch":13,"q":"14〜16世紀のルネサンスの中心となったイタリアの都市は？","a":"フィレンツェ","d":["ヴェネツィア","ジェノヴァ","ミラノ"],"x":"メディチ家の保護のもとで栄えました。","v":"MED"},
  {"id":"Q11-015","ch":13,"q":"『叙情詩集』を残し、ダンテとともに人文主義の先駆けとされる詩人は？","a":"ペトラルカ","d":["ボッカチオ","マキャベリ","チョーサー"],"x":"古代ローマの文献を熱心に集めました。","v":"MED"},
  {"id":"Q11-016","ch":13,"q":"『エセー（随想録）』を書いた、フランスの人文主義者は？","a":"モンテーニュ","d":["ラブレー","エラスムス","トマス＝モア"],"x":"「私は何を知っているか」という問いで知られます。","v":"MED"},
  {"id":"Q11-017","ch":13,"q":"『カンタベリ物語』を書き、イギリス国民文学の祖とされるのは？","a":"チョーサー","d":["シェイクスピア","トマス＝モア","ボッカチオ"],"x":"巡礼者たちが順番に物語を語る、という形式です。","v":"MED"},
  {"id":"Q11-018","ch":13,"q":"ボッティチェリの作品として正しいものは？","a":"『春』","d":["『最後の晩餐』","『アテネの学堂』","『最後の審判』"],"x":"『ヴィーナスの誕生』と並ぶ代表作です。","v":"MED"},
  {"id":"Q11-019","ch":13,"q":"ルネサンス絵画の先駆者とされる画家は？","a":"ジョット","d":["ラファエロ","ボッティチェリ","ファン＝アイク"],"x":"人物に立体感と感情を与えた、とされています。","v":"MED"},
  {"id":"Q11-020","ch":13,"q":"多くの聖母子像や『アテネの学堂』を描いた画家は？","a":"ラファエロ","d":["ボッティチェリ","ジョット","レオナルド＝ダ＝ヴィンチ"],"x":"『アテネの学堂』には、古代ギリシアの哲学者たちが描かれています。","v":"MED"},
  {"id":"Q11-021","ch":13,"q":"次の文の「『神の国』」の部分を正しく直すと？　――スコラ学を大成した神学者は、『神の国』で信仰と理性の調和をめざした","a":"『神学大全』","d":["『神の国』","『愚神礼賛』","『告白録』"],"x":"『神の国』はアウグスティヌスの本だね。トマスは体が大きくて無口だったから、「シチリアの黙った牛」とあだ名されたらしい。『神学大全』は未完のまま終わってるんだ。","v":"MED"},
  {"id":"Q11-022","ch":13,"q":"次の文の「ラテン語」の部分を正しく直すと？　――フィレンツェ出身の詩人は、『神曲』をラテン語で書いた","a":"トスカーナ語（イタリア語の口語）","d":["ラテン語","ギリシア語","フランス語"],"x":"ダンテは政争に巻き込まれてフィレンツェを追放されて、最後まで帰れなかったんだ。『神曲』は、追放されたあとに書かれているよ。","v":"MED"},
  {"id":"Q11-023","ch":13,"q":"次の文の「『カンタベリ物語』」の部分を正しく直すと？　――ペストが流行したフィレンツェを舞台に、『カンタベリ物語』が書かれた","a":"『デカメロン』","d":["『カンタベリ物語』","『神曲』","『君主論』"],"x":"ペストを逃れて郊外の屋敷に集まった10人が、10日間で100の話をする、という物語なんだ。『デカメロン』は「10日の物語」という意味だよ。","v":"MED"},
  {"id":"Q11-024","ch":13,"q":"次の文の「『ユートピア』」の部分を正しく直すと？　――フィレンツェの外交官は『ユートピア』で、強力な君主によるイタリア統一を説いた","a":"『君主論』","d":["『ユートピア』","『愚神礼賛』","『神学大全』"],"x":"マキャベリはメディチ家の復帰で職を失って、田舎に引っ込んでいた時期に『君主論』を書いたんだ。メディチ家に献上しているよ。","v":"MED"},
  {"id":"Q11-025","ch":13,"q":"次の文の「『最後の晩餐』」の部分を正しく直すと？　――メディチ家の保護を受けた画家は、『最後の晩餐』を描いた","a":"『ヴィーナスの誕生』","d":["『最後の晩餐』","『最後の審判』","『アテネの学堂』"],"x":"『ヴィーナスの誕生』は、貝殻の上に立った女神が岸に流れ着く場面を描いているんだ。今はフィレンツェのウフィツィ美術館にあるよ。","v":"MED"},
  {"id":"Q11-026","ch":13,"q":"次の文の「『ドン＝キホーテ』」の部分を正しく直すと？　――ネーデルラントの人文主義者は、『ドン＝キホーテ』で聖職者の腐敗を風刺した","a":"『愚神礼賛』","d":["『ドン＝キホーテ』","『デカメロン』","『ハムレット』"],"x":"『愚神礼賛』は、エラスムスがトマス＝モアの家に滞在していたときに書かれたんだ。二人は仲の良い友人だったよ。","v":"MED"},
  {"id":"Q11-027","ch":13,"q":"次の文の「ばら戦争」の部分を正しく直すと？　――イングランドの人文主義者は『ユートピア』で、ばら戦争を批判した","a":"囲い込み","d":["ばら戦争","百年戦争","修道院の解散"],"x":"「羊が人間を食べる」という言葉で、囲い込みを批判したんだ。モアはのちに、ヘンリ8世の離婚に反対して処刑されているよ。","v":"MED"},
  {"id":"Q11-028","ch":13,"q":"次の文の「『カンタベリ物語』」の部分を正しく直すと？　――エリザベス1世の時代の劇作家は、『カンタベリ物語』を書いた","a":"『ハムレット』","d":["『カンタベリ物語』","『ドン＝キホーテ』","『愚神礼賛』"],"x":"シェイクスピアの劇は、ロンドンのグローブ座で上演されていたんだ。セルバンテスとは、亡くなった年が同じ1616年だよ。","v":"MED"},
  {"id":"Q11-029","ch":13,"q":"次の文の「新しく台頭した商人」の部分を正しく直すと？　――スペインの作家は『ドン＝キホーテ』で、新しく台頭した商人を風刺した","a":"時代遅れの騎士道","d":["新しく台頭した商人","教皇の権威","絶対王政"],"x":"セルバンテスは若い頃にレパントの海戦に出て、左手が使えなくなっているんだ。そのあと海賊に捕まって、5年ほど捕虜になってるよ。","v":"MED"},
  {"id":"Q11-030","ch":13,"q":"次の文の「ルネサンスまで誰も読まなかった」の部分を正しく直すと？　――中世のヨーロッパではギリシアの学問は完全に忘れられ、ルネサンスまで誰も読まなかった","a":"12世紀にイスラーム世界からラテン語に訳され、研究された","d":["ルネサンスまで誰も読まなかった","教会がすべて焼き捨てた","ビザンツ帝国だけが独占した"],"x":"イブン＝ルシュドはアリストテレスの注釈をたくさん書いていて、ヨーロッパでは「注釈者」と呼ばれていたんだ。トマス＝アクィナスも、彼の考えと向き合いながら神学を組み立てているよ。","v":"MED"},
  {"id":"MOD-Q01-001","ch":13,"q":"1300年ごろ、小アジアでオスマン帝国を建てたのは？","a":"オスマン1世","d":["メフメト2世","スレイマン1世","バヤジット1世"],"x":"国の名前は、建国者の名前そのものなんだ。ヨーロッパでは「オットマン」と呼ばれたよ。","v":"MOD"},
  {"id":"MOD-Q01-002","ch":13,"q":"オスマン1世が建てた、スンナ派のトルコ系国家は？","a":"オスマン帝国","d":["サファヴィー朝","ムガル帝国","セルジューク朝"],"x":"600年以上も続いた国なんだ。終わったのは、第一次世界大戦のあとだよ。","v":"MOD"},
  {"id":"MOD-Q01-003","ch":13,"q":"1402年、オスマン帝国のバヤジット1世を破った国は？","a":"ティムール朝","d":["サファヴィー朝","マムルーク朝","ビザンツ帝国"],"x":"この負けで、オスマン帝国はしばらくバラバラになったんだ。ビザンツ帝国は、おかげで50年ほど寿命がのびたよ。","v":"MOD"},
  {"id":"MOD-Q01-004","ch":13,"q":"バヤジット1世がティムール軍に敗れた戦いは？","a":"アンカラの戦い","d":["ニコポリスの戦い","モハーチの戦い","プレヴェザの海戦"],"x":"アンカラは今のトルコの首都だね。","v":"MOD"},
  {"id":"MOD-Q01-005","ch":13,"q":"1453年、メフメト2世が滅ぼした国は？","a":"ビザンツ帝国","d":["マムルーク朝","神聖ローマ帝国","ハンガリー王国"],"x":"陸の上を、油を塗った丸太の道で船を運んで、金角湾に入り込んだんだ。","v":"MOD"},
  {"id":"MOD-Q01-006","ch":13,"q":"メフメト2世がコンスタンティノープルを征服したのち、都とした都市は？","a":"イスタンブル","d":["アンカラ","ブルサ","エディルネ"],"x":"「イスタンブル」は、ギリシア語の「町へ」という言葉がなまったものだと言われているんだ。","v":"MOD"},
  {"id":"MOD-Q01-007","ch":13,"q":"オスマン帝国のセリム1世がマムルーク朝を滅ぼして得た権利は？","a":"メッカ・メディナの保護権","d":["カピチュレーション","ティマール制","カリフの選挙権"],"x":"イスラームの二つの聖地を守る役目だね。これで、スルタンはイスラーム世界の盟主になったんだ。","v":"MOD"},
  {"id":"MOD-Q01-008","ch":13,"q":"1529年、スレイマン1世がハプスブルク家の都を攻めた出来事は？","a":"第1次ウィーン包囲","d":["プレヴェザの海戦","レパントの海戦","モハーチの戦い"],"x":"冬が近づいて、補給も続かなくなって引き返したんだ。ウィーンのクロワッサンは、このころの戦いにちなんだ三日月のパンだという話もあるけど、作り話らしいよ。","v":"MOD"},
  {"id":"MOD-Q01-009","ch":13,"q":"1538年、スレイマン1世のオスマン艦隊がスペイン・ヴェネツィアなどの連合艦隊を破った海戦は？","a":"プレヴェザの海戦","d":["レパントの海戦","アクティウムの海戦","サラミスの海戦"],"x":"活躍した提督のバルバロス＝ハイレッディンは、もとは海賊だったんだ。","v":"MOD"},
  {"id":"MOD-Q01-010","ch":13,"q":"オスマン帝国で、騎士（シパーヒー）に徴税権を与えて軍役を課した制度は？","a":"ティマール制","d":["イクター制","千戸制","マンサブダール制"],"x":"土地そのものではなく、税を取る権利を与えたんだ。世襲は認めなかったよ。","v":"MOD"},
  {"id":"MOD-Q01-011","ch":13,"q":"オスマン帝国で、スルタンが定めた、イスラーム法を補う世俗の法は？","a":"カーヌーン","d":["シャリーア","ハディース","カピチュレーション"],"x":"スレイマン1世は、法を整えたことから「立法者」とも呼ばれているんだ。","v":"MOD"},
  {"id":"MOD-Q01-012","ch":13,"q":"オスマン帝国が外国人に与えた、居住や通商上の特権は？","a":"カピチュレーション","d":["ティマール","ジズヤ","カーヌーン"],"x":"最初は、強い国が恩恵として与えたものだったんだ。でも帝国が弱くなると、不平等条約のように使われてしまったよ。","v":"MOD"},
  {"id":"MOD-Q01-013","ch":13,"q":"17世紀以降、徴税請負などで富を蓄え、オスマン帝国の地方で力を持った有力者は？","a":"アーヤーン","d":["シパーヒー","イェニチェリ","ウラマー"],"x":"中央の言うことを聞かない有力者が増えて、帝国はだんだんまとまらなくなっていったんだ。","v":"MOD"},
  {"id":"MOD-Q02-001","ch":13,"q":"1501年、イスマーイール1世がイランに建てた王朝は？","a":"サファヴィー朝","d":["ササン朝","ムガル帝国","イル＝ハン国"],"x":"もとは神秘主義の教団だったんだ。その指導者が、そのまま王になったんだよ。","v":"MOD"},
  {"id":"MOD-Q02-002","ch":13,"q":"サファヴィー朝が国教とした、シーア派の一派は？","a":"十二イマーム派","d":["スンナ派","イスマーイール派","スーフィズム"],"x":"12代目のイマームは姿を隠していて、いつか帰ってくると信じられているんだ。今のイランも、この派が多いよ。","v":"MOD"},
  {"id":"MOD-Q02-003","ch":13,"q":"サファヴィー朝のアッバース1世が都を移し、「世界の半分」とたたえられた都市は？","a":"イスファハーン","d":["タブリーズ","バグダード","テヘラン"],"x":"青いタイルのモスクが並ぶ大きな広場は、今も残っているんだ。","v":"MOD"},
  {"id":"MOD-Q02-004","ch":13,"q":"ティムールの子孫バーブルが、1526年にインドに建てた国は？","a":"ムガル帝国","d":["デリー＝スルタン朝","マラーター王国","サファヴィー朝"],"x":"「ムガル」はペルシア語で「モンゴル」のことなんだ。母方はチンギス＝ハンの血筋だったよ。","v":"MOD"},
  {"id":"MOD-Q02-005","ch":13,"q":"ムガル帝国の初めの都は？","a":"デリー","d":["カルカッタ","ボンベイ","カナウジ"],"x":"今のインドの首都、ニューデリーのすぐそばだね。","v":"MOD"},
  {"id":"MOD-Q02-006","ch":13,"q":"ヒンドゥー教徒との融和を図ったアクバルが廃止した、非ムスリムへの人頭税は？","a":"ジズヤ","d":["ハラージュ","ザカート","カピチュレーション"],"x":"アクバルは字が読めなかったと言われているんだ。でも本を読ませては聞いて、いろいろな宗教の学者と議論するのが好きだったよ。","v":"MOD"},
  {"id":"MOD-Q02-007","ch":13,"q":"厳格なイスラーム政策をとり、ジズヤを復活させたムガル帝国の皇帝は？","a":"アウラングゼーブ","d":["アクバル","バーブル","シャー＝ジャハーン"],"x":"父のシャー＝ジャハーンを城に閉じこめて、自分が皇帝になったんだ。","v":"MOD"},
  {"id":"MOD-Q02-008","ch":13,"q":"アウラングゼーブの時代、デカン高原でシヴァージーが建てたヒンドゥー教徒の国は？","a":"マラーター王国","d":["ラージプート","シク王国","ヴィジャヤナガル王国"],"x":"山の砦にこもって、ゲリラ戦でムガル軍を苦しめたんだ。","v":"MOD"},
  {"id":"MOD-Q02-009","ch":13,"q":"ナーナクが開いた、イスラームの一神教とヒンドゥー教の要素を融合した宗教は？","a":"シク教","d":["ジャイナ教","バラモン教","マニ教"],"x":"信者の男性は髪やひげを切らずに、ターバンで包むんだ。寺院では、誰にでも無料の食事をふるまっているよ。","v":"MOD"},
  {"id":"MOD-Q02-010","ch":13,"q":"シク教を開いたのは？","a":"ナーナク","d":["ヴァルダマーナ","アクバル","シヴァージー"],"x":"カーストを否定して、みんな平等だと説いたんだ。","v":"MOD"},
  {"id":"MOD-Q02-011","ch":13,"q":"シャー＝ジャハーンが亡き妃のために建てた、白大理石の霊廟は？","a":"タージ＝マハル","d":["アルハンブラ宮殿","岩のドーム","アンコール＝ワット"],"x":"妃は14人目の子どもを産んで亡くなったんだ。建てるのに20年以上かかったよ。","v":"MOD"},
  {"id":"MOD-Q03-001","ch":13,"q":"ポルトガル王ジョアン2世の命で、アフリカ南端に達した航海者は？","a":"バルトロメウ＝ディアス","d":["ヴァスコ＝ダ＝ガマ","コロンブス","マゼラン"],"x":"最初は嵐にあって「嵐の岬」と呼んだんだ。それを王が、縁起のいい「喜望峰」に名前を変えさせたよ。","v":"MOD"},
  {"id":"MOD-Q03-002","ch":13,"q":"バルトロメウ＝ディアスが到達したアフリカ南端の岬は？","a":"喜望峰","d":["ヴェルデ岬","ホーン岬","マゼラン海峡"],"x":"「希望の岬」という意味なんだ。インドへの道が開ける希望だね。","v":"MOD"},
  {"id":"MOD-Q03-003","ch":13,"q":"1498年、インド西岸のカリカットに到達したポルトガルの航海者は？","a":"ヴァスコ＝ダ＝ガマ","d":["バルトロメウ＝ディアス","カブラル","マゼラン"],"x":"持っていった贈り物が安っぽすぎて、現地の王に笑われたと言われているんだ。","v":"MOD"},
  {"id":"MOD-Q03-004","ch":13,"q":"1492年、スペイン女王イサベルの援助で大西洋を横断した、ジェノヴァ出身の航海者は？","a":"コロンブス","d":["アメリゴ＝ヴェスプッチ","マゼラン","カボット"],"x":"彼は死ぬまで、自分が着いたのはアジアだと信じていたんだ。","v":"MOD"},
  {"id":"MOD-Q03-005","ch":13,"q":"1492年、コロンブスが最初に上陸した島は？","a":"サン＝サルバドル島","d":["セブ島","マダガスカル島","キューバ島"],"x":"「聖なる救い主」という意味の名前なんだ。カリブ海のバハマ諸島にある島だよ。","v":"MOD"},
  {"id":"MOD-Q03-006","ch":13,"q":"コロンブスがインドに着いたと思い込んだことから、アメリカの先住民は何と呼ばれた？","a":"インディアン（インディオ）","d":["メスティーソ","クリオーリョ","ムラート"],"x":"「インドの人」という意味なんだ。間違いが、そのまま名前になってしまったよ。","v":"MOD"},
  {"id":"MOD-Q03-007","ch":13,"q":"1493年、教皇アレクサンデル6世がスペインとポルトガルの勢力範囲を分けるために定めた境界線は？","a":"教皇子午線（植民地分界線）","d":["トリデシリャス線","赤道","本初子午線"],"x":"大西洋の上に、ローマ教皇が線を引いたんだ。ほかの国はまったく無視されているね。","v":"MOD"},
  {"id":"MOD-Q03-008","ch":13,"q":"1494年、スペインとポルトガルが結び、分界線を西へ移した条約は？","a":"トリデシリャス条約","d":["ウェストファリア条約","ユトレヒト条約","パリ条約"],"x":"線が西に動いたおかげで、ブラジルはポルトガル領になったんだ。今もブラジルでポルトガル語が話されているのは、そのためだよ。","v":"MOD"},
  {"id":"MOD-Q04-001","ch":13,"q":"メキシコ湾岸で栄え、巨石人頭像で知られる文明は？","a":"オルメカ文明","d":["マヤ文明","テオティワカン文明","チャビン文化"],"x":"大きいものは高さ3メートルもあるんだ。ヘルメットのようなものをかぶった顔だよ。","v":"MOD"},
  {"id":"MOD-Q04-002","ch":13,"q":"メキシコ高原で栄え、「太陽のピラミッド」「月のピラミッド」を残した都市文明は？","a":"テオティワカン文明","d":["オルメカ文明","アステカ文明","マヤ文明"],"x":"あとから来たアステカの人たちが「神々の都」と名づけたんだ。誰が建てたのかは、はっきりわかっていないよ。","v":"MOD"},
  {"id":"MOD-Q04-003","ch":13,"q":"ユカタン半島で栄え、二十進法やゼロの概念、独自の文字を持った文明は？","a":"マヤ文明","d":["インカ文明","オルメカ文明","ナスカ文明"],"x":"マヤの暦が「2012年に世界が終わる」と予言している、という話がはやったけど、暦の区切りがそこで一巡するだけなんだ。","v":"MOD"},
  {"id":"MOD-Q04-004","ch":13,"q":"前1000年ごろ、アンデス地方で栄えた文化は？","a":"チャビン文化","d":["ナスカ文化","インカ文化","テオティワカン文化"],"x":"ネコ科の動物をかたどった神の像が特徴なんだ。","v":"MOD"},
  {"id":"MOD-Q04-005","ch":13,"q":"ペルー南部の砂漠に描かれた巨大な地上絵で知られる文明は？","a":"ナスカ文明","d":["チャビン文化","インカ文明","マヤ文明"],"x":"空からでないと全体が見えないくらい大きいんだ。何のために描いたのか、今も研究が続いているよ。","v":"MOD"},
  {"id":"MOD-Q04-006","ch":13,"q":"大航海時代以降、アメリカ大陸を征服したスペイン人を何という？","a":"コンキスタドール","d":["クリオーリョ","イダルゴ","ユンカー"],"x":"「征服者」という意味のスペイン語なんだ。","v":"MOD"},
  {"id":"MOD-Q04-007","ch":13,"q":"アステカ帝国を征服したコンキスタドールは？","a":"コルテス","d":["ピサロ","マゼラン","バルボア"],"x":"兵はたった数百人だったんだ。アステカに支配されていた他の部族を味方につけて戦ったよ。","v":"MOD"},
  {"id":"MOD-Q04-008","ch":13,"q":"テノチティトランを都とし、1521年にコルテスに滅ぼされた国は？","a":"アステカ帝国","d":["インカ帝国","マヤ文明","オルメカ文明"],"x":"湖の上に浮かぶ大きな町だったんだ。今のメキシコシティは、その湖を埋め立てた上に建っているよ。","v":"MOD"},
  {"id":"MOD-Q04-009","ch":13,"q":"クスコを都とし、1533年にピサロに滅ぼされた国は？","a":"インカ帝国","d":["アステカ帝国","マヤ文明","チャビン文化"],"x":"文字はなかったけど、縄の結び目で数を記録する「キープ」を使っていたんだ。","v":"MOD"},
  {"id":"MOD-Q04-010","ch":13,"q":"インカ帝国を征服したコンキスタドールは？","a":"ピサロ","d":["コルテス","ラス＝カサス","コロンブス"],"x":"皇帝アタワルパを捕まえて、部屋いっぱいの金を身代金に払わせたんだ。それなのに、結局処刑してしまったよ。","v":"MOD"},
  {"id":"MOD-Q04-011","ch":13,"q":"スペインが植民者に先住民の保護とキリスト教化を委ね、労働力として使うことを認めた制度は？","a":"エンコミエンダ制","d":["アシエンダ制","プランテーション","ティマール制"],"x":"「保護」とは名ばかりで、実際は強制労働だったんだ。","v":"MOD"},
  {"id":"MOD-Q04-012","ch":13,"q":"17世紀以降のスペイン領アメリカで、債務で縛った労働者を使って大農園を経営した制度は？","a":"アシエンダ制","d":["エンコミエンダ制","ティマール制","荘園制"],"x":"借金を返し終わるまで、農園から出られなかったんだ。借金は、子どもにまで引き継がれたよ。","v":"MOD"},
  {"id":"MOD-Q04-013","ch":13,"q":"『インディアスの破壊についての簡潔な報告』で先住民への虐待を告発した聖職者は？","a":"ラス＝カサス","d":["ザビエル","ピサロ","イグナティウス＝ロヨラ"],"x":"あまりにひどい内容だったから、スペインの敵国がこの本を宣伝に使ったんだ。","v":"MOD"},
  {"id":"MOD-Q04-014","ch":13,"q":"16世紀、大量の銀がヨーロッパに流入するもととなった、ボリビアの銀山は？","a":"ポトシ銀山","d":["石見銀山","サカテカス銀山","ラウレイオン銀山"],"x":"標高4000メートルを超える山なんだ。働かされた先住民がたくさん命を落としたよ。","v":"MOD"},
  {"id":"Q10-001","ch":14,"q":"1455年に始まった、イギリスの王位継承をめぐる内乱は？","a":"ばら戦争","d":["百年戦争","ワット＝タイラーの乱","ピューリタン革命"],"x":"ランカスター家（赤ばら）とヨーク家（白ばら）の争いです。","v":"MED"},
  {"id":"Q10-002","ch":14,"q":"ばら戦争を終わらせ、テューダー朝を開いた王は？","a":"ヘンリ7世","d":["ヘンリ8世","エドワード4世","リチャード3世"],"x":"両家を統合した紋章が「テューダー＝ローズ」です。","v":"MED"},
  {"id":"Q10-003","ch":14,"q":"ヘンリ7世が設け、王に逆らう貴族を裁いた特別裁判所は？","a":"星室庁裁判所","d":["宗教裁判所","高等法院","枢密院"],"x":"天井に星の模様があった部屋が由来です。","v":"MED"},
  {"id":"Q10-004","ch":14,"q":"1588年、イングランドがスペインの無敵艦隊を破った戦いは？","a":"アルマダ海戦","d":["レパントの海戦","トラファルガーの海戦","プレヴェザの海戦"],"x":"スペインの海の覇権に陰りが見え始めました。","v":"MED"},
  {"id":"Q10-005","ch":14,"q":"1397年、デンマーク・スウェーデン・ノルウェーが結んだ同君連合は？","a":"カルマル同盟","d":["ハンザ同盟","ロンバルディア同盟","神聖同盟"],"x":"デンマークのマルグレーテが中心になりました。","v":"MED"},
  {"id":"Q10-006","ch":14,"q":"ばら戦争で、赤バラを紋章としたのは？","a":"ランカスター家","d":["ヨーク家","テューダー家","プランタジネット家"],"x":"白バラはヨーク家。両方を合わせたのがテューダー＝ローズです。","v":"MED"},
  {"id":"Q10-007","ch":14,"q":"テューダー朝の王権を地方で支えた、地主層を何という？","a":"ジェントリ（郷紳）","d":["ヨーマン","コロヌス","マムルーク"],"x":"貴族ではないが、地方の治安や行政を担いました。","v":"MED"},
  {"id":"Q10-008","ch":14,"q":"ヘンリ8世の子で、一般祈祷書を定めて国教会の新教化を進めた王は？","a":"エドワード6世","d":["ヘンリ7世","メアリ1世","エリザベス1世"],"x":"若くして亡くなり、姉のメアリ1世が即位します。","v":"MED"},
  {"id":"Q10-009","ch":14,"q":"カトリックを復活させたメアリ1世が結婚した、スペインの王子（のちの王）は？","a":"フェリペ2世","d":["カルロス1世","フェルナンド","フィリップ2世"],"x":"のちにアルマダ海戦でイギリスと戦う、あのフェリペ2世です。","v":"MED"},
  {"id":"Q10-010","ch":14,"q":"エリザベス1世が、スペインからの独立を支援した国は？","a":"オランダ","d":["ポルトガル","スコットランド","フランドル伯領"],"x":"これがスペインとの対立を決定的にしました。","v":"MED"},
  {"id":"Q10-011","ch":14,"q":"統一法で確立したイギリス国教会は、教義の面で何という派の影響を強く受けた？","a":"カルヴァン派","d":["ルター派","アリウス派","カタリ派"],"x":"教義は新教のカルヴァン派、儀式はカトリック風という折衷でした。","v":"MED"},
  {"id":"Q10-012","ch":14,"q":"テューダー朝の王を即位した順に並べたとき、4番目にくるのは？","a":"メアリ1世","d":["ヘンリ8世","エドワード6世","エリザベス1世"],"x":"ヘンリ7世→ヘンリ8世→エドワード6世→メアリ1世→エリザベス1世の順です。","v":"MED"},
  {"id":"Q10-013","ch":14,"q":"1256〜73年、ドイツで事実上皇帝がいなかった時代を何という？","a":"大空位時代","d":["教会大分裂","教皇のバビロン捕囚","三十年戦争"],"x":"ドイツでは諸侯の自立性が強く、皇帝の力が地方に及びませんでした。","v":"MED"},
  {"id":"Q10-014","ch":14,"q":"1356年にカール4世が発布し、皇帝を選ぶ七選帝侯を定めた文書は？","a":"金印勅書（黄金文書）","d":["大憲章","ヴォルムス協約","特許状"],"x":"皇帝の選び方を、教皇抜きで決めたことが重要です。","v":"MED"},
  {"id":"Q10-015","ch":14,"q":"中世末のドイツで、諸侯が国家のように自立して支配した領域を何という？","a":"領邦国家","d":["コムーネ","荘園","都市国家"],"x":"ドイツの統一が19世紀までずれこむ理由です。","v":"MED"},
  {"id":"Q10-016","ch":14,"q":"北イタリアで発達した、自治権をもつ都市（都市国家）を何という？","a":"コムーネ","d":["ギルド","ツンフト","ハンザ"],"x":"ヴェネツィアやフィレンツェなどが代表です。","v":"MED"},
  {"id":"Q10-017","ch":14,"q":"イタリアの都市内で対立した党派の組み合わせとして正しいものは？","a":"ゲルフ―教皇党、ギベリン―皇帝党","d":["ゲルフ―皇帝党、ギベリン―教皇党","ゲルフ―王党、ギベリン―議会党","ゲルフ―商人党、ギベリン―職人党"],"x":"ダンテもこの争いに巻き込まれ、フィレンツェを追放されました。","v":"MED"},
  {"id":"Q10-018","ch":14,"q":"中世末のドイツについて誤っているものは？","a":"皇帝の権力が地方まで強く及び、早くに統一国家となった","d":["大空位時代があった","金印勅書で七選帝侯が定められた","領邦国家が分立した"],"x":"ドイツはむしろ分裂が続いた国です。","v":"MED"},
  {"id":"Q10-019","ch":14,"q":"次の文の「統一法」の部分を正しく直すと？　――離婚問題で教皇と対立したイングランド王は、統一法を出してイギリス国教会を成立させた","a":"国王至上法（首長法）","d":["統一法","大憲章","権利の章典"],"x":"国王至上法は1534年。統一法を出したのは、娘のエリザベス1世だよ。ヘンリ8世は生涯で6回結婚しているんだ。","v":"MED"},
  {"id":"Q10-020","ch":14,"q":"次の文の「ポルトガル船」の部分を正しく直すと？　――エリザベス1世の時代、私掠船の船長はポルトガル船を襲い、富をもたらした","a":"スペイン船","d":["ポルトガル船","オランダ船","フランス船"],"x":"ドレークは世界一周も成し遂げているんだ。エリザベス1世から騎士の位をもらっているよ。","v":"MED"},
  {"id":"Q10-021","ch":14,"q":"次の文の「海外への進出を禁じた」の部分を正しく直すと？　――15世紀、ポルトガルの王子は海外への進出を禁じた","a":"海外への進出を奨励した","d":["海外への進出を禁じた","海外への進出をスペインに任せた","陸路での交易だけを認めた"],"x":"航海王子と呼ばれているけど、本人はほとんど航海に出ていないんだ。航海者を育てて、船を送り出す側だったんだよ。","v":"MED"},
  {"id":"Q10-022","ch":14,"q":"次の文の「南アメリカ南端のマゼラン海峡」の部分を正しく直すと？　――1488年、ポルトガルの航海者は南アメリカ南端のマゼラン海峡に到達した","a":"アフリカ南端の喜望峰","d":["南アメリカ南端のマゼラン海峡","インド西岸のカリカット","カリブ海の西インド諸島"],"x":"最初は「嵐の岬」と呼ばれていたんだ。インドへの道が見えたから、のちに「喜望峰」と名前が変わったんだよ。","v":"MED"},
  {"id":"Q10-023","ch":14,"q":"次の文の「インド東岸のマドラス」の部分を正しく直すと？　――1498年、喜望峰を回った航海者は、インド東岸のマドラスに到達した","a":"インド西岸のカリカット","d":["インド東岸のマドラス","マレー半島のマラッカ","中国の広州"],"x":"当時、こしょうは同じ重さの銀と取引されるほど高価だったんだ。ガマが持ち帰った香辛料は、航海の費用の何十倍にもなったらしいよ。","v":"MED"},
  {"id":"Q10-024","ch":14,"q":"次の文の「カトリックを復活させた」の部分を正しく直すと？　――1559年、イングランド女王は統一法を出し、カトリックを復活させた","a":"イギリス国教会を確立した","d":["カトリックを復活させた","ピューリタンを国教とした","教皇を教会の首長とした"],"x":"カトリックを復活させたのは、姉のメアリ1世だね。エリザベス1世は生涯結婚しなかったから、「処女王」とも呼ばれたよ。","v":"MED"},
  {"id":"MOD-Q05-001","ch":14,"q":"サン＝ピエトロ大聖堂の改築費用を得るため、贖宥状を販売した教皇は？","a":"レオ10世","d":["インノケンティウス3世","ウルバヌス2世","グレゴリウス7世"],"x":"フィレンツェのメディチ家の出身なんだ。ぜいたく好きで、教会のお金をどんどん使ったよ。","v":"MOD"},
  {"id":"MOD-Q05-002","ch":14,"q":"レオ10世が改築費用を集めようとした、ローマの大聖堂は？","a":"サン＝ピエトロ大聖堂","d":["ハギア＝ソフィア聖堂","ノートルダム大聖堂","ケルン大聖堂"],"x":"設計にはブラマンテやミケランジェロがかかわっているんだ。完成までに100年以上かかったよ。","v":"MOD"},
  {"id":"MOD-Q05-003","ch":14,"q":"お金を払えば罪の罰が軽くなるとされた証書は？","a":"贖宥状（免罪符）","d":["権利の章典","勘合","九十五か条の論題"],"x":"「お金が箱の中でチャリンと鳴ると、魂が煉獄から飛び出す」と言って売られていたんだ。","v":"MOD"},
  {"id":"MOD-Q05-004","ch":14,"q":"1517年、九十五か条の論題を発表して贖宥状を批判したドイツの神学者は？","a":"ルター","d":["カルヴァン","ツヴィングリ","フス"],"x":"雷に打たれそうになって、「助かったら修道士になります」と誓ったのが、修道院に入ったきっかけなんだ。","v":"MOD"},
  {"id":"MOD-Q05-005","ch":14,"q":"ルターが贖宥状を批判して発表した文書は？","a":"九十五か条の論題","d":["キリスト者の自由","権利の請願","人権宣言"],"x":"もとはラテン語で書いた、学者向けの討論の呼びかけだったんだ。それがドイツ語に訳されて、あっという間に広まったよ。","v":"MOD"},
  {"id":"MOD-Q05-006","ch":14,"q":"信仰のよりどころは教会ではなく聖書のみにあるとする、ルターの考えは？","a":"聖書主義","d":["予定説","万人司祭主義","長老主義"],"x":"だからルターは、誰でも読めるように聖書をドイツ語に訳したんだ。","v":"MOD"},
  {"id":"MOD-Q05-007","ch":14,"q":"すべての信者が神の前で平等に祭司であるとする、ルターの考えは？","a":"万人司祭主義","d":["聖書主義","予定説","三位一体説"],"x":"ルター自身も、元修道女と結婚して6人の子どもに恵まれたんだ。","v":"MOD"},
  {"id":"MOD-Q05-008","ch":14,"q":"ルターを帝国から追放した神聖ローマ皇帝は？","a":"カール5世","d":["フェリペ2世","カール4世","オットー1世"],"x":"スペイン王カルロス1世でもあるんだ。ルターは、味方の諸侯の城にかくまわれたよ。","v":"MOD"},
  {"id":"MOD-Q05-009","ch":14,"q":"ルターがヴァルトブルク城にかくまわれている間に行った仕事は？","a":"新約聖書のドイツ語訳","d":["九十五か条の論題の執筆","カトリックへの改宗","ドイツ農民戦争の指揮"],"x":"わずか11週間ほどで訳しあげたんだ。この訳が、今のドイツ語の土台になったと言われているよ。","v":"MOD"},
  {"id":"MOD-Q05-010","ch":14,"q":"1524年、ミュンツァーらの指導で農奴制の廃止などを求めて起きた反乱は？","a":"ドイツ農民戦争","d":["ジャックリーの乱","ワット＝タイラーの乱","三十年戦争"],"x":"ルターは最初は同情的だったけど、反乱が激しくなると、諸侯に鎮圧するよう呼びかけたんだ。","v":"MOD"},
  {"id":"MOD-Q05-011","ch":14,"q":"1555年、諸侯にカトリックかルター派かを選ぶ権利を認めた取り決めは？","a":"アウクスブルクの和議","d":["ウェストファリア条約","ナントの王令","ヴォルムス協約"],"x":"選べるのは諸侯だけで、住民は諸侯の決めた宗派に従わなければいけなかったんだ。","v":"MOD"},
  {"id":"MOD-Q05-012","ch":14,"q":"ルター派をはじめ、カトリックから分かれた宗派をまとめて何という？","a":"プロテスタント","d":["ユグノー","ピューリタン","ゴイセン"],"x":"「抗議する人」という意味なんだ。皇帝の決定に抗議した諸侯たちから、この名がついたよ。","v":"MOD"},
  {"id":"MOD-Q05-013","ch":14,"q":"スイスのチューリヒで宗教改革を行ったのは？","a":"ツヴィングリ","d":["カルヴァン","ルター","ミュンツァー"],"x":"カトリックの州との戦いに、自分も剣を持って出かけて戦死したんだ。","v":"MOD"},
  {"id":"MOD-Q05-014","ch":14,"q":"スイスのジュネーヴで、神権政治的な宗教改革を行ったフランス出身の人物は？","a":"カルヴァン","d":["ツヴィングリ","ルター","ノックス"],"x":"ジュネーヴでは、ダンスやトランプも禁止されたんだ。とても厳しい町だったよ。","v":"MOD"},
  {"id":"MOD-Q05-015","ch":14,"q":"カルヴァン派が採用した、信徒から選ばれた長老が牧師とともに教会を運営する制度は？","a":"長老主義","d":["司教制","万人司祭主義","教皇至上主義"],"x":"司教のような、上からの位の制度をなくしたんだ。","v":"MOD"},
  {"id":"MOD-Q05-016","ch":14,"q":"救われるかどうかは神によってあらかじめ決められているとする、カルヴァンの説は？","a":"予定説","d":["聖書主義","性善説","輪廻転生"],"x":"救われる人は、まじめに働いて成功するはずだ。そう考えられて、商工業者に支持されたんだ。","v":"MOD"},
  {"id":"MOD-Q05-017","ch":14,"q":"ヘンリ8世の離婚問題をきっかけに成立した、イングランドの教会は？","a":"イギリス国教会","d":["カルヴァン派","ルター派","ギリシア正教会"],"x":"教義はあまり変えずに、教皇ではなく国王を教会の首長にしたんだ。","v":"MOD"},
  {"id":"MOD-Q05-018","ch":14,"q":"1545年から開かれ、カトリックの教義を再確認して贖宥状の販売を禁じた公会議は？","a":"トリエント公会議","d":["コンスタンツ公会議","ニケーア公会議","クレルモン公会議"],"x":"プロテスタントに対抗して、カトリックの側も自分たちを立て直したんだ。","v":"MOD"},
  {"id":"MOD-Q05-019","ch":14,"q":"カトリック改革の中で発達した、豪華で劇的な芸術様式は？","a":"バロック様式","d":["ゴシック様式","ロココ様式","ロマネスク様式"],"x":"「ゆがんだ真珠」という意味のポルトガル語から来ているんだ。目で見て、信仰心をゆさぶる芸術だよ。","v":"MOD"},
  {"id":"MOD-Q05-020","ch":14,"q":"イグナティウス＝ロヨラらが結成し、海外布教でカトリックの勢力回復に貢献した修道会は？","a":"イエズス会","d":["ドミニコ会","フランチェスコ会","クリュニー修道院"],"x":"ロヨラはもとは軍人だったんだ。戦いで大けがをして、寝床で聖人の伝記を読んで、信仰の道に進んだよ。","v":"MOD"},
  {"id":"MOD-Q05-021","ch":14,"q":"宗教対立が激しくなった16〜17世紀のヨーロッパで、異端の疑いをかけた人々を迫害し処刑したことを何という？","a":"魔女狩り","d":["十字軍","異端審問のみの裁判","ポグロム"],"x":"何万人もの人が処刑されたと言われているんだ。多くは、ふつうの女性たちだったよ。","v":"MOD"},
  {"id":"MOD-Q06-001","ch":14,"q":"1494年に始まった、イタリアをめぐるフランスとハプスブルク家の戦争は？","a":"イタリア戦争","d":["三十年戦争","ユグノー戦争","百年戦争"],"x":"フランス王シャルル8世のイタリア侵入から始まって、60年以上も続いたんだ。","v":"MOD"},
  {"id":"MOD-Q06-002","ch":14,"q":"ヨーロッパで、オーストリアとスペインの王位を握り、フランスと争った名門の家は？","a":"ハプスブルク家","d":["ブルボン家","メディチ家","ステュアート家"],"x":"戦争より、結婚で領土を広げた家なんだ。「戦争は他の者にまかせよ、幸いなるオーストリアよ、汝は結婚せよ」という言葉があるくらいだよ。","v":"MOD"},
  {"id":"MOD-Q06-003","ch":14,"q":"1568年に始まった、ネーデルラントがスペインの支配に抵抗した戦争は？","a":"オランダ独立戦争","d":["三十年戦争","イタリア戦争","ユグノー戦争"],"x":"カルヴァン派の多い北部の州がまとまって、戦い続けたんだ。","v":"MOD"},
  {"id":"MOD-Q06-004","ch":14,"q":"オランダ独立戦争を指導した人物は？","a":"オラニエ公ウィレム","d":["フェリペ2世","ウィレム3世","カール5世"],"x":"あまりしゃべらない人だったから、「沈黙公」と呼ばれたんだ。最後は暗殺されてしまったよ。","v":"MOD"},
  {"id":"MOD-Q06-005","ch":14,"q":"オランダ独立戦争でオランダが戦った、スペインの王は？","a":"フェリペ2世","d":["カルロス1世","フェルナンド2世","フェリペ5世"],"x":"フィリピンという国名は、彼の名前から来ているんだ。","v":"MOD"},
  {"id":"MOD-Q06-006","ch":14,"q":"独立したオランダの首都は？","a":"アムステルダム","d":["ハーグ","ロッテルダム","ブリュッセル"],"x":"17世紀には、世界の商業と金融の中心になったんだ。","v":"MOD"},
  {"id":"MOD-Q06-007","ch":14,"q":"カール5世としても知られる、神聖ローマ皇帝を兼ねたスペイン王は？","a":"カルロス1世","d":["フェリペ2世","フェルナンド2世","カール4世"],"x":"スペイン、ネーデルラント、オーストリア、南イタリア、そしてアメリカ。たくさんの土地を一人で受け継いだんだ。","v":"MOD"},
  {"id":"MOD-Q06-008","ch":14,"q":"フランスで、カルヴァン派とカトリックの間で起きた宗教戦争は？","a":"ユグノー戦争","d":["三十年戦争","シュマルカルデン戦争","ピューリタン革命"],"x":"フランスのカルヴァン派は「ユグノー」と呼ばれたんだ。","v":"MOD"},
  {"id":"MOD-Q06-009","ch":14,"q":"1572年、パリで多数のユグノーが殺害された事件は？","a":"サンバルテルミの虐殺","d":["ヴァシーの虐殺","ヴァレンヌ逃亡事件","プラハ窓外投擲事件"],"x":"ユグノーの指導者アンリと、王の妹の結婚式に集まった人たちが狙われたんだ。","v":"MOD"},
  {"id":"MOD-Q06-010","ch":14,"q":"ユグノー戦争ののち、アンリ4世が開いた王朝は？","a":"ブルボン朝","d":["ヴァロワ朝","カペー朝","ハノーヴァー朝"],"x":"この王朝からルイ14世やルイ16世が出るんだ。","v":"MOD"},
  {"id":"MOD-Q06-011","ch":14,"q":"1598年、アンリ4世がユグノーに信仰の自由を認めて出した王令は？","a":"ナントの王令","d":["アウクスブルクの和議","ウェストファリア条約","権利の章典"],"x":"アンリ4世は自分ではカトリックに改宗しているんだ。「パリはミサに値する」と言ったと伝えられているよ。","v":"MOD"},
  {"id":"MOD-Q06-012","ch":14,"q":"1618年、ボヘミアの新教徒の反乱をきっかけに始まった宗教戦争は？","a":"三十年戦争","d":["ユグノー戦争","イタリア戦争","七年戦争"],"x":"ドイツは戦場になって、人口が3分の1ほど減ったとも言われているんだ。","v":"MOD"},
  {"id":"MOD-Q06-013","ch":14,"q":"1648年、三十年戦争を終わらせた講和条約は？","a":"ウェストファリア条約","d":["ユトレヒト条約","パリ条約","アウクスブルクの和議"],"x":"主権を持った国どうしが対等につき合う、今の国際社会のしくみの始まりとされているんだ。","v":"MOD"},
  {"id":"MOD-Q06-014","ch":14,"q":"ウェストファリア条約で明確になった、国家が持つ最高・独立の権力を何という？","a":"主権","d":["自然権","抵抗権","王権神授"],"x":"自分の国のことは、自分の国で決める。教皇も皇帝も口出しできない、ということだね。","v":"MOD"},
  {"id":"MOD-Q06-015","ch":14,"q":"ウェストファリア条約などを経て成立した、主権を持つ国々が並び立つ国家のあり方は？","a":"近代国家（主権国家）","d":["封建国家","都市国家","帝国"],"x":"はっきりした国境と、一つの政府を持つ国だね。今の世界の国々の形だよ。","v":"MOD"},
  {"id":"MOD-Q06-016","ch":14,"q":"17世紀後半のフランスなどで行われた、国王に権力を集中させた政治体制は？","a":"絶対王政","d":["立憲君主制","共和政","元首政"],"x":"官僚と常備軍を国王が直接動かすんだ。お金はたくさんかかったけどね。","v":"MOD"},
  {"id":"MOD-Q06-017","ch":14,"q":"ウェストファリア条約で独立が正式に認められた、ネーデルラント北部の国は？","a":"オランダ","d":["ベルギー","ポルトガル","プロイセン"],"x":"スイスの独立も、このとき正式に認められたんだ。","v":"MOD"},
  {"id":"MOD-Q06-018","ch":14,"q":"プロイセンのフリードリヒ2世と争った、オーストリアのハプスブルク家の女性君主は？","a":"マリア＝テレジア","d":["マリ＝アントワネット","エカチェリーナ2世","エリザベス1世"],"x":"16人の子どもを産んだんだ。その末娘が、フランスに嫁いだマリ＝アントワネットだよ。","v":"MOD"},
  {"id":"MOD-Q06-019","ch":14,"q":"1740年、マリア＝テレジアの相続をめぐって起きた戦争は？","a":"オーストリア継承戦争","d":["七年戦争","スペイン継承戦争","三十年戦争"],"x":"プロイセンは、この戦争で豊かなシュレジエン地方を手に入れたんだ。","v":"MOD"},
  {"id":"MOD-Q06-020","ch":14,"q":"1756年、シュレジエンをめぐってプロイセンとオーストリアが再び戦った戦争は？","a":"七年戦争","d":["オーストリア継承戦争","三十年戦争","北方戦争"],"x":"オーストリアは、長年の敵だったフランスと手を組んだんだ。「外交革命」と呼ばれているよ。","v":"MOD"},
  {"id":"MOD-Q07-001","ch":14,"q":"1603年、エリザベス1世の死後、スコットランド王がイングランド王を兼ねて始めた王朝は？","a":"ステュアート朝","d":["テューダー朝","ハノーヴァー朝","ヨーク朝"],"x":"エリザベス1世には子どもがいなかったから、親戚のスコットランド王が呼ばれたんだ。","v":"MOD"},
  {"id":"MOD-Q07-002","ch":14,"q":"スコットランド王からイングランド王となり、ステュアート朝を開いたのは？","a":"ジェームズ1世","d":["チャールズ1世","ジェームズ2世","ウィリアム3世"],"x":"聖書の英訳を作らせたんだ。この「欽定訳聖書」は、今でも英語の名文とされているよ。","v":"MOD"},
  {"id":"MOD-Q07-003","ch":14,"q":"王の権力は神から授けられたもので、国民に責任を負わないとする考えは？","a":"王権神授説","d":["社会契約説","天賦人権説","易姓革命"],"x":"王に逆らうのは、神に逆らうことだ。そういう理屈で、議会を抑えようとしたんだ。","v":"MOD"},
  {"id":"MOD-Q07-004","ch":14,"q":"1628年、議会が課税には議会の同意が必要だと国王に認めさせた文書は？","a":"権利の請願","d":["権利の章典","大憲章","人権宣言"],"x":"チャールズ1世は一度は受け入れたけど、そのあと11年も議会を開かなかったんだ。","v":"MOD"},
  {"id":"MOD-Q07-005","ch":14,"q":"権利の請願を受け入れたのち議会を無視し、ピューリタン革命で処刑された国王は？","a":"チャールズ1世","d":["ジェームズ1世","チャールズ2世","ジェームズ2世"],"x":"処刑の日はとても寒くてね。震えているのを怖がっていると思われないよう、シャツを2枚重ねて着たと言われているよ。","v":"MOD"},
  {"id":"MOD-Q07-006","ch":14,"q":"1642年に始まった、議会派が国王軍を破りチャールズ1世を処刑した革命は？","a":"ピューリタン革命","d":["名誉革命","フランス革命","アメリカ独立革命"],"x":"議会派にピューリタン（イギリスのカルヴァン派）が多かったから、この名前なんだ。","v":"MOD"},
  {"id":"MOD-Q07-007","ch":14,"q":"ピューリタン革命で議会派を率い、共和政を樹立した人物は？","a":"クロムウェル","d":["チャールズ2世","ウィレム3世","ロック"],"x":"肖像画を描かせるとき「いぼも、しわも、ありのままに描け」と言ったんだ。死後、墓をあばかれて首をさらされてしまったよ。","v":"MOD"},
  {"id":"MOD-Q07-008","ch":14,"q":"1651年、クロムウェルがオランダの中継貿易に打撃を与えるために制定した法は？","a":"航海法","d":["権利の章典","審査法","人身保護法"],"x":"イギリスの港には、イギリスの船か、品物をつくった国の船しか入れないことにしたんだ。これで英蘭戦争が起きたよ。","v":"MOD"},
  {"id":"MOD-Q07-009","ch":14,"q":"クロムウェルの死後、王政復古で即位した国王は？","a":"チャールズ2世","d":["ジェームズ2世","ウィリアム3世","ジョージ1世"],"x":"陽気で遊び好きの王様で、「陽気な王」と呼ばれたんだ。","v":"MOD"},
  {"id":"MOD-Q07-010","ch":14,"q":"カトリックを復活させようとして、名誉革命で追放された国王は？","a":"ジェームズ2世","d":["チャールズ2世","ジェームズ1世","チャールズ1世"],"x":"自分の娘とその夫に、王位を奪われてしまったんだ。","v":"MOD"},
  {"id":"MOD-Q07-011","ch":14,"q":"1688年、議会がジェームズ2世を追放し、オランダからウィレム3世を迎えた出来事は？","a":"名誉革命","d":["ピューリタン革命","王政復古","七月革命"],"x":"ほとんど血を流さずに終わったから、「名誉」革命と呼ばれているんだ。","v":"MOD"},
  {"id":"MOD-Q07-012","ch":14,"q":"名誉革命でイギリス王に迎えられたオランダ総督は？","a":"ウィレム3世","d":["オラニエ公ウィレム","ジョージ1世","フィリップ2世"],"x":"妻のメアリ2世と二人で、イギリス王位についたんだ。","v":"MOD"},
  {"id":"MOD-Q07-013","ch":14,"q":"名誉革命の翌年に制定され、議会の権利と王権の制限を定めた法は？","a":"権利の章典","d":["権利の請願","大憲章","航海法"],"x":"今もイギリスの憲法の一部として生きているんだ。","v":"MOD"},
  {"id":"MOD-Q07-014","ch":14,"q":"1714年、ハノーヴァー朝最初のイギリス王となったドイツ出身の人物は？","a":"ジョージ1世","d":["ウィリアム3世","ジェームズ2世","ジョージ3世"],"x":"英語がほとんど話せなかったから、閣議に出なくなったんだ。それで首相が政治を取り仕切るようになったよ。","v":"MOD"},
  {"id":"MOD-Q07-015","ch":14,"q":"ジョージ1世のころに生まれた、イギリスの立憲君主制の原則を表す言葉は？","a":"君臨すれども統治せず","d":["朕は国家なり","代表なくして課税なし","王は死んだ、王万歳"],"x":"王様はいるけど、政治は議会と内閣がやる、ということだね。","v":"MOD"},
  {"id":"MOD-Q08-001","ch":14,"q":"モスクワ大公国の君主で、ツァーリの称号を正式に用い、専制政治を強めたのは？","a":"イヴァン4世","d":["イヴァン3世","ピョートル1世","ミハイル＝ロマノフ"],"x":"あまりの恐ろしさに「雷帝」と呼ばれたんだ。怒りのあまり、自分の息子を殺してしまったこともあるよ。","v":"MOD"},
  {"id":"MOD-Q08-002","ch":14,"q":"ロシアの皇帝（ツァーリ）による専制政治を何という？","a":"ツァーリズム","d":["絶対王政","立憲君主制","啓蒙専制主義"],"x":"「ツァーリ」は、ローマの「カエサル」がなまった言葉なんだ。","v":"MOD"},
  {"id":"MOD-Q08-003","ch":14,"q":"1613年に成立し、ピョートル1世らを出したロシアの王朝は？","a":"ロマノフ朝","d":["リューリク朝","ハプスブルク朝","ブルボン朝"],"x":"20世紀のロシア革命まで、300年以上続いたんだ。","v":"MOD"},
  {"id":"MOD-Q08-004","ch":14,"q":"身長2メートルを超える大男で、西欧化政策を進めたロシアの皇帝は？","a":"ピョートル1世","d":["イヴァン4世","エカチェリーナ2世","アレクサンドル1世"],"x":"自分も身分を隠して西ヨーロッパを旅して、オランダの造船所で大工として働いたんだ。貴族のひげを、はさみで切らせたりもしたよ。","v":"MOD"},
  {"id":"MOD-Q08-005","ch":14,"q":"1689年、ピョートル1世が清と結んだ国境条約は？","a":"ネルチンスク条約","d":["キャフタ条約","トリデシリャス条約","ウェストファリア条約"],"x":"清にとっては、ヨーロッパの国と結んだ初めての対等な条約だったんだ。","v":"MOD"},
  {"id":"MOD-Q08-006","ch":14,"q":"ネルチンスク条約が結ばれた年は？","a":"1689年","d":["1648年","1727年","1588年"],"x":"名誉革命の翌年だね。","v":"MOD"},
  {"id":"MOD-Q08-007","ch":14,"q":"1854年、日本とロシアが結び、択捉島以南を日本領、得撫島以北をロシア領と定めた条約は？","a":"日露和親条約","d":["樺太・千島交換条約","ポーツマス条約","日ソ共同宣言"],"x":"樺太は、どちらの国の人も住める場所とされたんだ。","v":"MOD"},
  {"id":"MOD-Q08-008","ch":14,"q":"1875年、樺太をロシア領、千島列島をすべて日本領とした条約は？","a":"樺太・千島交換条約","d":["日露和親条約","ポーツマス条約","サンフランシスコ平和条約"],"x":"交渉にあたったのは、元幕臣の榎本武揚なんだ。","v":"MOD"},
  {"id":"MOD-Q09-001","ch":15,"q":"万有引力の法則を発見した17世紀のイギリスの科学者は？","a":"ニュートン","d":["ガリレイ","ケプラー","ボイル"],"x":"リンゴの話は有名だけど、本人がそう語った、と伝える人がいるくらいの話なんだ。造幣局の長官として、にせ金づくりを捕まえる仕事もしていたよ。","v":"MOD"},
  {"id":"MOD-Q09-002","ch":15,"q":"フランシス＝ベーコンが説いた、観察や実験から一般的な法則を導く考え方は？","a":"経験論","d":["合理論","ドイツ観念論","スコラ学"],"x":"個々の例を集めて法則を見つける。だから、例外が出てくると崩れることもあるんだ。","v":"MOD"},
  {"id":"MOD-Q09-003","ch":15,"q":"デカルトが説いた、理性による推論から真理を導く考え方は？","a":"合理論","d":["経験論","唯物論","功利主義"],"x":"「我思う、ゆえに我あり」。何もかも疑っても、疑っている自分がいることだけは疑えない、ということだね。","v":"MOD"},
  {"id":"MOD-Q09-004","ch":15,"q":"18世紀のフランスで盛んになった、理性によって古い制度や迷信を批判する思想は？","a":"啓蒙思想","d":["王権神授説","重商主義","ロマン主義"],"x":"「啓蒙」は、暗いところに光を当てて明るくする、という意味なんだ。","v":"MOD"},
  {"id":"MOD-Q09-005","ch":15,"q":"『戦争と平和の法』を著し、「国際法の祖」と呼ばれるオランダの法学者は？","a":"グロティウス","d":["ホッブズ","ボシュエ","モンテスキュー"],"x":"捕まって牢屋に入れられたとき、本を運ぶ箱に隠れて脱出したんだ。","v":"MOD"},
  {"id":"MOD-Q09-006","ch":15,"q":"「万人の万人に対する闘争」を避けるため、人々は国家に権利を譲るべきだと説いた思想家は？","a":"ホッブズ","d":["ロック","ルソー","ヴォルテール"],"x":"主な著書は『リヴァイアサン』。旧約聖書に出てくる、巨大な海の怪物の名前なんだ。","v":"MOD"},
  {"id":"MOD-Q09-007","ch":15,"q":"政府が自然権を侵したとき、人民は抵抗できると説き、名誉革命を擁護した思想家は？","a":"ロック","d":["ホッブズ","ルソー","モンテスキュー"],"x":"この考えは、アメリカ独立宣言にそのまま取り入れられているんだ。","v":"MOD"},
  {"id":"MOD-Q09-008","ch":15,"q":"『社会契約論』で人民主権と直接民主政を説いたフランスの思想家は？","a":"ルソー","d":["ロック","モンテスキュー","ディドロ"],"x":"教育論の『エミール』も書いているけど、自分の子どもはみんな孤児院に預けてしまったんだ。","v":"MOD"},
  {"id":"MOD-Q09-009","ch":15,"q":"『諸国民の富』で自由放任主義を説き、古典派経済学を創始したのは？","a":"アダム＝スミス","d":["ケネー","マルサス","リカード"],"x":"個人が自分の利益を追い求めれば、「見えざる手」に導かれて社会全体がうまくいく。そう考えたんだ。","v":"MOD"},
  {"id":"MOD-Q09-010","ch":15,"q":"17世紀、絶対王政のもとで栄えた、豪華で躍動的な美術・建築様式は？","a":"バロック様式","d":["ロココ様式","ゴシック様式","新古典主義"],"x":"フランスのヴェルサイユ宮殿が代表的だね。","v":"MOD"},
  {"id":"MOD-Q09-011","ch":15,"q":"18世紀に流行した、繊細で優美な美術・建築様式は？","a":"ロココ様式","d":["バロック様式","ロマネスク様式","ルネサンス様式"],"x":"プロイセンのサンスーシ宮殿が代表だよ。「サンスーシ」はフランス語で「憂いなし」という意味なんだ。","v":"MOD"},
  {"id":"MOD-Q10-001","ch":15,"q":"18世紀後半、世界で最初に産業革命が始まった国は？","a":"イギリス","d":["フランス","オランダ","ドイツ"],"x":"資源の石炭と鉄があって、植民地という市場もあった。条件がそろっていたんだ。","v":"MOD"},
  {"id":"MOD-Q10-002","ch":15,"q":"1733年にジョン＝ケイが発明し、織布の能率を高めた道具は？","a":"飛び杼","d":["紡績機","力織機","綿繰り機"],"x":"糸を通す杼を、ひもを引くだけで左右に飛ばせるようにしたんだ。おかげで、今度は糸が足りなくなったよ。","v":"MOD"},
  {"id":"MOD-Q10-003","ch":15,"q":"ハーグリーヴズやクロンプトンらが発明した、綿花から糸をつむぐ機械を総称して何という？","a":"紡績機","d":["力織機","飛び杼","綿繰り機"],"x":"飛び杼で布を織るのが速くなって糸が足りなくなった。だから糸をつむぐ機械が次々に発明されたんだ。","v":"MOD"},
  {"id":"MOD-Q10-004","ch":15,"q":"ニューコメンが実用化し、ワットが改良した動力機関は？","a":"蒸気機関","d":["内燃機関","水車","電動機"],"x":"仕事の量の単位「ワット」は、彼の名前から取られているんだ。","v":"MOD"},
  {"id":"MOD-Q10-005","ch":15,"q":"ニューコメンの蒸気機関を大幅に改良した人物は？","a":"ワット","d":["スティーヴンソン","フルトン","カートライト"],"x":"大学で器具を修理する仕事をしていて、蒸気機関の模型を直しているときに改良を思いついたんだ。","v":"MOD"},
  {"id":"MOD-Q10-006","ch":15,"q":"産業革命のころ、職を奪われた手工業者らが機械を打ち壊した運動は？","a":"ラダイト運動","d":["チャーティスト運動","ドイツ農民戦争","囲い込み運動"],"x":"伝説の指導者「ラッド将軍」の名前から来ているんだ。実在の人物かどうかはわかっていないよ。","v":"MOD"},
  {"id":"MOD-Q11-001","ch":15,"q":"北アメリカ南部の植民地で、黒人奴隷を使ってタバコなどを栽培した大農園を何という？","a":"プランテーション","d":["アシエンダ","エンコミエンダ","ラティフンディア"],"x":"一つの作物だけを大量につくって輸出するんだ。働かされたのは、アフリカから連れてこられた人たちだったよ。","v":"MOD"},
  {"id":"MOD-Q11-002","ch":15,"q":"1764年、イギリスが植民地に輸入される砂糖などに関税をかけた法は？","a":"砂糖法","d":["印紙法","茶法","航海法"],"x":"フレンチ＝インディアン戦争でお金を使いすぎたイギリスが、植民地からお金を取ろうとしたんだ。","v":"MOD"},
  {"id":"MOD-Q11-003","ch":15,"q":"1765年、新聞や証書などの印刷物に本国発行の印紙を貼らせた法は？","a":"印紙法","d":["砂糖法","茶法","審査法"],"x":"反対があまりに激しくて、翌年には取り消されたんだ。","v":"MOD"},
  {"id":"MOD-Q11-004","ch":15,"q":"1773年、茶の販売を東インド会社に独占させた法は？","a":"茶法","d":["印紙法","砂糖法","航海法"],"x":"お茶の値段はかえって安くなったんだ。それでも、植民地の商人の商売を奪う法だったから、反発されたよ。","v":"MOD"},
  {"id":"MOD-Q11-005","ch":15,"q":"イギリス本国の課税に反対した植民地側のスローガンは？","a":"代表なくして課税なし","d":["自由・平等・友愛","王は君臨すれども統治せず","万国の労働者よ団結せよ"],"x":"自分たちの代表がいない議会で、勝手に税を決めるな、ということだね。","v":"MOD"},
  {"id":"MOD-Q11-006","ch":15,"q":"1773年、茶法に反対する急進派が東インド会社の船の茶箱を海に投げ込んだ事件は？","a":"ボストン茶会事件","d":["ヴァレンヌ逃亡事件","アンボイナ事件","プラハ窓外投擲事件"],"x":"先住民の扮装をして、342箱もの茶を海に捨てたんだ。","v":"MOD"},
  {"id":"MOD-Q11-007","ch":15,"q":"1775年、13植民地とイギリス本国の間で始まった戦争は？","a":"アメリカ独立戦争","d":["フレンチ＝インディアン戦争","七年戦争","米英戦争"],"x":"最初は、独立までは考えていない人も多かったんだ。","v":"MOD"},
  {"id":"MOD-Q11-008","ch":15,"q":"1776年、ジェファソンらが起草し、基本的人権や抵抗権をうたった宣言は？","a":"アメリカ独立宣言","d":["フランス人権宣言","権利の章典","合衆国憲法"],"x":"7月4日に採択されて、今もアメリカの独立記念日になっているよ。","v":"MOD"},
  {"id":"MOD-Q11-009","ch":15,"q":"トマス＝ペインが独立の必要性を説いたパンフレットは？","a":"『コモン＝センス』","d":["『社会契約論』","『第三身分とは何か』","『諸国民の富』"],"x":"3か月で12万部も売れたんだ。当時のアメリカの人口を考えると、ものすごい数だよ。","v":"MOD"},
  {"id":"MOD-Q11-010","ch":15,"q":"1783年、イギリスがアメリカ合衆国の独立を承認した条約は？","a":"パリ条約","d":["ウェストファリア条約","ユトレヒト条約","ヴェルサイユ条約"],"x":"パリ条約という名前の条約はいくつもあるから、年号と一緒に覚えようね。","v":"MOD"},
  {"id":"MOD-Q11-011","ch":15,"q":"イギリスとの戦争を経て独立した、北アメリカの国は？","a":"アメリカ合衆国","d":["カナダ","メキシコ","ハイチ"],"x":"独立したときの州は13。だから最初の星条旗の星は13個なんだ。","v":"MOD"},
  {"id":"MOD-Q11-012","ch":15,"q":"1788年に発効した、世界初の近代的な成文憲法とされるものは？","a":"合衆国憲法","d":["権利の章典","1791年憲法","ナポレオン法典"],"x":"今も使われている成文憲法の中で、いちばん古いものなんだ。","v":"MOD"},
  {"id":"MOD-Q11-013","ch":15,"q":"合衆国憲法で、国の政治の最終的な決定権が人民にあるとした原則は？","a":"人民主権","d":["王権神授","連邦主義","三権分立"],"x":"国の主人は王ではなく人民だ、ということだね。","v":"MOD"},
  {"id":"MOD-Q11-014","ch":15,"q":"合衆国憲法が採用した、立法・行政・司法の権力を分ける原則は？","a":"三権分立","d":["連邦主義","人民主権","議院内閣制"],"x":"モンテスキューの考えを取り入れたものなんだ。","v":"MOD"},
  {"id":"MOD-Q11-015","ch":15,"q":"独立戦争の総司令官で、合衆国の初代大統領となったのは？","a":"ワシントン","d":["ジェファソン","フランクリン","リンカン"],"x":"2期8年で自ら退いたんだ。それが、大統領は2期までという慣例になったよ。","v":"MOD"},
  {"id":"MOD-Q11-016","ch":15,"q":"1800年から合衆国の首都となった都市は？","a":"ワシントンD.C.","d":["ニューヨーク","フィラデルフィア","ボストン"],"x":"どの州にも属さない特別な区域なんだ。初代大統領の名前がついているよ。","v":"MOD"},
  {"id":"MOD-Q11-017","ch":15,"q":"フランス領サン＝ドマングで黒人奴隷の反乱を指導し、のちのハイチ独立の道を開いたのは？","a":"トゥサン＝ルヴェルチュール","d":["シモン＝ボリバル","サン＝マルティン","イダルゴ"],"x":"ナポレオン軍に捕らえられて、フランスの牢獄で亡くなったんだ。","v":"MOD"},
  {"id":"MOD-Q11-018","ch":15,"q":"1804年に独立した、世界初の黒人共和国は？","a":"ハイチ","d":["ジャマイカ","キューバ","ブラジル"],"x":"独立と引きかえに、フランスに莫大な賠償金を払わされたんだ。払い終えるのに100年以上かかったよ。","v":"MOD"},
  {"id":"MOD-Q12-001","ch":15,"q":"革命前のフランスの、身分制にもとづく旧体制を何という？","a":"アンシャン＝レジーム","d":["ブルボン朝","第一共和政","絶対王政"],"x":"聖職者が第一身分、貴族が第二身分、平民が第三身分。人口のたった2％ほどの特権身分が、税を免れていたんだ。","v":"MOD"},
  {"id":"MOD-Q12-002","ch":15,"q":"財政難の中で即位し、のちに三部会を招集したフランス国王は？","a":"ルイ16世","d":["ルイ14世","ルイ15世","ルイ18世"],"x":"錠前作りが趣味で、自分で錠前を作っていたんだ。","v":"MOD"},
  {"id":"MOD-Q12-003","ch":15,"q":"ルイ16世のもとで財政改革にあたった、重農主義の経済学者は？","a":"テュルゴー","d":["ネッケル","ケネー","シェイエス"],"x":"特権身分に税をかけようとして、猛反対されて辞めさせられたんだ。","v":"MOD"},
  {"id":"MOD-Q12-004","ch":15,"q":"ルイ16世のもとで財政改革にあたった、スイス出身の銀行家は？","a":"ネッケル","d":["テュルゴー","ラファイエット","ミラボー"],"x":"国の収入と支出を公表して、宮廷のぜいたくを明らかにしたんだ。民衆にはとても人気があったよ。","v":"MOD"},
  {"id":"MOD-Q12-005","ch":15,"q":"1789年、三部会から分かれた第三身分の代表が結成した議会は？","a":"国民議会","d":["立法議会","国民公会","総裁政府"],"x":"自分たちこそが国民の代表だ、と宣言したんだ。","v":"MOD"},
  {"id":"MOD-Q12-006","ch":15,"q":"国民議会が憲法制定まで解散しないことを誓った出来事は？","a":"球戯場の誓い","d":["ヴァルミーの戦い","テルミドールのクーデタ","ブリュメール18日のクーデタ"],"x":"議場から閉め出されて、近くの屋内球技場に集まったんだ。テニスの前身のような球技の場所だよ。","v":"MOD"},
  {"id":"MOD-Q12-007","ch":15,"q":"『第三身分とは何か』を著し、第三身分こそが国民であると訴えたのは？","a":"シェイエス","d":["ルソー","ラファイエット","ロベスピエール"],"x":"もとは聖職者なんだ。のちに、ナポレオンがクーデタで権力を握るのにも手を貸しているよ。","v":"MOD"},
  {"id":"MOD-Q12-008","ch":15,"q":"シェイエスが著したパンフレットは？","a":"『第三身分とは何か』","d":["『コモン＝センス』","『社会契約論』","『法の精神』"],"x":"「第三身分とは何か。すべてである」という書き出しが有名なんだ。","v":"MOD"},
  {"id":"MOD-Q12-009","ch":15,"q":"1789年7月14日、パリの民衆が襲撃した、圧政の象徴とされた施設は？","a":"バスティーユ牢獄","d":["トゥイルリー宮殿","ヴェルサイユ宮殿","ルーヴル宮殿"],"x":"中にいた囚人は、実はたった7人だったんだ。でも武器と火薬があったんだよ。今も7月14日は、フランスの祝日だね。","v":"MOD"},
  {"id":"MOD-Q12-010","ch":15,"q":"1789年、国民議会が採択した、自由・平等・国民主権などをうたった宣言は？","a":"フランス人権宣言","d":["アメリカ独立宣言","権利の章典","ピルニッツ宣言"],"x":"正式には「人間と市民の権利の宣言」なんだ。ただし「人間」には、女性は入っていなかったよ。","v":"MOD"},
  {"id":"MOD-Q12-011","ch":15,"q":"アメリカ独立戦争に参加し、人権宣言の起草にかかわったフランスの貴族は？","a":"ラファイエット","d":["ネッケル","ミラボー","ダントン"],"x":"アメリカとフランスの、両方の革命にかかわった人なんだ。","v":"MOD"},
  {"id":"MOD-Q12-012","ch":15,"q":"1789年10月、パリの女性たちがパンを求めて国王一家をパリに連れ戻した事件は？","a":"ヴェルサイユ行進","d":["ヴァレンヌ逃亡事件","8月10日事件","球戯場の誓い"],"x":"雨の中、何千人もの女性たちが20キロ近く歩いて、ヴェルサイユまで行ったんだ。","v":"MOD"},
  {"id":"MOD-Q12-013","ch":15,"q":"ルイ16世の王妃で、マリア＝テレジアの娘は？","a":"マリ＝アントワネット","d":["マリア＝テレジア","エカチェリーナ2世","ジョゼフィーヌ"],"x":"「パンがなければお菓子を食べればいい」と言った、という話は、実は作り話なんだ。もっと前の本に、別の人の言葉として出てくるよ。","v":"MOD"},
  {"id":"MOD-Q12-014","ch":15,"q":"1791年、オーストリア皇帝とプロイセン王がフランス王権の回復を求めた宣言は？","a":"ピルニッツ宣言","d":["ウェストファリア条約","人権宣言","大陸封鎖令"],"x":"国王一家がヴァレンヌで捕まったことへの、ヨーロッパの王たちの反応だね。","v":"MOD"},
  {"id":"MOD-Q12-015","ch":15,"q":"1791年憲法のもとで成立した、制限選挙による議会は？","a":"立法議会","d":["国民公会","国民議会","三部会"],"x":"この議会のときに、オーストリアとの戦争が始まったんだ。","v":"MOD"},
  {"id":"MOD-Q12-016","ch":15,"q":"1791年、国民議会が制定して解散した、立憲君主政を定めた憲法は？","a":"1791年憲法","d":["1793年憲法","合衆国憲法","ナポレオン法典"],"x":"王はいるけど、権力は憲法で制限する。でも選挙権は、税を多く払う人にしかなかったんだ。","v":"MOD"},
  {"id":"MOD-Q12-017","ch":15,"q":"マルセイユの義勇兵が歌ったことから広まり、現在のフランス国歌となった革命歌は？","a":"ラ＝マルセイエーズ","d":["インターナショナル","ゴッド・セーブ・ザ・キング","星条旗"],"x":"もとはライン方面の軍隊のために作られた歌なんだ。歌詞はかなり勇ましくて、血なまぐさいよ。","v":"MOD"},
  {"id":"MOD-Q12-018","ch":15,"q":"1792年に招集され、王政を廃止して共和政を宣言した議会は？","a":"国民公会","d":["立法議会","国民議会","総裁政府"],"x":"男性の普通選挙で選ばれた、初めての議会なんだ。","v":"MOD"},
  {"id":"MOD-Q12-019","ch":15,"q":"国民公会のもとで始まった、フランス最初の共和政を何という？","a":"第一共和政","d":["第一帝政","総裁政府","統領政府"],"x":"この共和政は、ナポレオンが皇帝になるまで続いたんだ。","v":"MOD"},
  {"id":"MOD-Q12-020","ch":15,"q":"1793年、国民公会によって処刑された国王は？","a":"ルイ16世","d":["ルイ14世","ルイ15世","シャルル10世"],"x":"処刑の判決は、わずか1票差ほどの多数で決まったと言われているんだ。","v":"MOD"},
  {"id":"MOD-Q12-021","ch":15,"q":"ルイ16世の処刑後、イギリスの首相ピットの呼びかけで結成された、革命フランスに対抗する同盟は？","a":"対仏大同盟","d":["神聖同盟","武装中立同盟","三国同盟"],"x":"ヨーロッパの王たちは、革命が自分の国に広がるのを恐れたんだ。","v":"MOD"},
  {"id":"MOD-Q12-022","ch":15,"q":"ロベスピエールらジャコバン派が反対派を次々と処刑した政治を何という？","a":"ジャコバン独裁（恐怖政治）","d":["総裁政府","立憲君主政","第一帝政"],"x":"ギロチンで処刑された人は、何万人にものぼると言われているんだ。","v":"MOD"},
  {"id":"MOD-Q12-023","ch":15,"q":"ジャコバン派を率いて恐怖政治を行った指導者は？","a":"ロベスピエール","d":["ダントン","ナポレオン","シェイエス"],"x":"「清廉の人」と呼ばれるほど、私生活はまじめな人だったんだ。最後は、自分もギロチンにかけられたよ。","v":"MOD"},
  {"id":"MOD-Q12-024","ch":15,"q":"1794年、ロベスピエールが倒されたクーデタは？","a":"テルミドールのクーデタ","d":["ブリュメール18日のクーデタ","8月10日事件","ヴァレンヌ逃亡事件"],"x":"テルミドールは、革命暦の「熱月」という月の名前なんだ。","v":"MOD"},
  {"id":"MOD-Q13-001","ch":15,"q":"ナポレオンがイギリスとインドの連絡を断つため、1798年に行った遠征は？","a":"エジプト遠征","d":["イタリア遠征","ロシア遠征","スペイン遠征"],"x":"学者もたくさん連れて行ったんだ。ロゼッタ＝ストーンが見つかったのも、この遠征のときだよ。","v":"MOD"},
  {"id":"MOD-Q13-002","ch":15,"q":"ナポレオンが制定した、私有財産の不可侵や法の前の平等を定めた法典は？","a":"ナポレオン法典","d":["十二表法","ローマ法大全","権利の章典"],"x":"ナポレオン自身、戦争の勝利よりこの法典こそ永遠に残る、と語っているんだ。日本の民法にも影響を与えたよ。","v":"MOD"},
  {"id":"MOD-Q13-003","ch":15,"q":"1804年、ナポレオンが皇帝に即位して始まった体制は？","a":"第一帝政","d":["第一共和政","統領政府","総裁政府"],"x":"戴冠式では、教皇から冠を受け取らずに、自分で自分の頭にのせたんだ。","v":"MOD"},
  {"id":"MOD-Q13-004","ch":15,"q":"1806年、ナポレオンがライン同盟を結成させたことで消滅した国は？","a":"神聖ローマ帝国","d":["オーストリア帝国","プロイセン王国","ポーランド王国"],"x":"オットー1世から数えて、800年以上続いた帝国の終わりだね。","v":"MOD"},
  {"id":"MOD-Q13-005","ch":15,"q":"1806年、ナポレオンがイギリスとの通商を禁じた命令は？","a":"大陸封鎖令","d":["航海法","ピルニッツ宣言","ナントの王令"],"x":"海でイギリスに勝てなかったから、経済で締め上げようとしたんだ。でも、困ったのは大陸の国々のほうだったよ。","v":"MOD"},
  {"id":"MOD-Q13-006","ch":15,"q":"1805年、ネルソン率いるイギリス艦隊がフランス・スペイン艦隊を破った海戦は？","a":"トラファルガーの海戦","d":["アブキール湾の海戦","アクティウムの海戦","レパントの海戦"],"x":"勝ったネルソン提督は、この戦いで撃たれて亡くなったんだ。ロンドンのトラファルガー広場には、彼の像が立っているよ。","v":"MOD"},
  {"id":"MOD-Q13-007","ch":15,"q":"ナポレオンのロシア遠征失敗後、ヨーロッパ諸国がナポレオン支配に立ち向かった戦いは？","a":"諸国民戦争（解放戦争）","d":["七年戦争","三十年戦争","百年戦争"],"x":"1813年のライプツィヒの戦いが、決定的な戦いになったんだ。","v":"MOD"},
  {"id":"MOD-Q13-008","ch":15,"q":"諸国民戦争に敗れたナポレオンが流された島は？","a":"エルバ島","d":["セントヘレナ島","コルシカ島","シチリア島"],"x":"一度はここを抜け出して、皇帝に返り咲いたんだ。いわゆる「百日天下」だね。最後はもっと遠いセントヘレナ島に流されたよ。","v":"MOD"}

  {"title": "史書庫へようこそ", "ev": [

    {"t": "jump", "to": 24},

    {"t": "l", "s": "シミ", "x": "司書の仕事は、それを正すこと。君が食べる必要はないよ。これは俺の役目なんだ。"},
    {"t": "choice", "o": ["……おいしいんですか？", "おなか、壊さないんですか……？"], "to": [46, 48]},
    {"t": "l", "s": "シミ", "x": "インクの味だから美味しくはないけど、うーん……慣れたかな。"},
    {"t": "jump", "to": 50},
    {"t": "l", "s": "シミ", "x": "うーん……俺は普通の人間じゃないからね。ちょっとオエっとはするけど、もう慣れたかな。"},
    {"t": "jump", "to": 50},
    {"t": "l", "s": "主人公", "x": "慣れるくらい食べてるんですね。"},
    {"t": "l", "s": "シミ", "x": "長くいるからね。"},
    {"t": "l", "s": "シミ", "x": "年号の数字とか、地名の一字くらいなら、俺が食べれば済む。でも、人がかかわる大きな書き換えは、そうはいかない。"},
    {"t": "d", "x": "紙魚がエプロンのポケットから、細長い栞を数枚と、人物が描かれた一枚の紙を取り出す。紙魚は人物の姿と名前が書かれた紙の方をこちらに差し出した。"},
    {"t": "l", "s": "シミ", "x": "ちょっと見てみて。これが頁（ページ）。歴史上の人物について書かれた、文字通り本の一ページだよ。誤植を見つけたら、その出来事にいちばん詳しい人の頁を開いて、証言してもらうんだ。"},
    {"t": "l", "s": "シミ", "x": "頁（ページ）は、書庫のあちこちの本に挟まってる。この栞を集めておくと、自分が必要とすることになる誰かの頁のところまで導いてくれる。誰の頁が出てくるかは、めくってみるまでわからないけどね。"},
    {"t": "l", "s": "シミ", "x": "栞は、勉強した分だけ手に入る。知っていることを増やせば増やすほど、栞はたまるんだ。"},
    {"t": "l", "s": "シミ", "x": "そうだ、一度一緒に勉強してみようか。大丈夫、間違えても俺の栞を分けてあげるから。"},
    {"t": "act", "a": "tquiz", "v": ["ORI-Q01-002", "ORI-Q01-003", "ORI-Q01-004"]},
    {"t": "l", "s": "シミ", "x": "じゃあ、その栞で本をめくってみて。"},
    {"t": "act", "a": "tgacha"},
    {"t": "l", "s": "シミ", "x": "うん、いい頁が出たね。大事にしてあげて。"},
    {"t": "d", "x": "さらに奥、メソポタミアの棚で、別の本がまぶしく光る。", "fx": "flash"},
    {"t": "d", "x": "紙魚が開くと、ページの余白にまで黒い虫がびっしりと並び、大きく盛り上がっていく。小型の誤植モンスターになる。", "fx": "shake"},
    {"t": "d", "x": "ページには「世界最古の法典の一つをつくったのは、コンラッド博士である」。"},
    {"t": "l", "s": "主人公", "x": "コンラッド博士？"},
    {"t": "l", "s": "シミ", "x": "……うーーん、コンラッド……この人の名前は、初めて見たね。"},
    {"t": "l", "s": "シミ", "x": "ほら、さっきの頁がちょうど役に立ちそうだ。めくったときに出てくる頁が、どんな人だったかは図鑑で確認しておくといいかもしれないね。"},
    {"t": "act", "a": "tbattle"},
    {"t": "l", "s": "シミ", "x": "ハンムラビ法典は全282条。「目には目を、歯には歯を」で有名だね。ただし、身分によって罰の重さは違ったんだ。"},
    {"t": "l", "s": "シミ", "x": "お疲れ様。初日にしては筋がいいね。こうやって、一つずつ直していけばいいから。"},
    {"t": "d", "x": "書架の上のほうで、いくつもの本が次々と光り始める。どれも、オリエントの階の方向だ。", "fx": "flash"},
    {"t": "l", "s": "シミ", "x": "……うーーん、誤植の増え方が異常だな。どうやら、誰かが意思をもって本を書き換えていっているみたいだ。……新人さん、初日からで悪いんだけど、手伝ってもらえるかな。"},
    {"t": "choice", "o": ["もちろんです", "……がんばります"], "to": [74, 76]},
    {"t": "l", "s": "シミ", "x": "ありがとう。心強いよ。"},
    {"t": "jump", "to": 78},
    {"t": "l", "s": "シミ", "x": "うん、それで十分。俺も一緒だから。"},
    {"t": "jump", "to": 78}
  ]},
  {"title": "世界初の男", "ev": [
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "オリエントの階。粘土板を積み上げたような棚が並んでいる。そのうちの一冊が、ほかとは比べものにならないほど強く光っている。", "fx": "flash"},
    {"t": "l", "s": "主人公", "x": "あの本、さっきまでと光り方が違います。"},
    {"t": "l", "s": "シミ", "x": "中で誤植が増えすぎてるんだ。外からつまみ出すだけじゃ、追いつかないね。"},
    {"t": "l", "s": "シミ", "x": "こういうときは、本の中に入って直接直すんだよ。"},
    {"t": "l", "s": "主人公", "x": "本の中に……入る？"},
    {"t": "l", "s": "シミ", "x": "ページに手を置いてごらん。大丈夫、司書なら誰でもできるから。"},
    {"t": "d", "x": "○○がページに手を置くと、文字が足もとから立ちのぼり、書架が遠ざかっていく。", "fx": "flash"},
    {"t": "bg", "v": "背景_シュメール"},
    {"t": "d", "x": "気がつくと、照りつける日差しの下に立っている。日干しれんがの家並みの向こうに、階段状の巨大な神殿がそびえている。"},
    {"t": "l", "s": "シミ", "x": "ようこそ、メソポタミアへ。二つの川のあいだ、っていう意味の土地だよ。ここはシュメール人の都市国家、ウルだね。"},
    {"t": "l", "s": "主人公", "x": "本の中って、こんなふうになってるんですね……。"},
    {"t": "l", "s": "シミ", "x": "書いてあることが、そのまま景色になるんだ。だから誤植があると、景色のほうもおかしくなる。"},
    {"t": "d", "x": "市場の片すみで、書記が粘土板に楔形文字を刻んでいる。その粘土板の端に、なぜか読める文字が書き足されている。「楔形文字の発明者　コンラッド博士」。"},
    {"t": "l", "s": "主人公", "x": "また博士だ。"},
    {"t": "l", "s": "シミ", "x": "楔形文字はシュメール人が使い始めたものだね。たった一人だけの発明じゃない。何百年もかけて、絵から文字になっていったんだ。"},
    {"t": "l", "s": "シミ", "x": "メソポタミアのこと、少しおさらいしておこうか。"},
    {"t": "act", "a": "quiz", "v": ["ORI-Q02-001", "ORI-Q02-006", "ORI-Q02-009", "ORI-Q02-011", "ORI-Q02-013"]},
    {"t": "d", "x": "神殿へ続く道ばたの粘土板には「六十進法を考案した天才、コンラッド博士」。神殿の入口の柱には「ジッグラトの設計者、コンラッド博士」。"},
    {"t": "l", "s": "主人公", "x": "博士、手当たり次第ですね。"},
    {"t": "l", "s": "シミ", "x": "世界初、っていう言葉が好きなんだろうね。"},
    {"t": "l", "s": "主人公", "x": "これって、このコンラッド博士って人が犯人なんでしょうか。"},
    {"t": "l", "s": "シミ", "x": "うーん、決めつけはよくないけど、まあ、まず間違いないだろうね。"},
    {"t": "d", "x": "紙魚が道ばたの黒い虫をまとめてつまみ上げると、景色がページをめくるように流れ、時代が先へ進んでいく。", "fx": "shake"},
    {"t": "bg", "v": "背景_バビロン"},
    {"t": "d", "x": "高い城壁に囲まれた都。広場の真ん中に、人の背丈を超える黒い石碑が立っている。その石碑が、ひときわ強く光っている。", "fx": "flash"},
    {"t": "d", "x": "石碑の一番下に、新しい条文が刻まれている。「第283条　コンラッド博士の学説を否定した者は、溺死刑に処す」"},
    {"t": "l", "s": "主人公", "x": "……私怨がすごい。"},
    {"t": "l", "s": "シミ", "x": "よっぽど、否定されたのが悔しかったんだね。"},
    {"t": "l", "s": "主人公", "x": "ハンムラビ法典に、勝手に書き足されてますよ！！"},
    {"t": "l", "s": "シミ", "x": "本物は全282条だからね。この一条はおまけだ。いただきます。"},
    {"t": "d", "x": "紙魚が石碑の端から黒い虫をつまみ出し、口に入れる。283条目の文字が消える。"},
    {"t": "l", "s": "シミ", "x": "ちなみに、本物の法典には、ビールの値段をごまかした酒場の女主人を溺死刑にする条文があるんだよ。"},
    {"t": "l", "s": "主人公", "x": "溺死刑の基準がわからない……。"},
    {"t": "l", "s": "シミ", "x": "当時の「酒」は腐りにくく、長持ちする貴重なカロリー源だったからね。今とは価値が全く違うんだ。"},
    {"t": "act", "a": "quiz", "v": ["ORI-Q02-014", "ORI-Q02-016", "ORI-Q02-019", "ORI-Q02-021", "ORI-Q02-025"]},
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "本の外に出ると、ひんやりと冷たい書庫の空気が戻ってきた。古びた本の甘い匂いに少しホッとする。隣の書架では、本がいくつも金色に光っている。", "fx": "flash"},
    {"t": "l", "s": "シミ", "x": "ふう、あれは古代エジプトの棚だね。休むひまもないけど、行こうか。"},
    {"t": "bg", "v": "背景_ナイル"},
    {"t": "d", "x": "ゆったりと流れる大河。両岸だけが帯のように緑で、その外は見渡すかぎりの砂漠だ。遠くに、三つのピラミッドが並んでいる。"},
    {"t": "l", "s": "シミ", "x": "ナイル川だよ。毎年の増水が肥えた土を運んでくるから、とても豊かな土地だったんだ。"},
    {"t": "l", "s": "シミ", "x": "この時代について言及した記録として最も有名なのは、やっぱりギリシアの旅行家として知られる「彼」のものかな。"},
    {"t": "d", "x": "ピラミッドに近づくと、石材の一つに大きく彫りこまれている。「設計：コンラッド博士」。石のすき間から、黒い誤植がにじみ出してくる。", "fx": "shake"},
    {"t": "act", "a": "battle", "v": "P1-01"},
    {"t": "l", "s": "ヘロドトス", "x": "（ピラミッドのことなら、私が現地で聞いた話がいくらでもある。まあ読者のために、少々盛ってはいるがね。）"},
    {"t": "l", "s": "シミ", "x": "「エジプトはナイルのたまもの」も、彼の本に出てくる言葉だよ。"},
    {"t": "act", "a": "quiz", "v": ["ORI-Q03-001", "ORI-Q03-004", "ORI-Q03-005", "ORI-Q03-007", "ORI-Q03-011"]},
    {"t": "d", "x": "景色がふたたび流れ、時代が千年ほど先へ進む。"},
    {"t": "bg", "v": "背景_アマルナ"},
    {"t": "d", "x": "新しく切り開かれた、まぶしい白い都。どの建物にも、円盤から光の手がのびる太陽の浮き彫りがある。"},
    {"t": "l", "s": "シミ", "x": "……テル＝エル＝アマルナ。アメンホテプ4世というファラオが、アトン神のためにつくったとされる都だよ。"},
    {"t": "d", "x": "神殿の柱の陰に、背の高い初老の男が立っている。片眼鏡、ひざまである上着。手には分厚いノート。壁の碑文に、熱心に何かを書き込んでいる。"},
    {"t": "l", "s": "主人公", "x": "あの人……。"},
    {"t": "d", "x": "男が振り向く。逃げるどころか、胸を張って近づいてくる。"},
    {"t": "l", "s": "コンラッド", "x": "おや、見学者かね。ちょうどいい。私の業績について説明してあげよう。"},
    {"t": "l", "s": "主人公", "x": "あなたがコンラッド博士ですか？"},
    {"t": "l", "s": "コンラッド", "x": "いかにも。人類の「世界初」をことごとく成し遂げた男、コンラッド博士だ。"},
    {"t": "l", "s": "シミ", "x": "成し遂げた、っていうより、書き足した、だよね。"},
    {"t": "l", "s": "コンラッド", "x": "細かいことを気にする男だな。"},

    {"t": "l", "s": "コンラッド", "x": "見たまえ。アマルナ美術だ。王の顔も体も、理想化せずにありのままに描いた。それまでのエジプト美術とはまるで違う。"},
    {"t": "l", "s": "コンラッド", "x": "ネフェルティティの胸像は知っているかね？　アメンホテプ4世の王妃……君のような美人の胸像だよ。片方の目だけ、はめ込まれていない。なぜだと思う？"},
    {"t": "choice", "o": ["作りかけだったから？", "わざと？"], "to": [64, 66]},
    {"t": "l", "s": "コンラッド", "x": "ふむ、諸説ある。答えは、まだ誰も知らん。だから面白いのだ。"},
    {"t": "jump", "to": 68},
    {"t": "l", "s": "コンラッド", "x": "ふむ、諸説ある。答えは、まだ誰も知らん。だから面白いのだ。"},
    {"t": "jump", "to": 68},
    {"t": "d", "x": "○○が振り返ると、紙魚がいない。工房の外、王宮へ続く大通りを、一人で歩いていく背中が見える。"},
    {"t": "l", "s": "主人公", "x": "シミ先輩？"},

    {"t": "l", "s": "コンラッド", "x": "さて、講義は終わりだ。私には、まだ書き足すべき世界初があるのでね。失礼するよ！！"},
    {"t": "d", "x": "コンラッドがノートのページを一枚破って宙に投げる。ページの余白が白くほどけるように広がり、コンラッドはその白の中へ、溶けるように姿を消す。", "fx": "flash"},

    {"t": "d", "x": "紙魚が宙に残った白いページに手を置くと、景色が夜に変わる。"},
    {"t": "bg", "v": "背景_王家の谷"},
    {"t": "d", "x": "月明かりに照らされた、岩山の谷。斜面のあちこちに、王たちの墓の入口がぽっかりと口をあけている。"},

    {"t": "bg", "v": "背景_王家の谷_墓"},

    {"t": "d", "x": "墓の奥へ進むと、壁画の並ぶ通路の突きあたりに、場違いな黒い石板が埋めこまれている。表面には三種類の文字。そして一番下に、大きな署名。"},
    {"t": "l", "s": "シミ", "x": "ロゼッタ＝ストーン……のはずなんだけど、署名つきは初めて見たね。"},

    {"t": "l", "s": "シミ", "x": "それも誤植のしわざだね。本当はナイル河口の町で見つかったんだよ。"},
    {"t": "act", "a": "battle", "v": "P1-03"},
    {"t": "l", "s": "シャンポリオン", "x": "（解読したのは私だ！　わかった瞬間、嬉しすぎて嬉しすぎて、兄の職場に駆け込んで、そのまま気を失ったんだ！アッハッハッハ！）"},
    {"t": "l", "s": "シミ", "x": "それだけ情熱を注いでいたんだろうね。ちなみに、ロゼッタ＝ストーンを見つけたのはナポレオンのエジプト遠征軍なんだ。でもフランスはイギリスに敗れて引き渡すことになったから、今はロンドンの大英博物館にあるんだよ。"},
    {"t": "act", "a": "quiz", "v": ["ORI-Q03-012", "ORI-Q03-013", "ORI-Q03-015", "ORI-Q03-017", "ORI-Q03-021"]},
    {"t": "act", "a": "break"},
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "書庫の通路。今度は、地中海の棚で本が光っている。", "fx": "flash"},
    {"t": "l", "s": "シミ", "x": "博士、今度は海のほうへ行ったみたいだね。"},
    {"t": "d", "x": "二人は、光るページに手を置く。"},
    {"t": "bg", "v": "背景_フェニキア"},
    {"t": "d", "x": "潮のにおい。港町の岸壁に、杉材を積んだ船がずらりと並んでいる。"},
    {"t": "l", "s": "シミ", "x": "ティルス。フェニキア人の港町だよ。ここの商人たちは、地中海じゅうを船で行き来してたんだ。"},

    {"t": "d", "x": "積み荷の陰から、聞き覚えのある声。"},
    {"t": "l", "s": "コンラッド", "x": "フェニキア文字だ！　そんなことも知らんのか！"},

    {"t": "d", "x": "コンラッドは慌てて引っ込む。"},
    {"t": "l", "s": "シミ", "x": "詳しいねえ。さすが研究者だ。"},

    {"t": "act", "a": "battle", "v": "P1-04"},
    {"t": "l", "s": "シミ", "x": "フェニキア文字は、もともとフェニキアの商人たちが商売の帳簿をつけるために使っていた文字なんだ。子音しかなかったから、ギリシア人が母音を書き足して使うようになったんだよ。"},
    {"t": "act", "a": "quiz", "v": ["ORI-Q04-001", "ORI-Q04-004", "ORI-Q04-006", "ORI-Q04-008", "ORI-Q04-015"]},
    {"t": "d", "x": "コンラッドの足あとを追って港を走りぬけると、景色がページをめくるように流れていく。"},
    {"t": "bg", "v": "背景_ニネヴェ"},
    {"t": "d", "x": "アッシリアの都ニネヴェ。王宮の一室に、粘土板の目録がずらりと並ぶ巨大な書庫がある。その一角が、まぶしく光っている。", "fx": "flash"},
    {"t": "d", "x": "目録の粘土板の間に、場違いな革装の本が何冊も差し込まれている。背表紙には「コンラッド著」。"},
    {"t": "d", "x": "その前で、コンラッドが満足げに腕を組んでいる。"},
    {"t": "l", "s": "コンラッド", "x": "見たまえ。アッシュルバニパルの図書館だ。世界最古級の図書館だぞ。私の本にこそ相応しい。"},

    {"t": "l", "s": "コンラッド", "x": "勝手ではない。ここに並ぶべき業績を、並べたまでだ。"},
    {"t": "l", "s": "シミ", "x": "この図書館の粘土板は、町が焼けたときに、かえって焼き固められて残ったんだ。燃えたおかげで、何千年も残った本だよ。"},
    {"t": "l", "s": "コンラッド", "x": "……ふむ。それは知っている。研究者からすればラッキーな話だ。町が燃えた民衆はたまったものではなかったろうがな。"},
    {"t": "d", "x": "コンラッドは咳払いをして、王宮の奥へ逃げ込む。逃げた先の壁のレリーフが光り、誤植が湧き出す。", "fx": "shake"},
    {"t": "l", "s": "シミ", "x": "金属貨幣についての問題か。これについて詳しいのも、やっぱりギリシアの冒険家のあの人なんだよね。"},
    {"t": "act", "a": "battle", "v": "P1-05"},
    {"t": "l", "s": "ヘロドトス", "x": "（リディア人こそ、金や銀の貨幣を初めてつくって使った人々だ。私の『歴史』にも、ちゃんと書いておいたよ。）"},
    {"t": "act", "a": "quiz", "v": ["ORI-Q05-001", "ORI-Q05-003", "ORI-Q05-005", "ORI-Q05-006"]},
    {"t": "d", "x": "レリーフの奥に、海の色をした光がのぞいている。くぐり抜けると、波の音がする。"},
    {"t": "bg", "v": "背景_クノッソス"},
    {"t": "d", "x": "海を見下ろす丘の上の宮殿。赤い柱の廊下が、どこまでも入り組んで続いている。廊下の壁そのものが、脈打つように光っている。", "fx": "flash"},
    {"t": "d", "x": "迷宮の奥に、コンラッドがいる。"},

    {"t": "l", "s": "主人公", "x": "原点？"},
    {"t": "l", "s": "コンラッド", "x": "私は、この島の宮殿を研究していた。ミノタウロスの迷宮が実在すると証明するために、人生を賭けた。"},
    {"t": "l", "s": "コンラッド", "x": "だが、宮殿を掘り当てたのは私ではなかった。私の学説は、彼らの発見によって、ことごとく否定された。"},
    {"t": "l", "s": "シミ", "x": "エヴァンズと、シュリーマンだね。"},
    {"t": "l", "s": "コンラッド", "x": "彼らの名は教科書に載った。どれだけ研究に人生を注いでも、最初の発見者でない私は、教科書に載ることはない。"},
    {"t": "l", "s": "コンラッド", "x": "発見したのが私でないなら、発見したことにすればいい。それだけの話だ。"},
    {"t": "d", "x": "迷宮の壁が崩れ、あらゆる亀裂の中から誤植が湧き出してくる。最後には、迷宮そのものが巨大な誤植になって襲いかかってきた。", "fx": "shakeBig"},
    {"t": "act", "a": "battle", "v": "P1-06"},
    {"t": "l", "s": "エヴァンズ", "x": "（宮殿を掘ったのは私だ。ただ、コンクリートで復元しすぎたと、今でも言われているがね。）"},
    {"t": "d", "x": "迷宮の光が消え、廊下がもとの宮殿に戻る。コンラッドはひざをついている。"},
    {"t": "l", "s": "主人公", "x": "博士……。"},

    {"t": "d", "x": "コンラッドは崩れた壁の白い余白へ転がり込み、溶けるように姿を消す。"},
    {"t": "l", "s": "シミ", "x": "逃げちゃったね。"},
    {"t": "l", "s": "主人公", "x": "追わなくていいんですか？"},
    {"t": "l", "s": "シミ", "x": "行き先はわかるよ。博士が書き込むたびに、本が光るから。"},
    {"t": "act", "a": "quiz", "v": ["ORI-Q06-002", "ORI-Q06-003", "ORI-Q06-005", "ORI-Q06-007"]},
    {"t": "bg", "v": "背景_書庫_書架"},

    {"t": "l", "s": "主人公", "x": "シミ先輩。ここ、誤植ないですよ。"},
    {"t": "l", "s": "シミ", "x": "うん。誤植がなくても、たまに本の様子を見に来るんだよ。何度でも読み返したくなったりする本って、あるだろ。"},
    {"t": "d", "x": "紙魚は振り返り、いつもの顔で笑う。"},
    {"t": "l", "s": "シミ", "x": "さ、お茶にしようか。新人さん、今日はよくがんばったね。"},

  {"title": "消えていく名前", "ev": [
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "インドの階。棚の本がいくつも光っている。けれど、これまでの白く強い光とは違う。ぼんやりと、にじむような光だ。【演出：光る】"},
    {"t": "l", "s": "主人公", "x": "光り方が、なんだか弱いですね。"},
    {"t": "l", "s": "シミ", "x": "……うん。コンラッド博士の産み出した誤植とはべつのものかもしれないね。"},
    {"t": "l", "s": "シミ", "x": "でも、変だな。本を書き換える人が、一度に二人も現れるなんて。今まで、なかったのになあ。"},

    {"t": "l", "s": "シミ", "x": "うん。一人だって、何百年に一度あるかないかなんだ。"},
    {"t": "d", "x": "紙魚が一番左上にあった一冊を抜き出す。背表紙には「インダス文明」。"},
    {"t": "l", "s": "シミ", "x": "まずは、いちばん古いところから入ってみよう。"},
    {"t": "d", "x": "二人は本の記述に手を置く。"},
    {"t": "bg", "v": "背景_インダス"},
    {"t": "d", "x": "焼きれんがの家が、碁盤の目のようにまっすぐ並ぶ町。大きな沐浴場のまわりに、人の気配はない。"},
    {"t": "l", "s": "シミ", "x": "インダス川の下流にある、モエンジョ＝ダーロだよ。下水道まで整った、すごく計画的な町だったんだ。"},
    {"t": "l", "s": "主人公", "x": "でも、誰もいませんね。"},
    {"t": "l", "s": "シミ", "x": "この本は、もともとこうなんだ。町の名前はわかるけど、ここを治めた王や、そこで暮らしていた人々の名前は、ひとつも伝わってない。"},
    {"t": "l", "s": "主人公", "x": "どうしてですか？"},
    {"t": "d", "x": "紙魚が足もとから、小さな四角い石を拾い上げる。雄牛の浮き彫りと、見たことのない記号が刻まれている。"},
    {"t": "l", "s": "シミ", "x": "これは印章って言って、粘土板にハンコ代わりに押されていたものらしいんだ。ここに刻まれた記号が「インダス文字」と呼ばれる言語なんだけど、まだ現代では誰にも読めていないんだ。"},
    {"t": "l", "s": "主人公", "x": "誰も読めないから、誰もいなかったことになってるってことですか……。"},
    {"t": "l", "s": "シミ", "x": "本は読む人によって意味も価値も180度変わるものだからね。もし俺たちではなく、当時の人がこの本を読んだら、もっと活気ある街になっているんだろうね。……ここは、誤植で消えたわけじゃない。……光ってたのは、この先みたいだね。"},
    {"t": "l", "s": "シミ", "x": "ああそうだ。せっかくだから、インダス文明とアーリヤ人のことも、クイズでおさらいしておこうか。"},
    {"t": "act", "a": "quiz", "v": ["IND-Q01-001", "IND-Q01-002", "IND-Q01-003", "IND-Q01-004", "IND-Q01-006"]},
    {"t": "d", "x": "景色が本のページをめくるように流れ、時代が先へ進む。"},
    {"t": "bg", "v": "背景_ガンジス"},
    {"t": "d", "x": "ゆったりと流れる大河だ。川岸の石段が水際まで続き、さっきとは違い、沐浴する人々の姿が見える。川沿いには、城壁に囲まれた町がいくつも並んでいる。"},
    {"t": "l", "s": "シミ", "x": "ガンジス川の流域だよ。前6世紀ごろ、このあたりの都市国家で、新しい教えがいくつも生まれたんだ。"},
    {"t": "d", "x": "町の入口に掛けられた木札が、にじむように光っている。【演出：光る】"},
    {"t": "d", "x": "「（　　）は、バラモンの権威を否定し、徹底した不殺生を説いてジャイナ教を開いた」"},
    {"t": "l", "s": "主人公", "x": "あれ、名前のところだけ、穴があいてる……これも誤植ですか？"},
    {"t": "l", "s": "シミ", "x": "ちょっと違う。あれは誤植じゃなくて「落丁(らくちょう)」だね。書いてあるべきものが書かれていないことを指す。"},
    {"t": "l", "s": "主人公", "x": "博士が、自分の名前を入れるために場所をあけてるとか？"},
    {"t": "l", "s": "シミ", "x": "うーん、多分違う。だって穴をあけたら自分の名前を書くスペースがなくなってしまうだろ。それに博士なら、俺たちから逃げずに、堂々と自分の名前を書き込んでると思うよ。"},
    {"t": "d", "x": "空欄が黒くにじみ、木札からはがれて、誤植になる。【演出：揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-07"},
    {"t": "l", "s": "ヴァルダマーナ", "x": "（我々がこの世界を生まれ変わり続けるのは、「業（カルマ）」から逃れられないからだ。厳しい苦行や正しい生き方でカルマを消し去り、解脱をしようではないか。）"},
    {"t": "l", "s": "シミ", "x": "ジャイナ教は不殺生をとても厳しく守るから、土を耕して虫や害獣を殺してしまう農業には向かなくてね。商人たちに広まったんだ。"},
    {"t": "d", "x": "隣の石板にも、同じような空欄がある。「（　　）は、四諦・八正道を説いた」"},

    {"t": "act", "a": "quiz", "v": ["IND-Q02-001", "IND-Q02-002", "IND-Q02-004", "IND-Q02-005", "IND-Q02-009"]},
    {"t": "d", "x": "景色が流れ、時代が少し先へ進む。川沿いに、木の城壁に囲まれた大きな都が現れる。"},
    {"t": "d", "x": "都の城門の前で、見覚えのある片眼鏡の男が、青い顔をして本をめくっている。"},
    {"t": "l", "s": "主人公", "x": "博士！　やっぱり、名前を消してたのは……"},
    {"t": "l", "s": "コンラッド", "x": "私ではない！"},

    {"t": "l", "s": "コンラッド", "x": "見たまえ。私が書いた私の名前まで、消されている！"},
    {"t": "l", "s": "コンラッド", "x": "これだと、どこの「博士」だか分からなくなってしまうだろう！！”コンラッド博士”じゃなければ困るのだ！"},
    {"t": "l", "s": "コンラッド", "x": "だいたい、君らも分かってると思うが、私は自分の名前を歴史に残したいだけだ。誰かの業績を意味もなく消すわけがないだろう。"},
    {"t": "l", "s": "主人公", "x": "……たしかに。"},

    {"t": "l", "s": "シミ", "x": "業績欄っていうか、誤植なんだけどね。"},
    {"t": "l", "s": "コンラッド", "x": "……不本意だが、提案がある。名前を消して回ってる「犯人」を見つけるまで、君たちに協力してやろう。"},

    {"t": "jump", "to": 61},
    {"t": "d", "x": "城門の上の銘板が、にじむように光る。「（　　）は、マガダ国にマウリヤ朝を建て、パータリプトラを都とした」【演出：光る】"},
    {"t": "l", "s": "コンラッド", "x": "さっそく出たな。ここは引っかけがある。……いや、自分で考えたまえ。"},

    {"t": "l", "s": "コンラッド", "x": "グプタ朝を建てたのはチャンドラグプタ1世。名前が同じうえに、都まで同じパータリプトラなのだ。紛らわしいことこの上ない。"},

    {"t": "act", "a": "break"},
    {"t": "d", "x": "都のはずれ。よく磨かれた石の柱が立っている。表面にはびっしりと文字が刻まれているが、ところどころが白く削り取られている。【演出：光る】"},
    {"t": "l", "s": "コンラッド", "x": "ふむ……この文字は読める。ブラーフミー文字だ。"},

    {"t": "l", "s": "コンラッド", "x": "この文字を解読したのは、19世紀のプリンセプという男だ。造幣局の役人でな、仕事の合間に、こつこつ研究を進め、誰も読めなかった碑文を解き明かした。"},
    {"t": "l", "s": "コンラッド", "x": "……見事な仕事だ。あれは、本物の発見だ。"},

    {"t": "l", "s": "アショーカ王", "x": "（碑文では、私は『神々に愛された者』と名乗った。誰が誓ったのかを、民が忘れないようにな。）"},
    {"t": "l", "s": "コンラッド", "x": "碑文に『アショーカ』という名が出てくるのは、ほんのわずかでな。長いあいだ、この『神々に愛された者』が誰なのか、わからなかったのだ。"},

    {"t": "bg", "v": "背景_ナーランダー"},
    {"t": "d", "x": "れんが造りの巨大な僧院。いくつも並んだ僧房から、経を読む声が聞こえてくる。中庭の奥に、ひときわ高い図書館の建物がそびえている。"},
    {"t": "l", "s": "コンラッド", "x": "ナーランダー僧院だ。インド仏教の最高学府。当時の世界でも、指折りの学問の府だな。"},

    {"t": "l", "s": "コンラッド", "x": "敵ながらあっぱれだ。数が多い。手分けして片っ端から埋めていくほかあるまい。"},
