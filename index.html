<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#070c1f">
<meta name="robots" content="noindex, nofollow">
<title>エラータ</title>
<style id="errata-css">:root{
  --ink:#1c2540; --ink2:#2b3658; --paper:#eceee6; --paper2:#dfe2d6; --line:#c6cabb;
  --proof:#c4302b; --gold:#a8873a; --mute:#6c7280;
  --a-kunshu:#7a2e3a; --a-shinka:#2e5c7a; --a-shiso:#5b4a86; --a-gaku:#3e7a4f;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP","Hiragino Mincho Pro",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:var(--ink);color:var(--ink);font-family:var(--sans);-webkit-tap-highlight-color:transparent;overflow:hidden;
  background-image:repeating-linear-gradient(90deg,rgba(255,255,255,.025) 0 2px,transparent 2px 64px)}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
#app{position:relative;height:100%;max-width:1100px;margin:0 auto;display:flex;flex-direction:column}
.screen{flex:1;display:flex;flex-direction:column;min-height:0}
.scroll{overflow-y:auto;-webkit-overflow-scrolling:touch;flex:1;min-height:0;padding:16px}
.paper{background:var(--paper);border-radius:3px;box-shadow:0 1px 0 var(--line),0 12px 30px rgba(0,0,0,.35)}
.bar{display:flex;align-items:center;gap:12px;padding:12px 16px;color:var(--paper)}
.bar h2{font-family:var(--serif);font-weight:600;font-size:22px;margin:0;flex:1;letter-spacing:.06em}
.back{color:var(--paper);padding:10px 14px;border:1px solid rgba(236,238,230,.35);border-radius:3px;min-height:44px}
.shiori{font-family:var(--serif);color:var(--paper);font-size:16px;white-space:nowrap}
.shiori b{font-size:20px;color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:12px 22px;border-radius:3px;font-size:17px;
  background:var(--ink);color:var(--paper);font-weight:600;letter-spacing:.04em}
.btn.light{background:var(--paper);color:var(--ink);border:1px solid var(--line)}
.btn.red{background:var(--proof);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.muted{color:var(--mute)}
/* title */
#title{align-items:center;justify-content:center;text-align:center;color:var(--paper);gap:8px;padding:24px}
.logo{font-family:var(--serif);font-size:clamp(64px,13vw,120px);font-weight:600;letter-spacing:.18em;position:relative;margin:0;padding-left:.18em}
.logo .mark{position:absolute;left:52%;top:8%;width:46%;height:84%;pointer-events:none}
.logo .mark path{stroke:var(--proof);stroke-width:5;fill:none;stroke-linecap:round;stroke-dasharray:400;stroke-dashoffset:400;animation:draw 1.2s .4s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.logo .mark path{animation:none;stroke-dashoffset:0}}
.subtitle{font-family:var(--serif);font-size:18px;letter-spacing:.3em;opacity:.8;margin:0 0 28px}
.titlebtns{display:flex;flex-direction:column;gap:12px;width:min(320px,80vw)}
.titlebtns .btn{background:transparent;border:1px solid rgba(236,238,230,.5)}
.titlebtns .btn.main{background:var(--paper);color:var(--ink)}
/* home */
.home-head{padding:22px 20px 6px;color:var(--paper);display:flex;align-items:flex-end;gap:16px}
.home-head h1{font-family:var(--serif);font-size:40px;margin:0;letter-spacing:.16em;font-weight:600}
.home-head .vol{font-family:var(--serif);opacity:.75;letter-spacing:.2em;margin-bottom:6px;flex:1}
.menu{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px;padding:16px 20px}
.menu button{background:var(--paper);text-align:left;padding:18px 18px 16px;border-radius:3px;min-height:110px;display:flex;flex-direction:column;gap:6px;
  border-left:6px solid var(--ink2);box-shadow:0 8px 20px rgba(0,0,0,.25)}
.menu button .t{font-family:var(--serif);font-size:22px;font-weight:600}
.menu button .s{font-size:14px;color:var(--mute);line-height:1.5}
.menu button.story{border-left-color:var(--proof)}
.shimi-says{margin:4px 20px 0;color:var(--paper);font-family:var(--serif);font-size:15px;opacity:.85}
/* story */
.stage{flex:1;position:relative;display:flex;align-items:flex-end;justify-content:center;min-height:0;overflow:hidden}
.portrait{height:min(58vh,520px);max-width:60%;display:flex;align-items:flex-end;justify-content:center;transition:opacity .25s}
.portrait img{max-height:100%;max-width:100%;object-fit:contain}
.portrait .card{width:200px}
.ph-char{width:220px;height:min(46vh,400px);border-radius:110px 110px 6px 6px;display:flex;align-items:center;justify-content:center;
  font-family:var(--serif);font-size:20px;color:rgba(236,238,230,.55);border:1px dashed rgba(236,238,230,.3);writing-mode:vertical-rl;letter-spacing:.3em}
.textbox{margin:0 12px 12px;padding:18px 22px 22px;min-height:180px;position:relative;cursor:pointer;user-select:none;-webkit-user-select:none}
.nameplate{position:absolute;top:-17px;left:18px;background:var(--ink2);color:var(--paper);font-family:var(--serif);font-weight:600;
  padding:5px 16px;font-size:17px;border-radius:2px;letter-spacing:.08em}
.nameplate.shimi{background:#2f5d8a}.nameplate.gw{background:var(--proof)}.nameplate.mc{background:#55607a}
.say{font-family:var(--serif);font-size:20px;line-height:1.9;margin:6px 0 0;max-width:46em}
.say.desc{color:#4b5263;font-size:18px}
.say.light{color:#7a6a2a;font-style:normal}
.tap{position:absolute;right:16px;bottom:10px;font-size:13px;color:var(--mute)}
.story-tools{position:absolute;top:10px;right:12px;display:flex;gap:8px;z-index:3}
.story-tools button{color:var(--paper);border:1px solid rgba(236,238,230,.4);padding:8px 14px;border-radius:3px;font-size:14px;background:rgba(28,37,64,.6)}
.choices{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:rgba(20,26,46,.55);z-index:4;padding:20px}
.choices button{width:min(520px,92%);background:var(--paper);padding:16px 20px;font-family:var(--serif);font-size:19px;border-radius:3px;border-left:6px solid #3e6b2e;text-align:left;min-height:56px}
.light-burst{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 50% 40%,rgba(255,244,200,.85),rgba(255,244,200,0) 55%);animation:burst 1.6s ease-out forwards}
@keyframes burst{0%{opacity:0}30%{opacity:1}100%{opacity:0}}
/* card */
.card{position:relative;aspect-ratio:3/4;border-radius:4px;overflow:hidden;background:var(--paper);border:3px solid var(--c,var(--ink2));display:flex;flex-direction:column;box-shadow:0 6px 16px rgba(0,0,0,.25)}
.card .art{flex:1;position:relative;background:linear-gradient(180deg,rgba(0,0,0,.04),rgba(0,0,0,.12));overflow:hidden}
.card .art img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.card .art svg{position:absolute;inset:0;width:100%;height:100%}
.card .nm{background:var(--c,var(--ink2));color:#fff;font-family:var(--serif);font-weight:600;font-size:14px;padding:6px 6px;text-align:center;line-height:1.25}
.card .rar{position:absolute;top:4px;left:6px;color:var(--gold);font-size:14px;text-shadow:0 1px 0 #fff;letter-spacing:-1px}
.card .lv{position:absolute;top:4px;right:6px;background:rgba(28,37,64,.8);color:#fff;font-size:12px;padding:1px 6px;border-radius:2px}
.card.unowned .art{filter:grayscale(1) brightness(.55)}
.card.unowned .nm{background:#7d8290}
.k-君主{--c:var(--a-kunshu)}.k-臣下{--c:var(--a-shinka)}.k-思想家{--c:var(--a-shiso)}.k-学者・芸術家{--c:var(--a-gaku)}
.attr{display:inline-block;color:#fff;background:var(--c);font-size:13px;padding:2px 8px;border-radius:2px}
/* battle */
#battle{color:var(--paper)}
.enemy{display:flex;align-items:center;gap:16px;padding:10px 18px}
.enemy .blob{width:92px;height:92px;flex:none}
.enemy.boss .blob{width:128px;height:128px}
.enemy .blob img{width:100%;height:100%;object-fit:contain}
.hpwrap{flex:1}
.hpwrap .lbl{font-family:var(--serif);font-size:16px;display:flex;justify-content:space-between;margin-bottom:6px}
.hp{height:14px;background:rgba(255,255,255,.15);border-radius:2px;overflow:hidden}
.hp i{display:block;height:100%;background:var(--proof);transition:width .5s}
.gauge{display:flex;gap:6px;margin-top:8px;align-items:center;font-size:13px;opacity:.9}
.gauge span{width:22px;height:10px;border:1px solid rgba(236,238,230,.6);border-radius:1px}
.gauge span.on{background:#e8b04a;border-color:#e8b04a}
.manuscript{margin:6px 14px 0;padding:20px 22px;color:var(--ink);position:relative}
.manuscript .lead{font-size:14px;color:var(--mute);margin:0 0 8px}
.manuscript .text{font-family:var(--serif);font-size:22px;line-height:1.9;margin:0}
.manuscript .slot{text-decoration:underline;text-decoration-color:var(--proof);text-decoration-thickness:2px;text-underline-offset:5px;position:relative}
.manuscript .slot.struck{text-decoration:line-through;text-decoration-color:var(--proof);text-decoration-thickness:3px;color:#8a8f99}
.fix{display:block;font-family:var(--serif);color:var(--proof);font-size:20px;margin-top:6px;animation:fadein .5s ease-out}
.fix::before{content:"⌒ ";}
@keyframes fadein{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.q-prompt{font-family:var(--serif);font-size:18px;margin:14px 18px 8px;color:var(--paper)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:0 14px 12px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{background:var(--paper);color:var(--ink);padding:14px 16px;border-radius:3px;text-align:left;font-size:17px;min-height:60px;line-height:1.5;border:2px solid transparent;font-family:var(--serif)}
.opt.owned{border-color:var(--gold);box-shadow:inset 0 0 0 1px var(--gold)}
.opt .own{display:block;font-family:var(--sans);font-size:12px;color:var(--gold);font-weight:600}
.opt.right{background:#dbe9d6;border-color:#3e7a4f}
.opt.wrong{background:#f1d9d6;border-color:var(--proof)}
.opt:disabled{cursor:default}
.result{margin:4px 14px 14px;padding:16px 18px;color:var(--ink)}
.result .head{font-weight:700;font-size:17px;margin:0 0 6px}
.result .head.ok{color:#2f6a3f}.result .head.ng{color:var(--proof)}
.result .dmg{font-family:var(--serif);font-size:16px;margin:0 0 8px}
.comment{display:flex;gap:10px;align-items:flex-start;font-family:var(--serif);font-size:17px;line-height:1.8;margin:6px 0 10px}
.comment .who{flex:none;background:#2f5d8a;color:#fff;font-size:13px;padding:2px 8px;border-radius:2px;margin-top:5px;font-family:var(--sans)}
.party{display:flex;gap:8px;padding:6px 14px 14px;align-items:flex-end}
.party .card{width:64px}
.party .card .nm{font-size:10px;padding:3px 2px}
.party .lbl{font-size:12px;opacity:.8;writing-mode:vertical-rl;letter-spacing:.2em}
.skillflash{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);background:var(--ink);color:#fff;font-family:var(--serif);font-size:24px;padding:14px 26px;border:2px solid var(--gold);z-index:5;animation:sf 1.4s ease-out forwards;pointer-events:none;white-space:nowrap}
@keyframes sf{0%{opacity:0;transform:translate(-50%,-40%)}20%{opacity:1;transform:translate(-50%,-50%)}80%{opacity:1}100%{opacity:0}}
/* lists */
.chlist{display:flex;flex-direction:column;gap:12px}
.chrow{display:flex;align-items:center;gap:16px;padding:16px 18px;text-align:left;width:100%}
.chrow .no{font-family:var(--serif);font-size:15px;color:var(--mute);width:72px}
.chrow .nm{font-family:var(--serif);font-size:20px;font-weight:600;flex:1}
.chrow .st{font-size:14px}
.chrow .st.done{color:#2f6a3f}.chrow .st.lock{color:var(--mute)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:14px}
.grid .card{cursor:pointer}
.pane{padding:18px 20px;margin-bottom:14px}
.pane h3{font-family:var(--serif);margin:0 0 10px;font-size:19px}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;max-width:640px}
.slot-empty{aspect-ratio:3/4;border:2px dashed var(--line);border-radius:4px;display:flex;align-items:center;justify-content:center;color:var(--mute);font-size:13px;text-align:center;padding:6px}
.bonus{font-size:15px;line-height:1.8;margin:10px 0 0}
.gacha-res{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-top:14px}
@media (max-width:560px){.gacha-res{grid-template-columns:repeat(3,1fr)}.slots{grid-template-columns:repeat(3,1fr)}}
.gacha-res .cell{position:relative;animation:pop .35s ease-out both}
.gacha-res .tag{position:absolute;bottom:-8px;left:50%;transform:translateX(-50%);background:var(--proof);color:#fff;font-size:11px;padding:1px 6px;border-radius:2px;white-space:nowrap}
@keyframes pop{from{opacity:0;transform:scale(.9)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.gacha-res .cell,.fix,.skillflash,.light-burst{animation:none}}
.code{font-family:"Menlo","Courier New",monospace;font-size:22px;letter-spacing:.12em;word-break:break-all;background:#fff;padding:14px;border:1px solid var(--line);line-height:1.8;user-select:all;-webkit-user-select:all}
textarea,input[type=text]{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:3px;font-family:inherit;background:#fff}
.modal{position:fixed;inset:0;background:rgba(14,18,32,.7);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal .box{max-width:560px;width:100%;max-height:88vh;overflow:auto;padding:22px}
.modal h3{font-family:var(--serif);margin:0 0 12px;font-size:21px}
.detail{display:grid;grid-template-columns:160px 1fr;gap:18px}
@media (max-width:520px){.detail{grid-template-columns:1fr}}
.detail dl{margin:0;font-size:15px;line-height:1.7}
.detail dt{color:var(--mute);font-size:13px}
.detail dd{margin:0 0 6px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.qcount{font-size:14px;color:var(--paper);opacity:.8;padding:0 18px}
.qtext{color:var(--ink);font-family:var(--serif);font-size:21px;line-height:1.8;padding:18px 20px;margin:8px 14px 12px}
.toast{position:fixed;left:50%;bottom:30px;transform:translateX(-50%);background:var(--paper);color:var(--ink);padding:12px 20px;border-radius:3px;z-index:30;box-shadow:0 6px 20px rgba(0,0,0,.4);font-size:15px}

/* ===== home (landscape first) ===== */
:root{--shelf-h:min(20vh,170px)}
.home{position:fixed;inset:0;overflow:hidden;background:#070c1f;color:var(--paper);font-family:var(--serif)}
.home-bg{position:absolute;inset:0;background:#0b1230 center/cover no-repeat}
.home-shade{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 38%,rgba(7,12,31,0) 40%,rgba(7,12,31,.55) 100%),
  linear-gradient(180deg,rgba(7,12,31,.35) 0,rgba(7,12,31,0) 22%,rgba(7,12,31,0) 58%,rgba(7,12,31,.82) 100%)}
.h-logo{position:absolute;left:clamp(16px,3vw,40px);top:calc(env(safe-area-inset-top,0px) + clamp(12px,2.4vh,28px));z-index:3;text-align:center}
.h-logo .lg-wrap{position:relative;display:inline-block;padding:0 .35em}
.h-logo .lg{font-size:clamp(40px,6.4vw,76px);font-weight:600;letter-spacing:.14em;color:#f4efe2;text-shadow:0 2px 14px rgba(0,0,0,.6);display:block;line-height:1.1;position:relative}
.h-logo svg{position:absolute;left:-8%;top:-18%;width:116%;height:136%;overflow:visible;pointer-events:none}
.h-logo .lg-sub{margin:.3em 0 0;font-size:clamp(13px,1.5vw,17px);letter-spacing:.32em;color:#e9e1cc;opacity:.9}
.h-shiori{position:absolute;right:clamp(16px,3vw,40px);top:calc(env(safe-area-inset-top,0px) + clamp(12px,2.4vh,28px));z-index:3;
  display:flex;align-items:center;gap:10px;padding:8px 22px 8px 12px;min-width:180px;
  background:linear-gradient(180deg,#f3ead6,#e2d5b8);color:#2a2320;border-radius:2px;box-shadow:0 6px 18px rgba(0,0,0,.45);
  clip-path:polygon(0 0,100% 0,100% 100%,6% 100%,0 86%)}
.h-shiori svg{width:30px;height:30px;flex:none}
.h-shiori b{font-size:24px;font-weight:600;flex:1;text-align:right;font-variant-numeric:tabular-nums}
.h-shiori span{font-size:13px;color:#6d5f4a}
.oshi{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:94vh;z-index:1;cursor:pointer;display:flex;align-items:flex-end}
.oshi img{height:100%;width:auto;display:block;filter:drop-shadow(0 0 30px rgba(10,16,40,.7))}
.oshi.cardmode{height:auto;bottom:calc(var(--shelf-h) + 8vh)}
.oshi.cardmode .card{width:min(34vh,250px);box-shadow:0 0 0 1px rgba(201,162,74,.6),0 0 60px rgba(255,214,140,.25),0 18px 40px rgba(0,0,0,.6)}
.oshi .ph-char{height:70vh;margin-bottom:var(--shelf-h)}
.bubble{position:absolute;z-index:3;left:calc(50% + min(17vh,160px));top:26%;max-width:min(330px,32vw);
  background:linear-gradient(180deg,#f6efe0,#ebe0c8);color:#2a2320;padding:14px 18px 20px;border-radius:2px;
  box-shadow:0 8px 24px rgba(0,0,0,.45);font-size:clamp(15px,1.6vw,18px);line-height:1.75;cursor:pointer}
.bubble::before{content:"";position:absolute;left:-12px;top:22px;border-top:8px solid transparent;border-bottom:8px solid transparent;border-right:12px solid #f4ecdc}
.bubble .who{display:block;font-family:var(--sans);font-size:12px;letter-spacing:.1em;color:#8a2a25;font-weight:700;margin-bottom:2px}
.bubble svg.ink{position:absolute;right:8px;bottom:5px;width:48px;height:16px}
.oshi-chg{position:absolute;z-index:3;left:calc(50% + min(17vh,160px));top:calc(26% - 48px);font-family:var(--sans);font-size:13px;color:#f1ead8;
  padding:7px 14px;border:1px solid rgba(241,234,216,.45);border-radius:2px;background:rgba(10,16,40,.55);min-height:36px}
.shelf{position:absolute;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 3vh);z-index:2;display:flex;gap:clamp(8px,1.3vw,16px);
  padding:0 clamp(16px,3.4vw,48px);align-items:flex-end;height:var(--shelf-h)}
.tome{position:relative;flex:1;height:86%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;
  font-family:var(--serif);font-weight:600;color:#2a2320;font-size:clamp(15px,1.8vw,21px);letter-spacing:.08em;padding:10px 6px 10px 20px;
  background:radial-gradient(ellipse at 55% 45%,#f4ecda 0,#e9dcc0 60%,#d6c39e 100%);border-radius:2px 4px 4px 2px;
  box-shadow:inset 12px 0 0 #3a2a1e,inset 13px 0 0 #b8923f,inset 15px 0 0 #3a2a1e,inset 0 0 0 1px rgba(90,60,30,.35),0 10px 22px rgba(0,0,0,.5);
  transition:transform .12s ease-out}
.tome::after{content:"";position:absolute;inset:6px 6px 6px 22px;border:1px solid rgba(120,88,40,.45);pointer-events:none}
.tome:active{transform:translateY(2px)}
.tome .ic{width:clamp(32px,4.6vh,48px);height:clamp(32px,4.6vh,48px);color:#2a2320}
.tome .flo{position:absolute;right:10px;bottom:9px;width:40px;height:14px}
.tome.lead{flex:1.35;height:100%;color:#f4e6c4;
  background:radial-gradient(ellipse at 50% 40%,#9b2a2b 0,#7a1c1f 55%,#561114 100%);
  box-shadow:inset 12px 0 0 #3b0c0e,inset 13px 0 0 #c9a24a,inset 15px 0 0 #3b0c0e,inset 0 0 0 4px #561114,inset 0 0 0 5px #c9a24a,0 12px 28px rgba(0,0,0,.6)}
.tome.lead::after{border-color:rgba(201,162,74,.6)}
.tome.lead .ic{color:#e6c77a}
.tome.lead .nx{font-family:var(--sans);font-weight:400;font-size:12px;letter-spacing:.04em;opacity:.85}
.tome.lead .ribbon{position:absolute;left:30%;bottom:-16px;width:14px;height:26px;background:#a51d22;clip-path:polygon(0 0,100% 0,100% 100%,50% 76%,0 100%)}

"K": {
  "K01-01": {"id":"K01-01","ch":6,"boss":false,"t":"3世紀末、軍人皇帝時代を終わらせた皇帝は、元首政を復活させ、元老院と協力して統治した","slot":"元首政を復活させ、元老院と協力して統治した","who":"ディオクレティアヌス","wd":["コンスタンティヌス","テオドシウス","ユスティニアヌス"],"ok":"専制君主政を始め、皇帝を神のように崇めさせた","ng":["共和政に戻し、執政官に統治を任せた","三頭政治を始め、権力を3人で分け合った"],"cm":"皇帝の前ではひざまずいて、衣の裾に口づけするのが決まりになったんだ。引退したあとは故郷でキャベツを育てていたらしいよ。"},
  "K01-02": {"id":"K01-02","ch":6,"boss":false,"t":"313年のミラノ勅令によって、キリスト教はローマ帝国の国教となった","slot":"国教となった","who":"コンスタンティヌス","wd":["テオドシウス","ディオクレティアヌス","ユスティニアヌス"],"ok":"公認された","ng":["禁止された","異端とされた"],"cm":"313年は公認、国教になるのは392年だよ。コンスタンティヌス自身は、洗礼を受けたのが亡くなる直前だったらしい。"},
  "K01-03": {"id":"K01-03","ch":6,"boss":false,"t":"キリスト教を国教とした皇帝の死後、395年に帝国は南北に分割された","slot":"南北に分割された","who":"テオドシウス","wd":["コンスタンティヌス","ディオクレティアヌス","オドアケル"],"ok":"東西に分割された","ng":["四つに分割された","ゲルマン人に譲り渡された"],"cm":"二人の息子に、東と西を分けて継がせたんだ。兄が東で、弟が西。弟のほうはまだ10歳くらいだったそうだよ。"},
  "K01-04": {"id":"K01-04","ch":6,"boss":true,"t":"476年、西ローマ帝国はゲルマン人の侵入を退け、その後も存続した","slot":"ゲルマン人の侵入を退け、その後も存続した","who":"オドアケル","wd":["テオドリック","クローヴィス","ディオクレティアヌス"],"ok":"ゲルマン人傭兵隊長に皇帝を廃位され、滅亡した","ng":["フン人に征服され、滅亡した","東ローマ帝国に併合され、消滅した"],"cm":"最後の皇帝はまだ子どもでね、退位させられたあとは年金をもらって暮らしたらしい。オドアケルは、自分では皇帝を名乗らなかったんだ。"},
  "K02-01": {"id":"K02-01","ch":7,"boss":false,"t":"ユダヤ教の律法を厳格に守るパリサイ派の教えを広めた人物は、ローマへの反逆者として処刑された","slot":"パリサイ派の教えを広めた","who":"イエス","wd":["パウロ","ペテロ","アウグスティヌス"],"ok":"パリサイ派を批判し、神の愛と隣人愛を説いた","ng":["皇帝崇拝を説いた","多神教の復興を説いた"],"cm":"パリサイ派は、律法を細かく守ることを大事にした人たちだね。イエスは安息日に病人を癒やして、彼らに咎められたことがあるんだ。"},
  "K02-02": {"id":"K02-02","ch":7,"boss":false,"t":"元パリサイ派で回心した使徒は、ユダヤ人だけに伝道を限った","slot":"ユダヤ人だけに伝道を限った","who":"パウロ","wd":["ペテロ","イエス","エウセビオス"],"ok":"異邦人（ユダヤ人以外）への伝道に尽くした","ng":["ローマ皇帝にだけ伝道した","伝道そのものを禁じた"],"cm":"パウロはもともと、キリスト教徒を迫害する側だったんだ。地中海のあちこちを回って各地の信徒に手紙を書いていて、それが新約聖書にたくさん入っているよ。"},
  "K02-03": {"id":"K02-03","ch":7,"boss":false,"t":"最大の教父とされる人物は、『ゲルマニア』を著して神の国の到来を説いた","slot":"『ゲルマニア』","who":"アウグスティヌス","wd":["エウセビオス","ヒエロニムス","タキトゥス"],"ok":"『告白録』『神の国』","ng":["『天文学大全』","『博物誌』"],"cm":"『告白録』には、若い頃に友だちと梨を盗んだ話が出てくるんだ。お腹が空いていたわけでもないのに、ってね。"},
  "K02-04": {"id":"K02-04","ch":7,"boss":false,"t":"2世紀の天文学者は、『天文学大全』で地動説を唱えた","slot":"地動説","who":"プトレマイオス","wd":["プリニウス","タキトゥス","ウェルギリウス"],"ok":"天動説","ng":["太陽を神とする説","大地が平らだという説"],"cm":"アレクサンドリアの学者だね。地理の本も書いていて、場所を緯度と経度で示しているんだ。天動説は千四百年くらい続いたかな。まあ、長いほうだよ。"},
  "K02-05": {"id":"K02-05","ch":7,"boss":true,"t":"歴史家は『ゲルマニア』で、ローマ人の暮らしを記録した","slot":"ローマ人の暮らし","who":"タキトゥス","wd":["リウィウス","プリニウス","プトレマイオス"],"ok":"ゲルマン人の社会","ng":["ギリシア人の神話","エジプトの王朝"],"cm":"ゲルマン人は質素で勇敢だ、と書いているんだ。ローマ人の贅沢を遠回しに批判したかった、という見方もあるよ。"},
  "K03-01": {"id":"K03-01","ch":7,"boss":false,"t":"メロヴィング朝を開いた王は、アリウス派に改宗してローマ人の支持を得た","slot":"アリウス派","who":"クローヴィス","wd":["テオドリック","ピピン3世","カール大帝"],"ok":"アタナシウス派（正統派）","ng":["ネストリウス派","マニ教"],"cm":"戦いで追い詰められたときに、妃が信じていた神に祈ったら勝てた。それで改宗を決めた、という話が残っているよ。妃はもともと正統派の信者だったんだ。"},
  "K03-02": {"id":"K03-02","ch":7,"boss":false,"t":"732年、トゥール・ポワティエ間の戦いでフランク王国はアッバース朝を破った","slot":"アッバース朝","who":"カール＝マルテル","wd":["クローヴィス","ピピン3世","カール大帝"],"ok":"ウマイヤ朝","ng":["ファーティマ朝","ササン朝"],"cm":"マルテルは「鉄槌」という意味のあだ名だよ。王様じゃなくて、宮宰だったんだ。"},
  "K03-03": {"id":"K03-03","ch":7,"boss":false,"t":"カロリング朝を開いた王は、ラヴェンナ地方をビザンツ皇帝に寄進した","slot":"ビザンツ皇帝","who":"ピピン3世","wd":["カール大帝","クローヴィス","カール＝マルテル"],"ok":"ローマ教皇","ng":["ランゴバルド王","イスラームのカリフ"],"cm":"背が低かったから「小ピピン」と呼ばれていたらしい。寄進したのは、ランゴバルド王国から取り上げた土地だよ。"},
  "K03-04": {"id":"K03-04","ch":7,"boss":false,"t":"カール大帝の宮廷に招かれた学者は、ギリシア語による学芸の復興を担った","slot":"ギリシア語","who":"アルクイン","wd":["タキトゥス","アウグスティヌス","エウセビオス"],"ok":"ラテン語","ng":["アラビア語","ゲルマン語"],"cm":"アルクインはイングランドの出身でね。カロリング＝ルネサンスの頃に、小文字を使った読みやすい書体が広まったんだ。今のアルファベットの小文字のもとになっているよ。"},
  "K03-05": {"id":"K03-05","ch":7,"boss":false,"t":"800年、ローマ教皇はカール大帝にビザンツ皇帝の冠を授けた","slot":"ビザンツ皇帝","who":"レオ3世","wd":["ウルバヌス2世","グレゴリウス7世","レオン3世"],"ok":"西ローマ皇帝","ng":["ランゴバルド王","イングランド王"],"cm":"ビザンツ皇帝のレオン3世と、教皇のレオ3世。名前は似てるけど、別の人だよ。レオ3世は戴冠の前の年、ローマで襲われてカールのもとに逃げ込んでいたんだ。"},
  "K03-06": {"id":"K03-06","ch":7,"boss":true,"t":"800年、フランク王はローマで教皇に冠を授けた","slot":"教皇に冠を授けた","who":"カール大帝","wd":["ピピン3世","クローヴィス","オットー1世"],"ok":"教皇から西ローマ皇帝の冠を授けられた","ng":["ビザンツ皇帝から冠を奪った","自ら冠をかぶった"],"cm":"カールは戴冠のことを知らされていなかった、と伝記には書かれているんだ。本当かどうかはわからないけどね。字を書く練習を、寝床の枕の下に板を置いてしていたらしいよ。"},
  "K04-01": {"id":"K04-01","ch":7,"boss":false,"t":"ノルマン人の首長は、北イタリアにノルマンディー公国を建てた","slot":"北イタリア","who":"ロロ","wd":["ルッジェーロ2世","リューリク","クヌート"],"ok":"北フランス","ng":["南イタリア","ロシア"],"cm":"フランス王から土地をもらう代わりに、キリスト教に改宗したんだ。臣従の礼で王の足に口づけするのを嫌がった、なんて話も残ってるよ。"},
  "K04-02": {"id":"K04-02","ch":7,"boss":false,"t":"キエフ公国の君主は、ローマ＝カトリックを国教とした","slot":"ローマ＝カトリック","who":"ウラディミル1世","wd":["リューリク","オットー1世","クヌート"],"ok":"ギリシア正教","ng":["イスラーム","ゾロアスター教"],"cm":"イスラームやカトリックとも比べたうえで、ギリシア正教を選んだと伝えられてるよ。コンスタンティノープルの教会の美しさに、使者が驚いたからだって。"},
  "K04-03": {"id":"K04-03","ch":7,"boss":false,"t":"962年、ザクセン朝の王は教皇から戴冠され、これがフランス王国の起源となった","slot":"フランス王国","who":"オットー1世","wd":["ユーグ＝カペー","カール大帝","カール4世"],"ok":"神聖ローマ帝国","ng":["ノルマン朝","カロリング朝"],"cm":"955年にマジャール人を破ったのが大きかったんだ。マジャール人はそのあと定住して、ハンガリー王国をつくるよ。"},
  "K04-04": {"id":"K04-04","ch":7,"boss":true,"t":"1066年、ノルマンディー公はヘースティングズの戦いに敗れ、北フランスに退いた","slot":"敗れ、北フランスに退いた","who":"ウィリアム1世","wd":["クヌート","アルフレッド大王","ヘンリ2世"],"ok":"勝利し、イングランドを征服した","ng":["デーン人と和平を結んだ","教皇に破門された"],"cm":"ウィリアムはもともとノルマンディー公だから、フランス王の家臣なんだ。イングランドの王になってもそこは変わらなかった。征服のあと、国中の土地を調べた台帳もつくらせているよ。"},
  "K05-01": {"id":"K05-01","ch":8,"boss":false,"t":"622年、迫害を受けた預言者は、メッカからダマスクスへ移住した","slot":"ダマスクス","who":"ムハンマド","wd":["アブー＝バクル","アリー","ウマル"],"ok":"メディナ","ng":["バグダード","イェルサレム"],"cm":"メディナはもとはヤスリブという町で、「預言者の町」という意味でメディナと呼ばれるようになったんだ。イスラーム暦は、この移住の年から数えるよ。"},
  "K05-02": {"id":"K05-02","ch":8,"boss":false,"t":"ムハンマドの死後、初代カリフに選ばれたのはムハンマドの娘婿だった","slot":"ムハンマドの娘婿","who":"アブー＝バクル","wd":["アリー","ウマル","ウスマーン"],"ok":"ムハンマドの親友（義父）","ng":["ムハンマドの息子","ウマイヤ家の総督"],"cm":"アブー＝バクルの娘は、ムハンマドの妻なんだ。だから親友で、義理の父でもある。娘婿は第4代のアリーだね。"},
  "K05-03": {"id":"K05-03","ch":8,"boss":false,"t":"642年、第2代正統カリフの軍はニハーヴァンドの戦いでビザンツ帝国を破った","slot":"ビザンツ帝国","who":"ウマル","wd":["アブー＝バクル","ウスマーン","ムアーウィヤ"],"ok":"ササン朝","ng":["西ゴート王国","フランク王国"],"cm":"ササン朝はこのあと、651年に最後の王が殺されて滅びるんだ。ウマルの時代に、エジプトやシリアもイスラームの支配下に入っているよ。"},
  "K05-04": {"id":"K05-04","ch":8,"boss":false,"t":"ウマイヤ家出身の第3代正統カリフは、コーランを処分した","slot":"コーランを処分した","who":"ウスマーン","wd":["アリー","ムアーウィヤ","ウマル"],"ok":"コーランを編纂し、現在の形に定めた","ng":["コーランをペルシア語に翻訳させた","ハディースだけを聖典とした"],"cm":"処分したのはコーランそのものじゃなくて、まとめる前の写本のほうなんだ。それまでは人によって覚えているコーランに少しずつ違いがあって、ウスマーンは一つの形に定めたうえで、ほかの写本を処分させたといわれてる。"},
  "K05-05": {"id":"K05-05","ch":8,"boss":false,"t":"第4代正統カリフとその子孫だけを正統な指導者と認める人々は、スンナ派と呼ばれる","slot":"スンナ派","who":"アリー","wd":["ウスマーン","ムハンマド","アブー＝バクル"],"ok":"シーア派","ng":["スーフィー","ウラマー"],"cm":"シーアは「党派」という意味で、もとは「アリーの党派」と呼ばれていたんだ。今のイランは、シーア派の人が多い国だよ。"},
  "K05-06": {"id":"K05-06","ch":8,"boss":true,"t":"シリア総督は、バグダードを都としてウマイヤ朝を開いた","slot":"バグダード","who":"ムアーウィヤ","wd":["マンスール","アリー","ウスマーン"],"ok":"ダマスクス","ng":["メッカ","カイロ"],"cm":"バグダードはアッバース朝の都だね。ムアーウィヤはカリフの位を自分の息子に継がせたんだ。ここから、カリフが世襲になっていくよ。"},
  "K06-01": {"id":"K06-01","ch":8,"boss":false,"t":"セルジューク朝の宰相は、各地にアズハル学院を建てた","slot":"アズハル学院","who":"ニザーム＝アル＝ムルク","wd":["トゥグリル＝ベク","ガザーリー","ハールーン＝アッラシード"],"ok":"ニザーミーヤ学院","ng":["知恵の館","ボローニャ大学"],"cm":"アズハル学院はファーティマ朝がカイロに建てた学院で、今も大学として続いてるよ。ニザーミーヤ学院のほうは、スンナ派の学問を広めるためにつくられたんだ。"},
  "K06-02": {"id":"K06-02","ch":8,"boss":false,"t":"ニザーミーヤ学院の教授は、ゾロアスター教の教えを理論化した","slot":"ゾロアスター教の教え","who":"ガザーリー","wd":["イブン＝ルシュド","イブン＝シーナー","ニザーム＝アル＝ムルク"],"ok":"神秘主義（スーフィズム）","ng":["ギリシア哲学","代数学"],"cm":"ガザーリーは学院の教授という立場を捨てて、10年ほど修行の旅に出ているんだ。"},
  "K06-03": {"id":"K06-03","ch":8,"boss":false,"t":"知恵の館で活躍した学者は、天動説を大きく発展させた","slot":"天動説","who":"フワーリズミー","wd":["ウマル＝ハイヤーム","イブン＝シーナー","タバリー"],"ok":"代数学","ng":["医学","歴史学"],"cm":"「アルゴリズム」という言葉は、フワーリズミーの名前から来ているんだ。インドから伝わった数字の使い方も、彼の本を通じてヨーロッパに広まったよ。"},
  "K06-04": {"id":"K06-04","ch":8,"boss":false,"t":"イスラームの医学者・哲学者は『集史』を著し、ヨーロッパの医学にも影響を与えた","slot":"『集史』","who":"イブン＝シーナー","wd":["イブン＝ルシュド","フワーリズミー","ラシード＝アッディーン"],"ok":"『医学典範』","ng":["『三大陸周遊記』","『神学大全』"],"cm":"『医学典範』はラテン語に訳されて、ヨーロッパの大学で何百年も教科書として使われたんだ。"},
  "K06-05": {"id":"K06-05","ch":8,"boss":false,"t":"モロッコ出身の旅行家は、アジアやアフリカを巡って『東方見聞録』を残した","slot":"『東方見聞録』","who":"イブン＝バットゥータ","wd":["マンサ＝ムーサ","ルブルック","ラシード＝アッディーン"],"ok":"『三大陸周遊記』","ng":["『集史』","『医学典範』"],"cm":"『東方見聞録』はマルコ＝ポーロだね。イブン＝バットゥータは30年近く旅をして、中国の泉州まで行ってるんだ。"},
  "K06-06": {"id":"K06-06","ch":8,"boss":true,"t":"イル＝ハン国の宰相は、アラビア語で『集史』を書いた","slot":"アラビア語","who":"ラシード＝アッディーン","wd":["フラグ","ガザン＝ハン","タバリー"],"ok":"ペルシア語","ng":["ラテン語","トルコ語"],"cm":"『集史』はモンゴルの歴史を中心に、中国やヨーロッパのことまで書いた本なんだ。世界史の本としては、かなり早い例だね。"},
  "K07-01": {"id":"K07-01","ch":10,"boss":false,"t":"6世紀のビザンツ皇帝は、コンスタンティノープルにサン＝ピエトロ大聖堂を建てた","slot":"サン＝ピエトロ大聖堂","who":"ユスティニアヌス","wd":["レオン3世","コンスタンティヌス","ホスロー1世"],"ok":"ハギア＝ソフィア聖堂","ng":["ノートルダム大聖堂","カーバ神殿"],"cm":"ハギア＝ソフィアは、オスマン帝国の時代にモスクになって、ミナレット（塔）が建て足されたんだ。今もイスタンブルに残ってるよ。"},
  "K07-02": {"id":"K07-02","ch":10,"boss":false,"t":"法学者は皇帝の命を受け、『神の国』を編纂した","slot":"『神の国』","who":"トリボニアヌス","wd":["アウグスティヌス","エウセビオス","レオン3世"],"ok":"『ローマ法大全』","ng":["十二表法","コーラン"],"cm":"『ローマ法大全』は、それまでの何百年分の法や学説を整理したものなんだ。今のヨーロッパや日本の民法にも、影響が残ってるよ。"},
  "K07-03": {"id":"K07-03","ch":10,"boss":false,"t":"726年、ビザンツ皇帝は聖像禁止令を出し、ローマ教会との関係を深めた","slot":"ローマ教会との関係を深めた","who":"レオン3世","wd":["ユスティニアヌス","レオ3世","メフメト2世"],"ok":"ローマ教会と対立した","ng":["ローマ教会に吸収された","イスラームに改宗した"],"cm":"ゲルマン人に布教するとき、ローマ教会は聖像を使って教えていたんだ。だから、この命令は受け入れられなかったんだよ。"},
  "K07-04": {"id":"K07-04","ch":10,"boss":false,"t":"アイユーブ朝の建国者は、第3回十字軍にイェルサレムを明け渡した","slot":"イェルサレムを明け渡した","who":"サラディン","wd":["バイバルス","リチャード1世","フリードリヒ1世"],"ok":"イェルサレムを守り抜き、講和を結んだ","ng":["イェルサレムを破壊した","イェルサレムを教皇に寄進した"],"cm":"サラディンは1187年にイェルサレムを取り戻したんだ。そのとき住民を虐殺しなかったことで、ヨーロッパでも名前が知られるようになったよ。"},
  "K07-05": {"id":"K07-05","ch":10,"boss":true,"t":"1453年、オスマン帝国のスルタンは、イェルサレムを攻略してビザンツ帝国を滅ぼした","slot":"イェルサレム","who":"メフメト2世","wd":["バイバルス","サラディン","トゥグリル＝ベク"],"ok":"コンスタンティノープル","ng":["ウィーン","アンティオキア"],"cm":"金角湾の入り口が鎖でふさがれていたから、船を陸に上げて丘を越えさせたんだ。メフメト2世はこのとき、まだ21歳だったよ。"},
  "K07-06": {"id":"K07-06","ch":10,"boss":false,"t":"1095年、ローマ教皇はクレルモン公会議を開き、イスラーム勢力との和平を呼びかけた","slot":"イスラーム勢力との和平を呼びかけた","who":"ウルバヌス2世","wd":["インノケンティウス3世","グレゴリウス7世","レオ3世"],"ok":"聖地回復のための十字軍を提唱した","ng":["東西教会の分裂を宣言した","神聖ローマ皇帝を破門した"],"cm":"きっかけは、ビザンツ皇帝から届いた救援の頼みだったんだ。集まった人々は「神がそれを望まれる」と叫んだと伝えられてるよ。"},
  "K08-01": {"id":"K08-01","ch":10,"boss":false,"t":"1077年、カノッサで教皇が神聖ローマ皇帝に謝罪した","slot":"教皇が神聖ローマ皇帝に謝罪した","who":"グレゴリウス7世","wd":["インノケンティウス3世","ウルバヌス2世","ボニファティウス8世"],"ok":"神聖ローマ皇帝が教皇に破門の解除を願った","ng":["教皇と皇帝が対等な条約を結んだ","皇帝が教皇を城に幽閉した"],"cm":"ハインリヒ4世は、雪の中で3日間、門の外に立って許しを求めたんだ。でもそのあと軍を率いてローマに攻め込んで、グレゴリウス7世はローマを追われてるよ。"},
  "K08-02": {"id":"K08-02","ch":10,"boss":false,"t":"13世紀初めの教皇は「教皇は月、皇帝は太陽」と述べ、皇帝の優位を認めた","slot":"「教皇は月、皇帝は太陽」と述べ、皇帝の優位を認めた","who":"インノケンティウス3世","wd":["グレゴリウス7世","ボニファティウス8世","ウルバヌス2世"],"ok":"「教皇は太陽、皇帝は月」と述べ、教皇の優位を誇った","ng":["「教皇も皇帝も神の僕」と述べ、両者を対等とした","「皇帝は教皇の兄弟」と述べ、協力を求めた"],"cm":"インノケンティウス3世は、イングランドのジョン王も破門して、最後は従わせているんだ。教皇の力がいちばん強かった頃だね。"},
  "K08-03": {"id":"K08-03","ch":10,"boss":false,"t":"フランス王が聖職者に課税しようとすると、教皇はこれを歓迎した","slot":"歓迎した","who":"ボニファティウス8世","wd":["インノケンティウス3世","グレゴリウス7世","ウルバヌス2世"],"ok":"激しく反対し、王と対立した","ng":["黙認した","教皇領全体にも同じ税を課した"],"cm":"フィリップ4世は戦争のお金が足りなくて、教会からも税を取ろうとしたんだ。ボニファティウス8世は、アナーニ事件のひと月ほどあとに亡くなってるよ。"},
  "K08-04": {"id":"K08-04","ch":10,"boss":false,"t":"オックスフォード大学の教授は、教会を批判して聖書をラテン語に翻訳した","slot":"ラテン語","who":"ウィクリフ","wd":["フス","エラスムス","トマス＝モア"],"ok":"英語","ng":["ドイツ語","チェコ語"],"cm":"ウィクリフは亡くなってから30年以上たって異端とされて、墓を掘り返されて遺体を焼かれたんだ。"},
  "K08-05": {"id":"K08-05","ch":10,"boss":true,"t":"プラハ大学の教授は、トリエント公会議で異端とされ火刑に処された","slot":"トリエント公会議","who":"フス","wd":["ウィクリフ","トマス＝アクィナス","エラスムス"],"ok":"コンスタンツ公会議","ng":["ニケーア公会議","クレルモン公会議"],"cm":"フスは身の安全を約束されて公会議に出かけたのに、捕らえられて火刑になったんだ。その怒りから、ベーメンでフス戦争が起きるよ。"},
  "K08-06": {"id":"K08-06","ch":10,"boss":false,"t":"1303年、教皇がフランス王をアナーニで捕らえた","slot":"教皇がフランス王を","who":"フィリップ4世","wd":["フィリップ2世","ルイ9世","シャルル7世"],"ok":"フランス王が教皇を","ng":["神聖ローマ皇帝がフランス王を","イギリス王が教皇を"],"cm":"事件のあと、教皇庁は南フランスのアヴィニョンに移されるんだ。それから70年ほど、教皇はフランス王の影響を強く受けることになるよ。"},
  "K09-01": {"id":"K09-01","ch":10,"boss":false,"t":"1215年、イングランド王は貴族に迫られ、権利の請願を認めた","slot":"権利の請願","who":"ジョン","wd":["ヘンリ2世","エドワード1世","リチャード1世"],"ok":"大憲章（マグナ＝カルタ）","ng":["権利の章典","国王至上法"],"cm":"ジョンは「欠地王」と呼ばれた王で、フランスにあった領地の多くをフィリップ2世に奪われているんだ。大憲章の原本は、今もイギリスにいくつか残ってるよ。"},
  "K09-02": {"id":"K09-02","ch":10,"boss":false,"t":"1265年、ヘンリ3世に反乱を起こした貴族は、聖職者だけによる会議を開かせた","slot":"聖職者だけによる会議","who":"シモン＝ド＝モンフォール","wd":["エドワード1世","ジョン","エドワード黒太子"],"ok":"州や都市の代表も加えた議会","ng":["貴族だけによる会議","王の側近だけによる会議"],"cm":"シモン自身はフランス生まれの貴族なんだ。この議会のあと、王太子エドワードとの戦いで戦死しているよ。"},
  "K09-03": {"id":"K09-03","ch":10,"boss":false,"t":"フランス王ルイ9世の使節として、修道士がビザンツ帝国を訪れた","slot":"ビザンツ帝国","who":"ルブルック","wd":["イブン＝バットゥータ","ヴァスコ＝ダ＝ガマ","ラシード＝アッディーン"],"ok":"モンゴル帝国","ng":["マムルーク朝","マリ王国"],"cm":"ルブルックはカラコルムまで行って、モンケ＝ハンに会っているんだ。そこでは、仏教徒やイスラーム教徒と宗教の討論もしたらしいよ。"},
  "K09-04": {"id":"K09-04","ch":10,"boss":false,"t":"百年戦争の初期、イギリス軍は騎士の突撃によってフランス軍を破った","slot":"騎士の突撃","who":"エドワード黒太子","wd":["ジャンヌ＝ダルク","エドワード3世","シャルル7世"],"ok":"長弓兵","ng":["火砲","傭兵の海軍"],"cm":"長弓兵の多くは、イギリスの農民出身だったんだ。黒太子というあだ名は、黒い鎧を着ていたから、という説があるよ。"},
  "K09-05": {"id":"K09-05","ch":10,"boss":true,"t":"1429年、包囲されたオルレアンを解放した少女は、のちにイギリス王の戴冠を実現させた","slot":"イギリス王","who":"ジャンヌ＝ダルク","wd":["エドワード黒太子","シモン＝ド＝モンフォール","マルグレーテ"],"ok":"フランス王シャルル7世","ng":["神聖ローマ皇帝","ブルゴーニュ公"],"cm":"戴冠式はランスの大聖堂で行われたんだ。ジャンヌはそのあとイギリス側に引き渡されて、19歳で火刑になっているよ。"},
  "K10-01": {"id":"K10-01","ch":14,"boss":false,"t":"離婚問題で教皇と対立したイングランド王は、統一法を出してイギリス国教会を成立させた","slot":"統一法","who":"ヘンリ8世","wd":["ヘンリ7世","エドワード1世","メアリ1世"],"ok":"国王至上法（首長法）","ng":["大憲章","権利の章典"],"cm":"国王至上法は1534年。統一法を出したのは、娘のエリザベス1世だよ。ヘンリ8世は生涯で6回結婚しているんだ。"},
  "K10-02": {"id":"K10-02","ch":14,"boss":false,"t":"エリザベス1世の時代、私掠船の船長はポルトガル船を襲い、富をもたらした","slot":"ポルトガル船","who":"ドレーク","wd":["ヴァスコ＝ダ＝ガマ","バルトロメウ＝ディアス","エンリケ航海王子"],"ok":"スペイン船","ng":["オランダ船","フランス船"],"cm":"ドレークは世界一周も成し遂げているんだ。エリザベス1世から騎士の位をもらっているよ。"},
  "K10-03": {"id":"K10-03","ch":14,"boss":false,"t":"15世紀、ポルトガルの王子は海外への進出を禁じた","slot":"海外への進出を禁じた","who":"エンリケ航海王子","wd":["バルトロメウ＝ディアス","ヴァスコ＝ダ＝ガマ","ドレーク"],"ok":"海外への進出を奨励した","ng":["海外への進出をスペインに任せた","陸路での交易だけを認めた"],"cm":"航海王子と呼ばれているけど、本人はほとんど航海に出ていないんだ。航海者を育てて、船を送り出す側だったんだよ。"},
  "K10-04": {"id":"K10-04","ch":14,"boss":false,"t":"1488年、ポルトガルの航海者は南アメリカ南端のマゼラン海峡に到達した","slot":"南アメリカ南端のマゼラン海峡","who":"バルトロメウ＝ディアス","wd":["ヴァスコ＝ダ＝ガマ","エンリケ航海王子","ドレーク"],"ok":"アフリカ南端の喜望峰","ng":["インド西岸のカリカット","カリブ海の西インド諸島"],"cm":"最初は「嵐の岬」と呼ばれていたんだ。インドへの道が見えたから、のちに「喜望峰」と名前が変わったんだよ。"},
  "K10-05": {"id":"K10-05","ch":14,"boss":false,"t":"1498年、喜望峰を回った航海者は、インド東岸のマドラスに到達した","slot":"インド東岸のマドラス","who":"ヴァスコ＝ダ＝ガマ","wd":["バルトロメウ＝ディアス","エンリケ航海王子","イブン＝バットゥータ"],"ok":"インド西岸のカリカット","ng":["マレー半島のマラッカ","中国の広州"],"cm":"当時、こしょうは同じ重さの銀と取引されるほど高価だったんだ。ガマが持ち帰った香辛料は、航海の費用の何十倍にもなったらしいよ。"},
  "K10-06": {"id":"K10-06","ch":14,"boss":true,"t":"1559年、イングランド女王は統一法を出し、カトリックを復活させた","slot":"カトリックを復活させた","who":"エリザベス1世","wd":["メアリ1世","マルグレーテ","ヘンリ7世"],"ok":"イギリス国教会を確立した","ng":["ピューリタンを国教とした","教皇を教会の首長とした"],"cm":"カトリックを復活させたのは、姉のメアリ1世だね。エリザベス1世は生涯結婚しなかったから、「処女王」とも呼ばれたよ。"},
  "K11-01": {"id":"K11-01","ch":13,"boss":false,"t":"スコラ学を大成した神学者は、『神の国』で信仰と理性の調和をめざした","slot":"『神の国』","who":"トマス＝アクィナス","wd":["アンセルムス","アウグスティヌス","ウィリアム＝オブ＝オッカム"],"ok":"『神学大全』","ng":["『愚神礼賛』","『告白録』"],"cm":"『神の国』はアウグスティヌスの本だね。トマスは体が大きくて無口だったから、「シチリアの黙った牛」とあだ名されたらしい。『神学大全』は未完のまま終わってるんだ。"},
  "K11-02": {"id":"K11-02","ch":13,"boss":false,"t":"フィレンツェ出身の詩人は、『神曲』をラテン語で書いた","slot":"ラテン語","who":"ダンテ","wd":["ペトラルカ","ボッカチオ","チョーサー"],"ok":"トスカーナ語（イタリア語の口語）","ng":["ギリシア語","フランス語"],"cm":"ダンテは政争に巻き込まれてフィレンツェを追放されて、最後まで帰れなかったんだ。『神曲』は、追放されたあとに書かれているよ。"},
  "K11-03": {"id":"K11-03","ch":13,"boss":false,"t":"ペストが流行したフィレンツェを舞台に、『カンタベリ物語』が書かれた","slot":"『カンタベリ物語』","who":"ボッカチオ","wd":["チョーサー","ダンテ","ペトラルカ"],"ok":"『デカメロン』","ng":["『神曲』","『君主論』"],"cm":"ペストを逃れて郊外の屋敷に集まった10人が、10日間で100の話をする、という物語なんだ。『デカメロン』は「10日の物語」という意味だよ。"},
  "K11-04": {"id":"K11-04","ch":13,"boss":false,"t":"フィレンツェの外交官は『ユートピア』で、強力な君主によるイタリア統一を説いた","slot":"『ユートピア』","who":"マキャベリ","wd":["トマス＝モア","エラスムス","ダンテ"],"ok":"『君主論』","ng":["『愚神礼賛』","『神学大全』"],"cm":"マキャベリはメディチ家の復帰で職を失って、田舎に引っ込んでいた時期に『君主論』を書いたんだ。メディチ家に献上しているよ。"},
  "K11-05": {"id":"K11-05","ch":13,"boss":false,"t":"メディチ家の保護を受けた画家は、『最後の晩餐』を描いた","slot":"『最後の晩餐』","who":"ボッティチェリ","wd":["ラファエロ","ジョット","ミケランジェロ"],"ok":"『ヴィーナスの誕生』","ng":["『最後の審判』","『アテネの学堂』"],"cm":"『ヴィーナスの誕生』は、貝殻の上に立った女神が岸に流れ着く場面を描いているんだ。今はフィレンツェのウフィツィ美術館にあるよ。"},
  "K11-06": {"id":"K11-06","ch":13,"boss":false,"t":"ネーデルラントの人文主義者は、『ドン＝キホーテ』で聖職者の腐敗を風刺した","slot":"『ドン＝キホーテ』","who":"エラスムス","wd":["トマス＝モア","ラブレー","モンテーニュ"],"ok":"『愚神礼賛』","ng":["『デカメロン』","『ハムレット』"],"cm":"『愚神礼賛』は、エラスムスがトマス＝モアの家に滞在していたときに書かれたんだ。二人は仲の良い友人だったよ。"},
  "K11-07": {"id":"K11-07","ch":13,"boss":false,"t":"イングランドの人文主義者は『ユートピア』で、ばら戦争を批判した","slot":"ばら戦争","who":"トマス＝モア","wd":["エラスムス","チョーサー","シェイクスピア"],"ok":"囲い込み","ng":["百年戦争","修道院の解散"],"cm":"「羊が人間を食べる」という言葉で、囲い込みを批判したんだ。モアはのちに、ヘンリ8世の離婚に反対して処刑されているよ。"},
  "K11-08": {"id":"K11-08","ch":13,"boss":false,"t":"エリザベス1世の時代の劇作家は、『カンタベリ物語』を書いた","slot":"『カンタベリ物語』","who":"シェイクスピア","wd":["チョーサー","トマス＝モア","セルバンテス"],"ok":"『ハムレット』","ng":["『ドン＝キホーテ』","『愚神礼賛』"],"cm":"シェイクスピアの劇は、ロンドンのグローブ座で上演されていたんだ。セルバンテスとは、亡くなった年が同じ1616年だよ。"},
  "K11-09": {"id":"K11-09","ch":13,"boss":false,"t":"スペインの作家は『ドン＝キホーテ』で、新しく台頭した商人を風刺した","slot":"新しく台頭した商人","who":"セルバンテス","wd":["ラブレー","シェイクスピア","モンテーニュ"],"ok":"時代遅れの騎士道","ng":["教皇の権威","絶対王政"],"cm":"セルバンテスは若い頃にレパントの海戦に出て、左手が使えなくなっているんだ。そのあと海賊に捕まって、5年ほど捕虜になってるよ。"},
  "K11-10": {"id":"K11-10","ch":13,"boss":true,"t":"中世のヨーロッパではギリシアの学問は完全に忘れられ、ルネサンスまで誰も読まなかった","slot":"ルネサンスまで誰も読まなかった","who":"イブン＝ルシュド","wd":["イブン＝シーナー","ガザーリー","フワーリズミー"],"ok":"12世紀にイスラーム世界からラテン語に訳され、研究された","ng":["教会がすべて焼き捨てた","ビザンツ帝国だけが独占した"],"cm":"イブン＝ルシュドはアリストテレスの注釈をたくさん書いていて、ヨーロッパでは「注釈者」と呼ばれていたんだ。トマス＝アクィナスも、彼の考えと向き合いながら神学を組み立てているよ。"},
  "P1-01": {"id":"P1-01","ch":1,"boss":false,"t":"古王国の時代、コンラッド博士の設計によって、ギザに三大ピラミッドが建てられた","slot":"コンラッド博士の設計によって","who":"ヘロドトス","wd":["シャンポリオン","ラメス2世","ツタンカーメン"],"ok":"強大な神権政治をもつファラオの墓として","ng":["ヒクソスの砦として","アッシリアの神殿として"],"cm":"ピラミッドは古王国のファラオの墓だね。建てたのは奴隷じゃなくて、給料をもらって働く人たちだったという説が今は有力なんだ。"},
  "P1-02": {"id":"P1-02","ch":1,"boss":false,"t":"ツタンカーメンの墓は、コンラッド博士によって発見され、黄金のマスクが出土した","slot":"コンラッド博士によって発見され","who":"カーター","wd":["ツタンカーメン","シャンポリオン","エヴァンズ"],"ok":"王家の谷でイギリスのカーターらによって発見され","ng":["ギザのピラミッドの中で発見され","アマルナの宮殿跡で発見され"],"cm":"王家の谷の王墓は、ほとんどが盗掘で空っぽだった。ツタンカーメンの墓は、ほぼ手つかずで見つかった珍しい例なんだ。"},
  "P1-03": {"id":"P1-03","ch":1,"boss":false,"t":"ロゼッタ＝ストーンには、神聖文字・民用文字・ギリシア文字と、コンラッド博士の署名が刻まれていた","slot":"と、コンラッド博士の署名","who":"シャンポリオン","wd":["エヴァンズ","シュリーマン","ヘロドトス"],"ok":"の3種類の文字で、同じ内容","ng":["の3種類の文字で、別々の物語","とフェニキア文字の4種類で、同じ内容"],"cm":"ロゼッタ＝ストーンは、ナポレオンのエジプト遠征のときに見つかったんだ。今はロンドンの大英博物館にあるよ。"},
  "P1-04": {"id":"P1-04","ch":1,"boss":false,"t":"コンラッド博士が考案したコンラッド文字が、ギリシアに伝わってアルファベットになった","slot":"コンラッド博士が考案したコンラッド文字","who":"フェニキア人","wd":["アラム人","ソロモン","モーセ"],"ok":"地中海交易で活躍したフェニキア人の文字","ng":["内陸交易で活躍したアラム人の文字","シュメール人の楔形文字"],"cm":"フェニキア文字は子音だけの文字だったんだ。ギリシア人が母音を書き足して、アルファベットになったよ。"},
  "P1-05": {"id":"P1-05","ch":1,"boss":false,"t":"アッシリア滅亡後、小アジアのコンラッド博士が世界最古の金属貨幣をつくった","slot":"小アジアのコンラッド博士が","who":"ヘロドトス","wd":["ネブカドネザル2世","フェニキア人","ラメス2世"],"ok":"小アジアのリディアが","ng":["メソポタミアの新バビロニアが","イラン高原のメディアが"],"cm":"最初の貨幣は、金と銀が自然にまざった合金でつくられていたんだ。お金はのちにギリシアに伝わって、商売を盛んにしたよ。"},
  "P1-06": {"id":"P1-06","ch":1,"boss":true,"t":"クレタ島のクノッソス宮殿の遺跡は、コンラッド博士によって発見された","slot":"コンラッド博士によって","who":"エヴァンズ","wd":["シュリーマン","ヘロドトス","シャンポリオン"],"ok":"イギリスの考古学者エヴァンズによって","ng":["ドイツの実業家シュリーマンによって","フランスの学者シャンポリオンによって"],"cm":"エヴァンズは私財を投じて宮殿をコンクリートで復元したんだ。今でも賛否が分かれているよ。"},
  "P1-07": {"id":"P1-07","ch":2,"boss":false,"t":"（　　）は、バラモンの権威を否定し、徹底した不殺生を説いてジャイナ教を開いた","slot":"（　　）は、","who":"ヴァルダマーナ","ok":"クシャトリヤ出身のヴァルダマーナは、","wd":["ガウタマ＝シッダールタ","ナーガールジュナ","カニシカ王"],"ng":["バラモン出身のヴァルダマーナは、","シュードラ出身のヴァルダマーナは、"],"cm":"ジャイナ教は不殺生をとても厳しく守るから、農業より商業に向いていてね。ヴァイシャ、つまり商人たちに広まったんだ。"},
  "P1-08": {"id":"P1-08","ch":2,"boss":false,"t":"（　　）は、マガダ国にマウリヤ朝を建て、パータリプトラを都とした","slot":"（　　）は、","who":"チャンドラグプタ","ok":"チャンドラグプタは、","wd":["チャンドラグプタ2世","アショーカ王","ハルシャ王"],"ng":["チャンドラグプタ1世は、","チャンドラグプタ2世は、"],"cm":"マウリヤ朝のチャンドラグプタと、グプタ朝のチャンドラグプタ1世は別の人だよ。都はどちらもパータリプトラだから、混同しやすいんだ。"},
  "P1-09": {"id":"P1-09","ch":2,"boss":false,"t":"カリンガ征服を悔いた（　　）は、仏教に帰依し、ダルマにもとづく政治を行った","slot":"（　　）","who":"アショーカ王","ok":"マウリヤ朝のアショーカ王","wd":["カニシカ王","チャンドラグプタ","ハルシャ王"],"ng":["クシャーナ朝のアショーカ王","グプタ朝のアショーカ王"],"cm":"アショーカ王は碑文の中で、自分のことを「神々に愛された者」と名乗っていたんだ。"},
  "P1-10": {"id":"P1-10","ch":2,"boss":true,"t":"唐の僧（　　）は、ナーランダー僧院で学び、帰国後に『大唐西域記』を著した","slot":"（　　）は、","who":"玄奘","ok":"陸路でインドに渡った玄奘は、","wd":["義浄","法顕","ハルシャ王"],"ng":["海路でインドに渡った玄奘は、","東晋から渡った玄奘は、"],"cm":"玄奘は陸路でインドへ行って、帰りも陸路だったんだ。海路でインドに渡ったのは、義浄のほうだよ。この陸路の旅が、ずっとあとの明の時代に、小説『西遊記』になったんだよ。"},
  "P1-11": {"id":"P1-11","ch":3,"boss":false,"t":"殷墟から出土した甲骨文字は、コンラッド博士の日記だった","slot":"コンラッド博士の日記だった","who":"武王","ok":"王が行った占いの記録だった","wd":["斉の桓公","始皇帝","孔子"],"ng":["周の法律の条文だった","商人の取引の記録だった"],"cm":"甲骨文字は、殷の王が亀の甲羅や獣の骨を焼いて行った占いの記録なんだ。"},
  "P1-12": {"id":"P1-12","ch":3,"boss":false,"t":"ある人は、人の本性は善であるとする性善説を説き、徳による王道政治を主張した","slot":"ある人は、","who":"孟子","ok":"儒家の孟子は、","wd":["荀子","孔子","韓非"],"ng":["法家の孟子は、","道家の孟子は、"],"cm":"性善説の孟子と、性悪説の荀子。どちらも儒家だから、セットで覚えておこう。"},
  "P1-13": {"id":"P1-13","ch":3,"boss":false,"t":"ある人は、法による厳しい統治を説き、その著書は秦王に愛読された","slot":"ある人は、","who":"韓非","ok":"荀子に学んだ韓非は、","wd":["荀子","墨子","張儀"],"ng":["孟子に学んだ韓非は、","老子に学んだ韓非は、"],"cm":"韓非は荀子に学んで、法家の思想を大成したんだ。秦の李斯とは同じ先生に学んだ仲だよ。"},
  "P1-14": {"id":"P1-14","ch":3,"boss":false,"t":"秦王の政は前221年に中国を統一し、（　　）と名乗った","slot":"（　　）と名乗った","who":"始皇帝","ok":"初めて「皇帝」と名乗った","wd":["蒙恬","武王","張儀"],"ng":["初めて「天子」と名乗った","初めて「覇者」と名乗った"],"cm":"「皇帝」という称号は、始皇帝が初めて使ったんだ。それまでは「王」だったんだよ。"},
  "P1-15": {"id":"P1-15","ch":3,"boss":false,"t":"秦の将軍（　　）は、北方の（　　）を討ち、長城を修築した","slot":"（　　）は、北方の（　　）を討ち","who":"蒙恬","ok":"蒙恬は、北方の匈奴を討ち","wd":["始皇帝","陳勝","蘇秦"],"ng":["蒙恬は、北方のスキタイを討ち","蒙恬は、北方の鮮卑を討ち"],"cm":"蒙恬が討ったのはモンゴル高原の匈奴。スキタイは黒海北岸の遊牧民だね。"},
  "P1-16": {"id":"P1-16","ch":3,"boss":true,"t":"秦末、（　　）は「王侯将相いずくんぞ種あらんや」と唱えて反乱を起こした","slot":"（　　）は","who":"陳勝","ok":"農民出身の陳勝は","wd":["蒙恬","始皇帝","韓非"],"ng":["貴族出身の陳勝は","将軍出身の陳勝は"],"cm":"陳勝・呉広の乱は、中国史上はじめての大規模な農民反乱といわれているんだ。"},
  "P1-17": {"id":"P1-17","ch":4,"boss":false,"t":"垓下の戦いで項羽を破った（　　）は、長安を都に前漢を建てた","slot":"（　　）は、","who":"劉邦","ok":"農民出身の劉邦は、","wd":["項羽","武帝","冒頓単于"],"ng":["楚の貴族出身の劉邦は、","匈奴の王族出身の劉邦は、"],"cm":"項羽は楚の名門の出身、劉邦は農民の出身。正反対の二人だったんだ。"},
  "P1-18": {"id":"P1-18","ch":4,"boss":false,"t":"武帝は、匈奴を挟み撃ちにするため、（　　）に（　　）を派遣した","slot":"（　　）に（　　）を","who":"張騫","ok":"大月氏に張騫を","wd":["班超","司馬遷","武帝"],"ng":["匈奴に張騫を","大秦に張騫を"],"cm":"張騫が向かったのは大月氏。同盟はまとまらなかったけど、西方の情報を漢にもたらしたんだ。"},
  "P1-19": {"id":"P1-19","ch":4,"boss":false,"t":"西域都護の（　　）は、部下の甘英を（　　）へ派遣しようとした","slot":"（　　）は、部下の甘英を（　　）へ","who":"班超","ok":"班超は、部下の甘英を大秦へ","wd":["班固","張騫","光武帝"],"ng":["班超は、部下の甘英を大月氏へ","班超は、部下の甘英を倭へ"],"cm":"班超が甘英を送ろうとした「大秦」は、ローマのことだと考えられているよ。"},
  "P1-20": {"id":"P1-20","ch":4,"boss":false,"t":"（　　）は、魏に使いを送り「親魏倭王」の称号を与えられた","slot":"（　　）は","who":"卑弥呼","ok":"邪馬台国の女王卑弥呼は","wd":["劉備","諸葛亮","光武帝"],"ng":["奴国の女王卑弥呼は","百済の女王卑弥呼は"],"cm":"金印をもらった奴国は後漢の時代。卑弥呼の邪馬台国は三国の魏の時代だよ。"},
  "P1-21": {"id":"P1-21","ch":4,"boss":true,"t":"理想郷「桃源郷」のもとになった「桃花源記」は、（　　）の作品である","slot":"（　　）の","who":"陶淵明","ok":"東晋の詩人陶淵明の","wd":["王羲之","顧愷之","昭明太子"],"ng":["唐の詩人陶淵明の","前漢の詩人陶淵明の"],"cm":"陶淵明は東晋の詩人。「帰去来辞」で役人をやめて田舎に帰る気持ちを詠んだんだ。"},
  "P1-22": {"id":"P1-22","ch":5,"boss":false,"t":"オリンピアの祭典では、コンラッド博士が全種目で優勝した","slot":"コンラッド博士が全種目で優勝した","who":"ソロン","ok":"ポリスの市民がゼウスに捧げる競技を行った","wd":["ハンムラビ","ヴァルダマーナ","チャンドラグプタ"],"ng":["ローマの市民が皇帝に捧げる競技を行った","奴隷が剣闘士として戦った"],"cm":"オリンピアの祭典は、ポリスの市民がゼウスに捧げる競技会だったんだ。"},
  "P1-23": {"id":"P1-23","ch":5,"boss":false,"t":"（　　）は、独裁者の出現を防ぐため、陶片追放の制度をつくった","slot":"（　　）は、","who":"クレイステネス","ok":"前6世紀末にアテネで改革を行ったクレイステネスは、","wd":["ソロン","ペリクレス","ドラコン"],"ng":["スパルタで改革を行ったクレイステネスは、","前5世紀に民主政を完成させたクレイステネスは、"],"cm":"陶片追放をつくったのは前6世紀末のクレイステネス。民主政を完成させたペリクレスとは時代が違うよ。"},
  "P1-24": {"id":"P1-24","ch":5,"boss":false,"t":"前490年、（　　）は、マラトンの戦いでペルシア軍を破った","slot":"（　　）は、","who":"ミルティアデス","ok":"アテネの将軍ミルティアデスは、","wd":["テミストクレス","レオニダス","ペリクレス"],"ng":["スパルタの王ミルティアデスは、","マケドニアの将軍ミルティアデスは、"],"cm":"マラトンの戦いで勝ったのは、アテネの将軍ミルティアデスの重装歩兵部隊だよ。"},
  "P1-25": {"id":"P1-25","ch":5,"boss":false,"t":"前480年、（　　）は、サラミスの海戦でペルシア艦隊を破った","slot":"（　　）は、","who":"テミストクレス","ok":"三段櫂船の艦隊を率いたテミストクレスは、","wd":["ミルティアデス","レオニダス","クレイステネス"],"ng":["重装歩兵を率いたテミストクレスは、","騎兵隊を率いたテミストクレスは、"],"cm":"サラミスの海戦では、無産市民が三段櫂船の漕ぎ手として活躍したんだ。"},
  "P1-26": {"id":"P1-26","ch":5,"boss":false,"t":"デロス同盟の資金も使い、（　　）がパルテノン神殿を建てさせた","slot":"（　　）が","who":"ペリクレス","ok":"アテネの民主政を完成させたペリクレスが","wd":["フェイディアス","テミストクレス","ソロン"],"ng":["僭主政治を行ったペリクレスが","スパルタの王ペリクレスが"],"cm":"ペリクレスの時代に、アテネの民主政は完成したといわれているよ。"},
  "P1-27": {"id":"P1-27","ch":5,"boss":true,"t":"アレクサンドリアには王立研究所（　　）が建てられ、各地から学者が集まった","slot":"（　　）","who":"エウクレイデス","ok":"ムセイオン","wd":["アルキメデス","アリストテレス","ゼノン"],"ng":["アカデメイア","リュケイオン"],"cm":"アカデメイアはプラトン、リュケイオンはアリストテレスの学園。ムセイオンはアレクサンドリアの研究所だよ。"},
  "P1-28": {"id":"P1-28","ch":5,"boss":true,"t":"東方遠征でアケメネス朝を滅ぼした（　　）は、征服地の各地にアレクサンドリアを建設した","slot":"（　　）は、","who":"アレクサンドロス大王","ok":"マケドニアのアレクサンドロス大王は、","wd":["フィリッポス2世","アリストテレス","ペリクレス"],"ng":["アテネのアレクサンドロス大王は、","スパルタのアレクサンドロス大王は、"],"cm":"アレクサンドロス大王はマケドニアの王。東方遠征でアケメネス朝を滅ぼしたんだ。"}
},
"Q": [
  {"id":"ORI-Q01-001","ch":1,"q":"人類の進化で、猿人・原人・旧人に続いて登場した、クロマニョン人などの現生人類を何という？","a":"新人","d":["旧人","原人","猿人"],"x":"クロマニョン人は骨角器を使って、ラスコーの洞窟に絵を描いたんだ。描かれているのは馬や牛ばかりで、人の姿はほとんどないんだよ。","v":"ORI"},
  {"id":"ORI-Q01-002","ch":1,"q":"氷期が終わったあと、人類が始めた、人工的に水を引いて耕作する農業を何という？","a":"灌漑農業","d":["焼畑農業","天水農業","遊牧"],"x":"水を引く、水を分ける。それだけのことに人を集めて、決まりを作る必要があった。国や文字の始まりは、だいたいそこなんだ。","v":"ORI"},
  {"id":"ORI-Q01-003","ch":1,"q":"狩猟・採集によって食料を手に入れる経済を何という？","a":"獲得経済","d":["生産経済","貨幣経済","自給自足経済"],"x":"自然にあるものを取ってくる暮らしだね。農耕や牧畜で自分たちで食料をつくるようになると「生産経済」と呼ぶよ。","v":"ORI"},
  {"id":"ORI-Q01-004","ch":1,"q":"農耕・牧畜によって自ら食料をつくり出す経済を何という？","a":"生産経済","d":["獲得経済","貨幣経済","荘園経済"],"x":"食べ物が余るようになると、働かずに祈る人や、戦う人が生まれる。身分の差もそこから始まったんだ。","v":"ORI"},
  {"id":"ORI-Q02-001","ch":1,"q":"ティグリス川・ユーフラテス川の流域で、「川の間」という意味の名を持つ地域は？","a":"メソポタミア","d":["エジプト","パレスティナ","アナトリア"],"x":"ギリシア語で「川と川の間」という意味なんだ。今のイラクのあたりだよ。","v":"ORI"},
  {"id":"ORI-Q02-002","ch":1,"q":"「小アジア」とも呼ばれる、現在のトルコのあたりの地域は？","a":"アナトリア","d":["メソポタミア","パレスティナ","シリア"],"x":"アナトリアはギリシア語で「日の昇るところ」。オリエントと似た意味だね。ギリシアから見て東、というわけさ。","v":"ORI"},
  {"id":"ORI-Q02-003","ch":1,"q":"ナイル川の流域に古代文明が生まれた地域は？","a":"エジプト","d":["メソポタミア","アナトリア","パレスティナ"],"x":"ナイル川は毎年夏に氾濫して、上流から肥えた土を運んできたんだ。だから肥料がいらなかった。","v":"ORI"},
  {"id":"ORI-Q02-004","ch":1,"q":"ヘブライ人が王国を建てた、地中海東岸の地域は？","a":"パレスティナ","d":["アナトリア","メソポタミア","エジプト"],"x":"名前はヘブライ人と争った「ペリシテ人」から来ているんだ。皮肉な話だね。","v":"ORI"},
  {"id":"ORI-Q02-005","ch":1,"q":"「オリエント」は「太陽の昇るところ」という意味。どこから見て東なのか？","a":"ギリシア","d":["ローマ","エジプト","ペルシア"],"x":"ギリシア・ローマから見ての東、ということだね。だから「オリエント」という言葉は、最初からヨーロッパの側の目線なんだ。","v":"ORI"},
  {"id":"ORI-Q02-006","ch":1,"q":"前3000年ごろメソポタミアに都市国家を建てた、民族系統不明の人々は？","a":"シュメール人","d":["アッカド人","アムル人","ヒッタイト人"],"x":"どこから来たのか、今もわかっていないんだ。言葉もほかのどの言語とも似ていない。不思議な人たちだよ。","v":"ORI"},
  {"id":"ORI-Q02-007","ch":1,"q":"シュメール人が建てた都市国家で、のちにアブラハムの故郷ともいわれた都市は？","a":"ウル","d":["バビロン","ニネヴェ","メンフィス"],"x":"ウルの王墓からは、黄金の兜や竪琴がたくさん見つかっているよ。旧約聖書のアブラハムは「カルデアのウル」の出身とされているんだ。","v":"ORI"},
  {"id":"ORI-Q02-008","ch":1,"q":"シュメール人の都市国家で、伝説の王ギルガメッシュが治めたとされる都市は？","a":"ウルク","d":["ウル","スサ","ダマスクス"],"x":"ウルクの城壁は、ギルガメッシュが築いたと叙事詩の中で自慢されているんだ。","v":"ORI"},
  {"id":"ORI-Q02-009","ch":1,"q":"シュメール人が発明し、粘土板に刻んだ文字は？","a":"楔形文字","d":["ヒエログリフ","線文字A","アラム文字"],"x":"葦のペンを粘土に押しつけると、くさびの形の跡が残る。そのまま名前になったんだ。粘土板は焼けると固くなるから、火事のおかげで残ったものも多いよ。","v":"ORI"},
  {"id":"ORI-Q02-010","ch":1,"q":"楔形文字の解読の手がかりとなった、ダレイオス1世の業績を刻んだ碑文は？","a":"ベヒストゥーン碑文","d":["ロゼッタ＝ストーン","ハンムラビ法典碑","アショーカ王碑文"],"x":"崖の高いところに彫ってあってね、ローリンソンは崖をよじ登って写し取ったんだ。命がけの解読だよ。","v":"ORI"},
  {"id":"ORI-Q02-011","ch":1,"q":"シュメール人がメソポタミア各地に建てた、聖塔と呼ばれる建造物は？","a":"ジッグラト","d":["ピラミッド","オベリスク","ストゥーパ"],"x":"旧約聖書の「バベルの塔」のモデルになったとも言われているよ。上には神殿があって、神が降りてくる場所と考えられていたんだ。","v":"ORI"},
  {"id":"ORI-Q02-012","ch":1,"q":"シュメール人が採用した、月の満ち欠けを基準とする暦は？","a":"太陰暦","d":["太陽暦","ユリウス暦","ヒジュラ暦"],"x":"月は毎晩見れば形がわかるから、数えやすかったんだ。でも季節とは少しずつずれていくから、閏月で調整したよ。","v":"ORI"},
  {"id":"ORI-Q02-013","ch":1,"q":"シュメール人が採用し、今も時間や角度の単位に残る数え方は？","a":"六十進法","d":["十進法","二十進法","十二進法"],"x":"1時間が60分、円が360度なのは、シュメール人のおかげなんだ。60は割り切れる数が多くて便利なんだよ。","v":"ORI"},
  {"id":"ORI-Q02-014","ch":1,"q":"前24世紀にサルゴン1世のもとでメソポタミアを初めて統一した、セム語系の民族は？","a":"アッカド人","d":["シュメール人","アムル人","ヒッタイト人"],"x":"サルゴンは、自分は捨て子で、籠に入れられて川に流されたと語っているんだ。どこかで聞いた話だろう？","v":"ORI"},
  {"id":"ORI-Q02-015","ch":1,"q":"アッカド人・アムル人・アラム人・フェニキア人・ヘブライ人に共通する語族は？","a":"セム語系","d":["インド＝ヨーロッパ語族","エジプト語系","民族系統不明"],"x":"アラビア語やヘブライ語も、セム語系の言葉なんだ。今も中東で話されているよ。","v":"ORI"},
  {"id":"ORI-Q02-016","ch":1,"q":"アッカド人に続いてメソポタミアを統一し、バビロン第1王朝を建てたセム語系の民族は？","a":"アムル人","d":["アッカド人","ヒッタイト人","カッシート人"],"x":"もとは西のほうから来た遊牧民だったんだ。アムルは「西の人」という意味だよ。","v":"ORI"},
  {"id":"ORI-Q02-017","ch":1,"q":"アムル人がバビロンを都に建てた王朝は？","a":"バビロン第1王朝","d":["ウル第3王朝","新バビロニア","ミタンニ王国"],"x":"古バビロニアとも呼ぶよ。新バビロニアとは千年以上離れているから、混ぜないようにね。","v":"ORI"},
  {"id":"ORI-Q02-018","ch":1,"q":"「王朝」とは、君主の交代が何によって行われていく国家のこと？","a":"血縁関係","d":["選挙","武力による奪い合い","神官の占い"],"x":"親から子へ、兄から弟へ。血のつながりで受け継いでいく限り、同じ王朝なんだ。","v":"ORI"},
  {"id":"ORI-Q02-019","ch":1,"q":"バビロン第1王朝の王ハンムラビが制定した法典は？","a":"ハンムラビ法典","d":["十二表法","ウルナンム法典","ローマ法大全"],"x":"全部で282条。石碑の上には、王が太陽神から法を授かる場面が彫られているよ。","v":"ORI"},
  {"id":"ORI-Q02-020","ch":1,"q":"ハンムラビ法典の石碑が発見された、イランの古都は？","a":"スサ","d":["バビロン","ニネヴェ","ペルセポリス"],"x":"戦争の戦利品として、エラム人がスサに持って帰ったんだ。今はパリのルーヴル美術館にあるよ。","v":"ORI"},
  {"id":"ORI-Q02-021","ch":1,"q":"ハンムラビ法典の「復讐法」の原則を表す言葉は？","a":"目には目を、歯には歯を","d":["汝の隣人を愛せ","法の前の平等","悪法もまた法なり"],"x":"やられた以上にやり返すな、という上限の決まりでもあったんだ。ただし身分が違えば、罰も違ったよ。","v":"ORI"},
  {"id":"ORI-Q02-022","ch":1,"q":"「目には目を、歯には歯を」に代表される、ハンムラビ法典の原則は？","a":"復讐法","d":["身分法","万民法","自然法"],"x":"復讐していいのは、受けた害と同じ分まで。際限のない仕返しを止めるための決まりだったんだ。","v":"ORI"},
  {"id":"ORI-Q02-023","ch":1,"q":"ハンムラビ法典に定められた、酒場の女主人がビールの値段をごまかしたときの罰は？","a":"溺死刑","d":["火あぶり刑","罰金のみ","追放刑"],"x":"ビールはパンと同じくらい大切な食べ物だったんだ。だから値段のごまかしには厳しかったんだよ。","v":"ORI"},
  {"id":"ORI-Q02-025","ch":1,"q":"鉄製の武器を用いてバビロン第1王朝を滅ぼした、インド＝ヨーロッパ語族の民族は？","a":"ヒッタイト人","d":["アッシリア人","ヒクソス","カッシート人"],"x":"製鉄の技術は国の秘密として守られていたんだ。ヒッタイトが滅びたあとで、鉄は一気にオリエントに広まったよ。","v":"ORI"},
  {"id":"ORI-Q02-026","ch":1,"q":"ヒッタイト人がオリエントで初めて本格的に用いた金属は？","a":"鉄","d":["青銅","銅","金"],"x":"鉄の武器は青銅より硬くて、材料もあちこちで手に入る。戦いのあり方を変えた金属だね。","v":"ORI"},
  {"id":"ORI-Q02-027","ch":1,"q":"ヒッタイトが去ったあと、北メソポタミアにフルリ人が建てた国は？","a":"ミタンニ王国","d":["カッシート王国","リディア","クシュ王国"],"x":"ミタンニの王女はエジプトのファラオに嫁いでいるんだ。外交の手紙もたくさん残っているよ。","v":"ORI"},
  {"id":"ORI-Q02-028","ch":1,"q":"ヒッタイトが去ったあと、南メソポタミアを支配したインド＝ヨーロッパ語族の民族は？","a":"カッシート人","d":["ミタンニ人","ヒクソス","アラム人"],"x":"カッシート人は400年近くバビロニアを治めたんだ。馬の飼育が得意だったと言われているよ。","v":"ORI"},
  {"id":"ORI-Q03-001","ch":1,"q":"毎年夏に氾濫して、肥えた土を運んでエジプトの農業を支えた川は？","a":"ナイル川","d":["ティグリス川","ユーフラテス川","ヨルダン川"],"x":"氾濫の時期を知るために、星や暦の研究が進んだんだ。シリウスが夜明け前に見えると、増水が近いと考えたよ。","v":"ORI"},
  {"id":"ORI-Q03-002","ch":1,"q":"「エジプトはナイルのたまもの」と書いたギリシアの歴史家は？","a":"ヘロドトス","d":["トゥキディデス","ホメロス","プルタルコス"],"x":"ヘロドトスは自分でエジプトを旅しているんだ。ちょっと話を盛るところもあって、「嘘の父」なんて呼ばれることもあるよ。","v":"ORI"},
  {"id":"ORI-Q03-003","ch":1,"q":"ヘロドトスが『歴史』の中で「エジプトは〇〇のたまもの」と表現した。〇〇に入るのは？","a":"ナイル","d":["太陽","ファラオ","ピラミッド"],"x":"同じ言葉はヘロドトスより前の人も使っていたらしい。でも広めたのは彼の本だね。","v":"ORI"},
  {"id":"ORI-Q03-004","ch":1,"q":"古代エジプトの初期に乱立していた小規模な国家を何という？","a":"ノモス","d":["ポリス","ジャーティ","ミスル"],"x":"ノモスはのちの時代には「州」の単位として使われ続けたよ。","v":"ORI"},
  {"id":"ORI-Q03-005","ch":1,"q":"古代エジプトの王の呼び名は？","a":"ファラオ","d":["スルタン","カリフ","ハン"],"x":"もとは「大きな家」、つまり王宮という意味なんだ。直接名前を呼ぶのを避けた、遠回しな言い方だよ。","v":"ORI"},
  {"id":"ORI-Q03-006","ch":1,"q":"古代エジプト史は「古王国」「中王国」と、あと一つは？","a":"新王国","d":["後王国","第二王国","統一王国"],"x":"三つの王国の間には、国が乱れた「中間期」がはさまっているよ。","v":"ORI"},
  {"id":"ORI-Q03-007","ch":1,"q":"古王国時代の都は？","a":"メンフィス","d":["テーベ","テル＝エル＝アマルナ","アレクサンドリア"],"x":"メンフィスは上エジプトと下エジプトの境目にあったんだ。両方を治めるのにちょうどいい場所だよ。","v":"ORI"},
  {"id":"ORI-Q03-008","ch":1,"q":"古王国時代の王の権力の大きさを示す、王の墓とされる巨大建造物は？","a":"ピラミッド","d":["ジッグラト","オベリスク","マスタバ"],"x":"ピラミッドを造ったのは奴隷ではなく、給料をもらって働く人たちだったという説が今は有力なんだ。仕事の日誌も見つかっているよ。","v":"ORI"},
  {"id":"ORI-Q03-009","ch":1,"q":"クフ王のものなど三大ピラミッドがある場所は？","a":"ギザ","d":["テーベ","メンフィス","アマルナ"],"x":"クフ王のピラミッドは、できたときは表面が白い石灰岩で覆われていて、輝いて見えたらしいよ。","v":"ORI"},
  {"id":"ORI-Q03-010","ch":1,"q":"中王国時代の都は？","a":"テーベ","d":["メンフィス","アレクサンドリア","ニネヴェ"],"x":"テーベは今のルクソールだよ。アメン神の大きな神殿があるんだ。","v":"ORI"},
  {"id":"ORI-Q03-011","ch":1,"q":"中王国時代の末、馬と戦車を用いてエジプトに流入した人々は？","a":"ヒクソス","d":["ヒッタイト","海の民","ヌビア人"],"x":"ヒクソスは「異国の支配者」という意味なんだ。彼らのおかげで、エジプトに馬と戦車が伝わったよ。","v":"ORI"},
  {"id":"ORI-Q03-012","ch":1,"q":"新王国時代のファラオ、アメンホテプ4世が都を移した場所は？","a":"テル＝エル＝アマルナ","d":["メンフィス","ギザ","アレクサンドリア"],"x":"何もない砂漠に、ほんの数年で新しい都を建てたんだ。王が死んだあとは見捨てられて、砂に埋もれてしまったよ。","v":"ORI"},
  {"id":"ORI-Q03-013","ch":1,"q":"アトン神を唯一神とする宗教改革を行ったファラオは？","a":"アメンホテプ4世","d":["ラメス2世","トトメス3世","ツタンカーメン"],"x":"……王の名前も、像も、あとの時代に削られてしまってね。なかったことにされたんだ。まあ、そういうこともあるよ。","v":"ORI"},
  {"id":"ORI-Q03-014","ch":1,"q":"アメンホテプ4世が宗教改革に合わせて名乗った、「アトンにとって有益な者」という意味の名は？","a":"アクエンアテン","d":["ツタンカーメン","ラメス","トトメス"],"x":"名前を変えるというのは、それまでの自分を捨てるということでもあるんだ。……本人にとっては、ね。","v":"ORI"},
  {"id":"ORI-Q03-015","ch":1,"q":"アメンホテプ4世の時代に生まれた、写実的な美術を何という？","a":"アマルナ美術","d":["ヘレニズム美術","ガンダーラ美術","ビザンツ美術"],"x":"王の顔や体を、理想化せずにありのままに描いたんだ。家族と仲良く過ごす王の姿まで残っているよ。","v":"ORI"},
  {"id":"ORI-Q03-016","ch":1,"q":"アマルナ美術の代表作として知られる、王妃の胸像は？","a":"ネフェルティティの胸像","d":["クレオパトラの胸像","ハトシェプストの胸像","黄金のマスク"],"x":"片方の目だけ、はめ込まれていないんだ。理由はわかっていない。今はベルリンの博物館にあるよ。","v":"ORI"},
  {"id":"ORI-Q03-017","ch":1,"q":"カーターが王家の谷で墓を発見した、ツタンカーメン王の副葬品として有名なものは？","a":"黄金のマスク","d":["ネフェルティティの胸像","ロゼッタ＝ストーン","死者の書"],"x":"ツタンカーメンは18歳ごろに亡くなった若い王なんだ。王家の谷の王墓は、ほとんどが盗掘で空っぽだった。これはほぼ手つかずで見つかった、珍しい例なんだ。","v":"ORI"},
  {"id":"ORI-Q03-018","ch":1,"q":"古代エジプトの宗教で、神々の中心とされた太陽神は？","a":"ラー","d":["アトン","オシリス","マルドゥーク"],"x":"新王国の時代には、テーベの守り神アメンと一つになって「アメン＝ラー」と呼ばれたよ。","v":"ORI"},
  {"id":"ORI-Q03-019","ch":1,"q":"死者の生前の善行などを記し、ミイラとともに墓に納めた文書は？","a":"死者の書","d":["ギルガメッシュ叙事詩","旧約聖書","ヴェーダ"],"x":"死後の裁きで、心臓を羽根と天秤ではかるんだ。罪が重くて心臓が沈むと、怪物に食べられてしまう。","v":"ORI"},
  {"id":"ORI-Q03-020","ch":1,"q":"霊魂の不滅を信じたエジプト人が、死後の復活に備えてつくった遺体を何という？","a":"ミイラ","d":["カノプス","スカラベ","オベリスク"],"x":"内臓は取り出して、別の壺に入れて保存したんだ。心臓だけは、裁きで使うから体に残したよ。","v":"ORI"},
  {"id":"ORI-Q03-021","ch":1,"q":"神殿や墓の石などに刻まれた、古代エジプトの象形文字は？","a":"ヒエログリフ（神聖文字）","d":["デモティック（民用文字）","楔形文字","線文字B"],"x":"「聖なる刻まれた文字」という意味のギリシア語なんだ。読める人がいなくなって、千年以上も謎の文字だったよ。","v":"ORI"},
  {"id":"ORI-Q03-022","ch":1,"q":"ヒエログリフ解読の手がかりとなった、3種類の文字で同じ内容が刻まれた石碑は？","a":"ロゼッタ＝ストーン","d":["ベヒストゥーン碑文","ハンムラビ法典碑","アショーカ王の石柱碑"],"x":"ナポレオンのエジプト遠征のときに見つかったんだ。でも戦争に負けてイギリスに取られて、今は大英博物館にあるよ。","v":"ORI"},
  {"id":"ORI-Q03-023","ch":1,"q":"ロゼッタ＝ストーンを手がかりにヒエログリフを解読したフランスの学者は？","a":"シャンポリオン","d":["ローリンソン","ヴェントリス","エヴァンズ"],"x":"解読できたと気づいた瞬間、兄の職場に駆け込んで「やった！」と叫んで、そのまま気を失ったと言われているよ。","v":"ORI"},
  {"id":"ORI-Q03-024","ch":1,"q":"古代エジプトで文字を書くのに使われた、植物からつくった紙は？","a":"パピルス","d":["羊皮紙","竹簡","粘土板"],"x":"英語の「paper」の語源なんだ。ナイル川の岸に生える草の茎を、薄く切って重ねてつくったよ。","v":"ORI"},
  {"id":"ORI-Q03-025","ch":1,"q":"古代エジプトでつくられ、のちにカエサルが採用してユリウス暦となった暦は？","a":"太陽暦","d":["太陰暦","太陰太陽暦","グレゴリウス暦"],"x":"1年を365日とする暦だね。ナイル川の氾濫の周期を知るのに、太陽の動きが役に立ったんだ。","v":"ORI"},
  {"id":"ORI-Q04-001","ch":1,"q":"ダマスクスを中心に内陸の中継貿易で栄えた、セム語系の民族は？","a":"アラム人","d":["フェニキア人","ヘブライ人","アッカド人"],"x":"アラム語は国際共通語になって、イエスもアラム語を話していたと言われているんだ。","v":"ORI"},
  {"id":"ORI-Q04-002","ch":1,"q":"アラム人が担った貿易は？","a":"内陸貿易","d":["地中海交易","インド洋交易","北海交易"],"x":"ラクダやロバの隊商で、オリエントの都市と都市をつないだんだ。","v":"ORI"},
  {"id":"ORI-Q04-003","ch":1,"q":"ウイグル文字やアラビア文字など、東方の文字のもとになった文字は？","a":"アラム文字","d":["フェニキア文字","楔形文字","ヒエログリフ"],"x":"アラム人の商売の広がりと一緒に、文字も広がったんだ。モンゴル文字や満州文字も、たどればアラム文字に行き着くよ。","v":"ORI"},
  {"id":"ORI-Q04-004","ch":1,"q":"シドン・ティルスなどの都市国家を建てたフェニキア人が活躍した貿易は？","a":"地中海交易","d":["内陸貿易","インド洋交易","バルト海交易"],"x":"北アフリカに植民市カルタゴも建てたんだ。のちにローマとポエニ戦争で争う、あのカルタゴだよ。","v":"ORI"},
  {"id":"ORI-Q04-005","ch":1,"q":"フェニキア人が船の材料にした、特産の木材は？","a":"レバノン杉","d":["オリーブ","ナツメヤシ","樫"],"x":"今のレバノンの国旗にも、この杉が描かれているんだ。切りすぎて、今はほとんど残っていないよ。","v":"ORI"},
  {"id":"ORI-Q04-006","ch":1,"q":"ギリシアに伝わり、アルファベットのもとになった文字は？","a":"フェニキア文字","d":["アラム文字","線文字B","楔形文字"],"x":"フェニキア文字は子音だけの文字だったんだ。ギリシア人が母音を書き足して、アルファベットになったよ。","v":"ORI"},
  {"id":"ORI-Q04-007","ch":1,"q":"ギリシア人がフェニキア文字を改良してつくった表音文字は？","a":"アルファベット","d":["線文字A","デモティック","ルーン文字"],"x":"名前は最初の2文字「アルファ」と「ベータ」から来ているんだ。","v":"ORI"},
  {"id":"ORI-Q04-008","ch":1,"q":"エジプトでの圧政から逃れる「出エジプト」を率いたヘブライ人の指導者は？","a":"モーセ","d":["ダヴィデ","ソロモン","サウル"],"x":"海が二つに割れて道ができた、という伝説が有名だね。シナイ山で神から十戒を授かったとされているよ。","v":"ORI"},
  {"id":"ORI-Q04-009","ch":1,"q":"ヘブライ人がパレスチナに建てた王国は？","a":"ヘブライ王国","d":["ミタンニ王国","クシュ王国","リディア王国"],"x":"サウル、ダヴィデ、ソロモンと続く王国だね。ソロモンが亡くなると、二つに分かれてしまうんだ。","v":"ORI"},
  {"id":"ORI-Q04-010","ch":1,"q":"ヘブライ王国の都は？","a":"イェルサレム","d":["ダマスクス","ティルス","ニネヴェ"],"x":"今もユダヤ教・キリスト教・イスラームの三つの宗教の聖地なんだ。","v":"ORI"},
  {"id":"ORI-Q04-011","ch":1,"q":"ヘブライ王国の神殿の跡に残る、ユダヤ教の聖地となっている壁は？","a":"嘆きの壁","d":["ハドリアヌスの長城","岩のドーム","オベリスク"],"x":"ローマに神殿を壊されたことを嘆いて祈る場所、という意味でその名で呼ばれているんだ。壁の隙間に、願いごとを書いた紙を差し込むよ。","v":"ORI"},
  {"id":"ORI-Q04-012","ch":1,"q":"ソロモンの死後、ヘブライ王国が分裂してできた北部の王国は？","a":"イスラエル王国","d":["ユダ王国","新バビロニア","アッシリア王国"],"x":"北の王国はアッシリアに滅ぼされて、住民は各地に散らばってしまったんだ。","v":"ORI"},
  {"id":"ORI-Q04-013","ch":1,"q":"ヘブライ王国の分裂後、南部に成立し、新バビロニアに滅ぼされた王国は？","a":"ユダ王国","d":["イスラエル王国","リディア","メディア"],"x":"「ユダヤ人」という呼び名は、この「ユダ」から来ているんだ。","v":"ORI"},
  {"id":"ORI-Q04-014","ch":1,"q":"イスラエル王国を前722年に滅ぼした国は？","a":"アッシリア","d":["新バビロニア","アケメネス朝ペルシア","エジプト"],"x":"アッシリアは征服した民を別の土地に移住させて、反乱を起こしにくくしたんだ。","v":"ORI"},
  {"id":"ORI-Q04-015","ch":1,"q":"新バビロニアの王ネブカドネザル2世が、ユダ王国の人々をバビロンに連れ去った事件は？","a":"バビロン捕囚","d":["出エジプト","ディアスポラ","アマルナ改革"],"x":"ネブカドネザル2世は、故郷の山を恋しがる王妃のために「空中庭園」を造ったという伝説もあるんだ。","v":"ORI"},
  {"id":"ORI-Q04-016","ch":1,"q":"バビロン捕囚が起きた年は？","a":"前586年","d":["前722年","前538年","前1200年"],"x":"この事件のあとから、ヘブライ人は「ユダヤ人」と呼ばれるようになるんだ。","v":"ORI"},
  {"id":"ORI-Q04-017","ch":1,"q":"新バビロニアを滅ぼし、捕囚されていたユダヤ人を解放した国は？","a":"アケメネス朝ペルシア","d":["アッシリア","ヒッタイト","メディア"],"x":"キュロス2世が解放したんだ。旧約聖書では、彼は異教徒なのに「神に油を注がれた者」とまで呼ばれているよ。","v":"ORI"},
  {"id":"ORI-Q04-018","ch":1,"q":"捕囚から解放されたユダヤ人が帰り、神殿を再建した都市は？","a":"イェルサレム","d":["バビロン","ダマスクス","スサ"],"x":"帰らずにペルシアに残った人たちも多かったんだ。そのまま各地で暮らし続けたよ。","v":"ORI"},
  {"id":"ORI-Q04-019","ch":1,"q":"バビロン捕囚から解放されたユダヤ人が成立させた宗教は？","a":"ユダヤ教","d":["キリスト教","ゾロアスター教","マニ教"],"x":"苦しい経験の中で、自分たちが何者なのかを確かめるように、教えがまとまっていったんだ。","v":"ORI"},
  {"id":"ORI-Q04-020","ch":1,"q":"ユダヤ教で信仰される唯一神は？","a":"ヤハウェ","d":["アトン","アフラ＝マズダ","マルドゥーク"],"x":"聖なる名前だから、口に出すのを避けたんだ。だから正しい読み方は、実はよくわかっていないんだよ。","v":"ORI"},
  {"id":"ORI-Q04-021","ch":1,"q":"ユダヤ教のように、ただ一つの神のみを信仰する宗教を何という？","a":"一神教","d":["多神教","自然崇拝","祖先崇拝"],"x":"オリエントは多神教が当たり前の世界だった。その中で、一つの神だけを信じるのは珍しいことだったんだ。……前にもそれを試みた王がいたけどね。","v":"ORI"},
  {"id":"ORI-Q04-022","ch":1,"q":"「自分たちだけが神に選ばれ、救われる」というユダヤ教の考え方は？","a":"選民思想","d":["終末思想","輪廻転生","万物斉同"],"x":"出エジプトやバビロン捕囚と、苦しいことが続いた。そうでも信じないと、やっていられなかったんだろうね。","v":"ORI"},
  {"id":"ORI-Q04-023","ch":1,"q":"ユダヤ教で、民族を苦難から救うと信じられた救世主を何という？","a":"メシア","d":["ファラオ","カリフ","ブッダ"],"x":"もとは「油を注がれた者」という意味なんだ。王を任命するときに油を注いだからだよ。ギリシア語に訳すと「キリスト」になる。","v":"ORI"},
  {"id":"ORI-Q04-024","ch":1,"q":"モーセの十戒をはじめ、神の戒めを厳しく守ることを重んじるユダヤ教の考え方は？","a":"戒律主義","d":["選民思想","一神教","隣人愛"],"x":"安息日には火をおこすことも禁じられたんだ。今でも、安息日にはエレベーターのボタンを押さなくていいよう、全階に止まるエレベーターがあるよ。","v":"ORI"},
  {"id":"ORI-Q04-025","ch":1,"q":"ユダヤ教の聖典は？","a":"旧約聖書","d":["新約聖書","コーラン","ヴェーダ"],"x":"「旧約」はキリスト教の側からの呼び方なんだ。ユダヤ教の人たちは、単に「聖書」と呼ぶよ。","v":"ORI"},
  {"id":"ORI-Q04-026","ch":1,"q":"バビロン捕囚の中で、ユダヤ文化を守るために確立された、神の教えの決まりは？","a":"律法","d":["十二表法","コーラン","ヴェーダ"],"x":"捕囚先で、みんなで集まって学び、祈る場所ができた。それがシナゴーグの始まりだと言われているよ。","v":"ORI"},
  {"id":"ORI-Q04-027","ch":1,"q":"第二次世界大戦後、パレスチナにユダヤ人が建国を宣言した国は？","a":"イスラエル","d":["ヨルダン","レバノン","シリア"],"x":"建国の翌日から、アラブ諸国との戦争が始まったんだ。パレスチナの問題は、今も続いているよ。","v":"ORI"},
  {"id":"ORI-Q05-001","ch":1,"q":"前7世紀前半にオリエントを統一し、ニネヴェを都とした国は？","a":"アッシリア王国","d":["新バビロニア","ヒッタイト","アケメネス朝ペルシア"],"x":"アッシュルバニパル王の図書館には、粘土板が何万枚も集められていたんだ。ギルガメッシュ叙事詩も、そこから見つかったよ。","v":"ORI"},
  {"id":"ORI-Q05-002","ch":1,"q":"アッシリア滅亡後に分立した四王国のうち、ナイル川流域の国は？","a":"エジプト","d":["リディア","メディア","新バビロニア"],"x":"四つの王国は、のちにすべてアケメネス朝ペルシアにまとめられるんだ。","v":"ORI"},
  {"id":"ORI-Q05-003","ch":1,"q":"アッシリア滅亡後に小アジアで栄え、世界最古の金属貨幣をつくった国は？","a":"リディア","d":["メディア","新バビロニア","ミタンニ"],"x":"最初の貨幣は、金と銀が自然にまざった合金でつくられていたんだ。","v":"ORI"},

  {"id":"IND-Q04-004","ch":2,"q":"クシャーナ朝の滅亡後、グプタ朝を建てたのは？","a":"チャンドラグプタ1世","d":["チャンドラグプタ","ハルシャ","カニシカ"],"x":"マウリヤ朝の創始者と同じ名前で、同じパータリプトラを都にした。昔の栄光を取り戻したかったんだろうね。","v":"IND"},
  {"id":"IND-Q04-005","ch":2,"q":"チャンドラグプタ1世が建てた王朝は？","a":"グプタ朝","d":["マウリヤ朝","ヴァルダナ朝","チョーラ朝"],"x":"グプタ朝の時代は、インドの古典文化の黄金時代と呼ばれているよ。","v":"IND"},
  {"id":"IND-Q04-006","ch":2,"q":"6世紀、グプタ朝を衰退させた中央アジアの遊牧民は？","a":"エフタル","d":["クシャーン人","匈奴","突厥"],"x":"エフタルはのちに、突厥とササン朝に挟み撃ちにされて滅びるよ。","v":"IND"},
  {"id":"IND-Q04-007","ch":2,"q":"東晋からグプタ朝のインドを訪れ、『仏国記』を著した僧は？","a":"法顕","d":["玄奘","義浄","鳩摩羅什"],"x":"60歳を超えてから旅立って、陸路で行って海路で帰ってきたんだ。帰りは嵐にあって、予定と違う場所に着いてしまったよ。","v":"IND"},
  {"id":"IND-Q04-008","ch":2,"q":"法顕がインドの旅について記した書物は？","a":"『仏国記』","d":["『大唐西域記』","『南海寄帰内法伝』","『エリュトゥラー海案内記』"],"x":"当時のインドの町のようすを伝える、貴重な記録なんだ。","v":"IND"},
  {"id":"IND-Q04-009","ch":2,"q":"グプタ朝の時代に生まれた、ギリシアの影響を離れた純インド的な美術を何という？","a":"グプタ様式","d":["ガンダーラ美術","ヘレニズム美術","アマルナ美術"],"x":"うすい衣が体にぴったりはりついたような、なめらかな仏像が特徴だよ。","v":"IND"},
  {"id":"IND-Q04-010","ch":2,"q":"グプタ様式の壁画で知られる、インドの石窟寺院は？","a":"アジャンター石窟寺院","d":["ナーランダー僧院","サーンチーの仏塔","エローラ石窟寺院"],"x":"19世紀に、トラ狩りをしていたイギリスの軍人が偶然見つけたんだ。それまで千年以上、森に埋もれていたよ。","v":"IND"},
  {"id":"IND-Q04-011","ch":2,"q":"グプタ朝の時代に定着した、バラモン教と民間信仰が融合した開祖のいない宗教は？","a":"ヒンドゥー教","d":["ジャイナ教","大乗仏教","ゾロアスター教"],"x":"開祖も、ただ一つの経典もない。長い時間をかけて、いろいろな信仰が積み重なってできた宗教なんだ。","v":"IND"},
  {"id":"IND-Q04-012","ch":2,"q":"ヒンドゥー教徒の生活規範を定めた法典は？","a":"『マヌ法典』","d":["『ハンムラビ法典』","『リグ＝ヴェーダ』","『十二表法』"],"x":"マヌは人類の始祖とされる人物なんだ。ヴァルナごとの義務が細かく書かれているよ。","v":"IND"},
  {"id":"IND-Q04-013","ch":2,"q":"ヒンドゥー教が神聖なものとして崇拝する動物は？","a":"牛","d":["象","蛇","猿"],"x":"シヴァ神の乗り物が牛なんだ。だからインドでは、牛が道路を悠々と歩いていても誰も怒らないよ。","v":"IND"},
  {"id":"IND-Q04-014","ch":2,"q":"グプタ朝の時代に栄えた、インドの古典語で書かれた文学は？","a":"サンスクリット文学","d":["タミル文学","パーリ語文学","ペルシア文学"],"x":"サンスクリットは「完成された言葉」という意味なんだ。今のヨーロッパの言葉とも、遠い親戚なんだよ。","v":"IND"},
  {"id":"IND-Q04-015","ch":2,"q":"クル国の王子たちの王位をめぐる争いを描いた、インドの二大叙事詩の一つは？","a":"『マハーバーラタ』","d":["『ラーマーヤナ』","『シャクンタラー』","『リグ＝ヴェーダ』"],"x":"とても長い詩で、ギリシアの『イリアス』と『オデュッセイア』を合わせたものの、何倍もの長さがあるんだ。","v":"IND"},
  {"id":"IND-Q04-016","ch":2,"q":"王子ラーマがさらわれた妻シータを取り戻す旅を描いた、インドの二大叙事詩の一つは？","a":"『ラーマーヤナ』","d":["『マハーバーラタ』","『シャクンタラー』","『仏国記』"],"x":"ラーマを助ける猿の将軍ハヌマーンが、孫悟空のモデルの一つだという説もあるんだ。","v":"IND"},
  {"id":"IND-Q04-017","ch":2,"q":"カーリダーサが書いた、王と仙女の恋を描いた戯曲は？","a":"『シャクンタラー』","d":["『ラーマーヤナ』","『マハーバーラタ』","『マヌ法典』"],"x":"ヨーロッパに訳されて、ゲーテが絶賛したんだ。『ファウスト』の冒頭にも影響を与えたと言われているよ。","v":"IND"},
  {"id":"IND-Q04-018","ch":2,"q":"グプタ朝の時代のインドで生まれ、のちにイスラーム世界に伝わった数の概念は？","a":"ゼロ","d":["小数","負の数","六十進法"],"x":"何もない、を一つの数として書き表す。単純なようで、なかなか思いつかないことなんだ。","v":"IND"},
  {"id":"IND-Q04-019","ch":2,"q":"7世紀にヴァルダナ朝を建てた王は？","a":"ハルシャ王","d":["チャンドラグプタ2世","カニシカ王","アショーカ王"],"x":"ハルシャ王は自分でも戯曲を書いた、文化好きの王様なんだ。","v":"IND"},
  {"id":"IND-Q04-020","ch":2,"q":"ハルシャ王が建てた王朝は？","a":"ヴァルダナ朝","d":["グプタ朝","マウリヤ朝","チョーラ朝"],"x":"ハルシャ王が亡くなると、王朝はすぐに崩れてしまったんだ。","v":"IND"},
  {"id":"IND-Q04-021","ch":2,"q":"唐からヴァルダナ朝のインドを訪れ、帰国後『大唐西域記』を著した僧は？","a":"玄奘","d":["法顕","義浄","鑑真"],"x":"国の許可を得ないまま、こっそり出国したんだ。それでも帰ってきたときは、皇帝の太宗が大歓迎したよ。","v":"IND"},
  {"id":"IND-Q04-022","ch":2,"q":"玄奘が著した、インドへの旅の記録は？","a":"『大唐西域記』","d":["『仏国記』","『南海寄帰内法伝』","『西遊記』"],"x":"これをもとに、ずっとあとの明の時代に物語の『西遊記』が生まれたんだ。史実の玄奘には、猿のお供はいないよ。","v":"IND"},
  {"id":"IND-Q04-023","ch":2,"q":"海路でインドに渡り、『南海寄帰内法伝』を著した唐の僧は？","a":"義浄","d":["玄奘","法顕","鑑真"],"x":"行きも帰りも海の道を使って、途中のシュリーヴィジャヤにも長く滞在したんだ。","v":"IND"},
  {"id":"IND-Q04-024","ch":2,"q":"義浄がインドや東南アジアの仏教のようすを記した書物は？","a":"『南海寄帰内法伝』","d":["『大唐西域記』","『仏国記』","『エリュトゥラー海案内記』"],"x":"僧たちが毎日どんな暮らしをしているかを、細かく書き留めた本なんだ。","v":"IND"},
  {"id":"IND-Q04-025","ch":2,"q":"玄奘や義浄が学んだ、インド仏教の最高学府とされた僧院は？","a":"ナーランダー僧院","d":["アジャンター石窟寺院","サーンチー","ボロブドゥール"],"x":"何千人もの僧が学ぶ、今でいう大学のような場所だったんだ。図書館が焼かれたときは、何か月も燃え続けたと伝えられているよ。","v":"IND"},
  {"id":"IND-Q04-026","ch":2,"q":"ヴァルダナ朝のころに盛んになった、神への絶対的な帰依を説く信仰運動は？","a":"バクティ運動","d":["ウパニシャッド哲学","仏典結集","スーフィズム"],"x":"難しい儀式や学問より、神をひたすら愛すること。それで誰でも救われるという考え方だね。","v":"IND"},
  {"id":"CHN-Q01-001","ch":3,"q":"黄河中流域で栄え、彩陶を特色とする新石器文化は？","a":"仰韶文化","d":["竜山文化","良渚文化","三星堆文化"],"x":"名前は最初に遺跡が見つかった河南省の村から取っているんだ。見つけたのはスウェーデンの地質学者だよ。","v":"CHN"},
  {"id":"CHN-Q01-002","ch":3,"q":"仰韶文化の人々が黄河流域で栽培した、乾燥に強い穀物は？","a":"粟","d":["稲","小麦","大豆"],"x":"黄土の地は雨が少ないから、乾燥に強い粟や黍が向いていたんだ。小麦が広まるのはずっとあとだよ。","v":"CHN"},

  {"id":"CHN-Q01-004","ch":3,"q":"仰韶文化を代表する、赤地に黒などで文様を描いた土器は？","a":"彩陶","d":["黒陶","灰陶","白陶"],"x":"模様は鮮やかだけど、焼く温度が低いから分厚くて割れやすかったんだ。","v":"CHN"},
  {"id":"CHN-Q01-005","ch":3,"q":"黄河下流域で栄え、黒陶を特色とする新石器文化は？","a":"竜山文化","d":["仰韶文化","河姆渡文化","三星堆文化"],"x":"竜山文化のころには、村のまわりに土の壁を築くようになるんだ。争いが増えてきた証拠だね。","v":"CHN"},
  {"id":"CHN-Q01-006","ch":3,"q":"竜山文化を代表する、高温で焼かれた薄くて硬い黒色の土器は？","a":"黒陶","d":["彩陶","白陶","唐三彩"],"x":"殻のように薄いから「卵殻黒陶」とも呼ばれるんだ。厚さ1ミリもないものがあるよ。","v":"CHN"},
  {"id":"CHN-Q01-007","ch":3,"q":"長江下流域の良渚遺跡や河姆渡遺跡で痕跡が見つかった農業は？","a":"稲作","d":["畑作","遊牧","焼畑"],"x":"河姆渡遺跡では、7000年くらい前の炭になった米が大量に見つかっているんだ。","v":"CHN"},

  {"id":"CHN-Q01-009","ch":3,"q":"長江下流域で、高床式の建物跡や炭化した米が見つかった遺跡は？","a":"河姆渡遺跡","d":["良渚遺跡","竜山遺跡","殷墟"],"x":"水辺の湿地だから、地面から床を浮かせた家に住んでいたんだ。","v":"CHN"},
  {"id":"CHN-Q01-010","ch":3,"q":"殷や周の時代に各地にあった、土壁で囲まれた集落を何という？","a":"邑","d":["ポリス","ノモス","郷"],"x":"「むら」とも読むよ。大きな邑が小さな邑を従えて、その頂点に立ったのが王なんだ。","v":"CHN"},

  {"id":"CHN-Q01-012","ch":3,"q":"殷の都の跡とされ、甲骨文字が大量に出土した遺跡は？","a":"殷墟","d":["河姆渡","良渚","仰韶"],"x":"薬として売られていた「竜骨」に文字が刻まれているのに、ある学者が気づいたのが発見のきっかけなんだ。","v":"CHN"},
  {"id":"CHN-Q01-013","ch":3,"q":"殷の王が亀の甲羅や獣の骨を焼いて行ったことは？","a":"占い","d":["裁判","徴税","暦づくり"],"x":"骨を焼いてできたひび割れの形で、吉か凶かを読んだんだ。その結果を骨に刻んだのが甲骨文字だよ。","v":"CHN"},
  {"id":"CHN-Q01-014","ch":3,"q":"殷を滅ぼした王朝は？","a":"周","d":["秦","夏","漢"],"x":"殷の最後の王の紂王は、酒の池と肉の林で宴会をしたと言われているんだ。ただし、勝った側が書いた話だからね。","v":"CHN"},
  {"id":"CHN-Q01-015","ch":3,"q":"天命が別の徳ある者に改まり王朝が交代する、という中国の考え方は？","a":"易姓革命","d":["尊王攘夷","中華思想","天人合一"],"x":"王の姓が易わり、天命が革まる。だから「易姓革命」なんだ。","v":"CHN"},
  {"id":"CHN-Q01-016","ch":3,"q":"易姓革命のうち、皇帝が有徳者に位を譲る平和的な王朝交代は？","a":"禅譲","d":["放伐","簒奪","世襲"],"x":"伝説の聖王、堯から舜、舜から禹への位の受け渡しがお手本とされたんだ。","v":"CHN"},
  {"id":"CHN-Q01-017","ch":3,"q":"易姓革命のうち、武力によって前の王を倒す王朝交代は？","a":"放伐","d":["禅譲","世襲","選挙"],"x":"殷の湯王が夏を倒したのと、周の武王が殷を倒したのが代表だね。","v":"CHN"},
  {"id":"CHN-Q01-018","ch":3,"q":"周の王が一族や功臣に封土を与え、軍役や貢納を課した統治制度は？","a":"封建制度","d":["郡県制","郡国制","均田制"],"x":"ヨーロッパの封建制と違って、周のつながりは血縁が中心なんだ。","v":"CHN"},
  {"id":"CHN-Q01-019","ch":3,"q":"周の封建制で、諸侯が封土を分け与えた家臣の身分は？","a":"卿・大夫・士","d":["諸侯・王・皇帝","士・農・工・商","貴族・平民・奴隷"],"x":"この「士」から、のちの学者や役人の層が生まれてくるんだ。孔子もこの「士」の出身だよ。","v":"CHN"},
  {"id":"CHN-Q01-020","ch":3,"q":"周の宗族（父系の親族集団）で守られた、嫡長子相続などの規範は？","a":"宗法","d":["礼","律","令"],"x":"同じ姓どうしは結婚しない、という決まりもあったんだ。","v":"CHN"},
  {"id":"CHN-Q01-021","ch":3,"q":"周で、身分の上下関係を律する規範を何という？","a":"礼","d":["宗法","法","仁"],"x":"のちに孔子が、この周の礼を理想として説くことになるよ。","v":"CHN"},
  {"id":"CHN-Q01-022","ch":3,"q":"周の最初の都で、のちの長安の近くにあった都市は？","a":"鎬京","d":["洛邑","咸陽","臨淄"],"x":"ここに都があった時代を「西周」と呼ぶよ。","v":"CHN"},
  {"id":"CHN-Q01-023","ch":3,"q":"前8世紀に周が都を移した、のちの洛陽は？","a":"洛邑","d":["鎬京","咸陽","邯鄲"],"x":"西北の異民族、犬戎に攻められて都を移したんだ。ここからが「東周」だよ。","v":"CHN"},

  {"id":"CHN-Q02-003","ch":3,"q":"斉の桓公・晋の文公など、春秋時代の代表的な覇者を何と総称する？","a":"春秋の五覇","d":["戦国の七雄","竹林の七賢","唐宋八大家"],"x":"誰を5人に数えるかは、本によって違うんだ。","v":"CHN"},
  {"id":"CHN-Q02-004","ch":3,"q":"呉と越の争いから生まれた、「仲の悪い者どうしが協力する」という意味の故事成語は？","a":"呉越同舟","d":["臥薪嘗胆","四面楚歌","酒池肉林"],"x":"呉と越の人でも、同じ舟に乗って嵐にあえば助け合う。そういう話なんだ。","v":"CHN"},
  {"id":"CHN-Q02-005","ch":3,"q":"呉王夫差と越王勾践の争いから生まれた、「目的のために苦労に耐える」という意味の故事成語は？","a":"臥薪嘗胆","d":["呉越同舟","四面楚歌","先従隗始"],"x":"薪の上に寝て仇を忘れず、苦い肝をなめて屈辱を忘れない。どちらも、執念の話だね。","v":"CHN"},

  {"id":"CHN-Q02-009","ch":3,"q":"戦国時代、韓・魏・趙などで使われた、農具の鋤の形をした青銅貨幣は？","a":"布銭","d":["刀銭","円銭","蟻鼻銭"],"x":"「布」は農具の「鎛（はく）」と音が通じるからこう呼ばれた、という説があるんだ。","v":"CHN"},
