  {"id":"GRM-Q01-010","ch":5,"q":"ポリスで、参政権を持ち、武器を自分で用意して戦った上層の身分は？","a":"貴族","d":["平民","無産市民","奴隷"],"x":"初めのころは、馬や武具を買えるお金持ちしか戦えなかった。だから政治も貴族が独占していたんだ。","v":"GRM"},
  {"id":"GRM-Q01-011","ch":5,"q":"ポリスの市民のうち、貴族に従属しない中小農民などの身分は？","a":"平民","d":["貴族","奴隷","在留外人"],"x":"平民が豊かになって自分で武器を買えるようになると、話が変わってくるんだ。","v":"GRM"},
  {"id":"GRM-Q01-012","ch":5,"q":"ポリスの市民のうち、財産を持たない貧しい人々を何という？","a":"無産市民","d":["平民","奴隷","騎士"],"x":"財産がないから、高い武具も買えなかったんだ。でもペルシア戦争で、別の形で活躍することになるよ。","v":"GRM"},
  {"id":"GRM-Q01-013","ch":5,"q":"ポリスで、人格を認められず売買の対象とされた人々は？","a":"奴隷","d":["無産市民","在留外人","ペリオイコイ"],"x":"戦争の捕虜や、借金を返せなくなった人が奴隷になったんだ。アテネでは、人口の3分の1くらいが奴隷だったとも言われているよ。","v":"GRM"},
  {"id":"GRM-Q01-014","ch":5,"q":"小アジアの国リディアが発明し、平民の武器自弁を進めたものは？","a":"金属貨幣","d":["鉄器","アルファベット","パピルス"],"x":"商売で豊かになった平民が、お金で武具を買えるようになったんだ。","v":"GRM"},
  {"id":"GRM-Q01-015","ch":5,"q":"平民が武器を自弁して参加し、ファランクス（密集隊形）で戦った兵を何という？","a":"重装歩兵","d":["騎兵","軽装歩兵","三段櫂船の漕ぎ手"],"x":"盾を並べて隣の人を守りながら進むんだ。一人が逃げると陣形が崩れるから、みんな対等な仲間という意識が生まれたよ。","v":"GRM"},
  {"id":"GRM-Q02-001","ch":5,"q":"イオニア人が建て、民主政が発展したポリスは？","a":"アテネ","d":["スパルタ","テーベ","コリントス"],"x":"守護神は知恵の女神アテナ。ポリスの名前も、女神から来ているんだ。","v":"GRM"},
  {"id":"GRM-Q02-002","ch":5,"q":"前7世紀、アテネで慣習法を成文化したのは？","a":"ドラコン","d":["ソロン","クレイステネス","ペリクレス"],"x":"ほとんどの罪が死刑というほど厳しい法だったんだ。英語の「ドラコニアン（過酷な）」の語源だよ。","v":"GRM"},
  {"id":"GRM-Q02-003","ch":5,"q":"前6世紀、アテネで財産政治や債務奴隷の禁止を行った改革者は？","a":"ソロン","d":["ドラコン","ペイシストラトス","クレイステネス"],"x":"借金を帳消しにする改革をやったから、貴族からも平民からも文句を言われたんだ。改革のあとは、10年ほど外国を旅していたよ。","v":"GRM"},
  {"id":"GRM-Q02-004","ch":5,"q":"ソロンが行った、財産額によって市民の参政権を定める政治は？","a":"財産政治","d":["僭主政治","陶片追放","貴族政治"],"x":"生まれではなく、財産で権利を決める。少しずつだけど、平民にも道が開けたんだ。","v":"GRM"},
  {"id":"GRM-Q02-005","ch":5,"q":"ソロンが国防力の低下を防ぐため禁止した、借金のために奴隷となることを何という？","a":"債務奴隷","d":["農奴","ヘイロータイ","コロヌス"],"x":"借金のかたに身を売る人が増えると、戦える市民が減ってしまう。だから禁止したんだ。","v":"GRM"},
  {"id":"GRM-Q02-006","ch":5,"q":"平民の支持を得て、非合法に独裁的な権力を握ったアテネの人物は？","a":"ペイシストラトス","d":["ソロン","ペリクレス","テミストクレス"],"x":"自分で自分を傷つけて「敵に襲われた」と訴え、護衛をつけてもらって権力を握ったと言われているんだ。","v":"GRM"},
  {"id":"GRM-Q02-007","ch":5,"q":"ペイシストラトスのように、非合法に権力を握って独裁する政治を何という？","a":"僭主政治","d":["民主政治","貴族政治","寡頭政治"],"x":"僭主は「タイラント」とも言うよ。英語では「暴君」の意味になったんだ。","v":"GRM"},
  {"id":"GRM-Q02-008","ch":5,"q":"前508年ごろからアテネで改革を行い、陶片追放の制度をつくったのは？","a":"クレイステネス","d":["ソロン","ペリクレス","ドラコン"],"x":"血のつながりで分かれていた部族を、住んでいる地域で分け直したんだ。","v":"GRM"},
  {"id":"GRM-Q02-009","ch":5,"q":"独裁者になりそうな人物の名を陶片に書いて投票し、国外追放した制度は？","a":"オストラシズム（陶片追放）","d":["僭主政治","民会","財産政治"],"x":"名前を書いた陶片が、今もたくさん見つかっているんだ。同じ筆跡のものがまとまって出てきて、組織票だったんじゃないかと言われているよ。","v":"GRM"},
  {"id":"GRM-Q03-001","ch":5,"q":"前500年から、ギリシアのポリスとアケメネス朝ペルシアとの間で戦われた戦争は？","a":"ペルシア戦争","d":["ペロポネソス戦争","ポエニ戦争","トロヤ戦争"],"x":"小アジアのギリシア人の町ミレトスの反乱が、きっかけだったんだ。","v":"GRM"},
  {"id":"GRM-Q03-002","ch":5,"q":"ペルシア戦争でギリシアと戦った国は？","a":"アケメネス朝ペルシア","d":["ササン朝ペルシア","パルティア","セレウコス朝シリア"],"x":"大きな帝国が、小さなポリスの連合に負けたんだ。ギリシア人にとっては、ずっと語り継がれる誇りになったよ。","v":"GRM"},
  {"id":"GRM-Q03-003","ch":5,"q":"ペルシア戦争を物語風に記録した歴史家は？","a":"ヘロドトス","d":["トゥキディデス","ホメロス","ポリビオス"],"x":"「歴史の父」と呼ばれているよ。旅先で聞いた面白い話も、どんどん書き込んでいるんだ。","v":"GRM"},
  {"id":"GRM-Q03-004","ch":5,"q":"前490年、アテネの将軍ミルティアデスがペルシア軍を破った戦いは？","a":"マラトンの戦い","d":["サラミスの海戦","プラタイアの戦い","テルモピレーの戦い"],"x":"勝利を知らせるために、兵士がアテネまで走りきって息絶えた、という伝説があるんだ。マラソンの起源だね。","v":"GRM"},
  {"id":"GRM-Q03-005","ch":5,"q":"前480年、アテネの将軍テミストクレスがペルシア艦隊を破った戦いは？","a":"サラミスの海戦","d":["マラトンの戦い","アクティウムの海戦","イッソスの戦い"],"x":"せまい湾にペルシアの大艦隊を誘い込んで、身動きをとれなくしたんだ。","v":"GRM"},
  {"id":"GRM-Q03-006","ch":5,"q":"サラミスの海戦でアテネ艦隊を率いた将軍は？","a":"テミストクレス","d":["ミルティアデス","ペリクレス","レオニダス"],"x":"ところが、のちに陶片追放でアテネを追われてしまってね。最後は、かつての敵ペルシアに身を寄せたんだ。","v":"GRM"},
  {"id":"GRM-Q03-007","ch":5,"q":"サラミスの海戦で、三段櫂船の漕ぎ手として活躍した人々は？","a":"無産市民","d":["貴族","奴隷","重装歩兵"],"x":"武具が買えなくても、船は漕げる。この活躍で、無産市民も政治に参加するようになるんだ。","v":"GRM"},
  {"id":"GRM-Q03-008","ch":5,"q":"前479年、ギリシア軍が陸上でペルシア軍を破り、ペルシア戦争の勝利を決めた戦いは？","a":"プラタイアの戦い","d":["マラトンの戦い","カイロネイアの戦い","サラミスの海戦"],"x":"アテネとスパルタが力を合わせた戦いだよ。この二つのポリスが仲良くしていたのは、このころまでなんだ。","v":"GRM"},
  {"id":"GRM-Q03-009","ch":5,"q":"スパルタで、市民の十倍ほどいたとされる、農業に従事させられた隷属民は？","a":"ヘイロータイ","d":["ペリオイコイ","メトイコイ","スパルティアタイ"],"x":"反乱を恐れたスパルタは、市民全員を兵士にして見張ったんだ。","v":"GRM"},
  {"id":"GRM-Q03-010","ch":5,"q":"スパルタで、多数の隷属民を支配するために行われた軍国主義的な制度は？","a":"リュクルゴスの制","d":["陶片追放","財産政治","リキニウス＝セクスティウス法"],"x":"男の子は7歳で親元を離れて、集団で訓練を受けたんだ。「スパルタ教育」の語源だね。","v":"GRM"},
  {"id":"GRM-Q03-011","ch":5,"q":"ペルシア戦争後、ペルシアの再来に備えてアテネを盟主に結成された同盟は？","a":"デロス同盟","d":["ペロポネソス同盟","コリントス同盟","ハンザ同盟"],"x":"同盟の金庫は、最初はデロス島に置かれていたんだ。でもアテネが自分の町に移して、使い込んでしまったよ。","v":"GRM"},
  {"id":"GRM-Q03-012","ch":5,"q":"デロス同盟の資金も使ってアテネのアクロポリスに建てられた、ドーリア式の神殿は？","a":"パルテノン神殿","d":["エレクテイオン神殿","ゼウス神殿","パンテオン"],"x":"あとの時代には教会になり、モスクになり、火薬庫になった。そして17世紀に、その火薬が爆発して壊れてしまったんだ。","v":"GRM"},
  {"id":"GRM-Q03-013","ch":5,"q":"前5世紀、アテネの民主政を完成させた指導者は？","a":"ペリクレス","d":["ソロン","クレイステネス","テミストクレス"],"x":"頭の形が長かったから、肖像はいつも兜をかぶった姿で作らせたと言われているんだ。","v":"GRM"},
  {"id":"GRM-Q03-014","ch":5,"q":"ペリクレスの時代のアテネで、18歳以上の成年男性市民全員が参加して国の方針を決めた議会は？","a":"民会","d":["元老院","平民会","三部会"],"x":"代表を選ぶのではなく、市民が自分で直接参加する。ただし女性や奴隷、外国人には参政権がなかったんだ。","v":"GRM"},
  {"id":"GRM-Q03-015","ch":5,"q":"アテネ民主政で、多くの官職が抽選で選ばれる中、例外として選挙で選ばれた職は？","a":"将軍職","d":["陪審員","評議員","執政官"],"x":"戦争の指揮だけは、くじ引きで決めるわけにいかなかったんだね。ペリクレスもこの将軍職に、15年続けて選ばれているよ。","v":"GRM"},
  {"id":"GRM-Q03-016","ch":5,"q":"アテネ民主政のもとで現れた、弁論術を教える職業教師を何という？","a":"ソフィスト","d":["ストア派","エピクロス派","ウラマー"],"x":"お金を取って教えたから、ソクラテスやプラトンには嫌われたんだ。","v":"GRM"},
  {"id":"GRM-Q03-017","ch":5,"q":"「万物の尺度は人間」と説いたソフィストは？","a":"プロタゴラス","d":["ソクラテス","タレス","ゼノン"],"x":"正しさは人それぞれで違う、という考えだね。","v":"GRM"},
  {"id":"GRM-Q04-001","ch":5,"q":"スパルタを盟主とし、反アテネのポリスが結んだ同盟は？","a":"ペロポネソス同盟","d":["デロス同盟","コリントス同盟","ラテン同盟"],"x":"スパルタのあるペロポネソス半島から取った名前なんだ。","v":"GRM"},
  {"id":"GRM-Q04-002","ch":5,"q":"アテネを中心とするデロス同盟と、スパルタを中心とするペロポネソス同盟の戦争は？","a":"ペロポネソス戦争","d":["ペルシア戦争","ポエニ戦争","トロヤ戦争"],"x":"戦争中、アテネでは疫病がはやって、ペリクレスもそれで亡くなったんだ。","v":"GRM"},
  {"id":"GRM-Q04-003","ch":5,"q":"ペロポネソス戦争を実証的・批判的に記録した歴史家は？","a":"トゥキディデス","d":["ヘロドトス","リウィウス","プルタルコス"],"x":"自分もアテネの将軍として戦ったんだ。作戦に失敗して追放されて、そのおかげで両方の陣営の話を聞けたらしいよ。","v":"GRM"},
  {"id":"GRM-Q04-004","ch":5,"q":"ペロポネソス戦争のころ、『女の平和』で戦争を風刺した喜劇作家は？","a":"アリストファネス","d":["ソフォクレス","アイスキュロス","エウリピデス"],"x":"女たちが「戦争をやめるまで夫を寝室に入れない」とストライキを起こす話なんだ。","v":"GRM"},
  {"id":"GRM-Q04-005","ch":5,"q":"前338年、マケドニアのフィリッポス2世がアテネ・テーベの連合軍を破った戦いは？","a":"カイロネイアの戦い","d":["イッソスの戦い","プラタイアの戦い","ピュドナの戦い"],"x":"この戦いで、18歳のアレクサンドロスが騎兵隊を率いて活躍しているんだ。","v":"GRM"},
  {"id":"GRM-Q04-006","ch":5,"q":"カイロネイアの戦いのあと、マケドニアがスパルタを除くギリシアのポリスをまとめた同盟は？","a":"コリントス同盟","d":["デロス同盟","ペロポネソス同盟","ヘラス同盟会議"],"x":"ポリスどうしの争いを禁じて、マケドニアの言うことを聞かせるしくみだったんだ。","v":"GRM"},
  {"id":"GRM-Q04-007","ch":5,"q":"アレクサンドロス大王の東方遠征から、プトレマイオス朝の滅亡までの約300年間を何という？","a":"ヘレニズム時代","d":["古典期","アルカイック期","パクス＝ロマーナ"],"x":"ギリシア人を表す「ヘレネス」から来た言葉なんだ。ギリシア風の文化が、オリエントに広がった時代だね。","v":"GRM"},
  {"id":"GRM-Q04-008","ch":5,"q":"東方遠征でアケメネス朝を滅ぼし、インダス川に至る大帝国を築いたマケドニアの王は？","a":"アレクサンドロス大王","d":["フィリッポス2世","ダレイオス3世","ペリクレス"],"x":"20歳で王になって、32歳で亡くなっているんだ。あっという間の一生だね。","v":"GRM"},
  {"id":"GRM-Q04-009","ch":5,"q":"アレクサンドロス大王の家庭教師を務めた哲学者は？","a":"アリストテレス","d":["プラトン","ソクラテス","ゼノン"],"x":"大王は遠征先でも、珍しい動物や植物を見つけると、先生に送っていたと言われているよ。","v":"GRM"},
  {"id":"GRM-Q04-010","ch":5,"q":"前334年にアレクサンドロス大王が始めた、アケメネス朝ペルシアへの遠征は？","a":"東方遠征","d":["西方遠征","ガリア遠征","十字軍"],"x":"父のフィリッポス2世がやろうとしていたことを、引き継いだんだ。","v":"GRM"},
  {"id":"GRM-Q04-011","ch":5,"q":"アレクサンドロス大王が征服地の各地に建設し、自分の名をつけた都市は？","a":"アレクサンドリア","d":["アンティオキア","セレウキア","ビザンティウム"],"x":"70近くつくったと言われているんだ。いちばん有名なのは、エジプトのアレクサンドリアだね。","v":"GRM"},
  {"id":"GRM-Q04-012","ch":5,"q":"アレクサンドロス大王がダレイオス3世を破り、シリアを占領した戦いは？","a":"イッソスの戦い","d":["アルベラの戦い","カイロネイアの戦い","マラトンの戦い"],"x":"ポンペイで見つかったモザイク画に、この戦いが描かれているんだ。逃げるダレイオス3世の顔が、とても印象的だよ。","v":"GRM"},
  {"id":"GRM-Q04-013","ch":5,"q":"アレクサンドロス大王がダレイオス3世を決定的に破った、メソポタミア北部での戦いは？","a":"アルベラの戦い","d":["イッソスの戦い","プラタイアの戦い","ピュドナの戦い"],"x":"ガウガメラの戦いとも呼ばれるよ。逃げたダレイオス3世は、部下に殺されてしまったんだ。","v":"GRM"},
  {"id":"GRM-Q04-014","ch":5,"q":"アレクサンドロス大王の死後、後継者たちが帝国をめぐって争った戦争は？","a":"ディアドコイ戦争","d":["ペロポネソス戦争","ポエニ戦争","同盟市戦争"],"x":"ディアドコイは「後継者たち」という意味なんだ。大王は後継ぎを誰とも決めずに、亡くなってしまったよ。","v":"GRM"},
  {"id":"GRM-Q04-015","ch":5,"q":"大王の死後に分立した3国のうち、ギリシア・マケドニアを支配した国は？","a":"アンティゴノス朝マケドニア","d":["セレウコス朝シリア","プトレマイオス朝エジプト","バクトリア"],"x":"のちにローマに敗れて、属州にされてしまったよ。","v":"GRM"},
  {"id":"GRM-Q04-016","ch":5,"q":"大王の死後に分立した3国のうち、最大の領土を持ち、アンティオキアなどを都とした国は？","a":"セレウコス朝シリア","d":["アンティゴノス朝マケドニア","プトレマイオス朝エジプト","パルティア"],"x":"広すぎて、東のほうから次々に独立されてしまったんだ。","v":"GRM"},
  {"id":"GRM-Q04-017","ch":5,"q":"大王の死後に分立した3国のうち、アレクサンドリアを都とし、クレオパトラの死で滅んだ国は？","a":"プトレマイオス朝エジプト","d":["セレウコス朝シリア","アンティゴノス朝マケドニア","クシュ王国"],"x":"王家はマケドニア出身のギリシア人なんだ。エジプトの言葉を話せた王は、クレオパトラが初めてだったと言われているよ。","v":"GRM"},
  {"id":"GRM-Q05-001","ch":5,"q":"トロヤ戦争を描いた叙事詩『イリアス』『オデュッセイア』の作者とされるのは？","a":"ホメロス","d":["ヘロドトス","ソフォクレス","サッフォー"],"x":"目が見えない吟遊詩人だったと伝えられているんだ。本当に一人の人物だったのかも、わかっていないよ。","v":"GRM"},
  {"id":"GRM-Q05-002","ch":5,"q":"ペルシア戦争に実際に参加した、三大悲劇詩人の一人は？","a":"アイスキュロス","d":["ソフォクレス","エウリピデス","アリストファネス"],"x":"自分の墓碑には、作品のことは書かずに、マラトンで戦ったことだけを書かせたんだ。","v":"GRM"},
  {"id":"GRM-Q05-003","ch":5,"q":"アイスキュロスが書いた、トロヤ戦争から帰った王が妻に殺される悲劇は？","a":"『アガメムノン』","d":["『オイディプス王』","『メデイア』","『女の平和』"],"x":"娘を生贄にされた妻の恨みが、帰ってきた夫に向かうんだ。","v":"GRM"},
  {"id":"GRM-Q05-004","ch":5,"q":"『オイディプス王』を書いた三大悲劇詩人は？","a":"ソフォクレス","d":["アイスキュロス","エウリピデス","ホメロス"],"x":"90歳近くまで生きて、120以上の作品を書いたんだ。今まで残っているのは7作品だけだけどね。","v":"GRM"},
  {"id":"GRM-Q05-005","ch":5,"q":"ソフォクレスが書いた、知らずに父を殺し母と結婚した王の悲劇は？","a":"『オイディプス王』","d":["『アガメムノン』","『メデイア』","『イリアス』"],"x":"運命から逃げようとした行動が、かえって運命どおりの結果を招いてしまう。逃げられないものも、あるんだよ。","v":"GRM"},
  {"id":"GRM-Q05-006","ch":5,"q":"『メデイア』を書いた三大悲劇詩人は？","a":"エウリピデス","d":["ソフォクレス","アイスキュロス","アリストファネス"],"x":"神ではなく、人間の心の動きを描いた作家なんだ。","v":"GRM"},
  {"id":"GRM-Q05-007","ch":5,"q":"エウリピデスが書いた、夫に裏切られた王女の復讐を描いた悲劇は？","a":"『メデイア』","d":["『オイディプス王』","『アガメムノン』","『女の平和』"],"x":"夫イアソンへの復讐のために、自分の子どもまで手にかけてしまうんだ。","v":"GRM"},
  {"id":"GRM-Q05-008","ch":5,"q":"ソクラテスと議論を重ねた、アテネで活躍した喜劇作家は？","a":"アリストファネス","d":["エウリピデス","ソフォクレス","ヘロドトス"],"x":"喜劇『雲』でソクラテスをからかっているんだ。ソクラテス本人も劇を見に来て、客席で立ち上がってみせたと言われているよ。","v":"GRM"},
  {"id":"GRM-Q05-009","ch":5,"q":"「医学の父」と呼ばれる古代ギリシアの医者は？","a":"ヒポクラテス","d":["ガレノス","イブン＝シーナー","アルキメデス"],"x":"病気は神のたたりではなく、自然の原因で起こると考えたんだ。医者の誓いの「ヒポクラテスの誓い」は、今も医学部で読まれているよ。","v":"GRM"},
  {"id":"GRM-Q05-010","ch":5,"q":"「万物の根源は水」と考えた、イオニア自然哲学の祖は？","a":"タレス","d":["ピタゴラス","ヘラクレイトス","デモクリトス"],"x":"星を見ながら歩いていて、井戸に落ちたという話が残っているんだ。でもオリーブの豊作を予想して大もうけしたこともあるよ。","v":"GRM"},
  {"id":"GRM-Q05-011","ch":5,"q":"「万物の根源は数」と考え、直角三角形の定理で知られる哲学者は？","a":"ピタゴラス","d":["タレス","エウクレイデス","アルキメデス"],"x":"弟子たちと秘密の教団をつくっていたんだ。豆を食べてはいけない、という不思議な決まりもあったよ。","v":"GRM"},
  {"id":"GRM-Q05-012","ch":5,"q":"「万物は流転する」と説き、万物の根源を火とした哲学者は？","a":"ヘラクレイトス","d":["タレス","デモクリトス","ピタゴラス"],"x":"「同じ川に二度入ることはできない」とも言っているんだ。川の水は、いつも入れかわっているからね。","v":"GRM"},
  {"id":"GRM-Q05-013","ch":5,"q":"万物の根源を原子（アトム）とした哲学者は？","a":"デモクリトス","d":["タレス","ヘラクレイトス","アナクサゴラス"],"x":"これ以上分けられない小さな粒、という考え方なんだ。2000年以上も前に、よく思いついたよ。","v":"GRM"},
  {"id":"GRM-Q05-014","ch":5,"q":"「無知の知」を説き、対話によって真理を探究した哲学者は？","a":"ソクラテス","d":["プラトン","アリストテレス","プロタゴラス"],"x":"若者を惑わせたとして死刑の判決を受けたんだ。逃げることもできたのに、法に従って毒杯を飲んだよ。","v":"GRM"},
  {"id":"GRM-Q05-015","ch":5,"q":"ソクラテスの弟子で、イデア論を説いた哲学者は？","a":"プラトン","d":["アリストテレス","ゼノン","エピクロス"],"x":"もとはレスリングの選手で、「プラトン（肩幅の広い）」はあだ名だったと言われているんだ。","v":"GRM"},
  {"id":"GRM-Q05-016","ch":5,"q":"プラトンが説いた、事物の完全な原型が別の世界に存在するという考えは？","a":"イデア論","d":["原子論","無知の知","世界市民主義"],"x":"この世のものは、みんな本物の影にすぎない。プラトンはそう考えたんだ。","v":"GRM"},
  {"id":"GRM-Q05-017","ch":5,"q":"プラトンの弟子で、学問を体系化し「万学の祖」と呼ばれるのは？","a":"アリストテレス","d":["ソクラテス","プラトン","アルキメデス"],"x":"論理学も、生物学も、政治学も、詩学も書いたんだ。千年以上あとの中世ヨーロッパでも、「哲学者」と言えば彼のことだったよ。","v":"GRM"},
  {"id":"GRM-Q05-018","ch":5,"q":"パルテノン神殿に代表される、太い柱で荘厳な印象を与えるギリシアの建築様式は？","a":"ドーリア式","d":["イオニア式","コリント式","ゴシック式"],"x":"柱の上の飾りがいちばんシンプルな様式なんだ。","v":"GRM"},
  {"id":"GRM-Q06-001","ch":5,"q":"ヘレニズム時代に現れた、民族やポリスの枠にとらわれない考え方は？","a":"世界市民主義","d":["選民思想","中華思想","愛国主義"],"x":"ポリスが崩れて、人々は「どこの町の人か」より「一人の人間としてどう生きるか」を考えるようになったんだ。","v":"GRM"},
  {"id":"GRM-Q06-002","ch":5,"q":"ゼノンが開いた、理性で欲望を抑える禁欲主義の学派は？","a":"ストア派","d":["エピクロス派","ソフィスト","イオニア学派"],"x":"アテネの「彩色された柱廊（ストア）」で教えたから、この名前なんだ。英語の「ストイック」の語源だよ。","v":"GRM"},
  {"id":"GRM-Q06-003","ch":5,"q":"心の平静を最高の快楽とする学派は？","a":"エピクロス派","d":["ストア派","ピタゴラス派","新プラトン主義"],"x":"「快楽主義」と言っても、パンと水があれば満足、というくらい質素な暮らしを勧めていたんだ。","v":"GRM"},
  {"id":"GRM-Q06-004","ch":5,"q":"精神的な快楽（心の平静）を最高の善とし、「隠れて生きよ」と説いたヘレニズムの哲学者は？","a":"エピクロス","d":["ゼノン","デモクリトス","ディオゲネス"],"x":"学園は「庭園」と呼ばれていて、女性や奴隷も学ぶことができたんだ。","v":"GRM"},
  {"id":"GRM-Q06-005","ch":5,"q":"アレクサンドリアに建てられた王立の研究所は？","a":"ムセイオン","d":["アカデメイア","リュケイオン","知恵の館"],"x":"「ミュージアム（博物館）」の語源なんだ。ここには、何十万巻もの本を集めた図書館もあったよ。","v":"GRM"},
  {"id":"GRM-Q06-006","ch":5,"q":"てこの原理や浮体の原理を発見した、シチリア出身の科学者は？","a":"アルキメデス","d":["エウクレイデス","エラトステネス","ピタゴラス"],"x":"お風呂で浮体の原理をひらめいて、裸のまま「わかった！（ヘウレーカ）」と叫んで町を走ったと言われているんだ。","v":"GRM"},
  {"id":"GRM-Q06-007","ch":5,"q":"平面幾何学を大成した、アレクサンドリアの数学者は？","a":"エウクレイデス","d":["アルキメデス","アリスタルコス","ピタゴラス"],"x":"王様に「もっと簡単に学ぶ方法はないか」と聞かれて、「幾何学に王道なし」と答えたんだ。","v":"GRM"},
  {"id":"GRM-Q07-001","ch":6,"q":"前550年にキュロス2世が建て、オリエントを統一したイランの王朝は？","a":"アケメネス朝ペルシア","d":["ササン朝ペルシア","パルティア","セレウコス朝"],"x":"征服した民の宗教や習慣を認める、寛容な支配で知られているんだ。","v":"GRM"},
  {"id":"GRM-Q07-002","ch":6,"q":"アケメネス朝の最盛期を築き、「王の道」を整備した王は？","a":"ダレイオス1世","d":["キュロス2世","クセルクセス1世","ダレイオス3世"],"x":"ベヒストゥーン碑文は、この王が自分の即位の正しさを訴えるために彫らせたものなんだ。","v":"GRM"},
  {"id":"GRM-Q07-003","ch":6,"q":"アケメネス朝で信仰された、善神と悪神の闘争を説く宗教は？","a":"ゾロアスター教","d":["マニ教","ユダヤ教","ミトラ教"],"x":"火を清らかなものとして大切にしたから「拝火教」とも呼ばれるよ。最後の審判の考え方は、キリスト教にも影響を与えたんだ。","v":"GRM"},
  {"id":"GRM-Q07-004","ch":6,"q":"アム川上流でギリシア人がセレウコス朝から独立して建てた国は？","a":"バクトリア","d":["パルティア","ソグディアナ","ガンダーラ"],"x":"ギリシア人の国が、中央アジアの奥にあったんだ。仏像が生まれるのにも、影響を与えたと言われているよ。","v":"GRM"},
  {"id":"GRM-Q07-005","ch":6,"q":"遊牧イラン人のアルサケスがセレウコス朝から独立して建てた国は？","a":"パルティア","d":["バクトリア","ササン朝","メディア"],"x":"中国では、建国者の名前から「安息」と呼ばれたんだ。馬で退くふりをして、振り向きざまに矢を放つ戦法が得意だったよ。","v":"GRM"},
  {"id":"GRM-Q07-006","ch":6,"q":"224年にパルティアを倒して建てられた、農耕イラン人の王朝は？","a":"ササン朝ペルシア","d":["アケメネス朝ペルシア","セレウコス朝","サーマーン朝"],"x":"アケメネス朝の後継者を名乗って、ゾロアスター教を国の宗教にしたんだ。","v":"GRM"},
  {"id":"GRM-Q07-007","ch":6,"q":"ササン朝で編纂された、ゾロアスター教の経典は？","a":"『アヴェスター』","d":["『リグ＝ヴェーダ』","『旧約聖書』","『マヌ法典』"],"x":"長い間、口で唱えて伝えられていた教えを、ようやく文字にまとめたんだ。","v":"GRM"},
  {"id":"GRM-Q07-008","ch":6,"q":"ササン朝で生まれた、ゾロアスター教・キリスト教・仏教を融合した宗教は？","a":"マニ教","d":["ゾロアスター教","ネストリウス派","ミトラ教"],"x":"開祖のマニは、ササン朝で処刑されてしまったんだ。でも教えは東西に広がって、ウイグルの国の宗教にもなったよ。","v":"GRM"},
  {"id":"GRM-Q07-009","ch":6,"q":"ローマの軍人皇帝ウァレリアヌスを捕虜にしたササン朝の王は？","a":"シャープール1世","d":["ホスロー1世","アルダシール1世","ダレイオス1世"],"x":"ローマの皇帝が敵の捕虜になったのは、これが初めてなんだ。王が皇帝の背中を踏み台にして馬に乗った、という話まで伝わっているよ。","v":"GRM"},
  {"id":"GRM-Q07-010","ch":6,"q":"突厥と結んでエフタルを滅ぼし、ビザンツ帝国のユスティニアヌス帝と争ったササン朝の王は？","a":"ホスロー1世","d":["シャープール1世","アルダシール1世","ホスロー2世"],"x":"この二つの大国の戦いが長引いたせいで、交易路はアラビア半島を回るようになった。それがイスラームの誕生につながっていくんだ。","v":"GRM"},
  {"id":"GRM-Q08-001","ch":6,"q":"前10世紀ごろ、ティベル川流域にローマを建てた人々は？","a":"ラテン人","d":["エトルリア人","ギリシア人","ケルト人"],"x":"伝説では、狼に育てられた双子のロムルスとレムスが建国したことになっているんだ。","v":"GRM"},
  {"id":"GRM-Q08-002","ch":6,"q":"ラテン人がティベル川流域に建てた都市国家は？","a":"ローマ","d":["カルタゴ","アテネ","ミラノ"],"x":"建国者ロムルスの名前から、ローマと呼ばれるようになったと伝えられているよ。","v":"GRM"},
  {"id":"GRM-Q08-003","ch":6,"q":"前6世紀までローマを支配していた、イタリア半島の先住民族は？","a":"エトルリア人","d":["ラテン人","ケルト人","フェニキア人"],"x":"アーチ造りの技術や剣闘士の見世物も、もとはエトルリア人の文化だったと言われているんだ。","v":"GRM"},
  {"id":"GRM-Q08-004","ch":6,"q":"共和政ローマで、古い家柄の裕福な貴族を何という？","a":"パトリキ","d":["プレブス","エクイテス","プロレタリイ"],"x":"「父たち」という意味の言葉なんだ。","v":"GRM"},
  {"id":"GRM-Q08-005","ch":6,"q":"共和政ローマで、中小自作農民や商工業者などの平民を何という？","a":"プレブス","d":["パトリキ","エクイテス","コロヌス"],"x":"兵士として戦う平民が増えるにつれて、政治への発言力も強くなっていくんだ。","v":"GRM"},
  {"id":"GRM-Q08-006","ch":6,"q":"共和政ローマで、貴族出身の終身議員で構成された最高機関は？","a":"元老院","d":["民会","平民会","護民官"],"x":"英語の「セナート（上院）」の語源なんだ。アメリカの上院も、この名前を使っているよ。","v":"GRM"},
  {"id":"GRM-Q08-007","ch":6,"q":"共和政ローマで、任期1年・定員2名の最高官職は？","a":"執政官（コンスル）","d":["独裁官（ディクタトル）","護民官","監察官"],"x":"2人にしたのは、1人に権力が集まるのを防ぐためだったんだ。おたがいに相手の決定を止めることもできたよ。","v":"GRM"},
  {"id":"GRM-Q08-008","ch":6,"q":"共和政ローマで、非常時に任期半年で選ばれた最高官職は？","a":"独裁官（ディクタトル）","d":["執政官（コンスル）","護民官","元首"],"x":"英語の「ディクテーター（独裁者）」の語源だよ。もとは国の非常時のための、期限つきの職だったんだ。","v":"GRM"},
  {"id":"GRM-Q08-009","ch":6,"q":"共和政ローマで、貴族と平民が政治的権利をめぐって争ったことを何という？","a":"身分闘争","d":["同盟市戦争","内乱の1世紀","叙任権闘争"],"x":"平民は、いざとなると町を出て山にこもったんだ。兵士がいなくなると困るから、貴族も譲るしかなかったよ。","v":"GRM"},
  {"id":"GRM-Q08-010","ch":6,"q":"前494年ごろ設置された、平民の権利を守るために元老院や執政官の決定を拒否できた官職は？","a":"護民官","d":["執政官","独裁官","監察官"],"x":"護民官の体は神聖なものとされて、傷つけた人は死刑になったんだ。","v":"GRM"},
  {"id":"GRM-Q08-011","ch":6,"q":"護民官の設置と同じころ成立した、平民だけで構成される議会は？","a":"平民会","d":["元老院","民会","三部会"],"x":"のちに、この平民会の決議が国の法になっていくんだ。","v":"GRM"},
  {"id":"GRM-Q08-012","ch":6,"q":"前451年ごろ制定された、ローマ最古の成文法は？","a":"十二表法","d":["ホルテンシウス法","リキニウス＝セクスティウス法","ローマ法大全"],"x":"12枚の板に刻んで、広場に掲げたんだ。法が書かれて誰でも読めるようになって、貴族が勝手に解釈できなくなったよ。","v":"GRM"},
  {"id":"GRM-Q08-013","ch":6,"q":"前367年に制定された、執政官の1人を平民から選び、公有地の占有を制限した法は？","a":"リキニウス＝セクスティウス法","d":["ホルテンシウス法","十二表法","カヌレイウス法"],"x":"二人の護民官の名前をとった法律なんだ。成立まで、10年近くもめたと言われているよ。","v":"GRM"},
  {"id":"GRM-Q08-014","ch":6,"q":"前287年に制定された、平民会の決議が元老院の承認なしに国法となる法は？","a":"ホルテンシウス法","d":["リキニウス＝セクスティウス法","十二表法","ユリウス法"],"x":"これで、200年続いた身分闘争が終わったんだ。","v":"GRM"},
  {"id":"GRM-Q08-015","ch":6,"q":"ローマが征服したイタリア半島の諸都市を、植民市・自治市・同盟市に分けて治めた統治法は？","a":"分割統治","d":["郡県制","羈縻政策","属州制"],"x":"待遇に差をつけて、まとまって反抗できないようにしたんだ。","v":"GRM"},
  {"id":"GRM-Q08-016","ch":6,"q":"ローマが最初に建設した軍道で、ローマからイタリア南部に通じる道は？","a":"アッピア街道","d":["王の道","絹の道","ハドリアヌスの長城"],"x":"前312年に工事が始まったんだ。石畳の道は今も一部が残っていて、歩くことができるよ。","v":"GRM"},
  {"id":"GRM-Q09-001","ch":6,"q":"前264年から3回にわたって戦われた、ローマとカルタゴの戦争は？","a":"ポエニ戦争","d":["ペロポネソス戦争","ペルシア戦争","同盟市戦争"],"x":"「ポエニ」はラテン語で「フェニキア人」という意味なんだ。カルタゴは、フェニキア人がつくった植民市だったからね。","v":"GRM"},
  {"id":"GRM-Q09-002","ch":6,"q":"象を連れてアルプスを越え、イタリアに侵入したカルタゴの将軍は？","a":"ハンニバル","d":["スキピオ","ポンペイウス","スパルタクス"],"x":"子どものころ、父の前で「一生ローマの敵であり続ける」と誓ったと言われているんだ。","v":"GRM"},
  {"id":"GRM-Q09-003","ch":6,"q":"ハンニバルがローマを攻めるとき、越えた山脈は？","a":"アルプス山脈","d":["ピレネー山脈","アペニン山脈","ウラル山脈"],"x":"雪の中を、象と兵士を連れて越えたんだ。象はほとんど死んでしまったと言われているよ。","v":"GRM"},
  {"id":"GRM-Q09-004","ch":6,"q":"ポエニ戦争の後、ローマが総督を派遣して支配したイタリア半島外の征服地は？","a":"属州","d":["同盟市","植民市","自治市"],"x":"最初の属州はシチリア島だよ。住民は重い税に苦しんだんだ。","v":"GRM"},
  {"id":"GRM-Q09-005","ch":6,"q":"ポエニ戦争のころ、属州の徴税請負などで富を得たローマの新興富裕層は？","a":"騎士（エクイテス）","d":["パトリキ","プレブス","無産市民"],"x":"もとは馬を持って騎兵として戦える人、という意味だったんだ。","v":"GRM"},
  {"id":"GRM-Q09-006","ch":6,"q":"ローマで、奴隷を使って経営された大土地所有制を何という？","a":"ラティフンディア","d":["コロナトゥス","荘園制","イクター制"],"x":"奴隷が作った安い穀物が出回って、中小の農民は暮らしていけなくなったんだ。","v":"GRM"},
  {"id":"GRM-Q09-007","ch":6,"q":"有力者が無産市民に提供した「パンとサーカス」のサーカスとは何か？","a":"剣闘士の見世物","d":["曲芸の見世物","戦車競走だけ","演劇"],"x":"今のサーカスとは違って、剣闘士どうしや猛獣と戦わせる命がけの見世物だったんだ。","v":"GRM"},
  {"id":"GRM-Q09-008","ch":6,"q":"剣闘士の見世物が行われた、ローマの円形闘技場は？","a":"コロッセウム","d":["パンテオン","フォルム","パルテノン神殿"],"x":"5万人も入れたと言われているんだ。水を張って、海戦の見世物をしたこともあるらしいよ。","v":"GRM"},
  {"id":"GRM-Q09-009","ch":6,"q":"前133年から、大土地所有を制限して自作農を再建しようとした護民官の兄弟は？","a":"グラックス兄弟","d":["スキピオ兄弟","ロムルスとレムス","ブルートゥス兄弟"],"x":"兄は反対派に殴り殺され、弟も追いつめられて命を落としたんだ。","v":"GRM"},
  {"id":"GRM-Q09-010","ch":6,"q":"無産市民を志願兵とする兵制改革を行った、平民派の指導者は？","a":"マリウス","d":["スラ","ポンペイウス","カエサル"],"x":"兵士は国ではなく、給料をくれる将軍に従うようになった。これが、内乱を長引かせることになるんだ。","v":"GRM"},
  {"id":"GRM-Q09-011","ch":6,"q":"マリウスと争った、閥族派の指導者は？","a":"スラ","d":["クラッスス","グラックス","キケロ"],"x":"政敵の名前を書き出して、殺してもいいと公示したんだ。何千人もの人が殺されたよ。","v":"GRM"},
  {"id":"GRM-Q09-012","ch":6,"q":"ローマ市民権を求めてイタリア半島の同盟市が起こした反乱は？","a":"同盟市戦争","d":["スパルタクスの反乱","ポエニ戦争","身分闘争"],"x":"反乱は鎮圧されたけど、結局イタリアの自由民全員に市民権が与えられることになったんだ。","v":"GRM"},
  {"id":"GRM-Q09-013","ch":6,"q":"前73年、剣闘士奴隷が起こした大反乱は？","a":"スパルタクスの反乱","d":["同盟市戦争","グラックス兄弟の改革","赤眉の乱"],"x":"一時は12万人もの奴隷が集まったと言われているんだ。鎮圧のあと、6000人がアッピア街道沿いに十字架にかけられたよ。","v":"GRM"},
  {"id":"GRM-Q09-014","ch":6,"q":"前60年に始まった、ポンペイウス・クラッスス・カエサルによる政治を何という？","a":"第1回三頭政治","d":["第2回三頭政治","元首政","専制君主政"],"x":"三人とも元老院とうまくいかなかったから、手を組んだんだ。","v":"GRM"},
  {"id":"GRM-Q09-015","ch":6,"q":"第1回三頭政治の一人で、スパルタクスの反乱を鎮圧し、セレウコス朝を滅ぼした将軍は？","a":"ポンペイウス","d":["クラッスス","カエサル","アントニウス"],"x":"カエサルの娘と結婚していたんだ。でも娘が亡くなると、二人の仲も壊れてしまったよ。","v":"GRM"},
  {"id":"GRM-Q09-016","ch":6,"q":"第1回三頭政治の一人で、ローマ一の大富豪とされ、パルティア遠征で戦死した人物は？","a":"クラッスス","d":["ポンペイウス","レピドゥス","スラ"],"x":"ローマの火事のとき、燃えている家を安く買いたたいて財産を増やしたと言われているんだ。","v":"GRM"},
  {"id":"GRM-Q09-017","ch":6,"q":"第1回三頭政治の一人で、ガリア遠征で名声を得た人物は？","a":"カエサル","d":["ポンペイウス","クラッスス","オクタウィアヌス"],"x":"遠征の記録『ガリア戦記』を自分で書いているんだ。自分のことを「彼」と三人称で書いているよ。","v":"GRM"},
  {"id":"GRM-Q09-018","ch":6,"q":"カエサルがルビコン川を渡るときに言ったとされる言葉は？","a":"賽は投げられた","d":["来た、見た、勝った","ブルートゥス、お前もか","全ての道はローマに通ず"],"x":"軍を連れてこの川を越えるのは、法律で禁じられていた。だからこれは、内戦の始まりの言葉なんだ。","v":"GRM"},
  {"id":"GRM-Q09-019","ch":6,"q":"カエサルがエジプトで出会い、恋仲になったプトレマイオス朝の女王は？","a":"クレオパトラ","d":["ネフェルティティ","ハトシェプスト","ゼノビア"],"x":"絨毯にくるまって、カエサルのもとに運び込ませたという話が有名なんだ。","v":"GRM"},
  {"id":"GRM-Q09-020","ch":6,"q":"カエサルが採用した、エジプトの太陽暦をもとにした暦は？","a":"ユリウス暦","d":["グレゴリウス暦","太陰暦","ヒジュラ暦"],"x":"英語の「ジュライ（7月）」は、カエサルの名前ユリウスから来ているんだ。","v":"GRM"},
  {"id":"GRM-Q09-021","ch":6,"q":"前44年、カエサルを暗殺した共和派の中心人物は？","a":"ブルートゥス","d":["アントニウス","オクタウィアヌス","ポンペイウス"],"x":"カエサルにかわいがられていた人なんだ。シェイクスピアの劇の「ブルータス、お前もか」が有名だね。","v":"GRM"},
  {"id":"GRM-Q10-001","ch":6,"q":"前43年に始まった、オクタウィアヌス・アントニウス・レピドゥスによる政治は？","a":"第2回三頭政治","d":["第1回三頭政治","元首政","四帝分治制"],"x":"第1回と違って、今度は法律で正式に認められた三頭政治だったんだ。","v":"GRM"},
  {"id":"GRM-Q10-002","ch":6,"q":"第2回三頭政治の一人で、カエサルの養子として遺言で後継者に指名されたのは？","a":"オクタウィアヌス","d":["アントニウス","レピドゥス","ブルートゥス"],"x":"カエサルが死んだとき、まだ18歳だったんだ。病弱だったけど、人を使うのがとてもうまかったよ。","v":"GRM"},
  {"id":"GRM-Q10-003","ch":6,"q":"第2回三頭政治の一人で、クレオパトラと結んだカエサルの部下は？","a":"アントニウス","d":["オクタウィアヌス","レピドゥス","クラッスス"],"x":"オクタウィアヌスの姉と結婚していたのに、クレオパトラのもとに走ったんだ。それがオクタウィアヌスに、戦争の口実を与えてしまったよ。","v":"GRM"},
  {"id":"GRM-Q10-004","ch":6,"q":"第2回三頭政治の一人で、のちに政争から離れたカエサル派の武将は？","a":"レピドゥス","d":["アントニウス","ブルートゥス","ポンペイウス"],"x":"三人の中では、いちばん目立たない人だね。最高神官の地位だけは、最後まで持ち続けたんだ。","v":"GRM"},
  {"id":"GRM-Q10-005","ch":6,"q":"前31年、オクタウィアヌスがアントニウスとクレオパトラの連合軍を破った戦いは？","a":"アクティウムの海戦","d":["サラミスの海戦","ザマの戦い","イッソスの戦い"],"x":"戦いの途中でクレオパトラの船が逃げ出して、アントニウスもそのあとを追ってしまったんだ。","v":"GRM"},
  {"id":"GRM-Q10-006","ch":6,"q":"アクティウムの海戦の翌年、クレオパトラの死によって滅んだ王朝は？","a":"プトレマイオス朝エジプト","d":["セレウコス朝シリア","アンティゴノス朝マケドニア","カルタゴ"],"x":"毒蛇に自分をかませて死んだ、と伝えられているんだ。","v":"GRM"},
  {"id":"GRM-Q10-007","ch":6,"q":"前27年、元老院がオクタウィアヌスに贈った「尊厳者」を意味する称号は？","a":"アウグストゥス","d":["プリンケプス","カエサル","インペラトル"],"x":"英語の「オーガスト（8月）」は、この称号から来ているんだ。","v":"GRM"},
  {"id":"GRM-Q10-008","ch":6,"q":"オクタウィアヌスが自ら名乗った「第一の市民」を意味する称号は？","a":"プリンケプス","d":["アウグストゥス","ディクタトル","コンスル"],"x":"「王になる気はない」というポーズだね。カエサルの失敗に、ちゃんと学んでいたんだ。","v":"GRM"},
  {"id":"GRM-Q10-009","ch":6,"q":"アウグストゥスが始めた、元老院などの共和政のしくみを残した事実上の帝政を何という？","a":"元首政（プリンキパトゥス）","d":["専制君主政（ドミナトゥス）","共和政","三頭政治"],"x":"形の上では共和政のまま、実際には一人が全部の力を握る。うまいやり方だね。","v":"GRM"},
  {"id":"GRM-Q10-010","ch":6,"q":"アウグストゥスから五賢帝の時代まで続いた、約200年間の平和を何という？","a":"パクス＝ロマーナ","d":["ヘレニズム時代","内乱の1世紀","軍人皇帝時代"],"x":"「ローマの平和」という意味だね。帝国の中では大きな戦争がなかった、ということだよ。","v":"GRM"},
  {"id":"GRM-Q10-011","ch":6,"q":"ネルヴァからマルクス＝アウレリウス＝アントニヌスまで、96年から180年まで続いた5人の皇帝を何という？","a":"五賢帝","d":["三頭政治","四帝","ディアドコイ"],"x":"自分の子ではなく、優秀な人を養子にして位を継がせたんだ。それがうまくいった時代だね。","v":"GRM"},
  {"id":"GRM-Q10-012","ch":6,"q":"初の属州出身の皇帝で、ダキアを征服してローマの最大版図を実現したのは？","a":"トラヤヌス","d":["ハドリアヌス","ネルヴァ","アウグストゥス"],"x":"ローマにはダキア遠征の様子を描いた記念柱が、今も建っているんだ。ぐるぐると巻きつくように、浮き彫りが彫られているよ。","v":"GRM"},
  {"id":"GRM-Q10-013","ch":6,"q":"ブリタニアに長城を築いた、五賢帝の一人は？","a":"ハドリアヌス","d":["トラヤヌス","アントニヌス＝ピウス","マルクス＝アウレリウス＝アントニヌス"],"x":"帝国のあちこちを自分で旅して回った皇帝なんだ。ギリシア文化が大好きで、ひげを生やした最初の皇帝だよ。","v":"GRM"},
  {"id":"GRM-Q10-014","ch":6,"q":"ストア派の哲学者で「哲人皇帝」と呼ばれた、五賢帝最後の皇帝は？","a":"マルクス＝アウレリウス＝アントニヌス","d":["ハドリアヌス","トラヤヌス","ネロ"],"x":"本当は哲学だけをしていたかった人なんだ。でも在位中はほとんど、国境で戦ってばかりだったよ。","v":"GRM"},
  {"id":"GRM-Q10-015","ch":6,"q":"マルクス＝アウレリウス＝アントニヌスが陣中で書いた、自分を戒める言葉を集めた著作は？","a":"『自省録』","d":["『幸福論』","『国家』","『ガリア戦記』"],"x":"朝なかなか起きられない自分を、本気で叱っている文章もあるんだ。皇帝も、人なんだね。","v":"GRM"},
  {"id":"GRM-Q10-016","ch":6,"q":"パクス＝ロマーナの時代、ローマと南インドの間で行われた交易は？","a":"季節風貿易","d":["オアシスの道の交易","大西洋三角貿易","朝貢貿易"],"x":"インドでは、ローマの金貨がたくさん見つかっているんだ。","v":"GRM"},
  {"id":"GRM-Q10-017","ch":6,"q":"ギリシアとローマの英雄を比べて描いた『対比列伝（英雄伝）』の作者は？","a":"プルタルコス","d":["リウィウス","タキトゥス","ヘロドトス"],"x":"シェイクスピアは、この本をもとに『ジュリアス・シーザー』などの劇を書いたんだ。","v":"GRM"},
  {"id":"Q01-001","ch":6,"q":"235〜284年、各地の軍団が次々と皇帝を立てて争った時代を何という？","a":"軍人皇帝時代","d":["五賢帝時代","三頭政治","元首政"],"x":"約50年で26人もの皇帝が立ちました。","v":"MED"},
  {"id":"Q01-002","ch":6,"q":"コンスタンティヌスが都を移した、コンスタンティノープルのもとの名前は？","a":"ビザンティウム","d":["ラヴェンナ","ミラノ","アレクサンドリア"],"x":"ギリシア人の植民市でした。ビザンツ帝国の名前の由来です。","v":"MED"},
  {"id":"Q01-003","ch":6,"q":"325年、アタナシウス派を正統としたのは？","a":"ニケーア公会議","d":["エフェソス公会議","クレルモン公会議","コンスタンツ公会議"],"x":"アリウス派はここで異端とされ、ゲルマン人に広まりました。","v":"MED"},
  {"id":"Q01-004","ch":6,"q":"4世紀後半、ゲルマン人の大移動のきっかけとなった、アジア系民族の西進は？","a":"フン人","d":["マジャール人","ノルマン人","アヴァール人"],"x":"375年、西ゴート人がドナウ川を渡ってローマ領に入りました。","v":"MED"},
  {"id":"Q01-005","ch":6,"q":"ローマ帝国末期、土地に縛られ移動の自由を制限された小作人を何という？","a":"コロヌス","d":["奴隷","農奴","騎士"],"x":"コロヌスは中世の農奴の先駆けとされます。","v":"MED"},
  {"id":"Q01-006","ch":6,"q":"ローマ帝国末期に広まった、移動の自由を奪われた小作人（コロヌス）を使う大土地経営を何という？","a":"コロナトゥス","d":["ラティフンディア","荘園制","イクター制"],"x":"奴隷を使うラティフンディアから、小作人を使うコロナトゥスへ。中世の荘園制の先駆けです。","v":"MED"},
  {"id":"Q01-007","ch":6,"q":"ディオクレティアヌス帝について誤っているものは？","a":"キリスト教を公認した","d":["専制君主制を始めた","帝国を四分割して統治した","キリスト教徒を大規模に迫害した"],"x":"公認したのはコンスタンティヌス。ディオクレティアヌスは最後の大迫害を行いました。","v":"MED"},
  {"id":"Q01-008","ch":6,"q":"次の出来事を古い順に並べたとき、3番目にくるのは？（ミラノ勅令／ニケーア公会議／キリスト教の国教化／帝国の東西分割）","a":"キリスト教の国教化","d":["ミラノ勅令","ニケーア公会議","帝国の東西分割"],"x":"313年→325年→392年→395年の順です。","v":"MED"},
  {"id":"Q01-009","ch":6,"q":"ニケーア公会議で異端とされたが、のちにゲルマン人の間に広まった派は？","a":"アリウス派","d":["アタナシウス派","ネストリウス派","カタリ派"],"x":"キリストは神ではなく人間だとする考え方です。正統になったのはアタナシウス派。","v":"MED"},
  {"id":"Q01-010","ch":6,"q":"ゲルマン民族の大移動が始まった年は？","a":"375年","d":["313年","395年","476年"],"x":"フン人に押された西ゴート人が、ドナウ川を越えてローマ領に移動しました。","v":"MED"},
  {"id":"Q01-011","ch":6,"q":"コンスタンティヌスが行ったこととして誤っているものは？","a":"キリスト教を国教とした","d":["ミラノ勅令を出した","ニケーア公会議を開いた","ビザンティウムに遷都した"],"x":"国教化はテオドシウス。二人の皇帝の業績は混ざりやすいので要注意です。","v":"MED"},
  {"id":"Q01-012","ch":6,"q":"次の文の「元首政を復活させ、元老院と協力して統治した」の部分を正しく直すと？　――3世紀末、軍人皇帝時代を終わらせた皇帝は、元首政を復活させ、元老院と協力して統治した","a":"専制君主政を始め、皇帝を神のように崇めさせた","d":["元首政を復活させ、元老院と協力して統治した","共和政に戻し、執政官に統治を任せた","三頭政治を始め、権力を3人で分け合った"],"x":"皇帝の前ではひざまずいて、衣の裾に口づけするのが決まりになったんだ。引退したあとは故郷でキャベツを育てていたらしいよ。","v":"MED"},
  {"id":"Q01-013","ch":6,"q":"次の文の「国教となった」の部分を正しく直すと？　――313年のミラノ勅令によって、キリスト教はローマ帝国の国教となった","a":"公認された","d":["国教となった","禁止された","異端とされた"],"x":"313年は公認、国教になるのは392年だよ。コンスタンティヌス自身は、洗礼を受けたのが亡くなる直前だったらしい。","v":"MED"},
  {"id":"Q01-014","ch":6,"q":"次の文の「南北に分割された」の部分を正しく直すと？　――キリスト教を国教とした皇帝の死後、395年に帝国は南北に分割された","a":"東西に分割された","d":["南北に分割された","四つに分割された","ゲルマン人に譲り渡された"],"x":"二人の息子に、東と西を分けて継がせたんだ。兄が東で、弟が西。弟のほうはまだ10歳くらいだったそうだよ。","v":"MED"},
  {"id":"Q01-015","ch":6,"q":"次の文の「ゲルマン人の侵入を退け、その後も存続した」の部分を正しく直すと？　――476年、西ローマ帝国はゲルマン人の侵入を退け、その後も存続した","a":"ゲルマン人傭兵隊長に皇帝を廃位され、滅亡した","d":["ゲルマン人の侵入を退け、その後も存続した","フン人に征服され、滅亡した","東ローマ帝国に併合され、消滅した"],"x":"最後の皇帝はまだ子どもでね、退位させられたあとは年金をもらって暮らしたらしい。オドアケルは、自分では皇帝を名乗らなかったんだ。","v":"MED"},
  {"id":"Q02-001","ch":7,"q":"イエスの言行や使徒の活動をまとめた、キリスト教の聖典は？","a":"新約聖書","d":["旧約聖書","コーラン","タルムード"],"x":"旧約聖書はユダヤ教から受け継いだ部分です。","v":"MED"},
  {"id":"Q02-002","ch":7,"q":"キリスト教の五本山に含まれないのは？","a":"ミラノ","d":["ローマ","アンティオキア","アレクサンドリア"],"x":"残りはコンスタンティノープルとイェルサレムです。","v":"MED"},
  {"id":"Q02-003","ch":7,"q":"431年、ネストリウス派を異端としたのは？","a":"エフェソス公会議","d":["ニケーア公会議","クレルモン公会議","トリエント公会議"],"x":"ネストリウス派はその後、東方へ広まりました。","v":"MED"},
  {"id":"Q02-004","ch":7,"q":"唐代の中国に伝わったネストリウス派は何と呼ばれた？","a":"景教","d":["祆教","摩尼教","回教"],"x":"祆教はゾロアスター教、摩尼教はマニ教です。","v":"MED"},
  {"id":"Q02-005","ch":7,"q":"ローマ最古の成文法は？","a":"十二表法","d":["ローマ法大全","万民法","大憲章"],"x":"貴族と平民の対立の中で作られました。","v":"MED"},
  {"id":"Q02-006","ch":7,"q":"ローマ建国の伝説を描いた叙事詩『アエネイス』の作者は？","a":"ウェルギリウス","d":["リウィウス","タキトゥス","プルタルコス"],"x":"ローマ文学の最高傑作とされます。","v":"MED"},
  {"id":"Q02-007","ch":7,"q":"『ローマ建国史』を書いた歴史家は？","a":"リウィウス","d":["タキトゥス","ウェルギリウス","プルタルコス"],"x":"アウグストゥスの時代の歴史家です。","v":"MED"},
  {"id":"Q02-008","ch":7,"q":"ギリシアとローマの英雄を比べて描いた『対比列伝』（英雄伝）の作者は？","a":"プルタルコス","d":["リウィウス","タキトゥス","セネカ"],"x":"ギリシア人ですが、ローマ時代に活躍しました。","v":"MED"},
  {"id":"Q02-009","ch":7,"q":"ストア派の哲学者でもあった「哲人皇帝」が書いた作品は？","a":"『自省録』","d":["『幸福論』","『ゲルマニア』","『神の国』"],"x":"五賢帝の最後、マルクス＝アウレリウス＝アントニヌスの著作です。","v":"MED"},
  {"id":"Q02-010","ch":7,"q":"『幸福論』を書いたストア派の哲学者は？","a":"セネカ","d":["マルクス＝アウレリウス＝アントニヌス","キケロ","プトレマイオス"],"x":"暴君ネロの家庭教師でもありました。","v":"MED"},
  {"id":"Q02-011","ch":7,"q":"作品と作者の組み合わせとして誤っているものは？","a":"『ゲルマニア』―プルタルコス","d":["『アエネイス』―ウェルギリウス","『天文学大全』―プトレマイオス","『神の国』―アウグスティヌス"],"x":"『ゲルマニア』はタキトゥスです。","v":"MED"},
  {"id":"Q02-012","ch":7,"q":"「キリスト」とはどういう意味の言葉？","a":"救世主（メシア）","d":["神の子","預言者","使徒"],"x":"イエスを救世主と信じる、というのがキリスト教の核心です。","v":"MED"},

  {"id":"Q02-016","ch":7,"q":"次の文の「パリサイ派の教えを広めた」の部分を正しく直すと？　――ユダヤ教の律法を厳格に守るパリサイ派の教えを広めた人物は、ローマへの反逆者として処刑された","a":"パリサイ派を批判し、神の愛と隣人愛を説いた","d":["パリサイ派の教えを広めた","皇帝崇拝を説いた","多神教の復興を説いた"],"x":"パリサイ派は、律法を細かく守ることを大事にした人たちだね。イエスは安息日に病人を癒やして、彼らに咎められたことがあるんだ。","v":"MED"},
  {"id":"Q02-017","ch":7,"q":"次の文の「ユダヤ人だけに伝道を限った」の部分を正しく直すと？　――元パリサイ派で回心した使徒は、ユダヤ人だけに伝道を限った","a":"異邦人（ユダヤ人以外）への伝道に尽くした","d":["ユダヤ人だけに伝道を限った","ローマ皇帝にだけ伝道した","伝道そのものを禁じた"],"x":"パウロはもともと、キリスト教徒を迫害する側だったんだ。地中海のあちこちを回って各地の信徒に手紙を書いていて、それが新約聖書にたくさん入っているよ。","v":"MED"},
  {"id":"Q02-018","ch":7,"q":"次の文の「『ゲルマニア』」の部分を正しく直すと？　――最大の教父とされる人物は、『ゲルマニア』を著して神の国の到来を説いた","a":"『告白録』『神の国』","d":["『ゲルマニア』","『天文学大全』","『博物誌』"],"x":"『告白録』には、若い頃に友だちと梨を盗んだ話が出てくるんだ。お腹が空いていたわけでもないのに、ってね。","v":"MED"},
  {"id":"Q02-019","ch":7,"q":"次の文の「地動説」の部分を正しく直すと？　――2世紀の天文学者は、『天文学大全』で地動説を唱えた","a":"天動説","d":["地動説","太陽を神とする説","大地が平らだという説"],"x":"アレクサンドリアの学者だね。地理の本も書いていて、場所を緯度と経度で示しているんだ。天動説は千四百年くらい続いたかな。まあ、長いほうだよ。","v":"MED"},

  {"id":"Q05-021","ch":8,"q":"次の文の「ダマスクス」の部分を正しく直すと？　――622年、迫害を受けた預言者は、メッカからダマスクスへ移住した","a":"メディナ","d":["ダマスクス","バグダード","イェルサレム"],"x":"メディナはもとはヤスリブという町で、「預言者の町」という意味でメディナと呼ばれるようになったんだ。イスラーム暦は、この移住の年から数えるよ。","v":"MED"},
  {"id":"Q05-022","ch":8,"q":"次の文の「ムハンマドの娘婿」の部分を正しく直すと？　――ムハンマドの死後、初代カリフに選ばれたのはムハンマドの娘婿だった","a":"ムハンマドの親友（義父）","d":["ムハンマドの娘婿","ムハンマドの息子","ウマイヤ家の総督"],"x":"アブー＝バクルの娘は、ムハンマドの妻なんだ。だから親友で、義理の父でもある。娘婿は第4代のアリーだね。","v":"MED"},

  {"id":"Q05-024","ch":8,"q":"次の文の「コーランを処分した」の部分を正しく直すと？　――ウマイヤ家出身の第3代正統カリフは、コーランを処分した","a":"コーランを編纂し、現在の形に定めた","d":["コーランを処分した","コーランをペルシア語に翻訳させた","ハディースだけを聖典とした"],"x":"処分したのはコーランそのものじゃなくて、まとめる前の写本のほうなんだ。それまでは人によって覚えているコーランに少しずつ違いがあって、ウスマーンは一つの形に定めたうえで、ほかの写本を処分させたといわれてる。","v":"MED"},
  {"id":"Q05-025","ch":8,"q":"次の文の「スンナ派」の部分を正しく直すと？　――第4代正統カリフとその子孫だけを正統な指導者と認める人々は、スンナ派と呼ばれる","a":"シーア派","d":["スンナ派","スーフィー","ウラマー"],"x":"シーアは「党派」という意味で、もとは「アリーの党派」と呼ばれていたんだ。今のイランは、シーア派の人が多い国だよ。","v":"MED"},

  {"id":"Q06-029","ch":8,"q":"次の文の「天動説」の部分を正しく直すと？　――知恵の館で活躍した学者は、天動説を大きく発展させた","a":"代数学","d":["天動説","医学","歴史学"],"x":"「アルゴリズム」という言葉は、フワーリズミーの名前から来ているんだ。インドから伝わった数字の使い方も、彼の本を通じてヨーロッパに広まったよ。","v":"MED"},
  {"id":"Q06-030","ch":8,"q":"次の文の「『集史』」の部分を正しく直すと？　――イスラームの医学者・哲学者は『集史』を著し、ヨーロッパの医学にも影響を与えた","a":"『医学典範』","d":["『集史』","『三大陸周遊記』","『神学大全』"],"x":"『医学典範』はラテン語に訳されて、ヨーロッパの大学で何百年も教科書として使われたんだ。","v":"MED"},
  {"id":"Q06-031","ch":8,"q":"次の文の「『東方見聞録』」の部分を正しく直すと？　――モロッコ出身の旅行家は、アジアやアフリカを巡って『東方見聞録』を残した","a":"『三大陸周遊記』","d":["『東方見聞録』","『集史』","『医学典範』"],"x":"『東方見聞録』はマルコ＝ポーロだね。イブン＝バットゥータは30年近く旅をして、中国の泉州まで行ってるんだ。","v":"MED"},
  {"id":"Q06-032","ch":8,"q":"次の文の「アラビア語」の部分を正しく直すと？　――イル＝ハン国の宰相は、アラビア語で『集史』を書いた","a":"ペルシア語","d":["アラビア語","ラテン語","トルコ語"],"x":"『集史』はモンゴルの歴史を中心に、中国やヨーロッパのことまで書いた本なんだ。世界史の本としては、かなり早い例だね。","v":"MED"},
