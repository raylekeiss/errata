    {"t": "act", "a": "battle", "v": "P1-17"},
    {"t": "l", "s": "劉邦", "x": "（わしは酒好きの田舎者だったが、自分でいうのもなんだが人望はあってな。張良、蕭何、韓信。あいつらが支えてくれたから、天下が取れたんだ。）"},
    {"t": "l", "s": "シミ", "x": "項羽は楚の名門貴族の出身で、劉邦は農民の出身。なにもかも正反対の二人だったんだ。"},
    {"t": "d", "x": "光の消えた大通りを歩いていくと、宮殿の書庫の前で、紙魚が足を止める。"},
    {"t": "d", "x": "書庫の一角に、竹簡を巻いた束が、天井近くまでぎっしりと積み上げられている。この一角だけは、どの束もまったく光っていない。"},
    {"t": "l", "s": "シミ", "x": "これは……"},
    {"t": "d", "x": "紙魚は書庫の棚から適当な竹簡を一連(ひとれん)取り出すと、広げて斜め読みをしていく。"},
    {"t": "l", "s": "シミ", "x": "うん、『史記』だね。全部で130巻、文字にすると50万字以上もあるのに、一行も消されてない。"},
    {"t": "l", "s": "主人公", "x": "どうしてでしょう。"},
    {"t": "l", "s": "シミ", "x": "司馬遷は、皇帝や将軍だけじゃなくて、刺客や商人や、人を笑わせる名人のことまで書き残したからね。"},
    {"t": "l", "s": "シミ", "x": "名前の残りにくい人たちのことも、ちゃんと書いた本なんだ。多分だけど、ヌルは、この本を気に入ってるんだと思うよ。"},
    {"t": "l", "s": "コンラッド", "x": "……私も気に入っている。趣味の域を出んが中国史は好きでな。史記からは司馬遷の鬼気迫る迫力が感じられる。あの本はよく書けた本だ。"},
    {"t": "d", "x": "宮廷の奥から、また別のにじむ光がもれている。【演出：光る】"},
    {"t": "l", "s": "シミ", "x": "今度は、もっと西のほうだね。"},
    {"t": "act", "a": "quiz", "v": ["CHN-Q04-002", "CHN-Q04-005", "CHN-Q04-009", "CHN-Q04-014", "CHN-Q04-012"]},
    {"t": "d", "x": "景色がページをめくるように流れ、乾いた風が吹きこんでくる。"},
    {"t": "bg", "v": "背景_西域"},
    {"t": "d", "x": "砂漠の中に、ぽつんと緑が広がるオアシスの町。日干しれんがの城壁の外に、ラクダの隊商がつながったまま歩いていく。"},
    {"t": "l", "s": "シミ", "x": "ここは、西域のオアシス都市だよ。敦煌のさらに西、亀茲（クチャ）のような町だね。前漢の武帝が河西回廊に敦煌などの四郡を置いて、西への影響力を強めて以降、様々な使者や商人が、ここを通って西へと向かったんだ。"},
    {"t": "l", "s": "コンラッド", "x": "もちろん西側から中国に流れた品も多い。ローマ製のガラスコップなどが後漢時代の墓から出土したりなどしているのだよ。"},
    {"t": "d", "x": "城門の石碑が、にじむように光っている。【演出：光る】"},
    {"t": "d", "x": "「武帝は、匈奴を挟み撃ちにするため、（　　）に（　　）を派遣した」"},
    {"t": "l", "s": "主人公", "x": "今度は、二か所も抜けてます。"},
    {"t": "l", "s": "コンラッド", "x": "行き先と使者、どちらも抜いてあるな。これでは何のための旅だったのか、わからんぞ。"},
    {"t": "d", "x": "石碑の空欄から砂がこぼれ落ち、渦を巻いて誤植になる。【演出：揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-18"},
    {"t": "l", "s": "張騫", "x": "（大月氏の王は、移り住んだ土地の暮らしに満足していてな。今さら匈奴と戦う気はない、と断られてしまった。）"},
    {"t": "l", "s": "シミ", "x": "同盟の話はまとまらなかったけど、張騫が持ち帰った西の国々の知らせが、のちのシルク＝ロードの交易につながっていくんだ。"},
    {"t": "d", "x": "オアシスの奥、城壁の上の物見台にも、同じ光がにじんでいる。時代は少し先、後漢のころだ。"},
    {"t": "d", "x": "「西域都護の（　　）は、部下の甘英を（　　）へ派遣しようとした」"},
    {"t": "l", "s": "コンラッド", "x": "後漢の班超だな。ちなみに甘英は、途中の海辺で引き返してしまった。"},
    {"t": "l", "s": "主人公", "x": "えっ、行かなかったんですか。"},
    {"t": "l", "s": "コンラッド", "x": "船旅は長くて危ない、と言われて怖じ気づいたらしい。もし行っていれば、ローマと漢が直接つながっていたかもしれん。"},
    {"t": "d", "x": "物見台の空欄が黒く固まり、誤植になって飛びかかってくる。【演出：揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-19"},
    {"t": "l", "s": "班超", "x": "（もとは兄と同じく、役所で書き写しの仕事をしていたのだ。ある日、まだ見ぬ世界を自分の足で開拓したくなってな。筆を投げ捨てて帝にお願いし、西域へと向かったんだ。）"},
    {"t": "l", "s": "シミ", "x": "ノーリスクノーリターンを意味する「虎穴に入らずんば虎子を得ず」ということわざは、班超の言葉として伝わってるんだよ。お兄さんの班固は、『漢書』を書いた歴史家なんだ。"},
    {"t": "act", "a": "quiz", "v": ["CHN-Q04-021", "CHN-Q04-025", "CHN-Q05-001", "CHN-Q05-008", "CHN-Q05-012"]},
    {"t": "act", "a": "break"},
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "書庫に戻ると、コンラッドは三国時代の棚の前に陣取って、何冊も本を広げはじめた。久しぶりに読み返したくなったらしい。"},
    {"t": "d", "x": "○○はコンラッドに自分の名前を書かないように念押しして、紙魚を探しに行った。ひとりで棚の奥へ歩いていく。すると話し声が聞こえた。書架のすき間からのぞくと、紙魚とヌルが向かい合っている。"},
    {"t": "l", "s": "シミ", "x": "ねえ、落丁を生み出すのを、やめるわけにはいかないのかな。"},
    {"t": "d", "x": "ヌルは何も言わずに首を振る。紙魚も諦めたように肩をすくめた。ヌルは手を前に差し出す。"},
    {"t": "d", "x": "ヌルの手には、古い頁が一枚握られていた。その頁は、人物の名前と顔の部分が削り取られたように判読できなくなっている。"},
    {"t": "l", "s": "ヌル", "x": "古代のどこかで見つけた頁なの。"},
    {"t": "l", "s": "ヌル", "x": "ふつう、名前を削られた頁からは、声がする。返して、とか、さみしい、助けて、とか。"},
    {"t": "l", "s": "ヌル", "x": "でも、この頁はとても静か。名前が削り取られてるのに、声がまったくしない。……どうして？　あなたは、ここに勤めて長いんでしょう。わかる？"},
    {"t": "d", "x": "紙魚は、少しのあいだ頁を眺める。"},
    {"t": "l", "s": "シミ", "x": "さあ。俺にも分からないことはあるよ。"},
    {"t": "l", "s": "シミ", "x": "この世界には、もういないのかもしれないし、全部が嫌になって寝てるのかも。……あるいは、もしかしたら生まれ変わって、どこかで楽しく過ごしてるのかも。"},
    {"t": "l", "s": "ヌル", "x": "三択しかないのなら、最後のがいい。"},
    {"t": "l", "s": "シミ", "x": "……俺もそう思う。"},
    {"t": "d", "x": "紙魚は、頁をそっとヌルの手に戻す。"},
    {"t": "l", "s": "シミ", "x": "よかったら、ヌルさんが預かっておいてくれる？"},
    {"t": "l", "s": "ヌル", "x": "……いいけど。"},
    {"t": "d", "x": "紙魚が、書架のすき間の○○に気づく。"},
    {"t": "l", "s": "シミ", "x": "あれ、新人さん。この棚、誤植が多くてね。今日はごちそうだよ。"},
    {"t": "d", "x": "紙魚はいつもの調子で、光る本から黒い虫をつまみ出して口に入れる。振り返ると、ヌルの姿はもうない。"},
    {"t": "l", "s": "主人公", "x": "ヌルさんが持って行った頁は？"},
    {"t": "l", "s": "シミ", "x": "聞いてたのか。盗み聞きは感心しないね。"},
    {"t": "d", "x": "紙魚はまた肩をすくめた。"},
    {"t": "l", "s": "シミ", "x": "俺にもよくわからなかったよ。見たところ、人的な誤植や欠落でもなかったみたいだし。考えてたって仕方ない。戻ろうか。"},
    {"t": "d", "x": "取りつく島もなく、○○と紙魚は書架の間の広い通路まで戻ってくる。"},
    {"t": "d", "x": "三国時代の棚の前まで行くと、コンラッドが待ってましたと言わんばかりに、熱心に話しかけてきた。案外、生来より人と話すのが好きな性質なのかもしれない。"},
    {"t": "l", "s": "コンラッド", "x": "おお、○○くん！いいかね。『三国志演義』は小説、『三国志』は正史だ。演義の方はあくまでフィクション。ここでは、関羽も諸葛亮も、実物より何割も格好よく書かれている。兵士の数も実際よりもずっと盛って書かれているのだ。そもそも、意外に思われるかもしれないが、あの時代には椅子という文化すら普及していなかった。三国では、皇帝も臣下も同じ床に敷物をしいて正座していたのだ。あぐらをかくのは無作法とされていたからな。"},
    {"t": "l", "s": "主人公", "x": "博士、詳しいですね。"},
    {"t": "l", "s": "コンラッド", "x": "演義はよくできたフィクション作品だ。私も歴史に名を残すなら、あれくらいダイナミックなウソを事実として上書きしてしまいたいものだよ。"},
    {"t": "l", "s": "シミ", "x": "それは、できれば諦めて欲しいけどね。"},
    {"t": "d", "x": "背後から、また女性の静かな声がする。"},
    {"t": "l", "s": "ヌル", "x": "三国志に出てくる兵士たちには、名前がある？"},
    {"t": "l", "s": "コンラッド", "x": "正史の方か？……なら、一兵卒のものはないな。"},
    {"t": "d", "x": "コンラッドは言い返さない。ヌルは少しだけ首をかしげ、棚の向こうへ消える。"},
    {"t": "d", "x": "その棚の一冊が、にじむように光りだす。開いたページには、海の向こうの島国の記事。【演出：光る】"},
    {"t": "d", "x": "「（　　）は、魏に使いを送り「親魏倭王」の称号を与えられた」"},
    {"t": "l", "s": "シミ", "x": "日本の話だね。中国の歴史書には、ときどき日本のことも書いてあるんだ。"},
    {"t": "d", "x": "空欄がページからはがれ、誤植になる。【演出：揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-20"},
    {"t": "l", "s": "卑弥呼", "x": "（魏の皇帝には、男女の奴隷と布を贈りました。お返しに金印と、銅鏡を百枚いただきましたよ。）"},
    {"t": "l", "s": "シミ", "x": "「漢委奴国王」と書かれた金印をもらったとされる奴国は、後漢の時代の話だよ。卑弥呼の治めていたとされる邪馬台国は、後漢のあと、三国時代の魏に金印をもらったんだ。ごっちゃにしやすいところだから気を付けてね。"},
    {"t": "act", "a": "quiz", "v": ["CHN-Q06-003", "CHN-Q06-006", "CHN-Q06-009", "CHN-Q06-012", "CHN-Q06-019"]},
    {"t": "d", "x": "南朝の棚。一冊の本が、やさしく、けれど弱々しく光っている。背表紙には「桃花源記」。"},
    {"t": "l", "s": "シミ", "x": "戦乱を知らずに暮らしてた村の話だよ。これは実在の村ではなく、東晋時代の詩人、「陶淵明」が描いた理想郷なんだ。漁師が一度だけ迷いこんで、二度とたどり着けなかった、という、理想の村が描かれている。"},
    {"t": "d", "x": "三人は、ページに手を置いた。"},
    {"t": "bg", "v": "背景_桃源郷"},
    {"t": "d", "x": "一面に、咲きほこる桃の林が広がった。林には花と一緒に桃の実がなっている。あたりには花の甘い匂いがして、遠くには霞がかかっている。花びらの舞う小道の先に、のどかな村の家並みが見える。みな美しい天女のような衣を着ている。どこからか中国の弦楽器である、二胡の音がした。幻想的な風景だ。"},
    {"t": "l", "s": "主人公", "x": "うわあ、夢の中みたいな、素敵な景色ですね。"},
    {"t": "l", "s": "シミ", "x": "うーーーん。"},
    {"t": "d", "x": "紙魚は苦笑いを浮かべた。"},
    {"t": "l", "s": "主人公", "x": "どうしたんですか？"},
    {"t": "l", "s": "シミ", "x": "作者の名前が消されているからか、後世の桃源郷伝説とごっちゃになっているみたいだ。桃花源記に書かれている村っていうのは、秦の戦乱を逃れてきた人たちの子孫が、みんなで畑仕事に精を出す、というごく普通の村なんだよ。一緒に書かれた詩には、秋の実りに王の税はかからない、とまで書いてある。陶淵明がそこを理想としたのは、王や権力に縛られず、自然の摂理にしたがって生きることができる村だからだ。"},
    {"t": "l", "s": "主人公", "x": "じゃあ……こんなにファンタジックではないんですね……"},
    {"t": "l", "s": "シミ", "x": "神仙思想と結びついて、仙人の住む場所みたいに語られるようになったのは、唐の時代ごろからなんだ。例えば、そこの桃だね。もともと、西王母っていう女神の、食べると不老不死になる桃の伝説があってね。それが桃源郷のイメージと混ざって、ここの桃も食べれば不老不死になる、なんて言われるようになったんだ。"},
    {"t": "l", "s": "コンラッド", "x": "不老不死か……"},
    {"t": "l", "s": "主人公", "x": "憧れるような、ちょっと怖いような……"},
    {"t": "l", "s": "コンラッド", "x": "ここの桃を食べれば不老不死になれるとすれば、歴史に名を残すチャンスじゃないか！？今のところ不老不死の人類は登場していないだろう？私が最初の一人になってやろうじゃないか！"},
    {"t": "d", "x": "駆け出したコンラッドが桃の木から果実をもぎ取り、口の中に突っ込む。"},
    {"t": "l", "s": "コンラッド", "x": "うげえ………………"},
    {"t": "d", "x": "大きな声で呻き、そのままコンラッドは口に入れた桃を吐き出した。"},
    {"t": "l", "s": "主人公", "x": "きったな……って、真っ黒じゃないですか！"},
    {"t": "l", "s": "シミ", "x": "本当だ、桃の中身が墨みたいに真っ黒だね。"},
    {"t": "d", "x": "紙魚がコンラッドに近づいて、横の枝から果実ひとつもぎ取り、かじる。"},
    {"t": "l", "s": "シミ", "x": "思った通り、誤植の味だ。博士、これは食べても不老不死にはならないよ。おなか壊すから吐き出しちゃいな……"},
    {"t": "l", "s": "コンラッド", "x": "クソ……理想郷まで誤植で荒らすとは、無粋なやつめ。"},
    {"t": "d", "x": "コンラッドは自分の失敗をごまかすように強く首を振り、憤慨したように桃型の誤植を芝生にたたきつける。ふいに、コンラッドがこめかみを押さえてよろめいた。"},
    {"t": "l", "s": "主人公", "x": "博士？"},
    {"t": "l", "s": "コンラッド", "x": "……なんでもない。少し、めまいがしただけだ。"},
    {"t": "l", "s": "シミ", "x": "ヘンなもの食べるから……"},
    {"t": "d", "x": "村の真ん中に進んでいくと、桃の花びらと白いページが混ざりあった、巨大な誤植がうずくまっている。【演出：大きく揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-21"},
    {"t": "l", "s": "陶淵明", "x": "（役人勤めは性に合わなかった。わずかな給料のために上役へ頭を下げるくらいなら、田舎で畑を耕して、酒を飲んでいるほうがいい。）"},
    {"t": "d", "x": "誤植が崩れ、桃の林に静けさが戻る。○○が振り返ると、コンラッドの姿がない。"},
    {"t": "d", "x": "桃の木の枝に、書き置きが一枚ひっかかっている。"},
    {"t": "d", "x": "「アレクサンドリアへ行く。この書庫の目録に私の名前がないのなら、世界最初の目録に載せるまでだ。　コンラッド」【演出：強調】", "img": "コンラッド", "sil": 1},
    {"t": "l", "s": "主人公", "x": "博士……。"},
    {"t": "l", "s": "シミ", "x": "行き先をちゃんと書いていくところが、博士らしいね。"},
    {"t": "act", "a": "quiz", "v": ["CHN-Q07-003", "CHN-Q07-005", "CHN-Q07-010", "CHN-Q07-013", "CHN-Q07-016"]},
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "書庫に戻った○○は、ヌルが預かった頁のことを、少しだけ気にしながら歩いた。"},
    {"t": "d", "x": "前を行く紙魚は、いつもと変わらない足取りで、ギリシアの階へ向かっていた。"},
    {"t": "act", "a": "reward", "v": 4, "c": "劉邦"}
  ]},
  {"title": "目録", "ev": [
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "ギリシアの歴史の書籍が置かれたエリアだ。白い大理石の柱のような書架が並んでいる。そのうちの一冊が、二種類の光で点滅している。白く強い光と、ぼんやりにじむ光。【演出：光る】"},
    {"t": "l", "s": "シミ", "x": "博士とヌル、両方の光だね。"},
    {"t": "l", "s": "主人公", "x": "二人とも、同じ本にいるんでしょうか？"},
    {"t": "l", "s": "シミ", "x": "行ってみればわかるよ。"},
    {"t": "d", "x": "二人はページに手を置く。"},
    {"t": "bg", "v": "背景_オリンピア"},
    {"t": "d", "x": "オリーブの木々に囲まれた聖域。神殿の柱の向こうに、細長い競技場が広がっている。"},
    {"t": "l", "s": "シミ", "x": "オリンピアだよ。ギリシア人は4年に一度ここに集まって、ゼウスに捧げる競技会を開いたんだ。"},
    {"t": "d", "x": "神殿の前の石板に、優勝者の名前が刻まれている。「徒競走　コンラッド博士」「レスリング　コンラッド博士」「戦車競走　コンラッド博士」。【演出：閃光】"},
    {"t": "d", "x": "その下では、本物の優勝者の名前が、ひとつずつ白く抜けていく。"},
    {"t": "l", "s": "主人公", "x": "こんなことになるなら、博士が協力を申し出たときにでもとっ捕まえて、図書館の本棚にでも縛り付けておくんでしたね。"},
    {"t": "d", "x": "紙魚が笑いながら返した。"},
    {"t": "l", "s": "シミ", "x": "この図書館は宇宙の始まりから終わりまで続くんだ。何億年も縛っておくことはできないよ。"},
    {"t": "l", "s": "主人公", "x": "確かに……じゃあ、いままで書き換えようとしてきた人には、どう対応したんですか？"},
    {"t": "l", "s": "シミ", "x": "過去を書き換えることはできない、って当たり前のことを、話して分かってもらうほかないんだ。"},
    {"t": "l", "s": "主人公", "x": "果てしない道のりですね。"},
    {"t": "l", "s": "シミ", "x": "そうだね。誰にだって諦められないことや、変えたい過去のひとつふたつはあるだろうからね。"},
    {"t": "d", "x": "石板に刻まれた「コンラッド博士」の文字がふくれあがり、誤植になって飛び出してくる。【演出：揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-22"},
    {"t": "l", "s": "ソロン", "x": "（オリンピアで勝ったアテネ市民には、500ドラクマの褒美を出すことにした。ずいぶん気前がいいと言われたものだ。）"},
    {"t": "l", "s": "シミ", "x": "ギリシア人はポリスごとにばらばらだったけど、オリンピアの祭典や神々への信仰で、同じ「ヘレネス」だっていう意識を持っていたんだ。"},
    {"t": "act", "a": "quiz", "v": ["GRM-Q01-001", "GRM-Q01-003", "GRM-Q01-007", "GRM-Q01-009", "GRM-Q01-015"]},
    {"t": "d", "x": "景色がページをめくるように流れ、にぎやかな人の声が近づいてくる。"},
    {"t": "bg", "v": "背景_アテネ"},
    {"t": "d", "x": "柱廊に囲まれた広場。見上げると、丘の上にパルテノン神殿が白く輝いている。"},
    {"t": "l", "s": "シミ", "x": "アテネのアゴラ。政治の話も商売も、みんなここでしたんだよ。"},
    {"t": "d", "x": "広場の一角に、割れた陶器のかけらが山のように積まれている。"},
    {"t": "l", "s": "主人公", "x": "オストラシズム、陶片に名前をたくさん書かれた人はアテネを追放されるってシステムですよね。"},
    {"t": "d", "x": "紙魚は頷き、陶器の欠片をひとつ拾い上げる。どのかけらからも、刻まれていたはずの名前が消えている。【演出：光る】"},
    {"t": "d", "x": "ふと見ると、陶片の山の上に、ヌルが腰かけていた。"},
    {"t": "d", "x": "ヌルの顔色は悪い。頭痛をこらえるように頭を押さえている。"},
    {"t": "l", "s": "ヌル", "x": "陶片に書かれた名前がなくなれば、誰も社会から追い出されない、誰も仲間はずれにならない。ねえ、これって、悪いこと？"},
    {"t": "choice", "o": ["……悪くは、ないのかも", "でも、人類が歩んできた道のりを否定してしまう"], "to": [34, 36]},
    {"t": "l", "s": "ヌル", "x": "そうでしょう？"},
    {"t": "jump", "to": 38},
    {"t": "l", "s": "ヌル", "x": "そうね。でも、オストラシズムは”名前”のある個人の試行錯誤だわ。"},
    {"t": "jump", "to": 38},
    {"t": "d", "x": "ヌルは陶片を一枚、○○に投げ渡して、人ごみの中へ消える。陶片の山がくずれ、誤植になる。【演出：揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-23"},
    {"t": "l", "s": "クレイステネス", "x": "（名を書かれた者は、軍への影響力を削いでクーデターを防ぐために、十年間アテネを離れてもらう。僭主の出現を防ぐための苦肉の策であったのだ。）"},
    {"t": "l", "s": "シミ", "x": "陶片はたくさん見つかってるんだけど、同じ筆跡の陶片がまとめて出てきたこともあるんだ。組織票だったんじゃないか、って言われてるよ。"},
    {"t": "d", "x": "広場の掲示板にも、にじむ光がある。ペルシア戦争の記録だ。"},
    {"t": "d", "x": "「マラトンの勝利を伝えるため、（　　）はアテネまで走りきったのちに、息絶えた」"},
    {"t": "l", "s": "主人公", "x": "ここも抜けてる。"},
    {"t": "l", "s": "シミ", "x": "ああ、そうだね。でもね、この伝令の名前は、もともとはっきりしないんだよ。本によって、「エウクレス」や「フィリッピデス」、「テルシッポス」など、違う名前で書かれてる。"},
    {"t": "d", "x": "いつのまにか、掲示板の前にヌルが立っている。"},
    {"t": "l", "s": "ヌル", "x": "名前が残らなくても、走った人はいた。それだけでいいと思わない？"},
    {"t": "d", "x": "○○が答える前に、紙魚が穏やかに言う。"},
    {"t": "l", "s": "シミ", "x": "そうだね。……この空欄は、空欄のままでもいいかもね。本当にわからないことは、わからないって書いておくのも、正しい記録だよ。"},
    {"t": "d", "x": "ヌルは少し驚いたように紙魚を見て、何も言わずに消える。"},
    {"t": "d", "x": "掲示板の残りの記事が、黒くにじんで誤植になる。【演出：揺れ】"},
    {"t": "l", "s": "シミ", "x": "でも、分かるものは分かると書いておかなくっちゃね。"},
    {"t": "act", "a": "battle", "v": "P1-24"},
    {"t": "l", "s": "ミルティアデス", "x": "（数ではペルシアにかなわなかった。だから重装歩兵で、一気に駆けて攻めかかったのだ。）"},
    {"t": "act", "a": "battle", "v": "P1-25"},
    {"t": "l", "s": "テミストクレス", "x": "（アポロンの神託は「木の壁に頼れ」だった。木の壁とは船のことだ、と皆を説き伏せたのは私だ。）"},
    {"t": "l", "s": "シミ", "x": "その船を漕いだのは、武器を買えない無産市民たちだった。サラミスの海戦で活躍した無産市民たちは、そのあと政治での発言力を強めていくんだ。"},
    {"t": "act", "a": "quiz", "v": ["GRM-Q02-003", "GRM-Q02-009", "GRM-Q03-004", "GRM-Q03-007", "GRM-Q03-011"]},
    {"t": "act", "a": "break"},
    {"t": "d", "x": "丘を登り、アクロポリスへ。パルテノン神殿の前の石碑が、にじむように光っている。【演出：光る】"},
    {"t": "d", "x": "「デロス同盟の資金も使い、（　　）がパルテノン神殿を建てさせた」"},
    {"t": "d", "x": "石碑の根もとに、見覚えのある分厚いノートが一冊、置き忘れられている。"},
    {"t": "l", "s": "主人公", "x": "博士のノートだ。"},
    {"t": "d", "x": "開くと、神殿を建てた石工、大工、運搬人の人数と日当が、細かい字でびっしりと書き写されている。名前のわかる者は名前を、わからない者は「石工　一名」とだけ。"},
    {"t": "l", "s": "シミ", "x": "工事の会計の記録から、自分の研究ノートに、全部書き写したんだね。"},
    {"t": "l", "s": "主人公", "x": "博士、歴史に自分の名前を書きこみに行ったんじゃ……。"},
    {"t": "l", "s": "シミ", "x": "行く途中で、わざわざ寄り道したみたいだね。ヌルとの出会いでなにか心に変化があったのかな。"},
    {"t": "l", "s": "シミ", "x": "……神殿の建設記録は実際に残されているんだ。この記録が残ってるのは、当時の指導者がポリスの事業として神殿を建てて、その帳簿を石に刻ませたからなんだよ。"},
    {"t": "d", "x": "石碑の空欄が黒くにじみ、誤植になる。【演出：揺れ】"},
    {"t": "act", "a": "battle", "v": "P1-26"},
    {"t": "l", "s": "ペリクレス", "x": "（アテネは、ギリシア全体の学校なのだ。……戦死者を弔う演説で、そう語ったこともある。）"},
    {"t": "l", "s": "シミ", "x": "神殿の彫刻を監督したのは、フェイディアスっていう彫刻家なんだ。神に見せるためといって、神殿の屋根の部分に細かな彫刻をほどこしたんだよ。神殿の中には、金と象牙でできた大きなアテナ女神像が安置されていたんだ。"},
    {"t": "l", "s": "主人公", "x": "美しい時代ですね。"},
    {"t": "l", "s": "シミ", "x": "うん、でも平和は続かなかった。ペリクレスがパルテノン神殿の建設にデロス同盟の軍資金を流用したこともあって、アテネは他ポリスの支持を失ってね。やがてスパルタとアテネが対立する「ペロポネソス戦争」という内乱が起こり、アレクサンドロス大王の時代までギリシアはバラバラになってしまうんだ。"},
    {"t": "act", "a": "quiz", "v": ["GRM-Q03-013", "GRM-Q03-012", "GRM-Q05-014", "GRM-Q05-015", "GRM-Q05-017"]},
    {"t": "d", "x": "景色が流れ、海の向こうへ、時代が先へ進んでいく。"},
    {"t": "bg", "v": "背景_ムセイオン"},
    {"t": "d", "x": "巨大な円形の閲覧室。天井まで届く棚に、巻物がぎっしりと収められている。アレクサンドリアのムセイオンだ。"},
    {"t": "d", "x": "棚という棚に詰め込まれたあらゆる巻物が、にじむように光っている。光の中心には、ヌルがいる。手には、仰々しく、細長い巻物の束を持っている。【演出：光る】"},
    {"t": "l", "s": "シミ", "x": "あれは、マイナーだけど、『ピナケス』だろうね。……カリマコスっていう学者がつくった、世界で最初の図書目録だといわれてるんだ。"},
    {"t": "l", "s": "ヌル", "x": "この目録から名前を全部消して白紙にすれば、図書目録そのものが発明されなかったことになる！！"},
    {"t": "l", "s": "主人公", "x": "そんなことしたら……。"},
    {"t": "l", "s": "シミ", "x": "どの本がどこにあるのか、俺たち司書にも、誰にもわからなくなる。いずれは後世で別の誰かがまた「図書目録」という概念を作るだろうけど、それまでは図書館が使えなくなるね。"},
    {"t": "l", "s": "主人公", "x": "その間に本を誰かに好き勝手に書き換えられたら、そんなことになったら……。"},
    {"t": "l", "s": "ヌル", "x": "それでいい、それでいい！！名前が全部消えれば、みんな静かになる。私は、それまで消し続けてやる。"},
    {"t": "d", "x": "ヌルは耳を押さえて、うずくまる。"},
    {"t": "l", "s": "ヌル", "x": "ずっと、聞いてきたの。名前を残せなかった人たちの声。ずるい、返して、どうして私じゃないの、って。"},
    {"t": "l", "s": "ヌル", "x": "話を聞いてあげると、声が少しだけ静かになる。だから、そうしてきた。人が字を書きはじめてから、歴史が人々の手元に降りて来てから、いままで、ずっと。"},
    {"t": "l", "s": "ヌル", "x": "でも、ここ何百年かで、人が増えすぎた。声も増えすぎた。……もう、もうこれ以上、抱えきれない。"},
    {"t": "l", "s": "シミ", "x": "そうか、あの図書館の無数の本の中で、”人類”が読み切れない無数の行間や余白を、君一人で抱え続けてきたんだね。それで、最近になって、一気に誤植があふれたんだね。"},
    {"t": "d", "x": "巻物から名前が次々と抜けていき、巻物から現れた、真っ白な本のページが竜巻のように舞い上がった。【演出：大きく揺れ】"},
    {"t": "d", "x": "そのとき、閲覧室の入口から、聞き慣れた声がした。"},
    {"t": "l", "s": "コンラッド", "x": "待ちたまえ！"},
    {"t": "d", "x": "コンラッドが、分厚いノートを何冊も抱えて駆けこんでくる。息が上がっている。"},
    {"t": "l", "s": "コンラッド", "x": "目録を消すのは、待ちたまえ。消す前に、一つ加えたいものがある。"},
    {"t": "l", "s": "ヌル", "x": "あなたの名前？"},
    {"t": "l", "s": "コンラッド", "x": "違う。"},
    {"t": "d", "x": "コンラッドは、ノートを閲覧室の机に積み上げる。"},
    {"t": "l", "s": "コンラッド", "x": "長城の建設に動員された人々。兵馬俑のモデルになった兵士たち。パルテノンを建てた石工と大工。名前のわからない人々の記録だ。ここに来るまでのあいだに、拾えるだけ拾ってきた。"},
    {"t": "l", "s": "コンラッド", "x": "名前がわからなくとも、いたことは記録できる。有名、無名を問わず、社会の流れをすべて書き留める。それが歴史家の仕事だ。"},
    {"t": "d", "x": "そのとき、舞い上がった白いページの一部がコンラッドの体に吸い寄せられる。コンラッドの輪郭が、にじんで薄くなる。【演出：揺れ】"},
    {"t": "l", "s": "主人公", "x": "博士！"},
    {"t": "l", "s": "コンラッド", "x": "なんだ、これは……！"},
    {"t": "l", "s": "シミ", "x": "薄くなっていってる……"},
    {"t": "d", "x": "ヌルは、薄くなっていくコンラッドを見つめる。"},
    {"t": "l", "s": "ヌル", "x": "あなたも、私が抱えていた声のひとつだったの。"},
    {"t": "l", "s": "コンラッド", "x": "何を言っている。私は、クノッソスの伝承を研究していた。論文も書いた。反論も山ほど受けた。私は確かに、歴史の中に生きていたはずだ。"},
    {"t": "l", "s": "ヌル", "x": "うん。生きてたんだろうね。でも、名前は教科書や主要な学説としては、残らなかった。あなたはそれに未練を抱き、だから私のところに来た。"},
    {"t": "l", "s": "ヌル", "x": "私が無数の魂たちを抱えきれなくなったとき、いちばん最初に飛び出していったのがあなた。"},
    {"t": "l", "s": "主人公", "x": "どうして、博士が最初に……？"},
    {"t": "l", "s": "ヌル", "x": "歴史への執着が、いちばん強かったから。"},
    {"t": "d", "x": "コンラッドは一瞬、言葉を失う。それから、笑いながら、ずれた片眼鏡を押し上げた。"},
    {"t": "l", "s": "コンラッド", "x": "……当然だ。私ほど歴史に執着した人間は、そうはおらん。"},
    {"t": "l", "s": "シミ", "x": "なるほど、すっきりした。”図書館”の目録に博士の論文がなかったのも、俺が博士の名前を知らなかったのも、それでなんだね。"},
    {"t": "l", "s": "シミ", "x": "俺が覚えていられるのは、あの本の中に記述としてある歴史だけだ。ヌルが博士を吸収してしまっていたから、出した論文も、学説も余白の中に溶け込んで、なかったことにされてしまっていたんだ。"},
    {"t": "l", "s": "コンラッド", "x": "なに！？なら彼女の影響下から抜け出しさえすれば、私は歴史の中に戻れるということか！いなかったことにはならないのか。"},
    {"t": "l", "s": "シミ", "x": "多分ね。"},
    {"t": "d", "x": "ヌルの手が止まる。けれど、舞い上がった白いページは止まらない。ページは閲覧室の真ん中で渦を巻き、巨大な誤植になる。【演出：大きく揺れ】"},
    {"t": "l", "s": "シミ", "x": "止められなくなってるね。新人さん、博士、いくよ。"},
    {"t": "l", "s": "コンラッド", "x": "言われずとも。「われ思う故に我あり」。私はここに存在している。このまま消されてたまるか。"},
    {"t": "act", "a": "battle", "v": "P1-27"},
    {"t": "l", "s": "エウクレイデス", "x": "（王に「もっと楽に幾何学を学ぶ方法はないのか」と聞かれてな。幾何学に王道なし、とお答えした。）"},
    {"t": "l", "s": "コンラッド", "x": "アカデメイアはプラトンの学園、リュケイオンはアリストテレスの学園だ。どちらもアテネにあった。"},
    {"t": "d", "x": "渦は少しだけ小さくなる。けれど、白いページはまだヌルのまわりを轟音とともに回りつづけている。轟音の中から、不確かな怨嗟の声が聞こえたような気がした。"},
    {"t": "l", "s": "ヌル", "x": "うるさい！うるさい！消さないと。消さないと、また声が……。"},
    {"t": "d", "x": "○○は、ヌルに向かって駆け出した。"},
    {"t": "l", "s": "シミ", "x": "おい！なにをしてる！待て！"},
    {"t": "d", "x": "〇〇は肌を切りつける紙の嵐を無視して、ヌルの前に立つ。耳を抑えるヌルの両手をそっと握る。"},
    {"t": "l", "s": "主人公", "x": "ヌルさん。前に言ってましたよね。どの人生も素晴らしいものであるはずなのに、って。"},
    {"t": "l", "s": "ヌル", "x": "……言った……言ったけど、だからなに！？"},
    {"t": "l", "s": "主人公", "x": "じゃあ、その素晴らしいところを、実際に聞いてみたことはありますか！？"},
    {"t": "d", "x": "ヌルが顔を上げる。"},
    {"t": "l", "s": "主人公", "x": "消すんじゃなくて、聞いてみてください。……先輩が、といってもついこの間知り合ったばっかりですけど、「本は読む人によって意味も価値も180度変わる」って言ってたんです。"},
    {"t": "d", "x": "紙の竜巻の向こうから、紙魚が叫ぶように呼び掛ける。"},
    {"t": "l", "s": "シミ", "x": "俺たちには、この空白はただの白にしか見えない。でも、ヌルが読んだら、ここには何が書いてある？"},
    {"t": "l", "s": "ヌル", "x": "……そんなこと、したことない。"},
    {"t": "l", "s": "シミ", "x": "やってみないと、分からないよ。少なくとも、この竜巻でお互い立ち往生はごめんだろ！？"},
    {"t": "d", "x": "〇〇は、足もとに落ちていた白いページを一枚拾い上げてヌルの手に握らせる。ヌルはしばらく黙って見つめてから、ぎゅっと目を閉じた。【演出：強調】"},
    {"t": "l", "s": "ヌル", "x": "……”羨ましい”、って声がする。いつもの声。"},
    {"t": "l", "s": "ヌル", "x": "でも、その奥に……ちがう声もある。"},
    {"t": "d", "x": "白いページに、うっすらと文字が浮かびはじめる。古代の言語のはずなのに、○○にも、それが読めた。【演出：光る】"},
    {"t": "bg", "v": "背景_ナイル", "cut": 1},
    {"t": "l", "s": "？？？", "x": "はっはっは、今日の現場は第三の班が一番で引き上げだ。おれたち『クフ王の友』の班がな。"},
    {"t": "l", "s": "？？？", "x": "おっ、ほら、パンの配給が来たぞ。今日の分のビールもだ。"},
    {"t": "l", "s": "？？？", "x": "お前ら、見ろよ、あの石をよ。あの三段目の一番大きいやつが、おれたちが上げた石に違いないぜ。明日は四段目って言ってたよな。さらに大きくなるってことだ。"},
    {"t": "bg", "v": "背景_ムセイオン", "cut": 1},
    {"t": "d", "x": "紙魚の声が遠くから聞こえる。"},
    {"t": "l", "s": "シミ", "x": "ギザのピラミッドを造った人たちだね。働き手たちは班に分かれていて、自分たちの班に『クフ王の友』みたいな名前をつけてたんだ。石に落書きも残ってるよ。パンやビールが配られていたことも、記録からわかってる。"},
    {"t": "d", "x": "ヌルは、もう一枚、ページを拾う。〇〇はヌルの手をそっと包み込む。"},
    {"t": "bg", "v": "背景_王家の谷", "cut": 1},
    {"t": "l", "s": "？？？", "x": "書記どの、今日は休みます。村のビールを仕込んでいたので。"},
    {"t": "l", "s": "？？？", "x": "すみません、サソリに刺されました、今日はお休みさせてください。"},
    {"t": "l", "s": "主人公", "x": "……これ、欠勤届ですか？"},
    {"t": "l", "s": "シミ", "x": "新王国の、王家の墓を造った職人の村の記録だよ。デイル＝エル＝メディナという村で出土した。誰がどんな理由で休んだか、陶片にちゃんと書き残してあるんだ。"},
    {"t": "bg", "v": "背景_ムセイオン", "cut": 1},
    {"t": "d", "x": "ヌルの頬を、なにかがつたう。"},
    {"t": "d", "x": "「焼きたてのパンがおいしかった」「あの人に気持ちが通じた」「孫が歩いた」"},
    {"t": "d", "x": "暴れ回る白いページが次々と、小さな声で埋まっていく。書き込まれたページは、一枚、また一枚と地面に落ちていく。"},
    {"t": "l", "s": "ヌル", "x": "……怒ってる声しか、聞いてこなかった。そうすれば、黙ってくれる、って。"},
    {"t": "l", "s": "ヌル", "x": "ちゃんと、笑ってたんだ。"},
    {"t": "d", "x": "コンラッドが、震える手でページを一枚拾い上げ、眼鏡越しにのぞきこむ。"},
    {"t": "l", "s": "コンラッド", "x": "……これらの声が、なぜ今まで見えなかったか、わかるかね。"},
    {"t": "l", "s": "コンラッド", "x": "ピラミッドの石工にたどりつけたのは、クフ王の名前が残っているからだ。王家の墓の職人の村が見つかったのは、王の墓を探していたからだ。パルテノンの石工の日当がわかるのは、ペリクレスが帳簿を石に刻ませたからだ。"},
    {"t": "l", "s": "コンラッド", "x": "君は名を消そうとするばかりで、残された名の意味を問うて来なかった。"},
    {"t": "l", "s": "主人公", "x": "……王さまや偉い人の名前が、ほかの人たちの暮らしを探す手がかりになってるんですね。"},
    {"t": "l", "s": "コンラッド", "x": "そうだ。名を残した者は、残せなかった者より、ずっとずっと少ない。だが、その少ない名前が、残りの者たちへたどりつく、ただひとつの道しるべなのだ。"},
    {"t": "l", "s": "コンラッド", "x": "名前を消せば、その道も消える。"},
    {"t": "l", "s": "シミ", "x": "それだけじゃないよ。"},
    {"t": "l", "s": "シミ", "x": "ギリシアのアテネで民主政が確立したのも、無名の無産市民たちがペルシア戦争に従軍し、船をこぎ、戦い、死に、勝ったからだ。歴史を消し去るということは、その裏に隠された名もなき人々の営みさえ、無かったことにしてしまうということなんだよ。"},
    {"t": "d", "x": "ヌルは、ピナケスの巻物を、そっと棚に戻す。"},
    {"t": "l", "s": "ヌル", "x": "……分かった。もう、もう消さない。"},
    {"t": "d", "x": "けれど、閲覧室の天井近くで、行き場をなくした白いページがもう一度集まり、大きな形をとる。【演出：大きく揺れ】"},
    {"t": "l", "s": "コンラッド", "x": "しぶといな。もうひと押しだ。"},
    {"t": "act", "a": "battle", "v": "P1-28"},
    {"t": "l", "s": "アレクサンドロス大王", "x": "（師のアリストテレスが注釈をつけてくれた『イリアス』は、遠征のあいだ、ずっと枕もとに置いていた。）"},
    {"t": "d", "x": "嵐がやみ、白いページがもとの巻物に戻っていく。閲覧室の光が、静かに消える。"},
    {"t": "d", "x": "コンラッドの輪郭も、もとに戻っている。コンラッドは自分の手を何度か握ったり開いたりして、ふんと鼻を鳴らした。"},
    {"t": "d", "x": "机の上には、コンラッドのノートと、声の書かれた白いページの束。ヌルは、それを大切そうに胸に抱える。"},
    {"t": "l", "s": "ヌル", "x": "今まで、本当に、ごめんなさい。"},
    {"t": "l", "s": "ヌル", "x": "もし、許されるのであれば、私はこの声たちを、本にしたい。"},
    {"t": "l", "s": "主人公", "x": "本に？"},
    {"t": "l", "s": "ヌル", "x": "私だけが読める、空白に書いてあることを、苦しいことも、楽しいことも、ちゃんと書き残すの。そうしたら、声は落ち着くと思う。読んでもらえたら、もう自分のことを忘れないで、って、叫ばなくていいから。"},
    {"t": "l", "s": "シミ", "x": "良い案かもしれないね。書き残された声は、ヌルが抱えていなくてもよくなる。少しずつ、ヌルも楽になるはずだよ。"},
    {"t": "l", "s": "コンラッド", "x": "……ならば、私も手伝おう。"},
    {"t": "l", "s": "ヌル", "x": "なんで、あなたが？"},
    {"t": "l", "s": "コンラッド", "x": "勘違いするな。君がこのまま抱えきれなくなれば、私のような厄介な手合いが次々と飛び出してくることになる。"},
    {"t": "l", "s": "主人公", "x": "（厄介な自覚はあるんだ。）"},
    {"t": "l", "s": "コンラッド", "x": "私と違って、歴史にまるで興味のない連中だったらどうする。書庫が荒れ放題だ。たまったものではない。"},
    {"t": "l", "s": "ヌル", "x": "……そう。"},
    {"t": "l", "s": "コンラッド", "x": "ただし、編者の欄には私の名前を入れさせてもらう。"},
    {"t": "l", "s": "ヌル", "x": "……考えておく。"},
    {"t": "l", "s": "コンラッド", "x": "……小さくでもいいぞ。小さくでも。"},
    {"t": "act", "a": "quiz", "v": ["GRM-Q04-008", "GRM-Q04-014", "GRM-Q06-005", "GRM-Q06-007", "GRM-Q06-006"]},
    {"t": "d", "x": "○○はほっと一息をつく。もう大丈夫みたいだ。それをみた紙魚が笑いかけてくる。"},
    {"t": "l", "s": "シミ", "x": "一件落着……みたいだね。"},
    {"t": "l", "s": "主人公", "x": "はい、大変でしたけど、でもなんだか、楽しかったですね！"},
    {"t": "bg", "v": "背景_書庫_カウンター"},
    {"t": "d", "x": "書庫のカウンター。紙魚と○○の前に、白と黒の細い羽根が添えられたメモが一枚、ひらりと落ちてくる。"},
    {"t": "d", "x": "「採用を許可する　館長」【演出：強調】"},
    {"t": "l", "s": "シミ", "x": "あっ、館長から、お許しが出たみたいだよ。"},
    {"t": "l", "s": "主人公", "x": "お許し？"},
    {"t": "l", "s": "シミ", "x": "うん、新規職員の採用をお願いしていたんだ。"},
    {"t": "l", "s": "主人公", "x": "採用って、もしかしたら、二人をですか？"},
    {"t": "l", "s": "シミ", "x": "うん。ヌルには空白の声を本にする仕事を、博士には研究員と、ヌルの書く本の校閲をやってもらおうと思って。"},
    {"t": "bg", "v": "背景_書庫_書架"},
    {"t": "d", "x": "書庫の一角に、新しい書架が立っている。看板には「名もなきひとびとの書架」。"},
    {"t": "d", "x": "まだ数冊しか並んでいない棚の前で、ヌルが新しく完成した本の背を一冊ずつ指でなぞっている。背表紙の題は、「クフ王の友の班の一日」「王家の墓の職人たちの欠勤簿」「パルテノンを建てた人びと」。"},
    {"t": "d", "x": "目録の端には、小さな字で「編者　コンラッド」。"},
    {"t": "l", "s": "コンラッド", "x": "小さすぎないかね、この字は。私の老眼では見えんぞ……。"},
    {"t": "d", "x": "コンラッドはピントを合わせようと、本を顔の手前にやったり奥にやったりしている。"},
    {"t": "l", "s": "ヌル", "x": "これくらいでちょうどいい。"},
    {"t": "l", "s": "コンラッド", "x": "……まあいい。目録の片隅というのも、なかなか悪くない。"},
    {"t": "l", "s": "ヌル", "x": "博士の論文、戻ってこなかったね……でも、いつか必ず私が書くよ。"},
    {"t": "l", "s": "コンラッド", "x": "……クノッソスの迷宮は実在した、という説だぞ。遺跡がなかなか見つからず、エヴァンズらよりも前に一度否定されたほうだ。"},
    {"t": "l", "s": "ヌル", "x": "わかってる。否定されたことも含めて、書き残してあげるから。"},
    {"t": "d", "x": "コンラッドは何か言いかけて、やめた。"},
    {"t": "l", "s": "シミ", "x": "にぎやかになったね。"},
    {"t": "d", "x": "紙魚は笑って、新しく光りはじめた次の書架のほうへ歩き出す。"},
    {"t": "l", "s": "シミ", "x": "さ、新人さん。……そうか、もう後輩が二人もいたら、新人さんとは呼べないね。○○さん、今日も、一つずつ直していこうか。"},

let GLYPHS=null;
function glyphPool(){if(GLYPHS)return GLYPHS;GLYPHS=[];
 try{const c=document.createElement('canvas');c.width=c.height=32;const x=c.getContext('2d');x.font='24px sans-serif';x.textBaseline='top';
  const sig=ch=>{x.clearRect(0,0,32,32);x.fillText(ch,2,2);const d=x.getImageData(0,0,32,32).data;let s=0;for(let i=3;i<d.length;i+=4)s=(s*31+d[i])>>>0;return s};
  const tofu=[sig('\u{10FFFD}'),sig('￿')];
  GLYPH_SRC.forEach(set=>{const a=[...set];const t=a[0];const g=sig(t);if(g&&!tofu.includes(g))GLYPHS.push(...a)})}catch(e){}
 if(!GLYPHS.length)GLYPHS=[...GLYPH_SRC.slice(0,6).join('')];return GLYPHS}
function bookCut(lb,swap,done){const st=$('#story');if(!st||FX.reduce()){swap();done();return}
 const o=document.createElement('div');o.className='bookcut';o.id='scenecut';const G=glyphPool();const H=st.clientHeight;
 let html='<div class="bk-dark"></div>';const N=Math.round(Math.min(190,Math.max(90,st.clientWidth/7)));
 for(let i=0;i<N;i++){const g=G[Math.floor(Math.random()*G.length)];const sz=(14+Math.random()*Math.random()*58).toFixed(0);
  html+=`<span class="gl" style="left:${(Math.random()*100).toFixed(1)}%;font-size:calc(${sz}*var(--u));--d:${(1.1+Math.random()*0.9).toFixed(2)}s;--w:${(Math.random()*1.1).toFixed(2)}s;--h:${Math.round(H*(0.6+Math.random()*0.6))}px">${esc(g)}</span>`}
 o.innerHTML=html;st.appendChild(o);let fin=false,shown=false;
 const ban=()=>{if(shown)return;shown=true;swap();o.querySelectorAll('.gl').forEach(x=>x.remove());const k=o.querySelector('.bk-dark');k.style.animation='none';k.style.opacity=1;
  if(lb){const b=document.createElement('div');b.className='bk-ban';b.innerHTML=`<div class="sc-ban"><span class="sc-a">${esc(lb[0])}</span><span class="sc-b">${esc(lb[1])}</span></div>`;o.appendChild(b)}};
 const end=()=>{if(fin)return;fin=true;clearTimeout(t1);clearTimeout(t2);ban();o.classList.add('out');setTimeout(()=>{o.remove();done()},320)};
 const t1=setTimeout(ban,2150),t2=setTimeout(end,lb?3500:2500);
 o.onclick=ev=>{ev.stopPropagation();if(!shown){ban();return}end()}}

const BG_SIZE={};
function crumbleCut(done){const st=$('#story'),bg=$('#vnbg');if(!st||!bg||FX.reduce()){done();return}
 stopType();const url=(bg.style.backgroundImage.match(/url\(["']?(.*?)["']?\)/)||[])[1];if(!url){done();return}
 const go=(iw,ih)=>{const r=bg.getBoundingClientRect(),sr=st.getBoundingClientRect();const W=r.width,H=r.height;
  const sc=Math.max(W/iw,H/ih),dw=iw*sc,dh=ih*sc,ox=(W-dw)/2,oy=(H-dh)/2;
  const cols=W>H?9:6,rows=W>H?6:9,tw=W/cols,th=H/rows;const o=document.createElement('div');o.className='crumble';
  let html='';for(let y=0;y<rows;y++)for(let x=0;x<cols;x++){
   const w=(Math.random()*0.5+(rows-y)/rows*0.35+Math.abs(x-cols/2)/cols*0.2).toFixed(2);
   html+=`<div class="tl" style="left:${(r.left-sr.left)+x*tw}px;top:${(r.top-sr.top)+y*th}px;width:${tw+1}px;height:${th+1}px;background-image:url(${url});background-size:${dw}px ${dh}px;background-position:${ox-x*tw}px ${oy-y*th}px;--w:${w}s;--d:${(0.7+Math.random()*0.5).toFixed(2)}s;--x:${((Math.random()-.5)*tw*1.4).toFixed(0)}px;--y:${(H*0.9+Math.random()*H*0.4).toFixed(0)}px;--r:${((Math.random()-.5)*80).toFixed(0)}deg"></div>`}
  o.innerHTML=html;st.appendChild(o);let fin=false;const end=()=>{if(fin)return;fin=true;clearTimeout(t);done()};
  const t=setTimeout(end,1750);o.onclick=ev=>{ev.stopPropagation();end()}};
 if(BG_SIZE[url]){go(...BG_SIZE[url]);return}
 const im=new Image();im.onload=()=>{BG_SIZE[url]=[im.naturalWidth,im.naturalHeight];go(im.naturalWidth,im.naturalHeight)};im.onerror=()=>done();im.src=url}

 step()}

 for(const c of owned){if(S.party.length>=4)break;S.party.push(c.n)}}}

 const mx=Math.max(0,...Object.values(cnt));let m=1,notes=[];
 const fb=mx>=4?.35:mx===3?.2:mx===2?.1:0;if(fb){m+=fb;notes.push(`編成ボーナス＋${Math.round(fb*100)}%`)}
 if(all.some(n=>CARD[n].a===whoAttr)){m+=.1;notes.push('有利属性＋10%')}

function followUp(){B.turn++;const base=Q.filter(q=>q.ch===B.ch&&!q.q.includes(B.k.t));const pool=base.filter(q=>!B.used.has(q.id));const src=pool.length?pool:base;const q=src[Math.floor(Math.random()*src.length)];B.used.add(q.id);

/* ---------- 復活の呪文 ---------- */
const B32='0123456789ABCDEFGHJKMNPQRSTVWXYZ';
function bitsPush(arr,v,n){for(let i=n-1;i>=0;i--)arr.push((v>>i)&1)}
function bitsRead(st,n){let v=0;for(let i=0;i<n;i++)v=(v<<1)|st.b[st.p++];return v}
function hash16(bits){let h=0x9e37;for(let i=0;i<bits.length;i++){h=((h<<5)-h+bits[i]+(i%7)*13)&0xffff}return h}
/* 復活の呪文 v4：全15章・全カード・全問題に対応（中世の巻の呪文とは互換性がありません） */
function gammaPush(a,n){const k=Math.floor(Math.log2(n));for(let i=0;i<k;i++)a.push(0);bitsPush(a,n,k+1)}
function gammaRead(st){let k=0;while(st.p<st.b.length&&st.b[st.p]===0){k++;st.p++;if(k>24)return null}if(st.p+k+1>st.b.length)return null;return bitsRead(st,k+1)}
function payload(){const b=[];bitsPush(b,(S.prologue?1:0)|(S.tutorial?2:0),8);let cl=0;for(let i=0;i<NCH;i++)if(S.cleared[i])cl|=1<<i;bitsPush(b,cl,16);
 bitsPush(b,Math.min(S.shiori,16383),14);bitsPush(b,S.pity%64,6);bitsPush(b,Math.min(S.shiryo,255),8);
 CARDS.forEach(c=>bitsPush(b,lv(c.n),3));QUIZ_ORDER.forEach(id=>bitsPush(b,S.qs[id]||0,2));return b}
function encode(){const p=payload();const out=[];bitsPush(out,4,8);
 const rle=[];rle.push(p[0]);let i=0;while(i<p.length){let j=i;while(j<p.length&&p[j]===p[i])j++;gammaPush(rle,j-i);i=j}
 if(rle.length<p.length){out.push(1);out.push(...rle)}else{out.push(0);out.push(...p)}
 bitsPush(out,hash16(p),16);while(out.length%5)out.push(0);
 let s='';for(let i=0;i<out.length;i+=5){let v=0;for(let j=0;j<5;j++)v=(v<<1)|out[i+j];s+=B32[v]}
 return s.match(/.{1,4}/g).join(' ')}
function decode(str){const N=decodeRaw(str);return N?normState(N):null}
function decodeRaw(str){str=str.toUpperCase().replace(/[\s\-ー－]/g,'').replace(/O/g,'0').replace(/[IL]/g,'1');
 const b=[];for(const ch of str){const v=B32.indexOf(ch);if(v<0)return null;bitsPush(b,v,5)}
 if(b.length<8)return null;const st={b,p:0};const ver=bitsRead(st,8);if(ver!==4)return null;
 try{const L=52+CARDS.length*3+QUIZ_ORDER.length*2;const mode=b[st.p++];let p=[];
  if(mode===1){let cur=b[st.p++];while(p.length<L){const n=gammaRead(st);if(!n||n>L)return null;for(let i=0;i<n;i++)p.push(cur);cur^=1}if(p.length!==L)return null}
  else{if(st.p+L>b.length)return null;p=b.slice(st.p,st.p+L);st.p+=L}
  if(st.p+16>b.length)return null;if(hash16(p)!==bitsRead(st,16))return null;
  const ps={b:p,p:0};const f=bitsRead(ps,8);const N=freshState();N.prologue=!!(f&1);N.tutorial=!!(f&2);const cl=bitsRead(ps,16);N.cleared=Array.from({length:NCH},(_,i)=>!!(cl&(1<<i)));
  N.shiori=bitsRead(ps,14);N.pity=bitsRead(ps,6);N.shiryo=bitsRead(ps,8);
  CARDS.forEach(c=>{const v=bitsRead(ps,3);if(v)N.cards[c.n]=Math.min(5,v)});QUIZ_ORDER.forEach(id=>{const v=bitsRead(ps,2);if(v)N.qs[id]=v});return N}
 catch(e){return null}}

function CodeScreen(){const code=encode();
 show(`<div class="screen">${topbar('復活の呪文')}<div class="scroll"><div class="pane paper"><h3>いまの記録の呪文</h3>
 <p style="line-height:1.8">記録はこの端末に自動で保存されています。ただ、ブラウザの履歴を消すと記録も消えることがあるので、ときどきこの呪文を書き写しておきましょう。別の端末でも、この呪文で続きから遊べます。</p>
 <div class="code">${code}</div><p class="muted" style="font-size:14px;line-height:1.7">数字の0と1だけを使っていて、アルファベットのO・I・Lは使っていません。名前は呪文に含まれないので、入力したときにもう一度決めます。</p>
 <div class="row"><button class="btn light" id="cp">呪文をコピー</button></div></div></div></div>`);
 $('#cp').onclick=()=>{try{navigator.clipboard.writeText(code).then(()=>toast('コピーしました'),()=>toast('コピーできませんでした。書き写してください'))}catch(e){toast('コピーできませんでした。書き写してください')}}}
function SpellInput(){modal(`<h3>復活の呪文を入力</h3><textarea id="sp" rows="4" placeholder="4文字ずつ区切られていても、そのまま入力できます"></textarea>
 <div class="row"><button class="btn" id="spok">この呪文で再開する</button><button class="btn light" data-close>やめる</button></div>`);
 $('#spok').onclick=()=>{const N=decode($('#sp').value);if(!N){toast('呪文が正しくありません。打ち間違いがないか確かめてください');return}
  S=N;autoParty();closeModal(true);askName(()=>{saveNow();toast('記録を復活させました');Home()})}}



/* ---------- 記録を守る ---------- */
/* アプリ切替・タブを閉じる直前にも保存（遊び始めてからのみ。タイトル画面で古い記録を上書きしないため） */

/* この開き方で記録が残せるか確かめる */
function storageOK(){try{const k='errata_test';localStorage.setItem(k,'1');const ok=localStorage.getItem(k)==='1';localStorage.removeItem(k);return ok}catch(e){return false}}

/* ---------- 学校アカウントへの保存（GAS版のみ） ---------- */
function saveNow(){save();cloudPush(true)}
function cloudPush(force){if(!CLOUD||!CL.ready||CL.busy)return;if(!CL.dirty&&!force)return;
 CL.busy=true;CL.dirty=false;const body=JSON.stringify(S);
 google.script.run.withSuccessHandler(()=>{CL.busy=false;CL.last=Date.now();CL.fail=0})
  .withFailureHandler(()=>{CL.busy=false;CL.dirty=true;if(++CL.fail===2)toast('学校アカウントへの保存に失敗しました。通信を確かめてください')}).putSave(body)}
function cloudInit(){if(!CLOUD)return;let done=false;
 const ready=()=>{if(done)return;done=true;CL.ready=true;if($('#title'))Title()};
 setTimeout(()=>{if(!done){toast('学校アカウントの記録を読めませんでした。この端末の記録で続けます');ready()}},12000);
 google.script.run.withSuccessHandler(r=>{if(done)return;
   let local=null;try{local=JSON.parse(localStorage.getItem(SAVE_KEY)||'null')}catch(e){}
   let cloud=null;try{cloud=r&&r.data?JSON.parse(r.data):null}catch(e){}
   if(cloud&&(!local||(cloud.t||0)>(local.t||0))){CL.mem=JSON.stringify(cloud);try{localStorage.setItem(SAVE_KEY,CL.mem)}catch(e){}}
   else if(local&&(!cloud||(local.t||0)>(cloud.t||0)))CL.dirty=true,CL.pendingLocal=local;
   ready();if(CL.pendingLocal){google.script.run.putSave(JSON.stringify(CL.pendingLocal));CL.pendingLocal=null;CL.dirty=false}})
  .withFailureHandler(()=>{toast('学校アカウントの記録を読めませんでした。この端末の記録で続けます');ready()}).getSave()}
setInterval(()=>cloudPush(false),60000);
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&window.__played)cloudPush(true)});

Title();
cloudInit();
if(!CLOUD&&!storageOK())modal(`<h3>この開き方では記録が残りません</h3><p style="line-height:1.8">プライベートブラウズで開いているなど、記録を保存できない状態です。ふつうのタブで開き直すか、遊んだあとにメニューの「復活の呪文」を書き写しておいてください。</p><div class="row"><button class="btn" data-close>わかった</button></div>`);
</script>
