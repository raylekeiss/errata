<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<title>エラータ　画像の出典</title>
<style>
:root{--ink:#070c1f;--paper:#f3ead6;--paper2:#e2d5b8;--line:#b8923f;--red:#8a2a25;--mute:#6d5f4a;
  --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
  --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--ink);color:#2a2320;font-family:var(--sans);
  padding:calc(env(safe-area-inset-top,0px) + 16px) 16px calc(env(safe-area-inset-bottom,0px) + 32px)}
.wrap{max-width:860px;margin:0 auto}
.top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.top a{color:#f1ead8;border:1px solid rgba(241,234,216,.5);border-radius:2px;padding:10px 16px;text-decoration:none;font-size:14px;min-height:44px;display:inline-flex;align-items:center}
h1{font-family:var(--serif);color:#f4efe2;font-size:24px;letter-spacing:.14em;margin:0;flex:1}
.paper{background:linear-gradient(180deg,var(--paper),var(--paper2));border-radius:2px;padding:20px 22px;box-shadow:inset 0 0 0 1px var(--line),0 10px 26px rgba(0,0,0,.5);margin-bottom:16px}
.paper h2{font-family:var(--serif);font-size:18px;margin:0 0 8px;letter-spacing:.08em}
.paper p{margin:0 0 6px;line-height:1.8;font-size:14px}
input{width:100%;font-size:16px;padding:10px 12px;border:1px solid var(--line);border-radius:2px;background:#fffdf7;margin:4px 0 12px}
ul{list-style:none;margin:0;padding:0}
li{padding:10px 0;border-top:1px solid rgba(120,88,40,.3);font-size:13px;line-height:1.7}
li b{font-family:var(--serif);font-size:16px;color:#2a2320;margin-right:.6em}
li a{color:var(--red);word-break:break-all}
.lic{display:inline-block;font-size:11px;font-weight:700;padding:0 6px;border-radius:2px;background:#2a2320;color:var(--paper);margin-right:6px}
.muted{color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a href="index.html">ゲームにもどる</a><h1>画像の出典</h1></div>
  <div class="paper">
    <h2>人物の肖像について</h2>
    <p>人物の頁（カード）に使っている肖像は、Wikimedia Commons で公開されている画像を、縮小・切り抜きして使っています。作者とライセンスは下の一覧のとおりです。</p>
    <p>CC BY-SA のライセンスの画像を加工したものは、同じ CC BY-SA のライセンスのもとで扱われます。</p>
    <p>箱庭の家具のうち、写真を使ったもの（【箱庭】と付けたもの）も同じく Wikimedia Commons の画像を加工しています。</p>
    <p>シミ・コンラッドなどの登場人物の絵は、このゲームの制作者によるものです。</p>
  </div>
  <div class="paper">
    <h2>肖像と写真の一覧</h2>
    <input id="q" type="search" placeholder="名前で探す" aria-label="名前で探す">
    <p class="muted" id="count"></p>
    <ul id="list"></ul>
  </div>
</div>
<script>
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let DATA={};
function render(){const q=document.getElementById('q').value.trim();
  const names=Object.keys(DATA).filter(n=>!q||n.includes(q)).sort((a,b)=>a.localeCompare(b,'ja'));
  document.getElementById('count').textContent=names.length+'件';
  document.getElementById('list').innerHTML=names.map(n=>{const c=DATA[n];
    return `<li><b>${esc(n)}</b><span class="lic">${esc(c.license)}</span>作者：${esc(c.author)}<br><a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.file)}</a></li>`}).join('')}
fetch('credits.json').then(r=>r.json()).then(d=>{DATA=d;render()}).catch(()=>{document.getElementById('count').textContent='一覧を読み込めませんでした。'});
document.getElementById('q').addEventListener('input',render);
</script>
</body>
</html>
