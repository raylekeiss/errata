<div id="app"><div class="boot"><i></i><div>問題を読み込んでいます…</div></div></div>
<script>
/* =====================================================================
   エラータ 問題演習（単体版）
   ・問題データと見た目（CSS）は、本体（../index.html）をその場で読み込む。
     本体の問題やデザインを直せば、ここにもそのまま反映される
   ・画面は本体の「勉強モード」と同じ（背景・立ち絵・吹き出しなし）。
     ストーリー・ガチャ・栞・紙魚の一言・学校アカウント保存はない
   ・記録はこの端末（localStorage の errata_enshu_v1）だけに残る。
     形は本体の記録 S と同じ（qs / jq / zq / kj / qmy / jk）なので、あとで本体に移しやすい
   ===================================================================== */
const BASE='../';
const SAVE_KEY='errata_enshu_v1',KJ_DKEY='errata_enshu_kj_drafts';
/* 図版・地図：写真がそろった問題だけを出す（本体の ZH_TEST を false にしたのと同じ） */
const ZH_TEST=false;

const QSEC={'ORI-Q01':'先史の人類','ORI-Q02':'メソポタミア','ORI-Q03':'エジプト','ORI-Q04':'東地中海の諸民族','ORI-Q05':'オリエントの統一と四王国','ORI-Q06':'エーゲ文明',
 'IND-Q01':'インダス文明とアーリヤ人','IND-Q02':'仏教とジャイナ教','IND-Q03':'マウリヤ朝・クシャーナ朝','IND-Q04':'グプタ朝・ヴァルダナ朝と南インド',
 'CHN-Q01':'中国文明・殷・周','CHN-Q02':'春秋・戦国と諸子百家','CHN-Q03':'秦','CHN-Q04':'前漢','CHN-Q05':'後漢','CHN-Q06':'三国・晋・五胡十六国','CHN-Q07':'南北朝と文化',
 'GRM-Q01':'ポリスの成立','GRM-Q02':'アテネ民主政の歩み','GRM-Q03':'ペルシア戦争と民主政の完成','GRM-Q04':'ペロポネソス戦争とアレクサンドロス','GRM-Q05':'ギリシアの文化','GRM-Q06':'ヘレニズム文化',
 'GRM-Q07':'イランの諸国家','GRM-Q08':'共和政ローマ','GRM-Q09':'ポエニ戦争と内乱の1世紀','GRM-Q10':'帝政ローマ','Q01':'ローマ帝国の変容',
 'Q02':'キリスト教とローマ文化','Q03':'ゲルマン人の移動とフランク王国','Q04':'封建社会とノルマン人','Q05':'イスラームの成立と拡大','Q06':'アッバース朝とイスラーム諸王朝',
 'CHN-Q08':'隋','CHN-Q09':'唐の成立と制度','CHN-Q10':'唐の盛衰','CHN-Q11':'唐の文化','Q07':'ビザンツ帝国と十字軍','Q08':'教会と中世都市','Q09':'英仏の王権と百年戦争',
 'EAS-Q01':'五代十国と北宋','EAS-Q02':'北方民族の国家（遼・西夏・金）','EAS-Q03':'南宋と宋の社会・文化','EAS-Q04':'モンゴル帝国','EAS-Q05':'元',
 'EAS-Q06':'明の成立','EAS-Q07':'明の後半','EAS-Q08':'清','EAS-Q09':'東西の交流と宣教師',
 'Q11':'中世・ルネサンスの文化','MOD-Q01':'オスマン帝国','MOD-Q02':'サファヴィー朝・ムガル帝国','MOD-Q03':'大航海時代','MOD-Q04':'アメリカ文明と征服',
 'Q10':'中世末のヨーロッパ各国','MOD-Q05':'宗教改革','MOD-Q06':'主権国家と絶対王政','MOD-Q07':'イギリス革命','MOD-Q08':'ロシアの台頭',
 'MOD-Q09':'科学革命と啓蒙思想','MOD-Q10':'産業革命','MOD-Q11':'アメリカ独立革命','MOD-Q12':'フランス革命','MOD-Q13':'ナポレオン'};
const JCH=[['M','世界史へのまなざし'],['1','文明の成立'],['2','中央ユーラシアと東アジア'],['3','南アジアと東南アジア'],['4','西アジアと地中海'],['5','イスラームとヨーロッパ'],
 ['6','イスラームの伝播'],['7','ヨーロッパの変容'],['8','東アジアとモンゴル'],['9','大交易・大交流'],['10','アジアの諸帝国'],['11','近世ヨーロッパ'],
 ['12','産業革命と環大西洋革命'],['13','欧米国民国家の形成'],['14','アジア諸地域の動揺'],['15','帝国主義と民族運動'],['16','第一次世界大戦'],['17','第二次世界大戦と戦後'],['18','冷戦と第三世界'],['19','冷戦の終結と今日の世界']];
/* 通常問題演習を混ぜるときの対応表（教科書の単元 → ゲームの章）。対応する章がない単元は混ぜない */
const JMAP={'1-2':[1],'1-3':[2],'1-4':[3],'2-2':[4],'2-3':[4],'2-4':[9],'3-1':[2],'3-2':[2],'4-1':[6],'4-2':[5],'4-3':[6],'4-4':[7],'5-1':[8],'5-2':[7],
 '6-1':[8],'6-2':[8],'7-1':[10],'7-2':[10],'7-3':[10],'7-4':[10],'8-1':[11],'8-2':[11],'9-1':[12],'9-2':[13],'10-3':[12],'11-1':[13],'11-2':[14],'11-3':[14],'11-4':[14],'11-5':[14],'11-6':[15],'12-1':[15],'12-2':[15],'12-3':[15],'12-4':[15]};

const BOOKC=['#20305a','#7a1f24','#244f39','#4a3470','#5a3a22'];
const EMB={
1:'<path d="M24 40c-9-3-15-11-15-21M24 40c9-3 15-11 15-21" stroke="currentColor" stroke-width="2" fill="none"/><g fill="currentColor"><ellipse cx="11" cy="16" rx="2.5" ry="5" transform="rotate(-20 11 16)"/><ellipse cx="10" cy="25" rx="2.5" ry="5" transform="rotate(-50 10 25)"/><ellipse cx="14" cy="33" rx="2.5" ry="5" transform="rotate(-70 14 33)"/><ellipse cx="37" cy="16" rx="2.5" ry="5" transform="rotate(20 37 16)"/><ellipse cx="38" cy="25" rx="2.5" ry="5" transform="rotate(50 38 25)"/><ellipse cx="34" cy="33" rx="2.5" ry="5" transform="rotate(70 34 33)"/></g>',
2:'<path d="M21 6h6v12h12v6H27v18h-6V24H9v-6h12z" fill="currentColor"/>',
3:'<path d="M8 34l3-18 8 9 5-13 5 13 8-9 3 18z" fill="currentColor"/><rect x="8" y="36" width="32" height="5" fill="currentColor"/>',
4:'<path d="M6 30h36l-5 9H11z" fill="currentColor"/><path d="M24 8v22M24 9l12 16H24" fill="currentColor" stroke="currentColor" stroke-width="1.5"/><path d="M6 30c-3-3-3-7 1-8" stroke="currentColor" stroke-width="2" fill="none"/>',
5:'<path d="M10 40V26c0-8 6-14 14-16 8 2 14 8 14 16v14z" fill="currentColor"/><path d="M24 4v6" stroke="currentColor" stroke-width="2"/><rect x="20" y="30" width="8" height="10" rx="4" fill="#1a1a1a" opacity=".5"/>',
6:'<circle cx="24" cy="24" r="15" stroke="currentColor" stroke-width="2.5" fill="none"/><circle cx="24" cy="24" r="9" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M24 6v36M6 24h36M13 13l22 22" stroke="currentColor" stroke-width="1.5"/>',
7:'<path d="M24 5l15 6v11c0 10-7 17-15 21-8-4-15-11-15-21V11z" fill="currentColor"/><path d="M24 12v24M16 20h16" stroke="#1a1a1a" stroke-width="3" opacity=".45"/>',
8:'<circle cx="17" cy="14" r="7" stroke="currentColor" stroke-width="3" fill="none"/><path d="M21 19l16 18M30 29l4-3M34 33l4-3" stroke="currentColor" stroke-width="3"/>',
9:'<path d="M12 6v36" stroke="currentColor" stroke-width="3"/><path d="M14 8h22l-6 7 6 7H14z" fill="currentColor"/>',
10:'<circle cx="24" cy="24" r="16" stroke="currentColor" stroke-width="2" fill="none"/><path d="M24 8l4 16-4 16-4-16z" fill="currentColor"/><path d="M8 24l16-3 16 3-16 3z" fill="currentColor" opacity=".6"/>',
11:'<path d="M38 6C26 9 17 18 13 32l-3 9 7-5c12-4 19-15 21-30z" fill="currentColor"/><path d="M13 32l-4 10" stroke="currentColor" stroke-width="2"/>'};

const app=document.getElementById('app');
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function show(h){app.innerHTML=h}
function toast(t){const d=document.createElement('div');d.className='toast';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2200)}
let modalCb=null;
function modal(html,cb){closeModal(true);const m=document.createElement('div');m.className='modal';m.id='modal';m.innerHTML=`<div class="box paper">${html}</div>`;document.body.appendChild(m);modalCb=cb||null;
 m.addEventListener('click',e=>{if(e.target.closest('[data-close]')){closeModal()}})}
function closeModal(silent){const m=$('#modal');if(m)m.remove();const cb=modalCb;modalCb=null;if(!silent&&cb)cb()}
function askYes(msg,yes,onYes,onNo,no='やめる'){modal(`<h3>確認</h3><p style="line-height:1.8;white-space:pre-line">${esc(msg)}</p><div class="row"><button class="btn red" id="askY">${esc(yes)}</button><button class="btn light" data-close>${esc(no)}</button></div>`,onNo);
 $('#askY').onclick=()=>{closeModal(true);onYes()}}
const FX={busy:false,
 reduce(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}},
 _replay(el,cls,ms){if(!el)return;el.classList.remove(cls);void el.offsetWidth;el.classList.add(cls);setTimeout(()=>el.classList.remove(cls),ms)},
 pageTurn(cb){if(FX.reduce()||FX.busy){cb&&cb();return}FX.busy=true;const d=document.createElement('div');d.className='fx-page';d.innerHTML='<div class="leaf"></div>';document.body.appendChild(d);
  setTimeout(()=>{try{cb&&cb()}finally{d.classList.add('out')}},430);setTimeout(()=>{d.remove();FX.busy=false},930)}};
/* 勉強モードと同じく、解説カードに紙魚の顔は出さない */
function noteHTML(cls,head,sub,body,btn='つぎへ'){return `<div class="note parch noface"><div class="face"></div>
 <div><p class="hd ${cls}">${head}${sub?`<small>${sub}</small>`:''}</p><p class="tx">${body}</p></div><button class="nx" id="nx">${btn}</button></div>`}
function qHTML(t){return esc(t).replace(/^下線部を訂正すると？/,'<span class="qbox">下線部を訂正すると？</span>').replace(/\{\{(.+?)\}\}/g,'<u class="ul">$1</u>').replace(/\n/g,'<br>')}
function exHTML(q){return esc(q.x||'')+(q.p?`<span class="ex-p">${esc(q.p)}</span>`:'')}
function vtitle(s){const c=[...s].map(x=>x==='ー'?'丨':x==='＝'?'‖':x);const cols=c.length<=8?[c]:[c.slice(0,Math.ceil(c.length/2)),c.slice(Math.ceil(c.length/2))];
 return cols.map(col=>`<span class="col">${col.map(x=>`<b>${esc(x)}</b>`).join('')}</span>`).join('')}
function embOf(ch){return EMB[ch]||EMB[((ch-1)%11)+1]||''}

/* ---------- 記録 ---------- */
let S={};
function fresh(){return {qs:{},jq:{},zq:{},kj:{},qmy:{secs:[]},jk:{my:[],lv:'std',mix:false},mode:'jk',n:10}}
function load(){try{S=Object.assign(fresh(),JSON.parse(localStorage.getItem(SAVE_KEY)||'{}'))}catch(e){S=fresh()}}
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
load();
const saveNow=save;

/* ---------- データと見た目を本体から読み込む ---------- */
let DATA,Q,CHT,JK,JUN,JCFG,ZQS,ZI,ZMAP,KQ;
async function boot(){
 let t;
 try{const r=await fetch(BASE+'index.html',{cache:'no-cache'});t=await r.text();
  DATA=JSON.parse(t.match(/<script[^>]*id="errata-data"[^>]*>([\s\S]*?)<\/script>/)[1]);
 }catch(e){show(`<div class="boot"><div>問題を読み込めませんでした。<br>通信状態を確かめて、ページを再読み込みしてください。</div><button onclick="location.reload()">再読み込み</button></div>`);return}
 const css=t.match(/<style id="errata-css">([\s\S]*?)<\/style>/);
 if(css){const st=document.createElement('style');st.id='errata-css';st.textContent=css[1];document.head.insertBefore(st,$('#boot-css'))}
 /* 先生用の編集画面（tools/drill-edit.html）で直した分を、この端末だけ上書き（本体と同じ） */
 try{const E=JSON.parse(localStorage.getItem('errata_drill')||'{}');if(!localStorage.getItem('errata_drill_v'))for(const[id,v]of Object.entries(E))if(id.startsWith('JK-')&&v&&v.ok===0)v.ok=-1;
  for(const L of [DATA.Q,DATA.JQ||[]])for(const q of L){if(E[q.id])Object.assign(q,E[q.id])}
  if(E.__cfg&&typeof E.__cfg==='object')DATA.JCFG=Object.assign({},DATA.JCFG||{},E.__cfg);
  DATA.Q=DATA.Q.filter(q=>!q.del);if(DATA.JQ)DATA.JQ=DATA.JQ.filter(q=>!q.del)}catch(e){}
 Q=DATA.Q;CHT=DATA.chapters;JK=DATA.JQ||[];JUN=DATA.JU||{};JCFG=DATA.JCFG||{pending:1};
 ZQS=(DATA.ZQ||[]).map(q=>Object.assign(q,{z:1}));ZI=DATA.ZI||{};ZMAP=DATA.ZMAP||{pt:{},view:{},route:{},river:{}};
 KQ=(()=>{const order=Object.keys(JUN);return (DATA.KQ||[]).slice().sort((a,b)=>(order.indexOf(a.u)-order.indexOf(b.u))||(a.id<b.id?-1:1))})();
 DRMODE=S.mode||'jk';QuizMenu();
}

/* ---------- 問題の状態（0未回答・1正解・2不正解） ---------- */
const secOf=q=>q.id.replace(/-\d+$/,'');
function jkGroup(u){return u[0]==='M'?'M':u==='P1'?'1':u==='P2'?'6':u.split('-')[0]}
function jkShown(q){return q.ok===1||(!!JCFG.pending&&!q.ok)}
function jkCfg(){if(!S.jk||typeof S.jk!=='object')S.jk={};if(!Array.isArray(S.jk.my))S.jk.my=[];if(S.jk.lv!=='all')S.jk.lv='std';return S.jk}
function qmyCfg(){if(!S.qmy||typeof S.qmy!=='object')S.qmy={};if(!Array.isArray(S.qmy.secs))S.qmy.secs=[];return S.qmy}
function jkName(key){const g=String(key).slice(2);return g==='my'?'マイ範囲':((JCH.find(c=>c[0]===g)||[])[1]||g)}
function jkShort(key){const g=String(key).slice(2);return g==='my'?'マイ範囲':g==='M'?'序':'第'+g+'章'}
function jkPool(key){const c=jkCfg(),g=String(key).slice(2);const base=JK.filter(q=>jkShown(q)&&(c.lv==='all'||q.lv==='標準'));
 if(g!=='my')return base.filter(q=>jkGroup(q.u)===g);
 const us=new Set(c.my);const out=base.filter(q=>us.has(q.u));
 if(c.mix){const chs=new Set();for(const u of us)for(const ch of (JMAP[u]||[]))chs.add(ch);out.push(...Q.filter(q=>chs.has(q.ch)))}
 return out}
function jqIdx(q){return Math.max(0,parseInt(q.id.split('-').pop(),10)-1)}
function strSet(o,u,i,v){let s=o[u]||'';if(s.length<=i)s=s.padEnd(i+1,'0');o[u]=s.slice(0,i)+v+s.slice(i+1)}
function qst(q){if(q.z)return +(((S.zq||{})[q.u]||'')[jqIdx(q)]||0);if(!q.u)return S.qs[q.id]||0;return +(((S.jq||{})[q.u]||'')[jqIdx(q)]||0)}
function qSet(q,v){if(q.z)return strSet(S.zq,q.u,jqIdx(q),v);if(!q.u){S.qs[q.id]=v;return}strSet(S.jq,q.u,jqIdx(q),v)}
function poolOf(key){if(String(key).startsWith('Z:'))return zhPool(key);if(key==='T:my'){const ss=new Set(qmyCfg().secs);return Q.filter(q=>ss.has(secOf(q)))}return typeof key==='number'?Q.filter(q=>q.ch===key):String(key).startsWith('J:')?jkPool(key):[]}
function labelOf(key){if(String(key).startsWith('Z:'))return '図版・地図　'+(key==='Z:all'?'全範囲':jkName('J:'+key.slice(2)));if(key==='T:my')return '試験範囲　マイ範囲';if(String(key).startsWith('J:'))return '受験対策　'+jkName(key);return '第'+key+'章「'+CHT[key]+'」'}
function chStat(key){const pool=poolOf(key);return {n:pool.length,done:pool.filter(q=>qst(q)===1).length}}

/* ---------- 図版・地図 ---------- */
const ZH_KANA=['ア','イ','ウ','エ'];
function zhHas(k){return !!(ZI[k]&&ZI[k].f)}
function zhReady(q){return q.t==='img-name'?zhHas(q.img):q.t==='img-pick'?[q.a,...q.d].every(zhHas):true}
function zhPool(key){const g=String(key).slice(2);return ZQS.filter(q=>(ZH_TEST||zhReady(q))&&(g==='all'||jkGroup(q.u)===g))}
function zhKana(q){return q.t==='map-pick'||q.t==='img-pick'}
function zhAns(q){if(!q.z)return q.a;if(q.t==='img-pick')return (ZI[q.a]||{}).l||q.a;return q.a}
function zhSrc(k){return zhHas(k)?BASE+'img/zuhan/'+k+'.webp':''}
function zhPhoto(k,showName){const im=ZI[k]||{},src=zhSrc(k);
 if(src)return `<img class="zph" src="${src}" alt="" draggable="false">`+(im.a?`<span class="zcr">${esc(im.a)} / ${esc(im.lic||'')}</span>`:'');
 return `<div class="zna"><b>写真準備中</b>${showName?esc(im.l||k):''}</div>`}
function zhMap(view,inner){const v=ZMAP.view[view];const [x,y,w,h]=v;const R=ZMAP.river||{};const m=Math.max(w,h*1.25);
 return `<svg class="zmap" viewBox="${x} ${y} ${w} ${h}" preserveAspectRatio="xMidYMid meet"><rect x="${x-w}" y="${y-h}" width="${w*3}" height="${h*3}" fill="#d5e2e6"/>
  <path class="zland" d="${ZMAP.land}" fill-rule="evenodd"/>
  <path class="zlk" d="${ZMAP.lake||''}"/>
  <g class="zrv">${Object.values(R).map(r=>`<path d="${r.d}"/>`).join('')}</g>
  <g class="zrvl">${Object.entries(R).filter(([k,r])=>r.lb).map(([k,r])=>`<text x="${r.lb[0]}" y="${r.lb[1]}" font-size="${m*.021}" stroke-width="${m*.006}">${esc(k)}</text>`).join('')}</g>${inner(m)}</svg>`}
function zhMarker(name,k,w,i){const [px,py]=ZMAP.pt[name];const r=w*.011,R=w*.028,fs=w*.03,lx=px+R*1.15,ly=py-R*1.15;
 return `<g class="mk" data-i="${i}"><circle class="dot" cx="${px}" cy="${py}" r="${r}"/>
  <g class="lbl"><line x1="${px}" y1="${py}" x2="${lx}" y2="${ly}" stroke="#2a2320" stroke-width="1" vector-effect="non-scaling-stroke"/><circle cx="${lx}" cy="${ly}" r="${R*.8}" stroke-width="1.5" vector-effect="non-scaling-stroke"/><text x="${lx}" y="${ly}" font-size="${fs}">${k}</text></g>
  <text class="nm" x="${lx+R}" y="${ly}" font-size="${fs*.8}" stroke-width="${fs*.22}" dominant-baseline="central">${esc(name)}</text>
  <circle class="hit" cx="${(px+lx)/2}" cy="${(py+ly)/2}" r="${R*1.6}"/></g>`}
function zhVis(q,opts){let h='';
 if(q.t==='map-pick')h=zhMap(q.view,w=>opts.map((o,i)=>zhMarker(o,ZH_KANA[i],w,i)).join(''));

 box.querySelectorAll('[data-s]').forEach(i=>i.onchange=()=>{const all=[...box.querySelectorAll(`[data-ch="${i.dataset.ch}"]`)];const h=box.querySelector(`[data-c="${i.dataset.ch}"]`);if(h)h.checked=all.every(x=>x.checked);cnt()});cnt();

 const groups=JCH.map(([g,n])=>{const us=Object.keys(JUN).filter(u=>jkGroup(u)===g);if(!us.length)return '';

/* ---------- 4択の出題（本体と同じ画面。栞の表示はなし） ---------- */
let QZ=null;
function drillPick(key){const pool=poolOf(key);
 const fresh=shuffle(pool.filter(q=>qst(q)===0)),wrong=shuffle(pool.filter(q=>qst(q)===2)),done=shuffle(pool.filter(q=>qst(q)===1));
 const list=fresh.concat(wrong,done).slice(0,S.n||10);
 const mode=fresh.length?'fresh':wrong.length?'wrong':'random';
 const msg=mode==='fresh'?`まだ解いていない問題から出すよ（残り${fresh.length}問）`:mode==='wrong'?`一周したね。間違えた問題を復習しよう（残り${wrong.length}問）`:'全部正解済み！　ランダムに出すよ';
 return {list,mode,msg}}
function startQuiz(key){const pick=drillPick(key);QZ={key,label:labelOf(key),list:pick.list,mode:pick.mode,i:0,wrong:[],res:[]};toast(pick.msg);quizQ()}
function quizQ(){const q=QZ.list[QZ.i];const top=typeof QZ.key==='number'?`第${QZ.key}章<br>${esc(CHT[QZ.key])}`:QZ.key==='T:my'?'試験範囲<br>マイ範囲':String(QZ.key).startsWith('J:')?'受験対策<br>'+jkShort(QZ.key):'図版・地図<br>'+(QZ.key==='Z:all'?'全範囲':jkShort('J:'+QZ.key.slice(2)));
 show(`<div class="dr q" id="drill"><div class="dr-bg"></div>
  <div class="scr-title">${top}<br><small style="font-size:.75em;opacity:.8">${({fresh:'はじめての問題',wrong:'間違えた問題の復習',random:'ランダム'})[QZ.mode]}</small></div>
  <div class="dr-tabs"><div class="tb">${QZ.list.map((_,i)=>`<i class="${QZ.res[i]===true?'ok':QZ.res[i]===false?'ng':''} ${i===QZ.i?'cur':''}">${QZ.res[i]===true?'✦':QZ.res[i]===false?'✕':''}</i>`).join('')}</div><span class="ct">${QZ.i+1} / ${QZ.list.length}</span></div>
  <button class="gc-back tl" id="qQuit">やめる</button>
  <div class="dr-flow" id="qflow"><div class="dr-paper parch"><p>${qHTML(q.q)}</p></div>
  ${q.z?zhVis(q,QZ.opts=shuffle([q.a,...q.d])):''}
  <div class="dr-opts${q.z&&zhKana(q)?' zh-k':''}" id="qo">${(q.z?QZ.opts:shuffle([q.a,...q.d])).map((o,i)=>`<button class="slip" data-v="${esc(o)}">${q.z&&zhKana(q)?ZH_KANA[i]:esc(o)}</button>`).join('')}</div>
  <div class="dr-note" id="qr"></div></div></div>`);
 QZ.answered=false;
 $('#qQuit').onclick=()=>{const back=()=>FX.pageTurn(QuizMenu);if(QZ.i===0&&QZ.res[0]===undefined)back();else askYes('問題演習を中断しますか？（ここまでの正解・不正解は記録されています）','中断する',back,null,'続ける')};
 const answer=b=>{if(QZ.answered)return;QZ.answered=true;document.querySelectorAll('#qo .slip').forEach(x=>{x.disabled=true;if(x.dataset.v===q.a)x.classList.add('right')});
  const ok=b.dataset.v===q.a;if(q.z)zhReveal(q,b.dataset.v);
  if(ok)qSet(q,1);else{b.classList.add('wrong');qSet(q,2);QZ.wrong.push(q)}
  QZ.res[QZ.i]=ok;save();
  const tabs=document.querySelectorAll('.dr-tabs .tb i');tabs[QZ.i].className=ok?'ok cur':'ng cur';tabs[QZ.i].textContent=ok?'✦':'✕';
  $('#qr').innerHTML=noteHTML(ok?'ok':'ng',ok?'正解！':'おしい……',ok?'':`正しくは${/^「.*」$/.test(zhAns(q))?esc(zhAns(q)):'「'+esc(zhAns(q))+'」'}`,exHTML(q),QZ.i+1<QZ.list.length?'つぎの問題':'結果を見る');
  setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})},60);
  $('#nx').onclick=()=>{QZ.i++;if(QZ.i<QZ.list.length)quizQ();else FX.pageTurn(quizEnd)}};
 document.querySelectorAll('#qo .slip').forEach(b=>b.onclick=()=>answer(b));
 if(q.z)document.querySelectorAll('#zv [data-i]').forEach(g=>g.addEventListener('click',()=>{const b=document.querySelectorAll('#qo .slip')[+g.dataset.i];if(b)answer(b)}))}
function quizEnd(){const w=QZ.wrong;const n=QZ.res.filter(x=>x!==undefined).length;
 show(`<div class="dr q" id="drill"><div class="dr-bg"></div>
  <div class="dr-res parch"><h3>${n-w.length===n?'全問正解！':'おつかれさま'}</h3><p class="sc">正解 ${n-w.length}／${n}問</p><p class="sub">${esc(QZ.label)}</p>
  ${w.length?`<div class="wl"><p style="font-weight:600">間違えた問題</p>${w.map(q=>`<p>${qHTML(q.q)}<br><b>答え：${esc(zhAns(q))}</b></p>`).join('')}<p class="sub">間違えた問題は、この棚を一周したあとに優先して出ます。</p></div>`:''}
  <div class="rowb"><button class="btn red" id="again">もう一度解く</button><button class="btn light" id="toShelf">ほかの棚を選ぶ</button></div></div></div>`);
 $('#again').onclick=()=>FX.pageTurn(()=>startQuiz(QZ.key));$('#toShelf').onclick=()=>FX.pageTurn(QuizMenu)}

/* ---------- 記述対策（本体と同じ画面。栞はなし） ---------- */
const KJ_MINUS=[[-2,'範囲外・論点からそれた記述がある','問われていない時代・地域の話や、問いと関係のない事項'],[-2,'誤植がある','時代・用語・因果関係・事実の誤り']];
let KJM='b',KJ=null;
function kjRec(id){if(!S.kj||typeof S.kj!=='object')S.kj={};return S.kj[id]||[0,-1,-1]}
function kjSet(id,i,v){const r=kjRec(id).slice();r[i]=v;S.kj[id]=r}
function kjDrafts(){try{return JSON.parse(localStorage.getItem(KJ_DKEY)||'{}')||{}}catch(e){return {}}}
function kjDraftSet(id,v){try{const d=kjDrafts();if(v)d[id]=v;else delete d[id];localStorage.setItem(KJ_DKEY,JSON.stringify(d))}catch(e){}}
function kjLen(s){return [...String(s).replace(/\r?\n/g,'')].length}
function kjMax(p){return p.rb.reduce((a,r)=>a+(r[0]>0?r[0]:0),0)}
function kjSeedShuffle(a,seed){a=a.slice();let h=0;for(const ch of seed)h=(h*31+ch.charCodeAt(0))>>>0;for(let i=a.length-1;i>0;i--){h=(h*1103515245+12345)>>>0;const j=h%(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function kjTermsShown(p){return kjSeedShuffle(p.terms||[],p.id)}
function kjModel(p){return p.ms.join('')}
function kjWrongList(p){const L=p.ms.map((s,i)=>({s,i}));const ins=[];
 (p.er||[]).forEach((e,n)=>{if(e.at!=null)ins.push({e,n});else{const o=L[e.i];o.s=o.s.replace(e.c,e.w);o.e=e;o.n=n}});
 ins.sort((a,b)=>b.e.at-a.e.at).forEach(({e,n})=>L.splice(e.at,0,{s:e.s,e,n,ins:true}));return L}
function kjReadList(p){const rd=(p.rd||[]).map(r=>({t:'c',...r}));const k=p.ord||0;
 if(k>=3){const a=p.terms.slice(0,k);let o=kjSeedShuffle(a,p.id+'o');if(o.join()===a.join())o=o.slice(1).concat(o[0]);rd.splice(Math.min(1,rd.length),0,{t:'o',q:'指定語句を年代の古い順に並べよう。',o,a})}
 return rd}
function kjCh(p){return jkGroup(p.u)}
function kjPoolCh(g){return KQ.filter(p=>kjCh(p)===g)}
function kjDoneN(list){return list.filter(p=>KJM==='b'?kjRec(p.id)[0]>0:kjRec(p.id)[2]>=0).length}
function KjMenu(){const chs=JCH.filter(c=>KQ.some(p=>kjCh(p)===c[0]));
 const keys=['R',...chs.map(c=>c[0])];
 show(`<div class="dr" id="drill"><div class="dr-bg"></div><div class="gc-shade"></div>
  <div class="gc-title">問題演習</div>
  <button class="gc-back tl ens-rec" id="ensRec">記録</button>
  ${modeTabs('kj')}
  <div class="dr-sub"><button data-kjm="b" class="${KJM==='b'?'on':''}">基本問題</button><button data-kjm="j" class="${KJM==='j'?'on':''}">実戦問題</button></div>
  <div class="shelf2-board"></div>
  <div class="shelf2 jk" id="shelf">${keys.map((g,ix)=>{const isR=g==='R';const list=isR?KQ:kjPoolCh(g);const done=kjDoneN(list);const on=Math.round(5*done/Math.max(1,list.length));
   const name=isR?(KJM==='b'?'おまかせ':'ランダム出題'):((JCH.find(c=>c[0]===g)||[])[1]||g);
   return `<button class="tome2${isR?' my':''}" data-kj="${g}" style="--bc:${isR?'#6b5320':BOOKC[ix%BOOKC.length]}"><span class="med"><svg viewBox="0 0 48 48">${isR?EMB[9]:embOf(g==='M'?ix:+g)}</svg></span><span class="no">${isR?'全範囲から':g==='M'?'序':'第'+g+'章'}</span>
    <span class="lbl">${vtitle(name)}</span><span class="beads">${[0,1,2,3,4].map(i=>`<i class="${i<on?'on':''}"></i>`).join('')}</span><span class="cnt">${done}／${list.length}</span></button>`}).join('')}</div></div>`);
 bindMenu();
 document.querySelectorAll('[data-kjm]').forEach(b=>b.onclick=()=>{KJM=b.dataset.kjm;KjMenu()});
 document.querySelectorAll('[data-kj]').forEach(b=>b.onclick=()=>{FX._replay(b,'fx-glow',500);const g=b.dataset.kj;
  if(g==='R'){const fr=KQ.filter(p=>KJM==='b'?kjRec(p.id)[0]===0:kjRec(p.id)[2]<0);const pool=fr.length?fr:KQ;if(!pool.length){toast('まだ問題がありません');return}
   const p=pool[Math.floor(Math.random()*pool.length)];toast(fr.length?(KJM==='b'?'まだクリアしていない問題から選んだよ':'まだ書いていない問題から選んだよ'):'全部取り組み済み！　ランダムに選んだよ');FX.pageTurn(()=>kjStart(p.id));return}
  kjList(g)})}
function kjList(g){const list=kjPoolCh(g);const name=(JCH.find(c=>c[0]===g)||[])[1]||g;
 modal(`<h3>${g==='M'?'':'第'+g+'章　'}${esc(name)}</h3><p class="sub" style="margin-top:-6px">${KJM==='b'?'基本問題：設問の読み解き → 誤植答案の訂正':'実戦問題：基本問題と同じ設問を、実際に書いて答える'}</p>
  <div class="kj-list">${list.map(p=>{const r=kjRec(p.id);const st=KJM==='b'?(r[0]?`<b>${r[0]}</b>回クリア`:'未クリア'):(r[2]>=0?`<b>${r[2]}</b>／${kjMax(p)}点`:(kjDrafts()[p.id]?'書きかけ':'未挑戦'));
   return `<button class="kj-it" data-id="${p.id}"><span class="nm">${esc(p.t)}</span><span class="st">${st}</span><small>${p.lim}字${KJM==='j'&&r[0]?'・基本クリア済み':''}</small></button>`}).join('')}</div>
  <div class="row"><button class="btn light" data-close>閉じる</button></div>`);
 document.querySelectorAll('.kj-it').forEach(b=>b.onclick=()=>{closeModal(true);FX.pageTurn(()=>kjStart(b.dataset.id))})}
function kjBack(){KJ=null;FX.pageTurn(()=>{DRMODE='kj';QuizMenu()})}
function kjStart(id){const p=KQ.find(x=>x.id===id);if(!p)return;KJ={p,mode:KJM,step:0,ri:0,ok:0,fixed:{}};kjDraw()}
function kjFrame(inner){const p=KJ.p,g=kjCh(p);
 show(`<div class="dr q kj" id="drill"><div class="dr-bg"></div>
  <div class="kj-scroll" id="kjS"><div class="kj-head"><button class="gc-back tl" id="kjQuit">やめる</button><div class="scr-title">記述対策　${KJ.mode==='b'?'基本問題':'実戦問題'}<br>${g==='M'?'序':'第'+g+'章'}</div></div><div class="kj-col">
   <h2 class="kj-tt">${esc(p.t)}</h2>
   ${KJ.mode==='b'?`<div class="kj-steps"><span class="${KJ.step===0?'cur':'done'}">STEP 1　設問を読み解く</span><span class="${KJ.step===1?'cur':''}">STEP 2　誤植答案を正す</span></div>`:''}
   <div class="kj-q parch corners"><p>${esc(p.q)}</p>${p.terms&&p.terms.length?`<div class="kj-terms" id="kjTerms">${kjTermsShown(p).map(t=>`<span data-t="${esc(t)}">${esc(t)}</span>`).join('')}</div>`:''}</div>
   <div id="kjBody">${inner}</div></div></div></div>`);
 $('#kjQuit').onclick=()=>{if(KJ.mode==='b'&&(KJ.step>0||KJ.ri>0))askYes('この問題を中断しますか？（最初からやり直しになります）','中断する',kjBack,null,'続ける');else kjBack()}}
function kjTop(){const s=$('#kjS');if(s)s.scrollTop=0}
function kjDraw(){if(KJ.mode==='j')return kjWrite();if(KJ.step===0)kjRead();else kjFix()}
function kjRead(){const p=KJ.p,R=kjReadList(p);
 if(KJ.ri>=R.length){const r=kjRec(p.id);if(KJ.ok>r[1])kjSet(p.id,1,KJ.ok);save();
  kjFrame(`<div class="kj-card parch"><h3>STEP 1 おわり</h3><p class="kj-score"><b>${KJ.ok}</b> / ${R.length}問</p><div class="row"><button class="btn red" id="kjNx">STEP 2　誤植答案を正す</button></div></div>`);
  $('#kjNx').onclick=()=>{KJ.step=1;kjDraw();kjTop()};return}
 const it=R[KJ.ri];
 kjFrame(`<div class="kj-hd"><span>STEP 1</span><span class="ct">${KJ.ri+1} / ${R.length}</span></div><p class="kj-ask">${esc(it.q)}</p><div id="kjA"></div><div id="kjN"></div>`);
 const A=$('#kjA'),N=$('#kjN');
 const fin=(ok,ans)=>{if(ok)KJ.ok++;N.innerHTML=noteHTML(ok?'ok':'ng',ok?'正解':'ちがう','',ok?'':`正しくは「${esc(ans)}」`,KJ.ri+1<R.length?'つぎへ':'結果を見る');
  $('#nx').onclick=()=>{KJ.ri++;kjDraw()};setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})},60)};
 if(it.t==='c'){A.innerHTML=`<div class="kj-opts">${it.o.map((o,j)=>`<button class="slip" data-j="${j}">${esc(o)}</button>`).join('')}</div>`;
  A.querySelectorAll('.slip').forEach(b=>b.onclick=()=>{const j=+b.dataset.j;A.querySelectorAll('.slip').forEach((x,k)=>{x.disabled=true;if(k===it.a)x.classList.add('right')});if(j!==it.a)b.classList.add('wrong');fin(j===it.a,it.o[it.a])})}
 else kjSort(A,it,fin)}
let KJ_DRAG=false;document.addEventListener('touchmove',e=>{if(KJ_DRAG)e.preventDefault()},{passive:false});
function kjSort(A,it,fin){A.innerHTML=`<p class="kj-hint">長押しして、上下にスライドすると入れ替えられる。上が古い。</p><div class="kj-sort">${it.o.map(o=>`<div class="srt" data-v="${esc(o)}"><span class="grip">≡</span><span>${esc(o)}</span></div>`).join('')}</div><div class="row"><button class="btn red" id="kjChk">答え合わせ</button></div>`;
 const g=A.querySelector('.kj-sort');let drag=null,timer=null,sx=0,sy=0;
 const end=()=>{clearTimeout(timer);timer=null;if(!drag)return;drag.el.classList.remove('drag');drag.el.style.transform='';drag=null;KJ_DRAG=false};
 g.addEventListener('pointerdown',e=>{const el=e.target.closest('.srt');if(!el||g.classList.contains('lock'))return;sx=e.clientX;sy=e.clientY;
  timer=setTimeout(()=>{drag={el,y0:sy};KJ_DRAG=true;el.classList.add('drag');try{el.setPointerCapture(e.pointerId)}catch(_){}},220)});
 g.addEventListener('pointermove',e=>{if(!drag){if(timer&&Math.hypot(e.clientX-sx,e.clientY-sy)>8){clearTimeout(timer);timer=null}return}
  const el=drag.el,y=e.clientY,before=el.offsetTop;
  for(let k=0;k<20;k++){const pv=el.previousElementSibling,nx=el.nextElementSibling;
   if(pv&&y<pv.getBoundingClientRect().top+pv.offsetHeight/2){g.insertBefore(pv,el.nextSibling);continue}
   if(nx&&y>nx.getBoundingClientRect().top+nx.offsetHeight/2){g.insertBefore(nx,el);continue}break}
  drag.y0+=el.offsetTop-before;el.style.transform=`translateY(${y-drag.y0}px)`});
 ['pointerup','pointercancel','lostpointercapture'].forEach(t=>g.addEventListener(t,end));g.addEventListener('contextmenu',e=>e.preventDefault());
 $('#kjChk').onclick=()=>{const ord=[...g.children].map(x=>x.dataset.v);const ok=ord.every((o,i)=>o===it.a[i]);
  [...g.children].forEach((c,i)=>{c.classList.add(c.dataset.v===it.a[i]?'right':'wrong');c.querySelector('.grip').textContent=i+1});g.classList.add('lock');$('#kjChk').remove();fin(ok,it.a.join(' → '))}}
function kjFix(){const p=KJ.p,L=kjWrongList(p);const errs=L.filter(x=>x.e);const nF=errs.filter(x=>KJ.fixed[x.n]).length,all=nF===errs.length;
 kjFrame(`<div class="kj-hd"><span>STEP 2</span><span class="ct">訂正 ${nF} / ${errs.length}</span></div>
  <p class="kj-hint">この答案には誤植が${errs.length}か所ある。1文ずつタップできるので、おかしいと思う文を選ぼう。</p>
  <div class="kj-paper parch" id="kjP">${L.map((x,k)=>{if(x.e&&KJ.fixed[x.n]){const fx=x.ins?'':p.ms[x.i];return `<span class="seg fixed${x.ins?' cut':''}"><s>${esc(x.s)}</s>${fx?`<em>${esc(fx)}</em>`:''}</span>`}
   return `<span class="seg${all?' lock':''}" data-k="${k}">${esc(x.s)}</span>`}).join('')}</div><div id="kjPn"></div>`);
 const pn=$('#kjPn');
 if(all){const r=kjRec(p.id);kjSet(p.id,0,r[0]+1);save();
  pn.innerHTML=`<div class="kj-card parch"><h3>クリア</h3><p>誤植を${errs.length}か所すべて訂正した。${kjRec(p.id)[0]}回目のクリア。</p>
   <div class="row"><button class="btn red" id="kjBk">棚にもどる</button><button class="btn light" id="kjRe">最初からもう一度</button></div></div>`;
  $('#kjBk').onclick=kjBack;$('#kjRe').onclick=()=>{KJ={...KJ,step:0,ri:0,ok:0,fixed:{}};kjDraw();kjTop()};return}
 document.querySelectorAll('#kjP .seg[data-k]').forEach(el=>el.onclick=()=>{document.querySelectorAll('#kjP .seg.sel').forEach(x=>x.classList.remove('sel'));el.classList.add('sel');const x=L[+el.dataset.k];
  pn.innerHTML=`<div class="kj-card parch"><p class="kj-pick">${esc(x.s)}</p><p class="kj-lbl">この文を修正する？</p><div class="row" id="kjYN"><button class="btn red" id="kjY">修正する</button><button class="btn light" id="kjNo">やめる</button></div><div id="kjF"></div></div>`;
  $('#kjNo').onclick=()=>{el.classList.remove('sel');pn.innerHTML=''};
  $('#kjY').onclick=()=>{$('#kjYN').remove();const F=$('#kjF');
   if(!x.e){F.innerHTML='<p>この文はこのままで正しい。ほかの文を見てみよう。</p>';return}
   const e=x.e;let opts;
   if(x.ins)opts=[{t:'この一文を消す',ok:1},{t:'この一文を答案の最初に移す'},{t:'この一文を答案の最後に移す'},{t:'この一文の前の文を消す'}];
   else{const base=p.ms[x.i];const mk=(rep)=>esc(base.split(e.c).join('\u0001')).split('\u0001').join(`<b>${esc(rep)}</b>`);opts=[{h:mk(e.c),ok:1},...e.d.map(d=>({h:mk(d)}))]}
   opts=shuffle(opts);
   F.innerHTML=`<p class="kj-lbl">どう修正する？</p><div class="kj-opts">${opts.map((o,j)=>`<button class="slip kj-long" data-j="${j}"><span>${o.h||esc(o.t)}</span></button>`).join('')}</div><div id="kjX"></div>`;
   F.querySelectorAll('.slip').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.j];if(!o.ok){b.classList.add('wrong');b.disabled=true;return}
    F.querySelectorAll('.slip').forEach(z=>z.disabled=true);b.classList.add('right');
    $('#kjX').innerHTML=noteHTML('ok','訂正',esc(e.k),esc(e.x||''),'答案に赤を入れる');
    $('#nx').onclick=()=>{KJ.fixed[x.n]=1;const sc=$('#kjS').scrollTop;kjFix();$('#kjS').scrollTop=sc};setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})},60)})};
  setTimeout(()=>pn.scrollIntoView({block:'nearest',behavior:'smooth'}),40)})}
function kjWrite(){const p=KJ.p,r=kjRec(p.id),l8=Math.ceil(p.lim*.8);
 kjFrame(`<p class="kj-hint">指定語句は、書くと上の枠で色が付く（下線は自動で引いた扱い）。まずは書き上げてから、自分で採点しよう。書きかけはこの端末に残る。</p>
  <textarea class="kj-ta parch" id="kjTa" placeholder="ここに答案を書く">${esc(kjDrafts()[p.id]||'')}</textarea>
  <div class="kj-meter"><div class="bar"><i id="kjBi"></i><span class="mk"></span></div><div class="txt"><span><b id="kjCn">0</b> / ${p.lim}字</span><span id="kjCm"></span></div></div>
  <div class="row"><button class="btn red" id="kjGo">書けたので自己採点する</button></div><div id="kjG"></div>`);
 const ta=$('#kjTa');
 const upd=()=>{const v=ta.value,n=kjLen(v);kjDraftSet(p.id,v);$('#kjCn').textContent=n;const bi=$('#kjBi');bi.style.width=Math.min(100,n/p.lim*100)+'%';bi.className=n>p.lim?'over':n>=l8?'good':'';
  document.querySelectorAll('#kjTerms span').forEach(s=>s.classList.toggle('on',v.includes(s.dataset.t)));
  const cm=$('#kjCm');cm.textContent=n>p.lim?`${n-p.lim}字オーバー`:n<l8?`8割（${l8}字）まであと${l8-n}字`:'字数OK';cm.className=n>p.lim?'ng':n>=l8?'ok':'';
  return {v,n,miss:(p.terms||[]).filter(t=>!v.includes(t))}};
 ta.oninput=upd;upd();
 $('#kjGo').onclick=()=>{const {n,miss}=upd();const G=$('#kjG');const warn=[];
  if(!n)warn.push('まだ何も書いていない。');if(n>p.lim)warn.push(`字数オーバー（${n}字）。入試では採点されないこともある。`);else if(n&&n<p.lim*.5)warn.push('制限字数の半分以下。入試では採点されないこともある。');
  if(miss.length)warn.push('使っていない指定語句：'+miss.join('、'));
  const RB=p.rb.concat(KJ_MINUS),max=kjMax(p),chk={};
  G.innerHTML=`<div class="kj-card parch"><h3>機械チェック</h3>${warn.length?warn.map(w=>`<p class="ng">${esc(w)}</p>`).join(''):'<p class="ok">字数・指定語句はOK。ここから先は中身の採点。</p>'}</div>
   <div class="kj-card parch"><h3>自己採点</h3><p class="kj-hint" style="color:#6d5f4a">模範解答と見比べて、書けているものにチェック。点線の項目は当てはまったらチェック（減点）。</p>
   <div class="kj-rub">${RB.map((x,i)=>`<label class="${x[0]<0?'minus':''}"><input type="checkbox" data-i="${i}"><span>${esc(x[1])}<small>${esc(x[2])}</small></span><b>${x[0]>0?'+':''}${x[0]}</b></label>`).join('')}</div>
   <p class="kj-score"><b id="kjSc">0</b> / ${max}点</p>
   <details class="kj-model"><summary>模範解答を見る</summary><p>${(()=>{let h=esc(kjModel(p));(p.terms||[]).forEach(t=>{h=h.split(esc(t)).join(`<u>${esc(t)}</u>`)});return h})()}</p><small>${kjLen(kjModel(p))}字</small></details>
   <div class="row"><button class="btn red" id="kjDone">採点を記録する</button><button class="btn light" id="kjBk2">棚にもどる</button></div></div>`;
  const calc=()=>{let s=0;RB.forEach((x,i)=>{if(chk[i])s+=x[0]});return Math.max(0,s)};
  G.querySelectorAll('.kj-rub input').forEach(c=>c.onchange=()=>{chk[c.dataset.i]=c.checked;$('#kjSc').textContent=calc()});
  $('#kjBk2').onclick=kjBack;
  $('#kjDone').onclick=()=>{const s=calc(),rr=kjRec(p.id);if(s>rr[2]||rr[2]<0)kjSet(p.id,2,s);save();
   modal(`<h3>自己採点を記録した</h3><p style="line-height:1.8;text-align:center">${s}／${max}点で記録しました。<br><small>これまでの最高：${kjRec(p.id)[2]}点</small></p><div class="row" style="justify-content:center"><button class="btn red" data-close>棚にもどる</button></div>`,kjBack)};
  setTimeout(()=>G.scrollIntoView({block:'start',behavior:'smooth'}),60)}}

boot();
</script>
</body>
</html>
