<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1c2540">
<meta name="robots" content="noindex, nofollow">
<title>エラータ 問題演習</title>
<style>
:root{
 --ink:#1c2540;--ink2:#2b3658;--paper:#eceee6;--paper2:#dfe2d6;--card:#fbfaf5;--line:#c6cabb;
 --red:#c4302b;--gold:#a8873a;--mute:#6c7280;--ok:#3f7a3a;--okbg:#e3efdf;--ngbg:#f6e1de;
 --serif:"Hiragino Mincho ProN","Yu Mincho","YuMincho","Noto Serif JP",serif;
 --sans:"Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","YuGothic","Noto Sans JP",sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:default}
#app{min-height:100vh;min-height:100dvh}

/* ヘッダー */
.hd{position:sticky;top:0;z-index:20;background:var(--ink);color:#f3efe3;padding:calc(env(safe-area-inset-top) + 10px) 16px 0;box-shadow:0 2px 10px rgba(0,0,0,.25)}
.hd-row{display:flex;align-items:center;gap:10px;max-width:1080px;margin:0 auto}
.logo{font-family:var(--serif);font-size:20px;letter-spacing:.06em;margin:0;flex:1;white-space:nowrap}
.logo small{font-family:var(--sans);font-size:12px;letter-spacing:.1em;opacity:.7;margin-left:10px}
.hbtn{background:transparent;border:1px solid rgba(255,255,255,.35);border-radius:6px;color:#f3efe3;padding:5px 12px;font-size:14px;min-height:36px}
.tabs{display:flex;gap:2px;max-width:1080px;margin:10px auto 0;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex:1 0 auto;background:transparent;border:0;color:rgba(243,239,227,.7);padding:10px 14px 12px;font-size:15px;border-bottom:3px solid transparent;white-space:nowrap}
.tabs button.on{color:#fff;border-bottom-color:var(--red);font-weight:700}

.wrap{max-width:1080px;margin:0 auto;padding:18px 16px 60px}
.lead{color:var(--mute);font-size:14px;margin:0 0 14px}
.seg{display:inline-flex;background:var(--paper2);border-radius:8px;padding:3px;margin:0 0 16px}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:6px;font-size:14px;min-height:38px}
.seg button.on{background:var(--card);box-shadow:0 1px 3px rgba(0,0,0,.15);font-weight:700}

/* 棚 */
.shelf{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px}
.bk{display:flex;flex-direction:column;align-items:stretch;text-align:left;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ink2);border-radius:8px;padding:12px 14px;min-height:96px;transition:transform .12s,box-shadow .12s}
.bk:hover{box-shadow:0 3px 10px rgba(0,0,0,.08)}
.bk:active{transform:scale(.98)}
.bk.my{border-left-color:var(--red);background:#fff8f4}
.bk .no{font-size:12px;color:var(--mute);letter-spacing:.05em}
.bk .nm{font-family:var(--serif);font-size:17px;font-weight:700;line-height:1.4;margin:2px 0 8px;flex:1}
.bar{height:6px;background:var(--paper2);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ok);border-radius:3px}
.bk .ct{font-size:12px;color:var(--mute);margin-top:4px;display:flex;justify-content:space-between}

/* 出題画面 */
.qtop{position:sticky;top:0;z-index:20;background:var(--ink);color:#f3efe3;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px}
.qtop .r{display:flex;align-items:center;gap:10px;max-width:960px;margin:0 auto}
.qtop .lb{flex:1;font-size:14px;line-height:1.35;min-width:0}
.qtop .lb small{display:block;opacity:.7;font-size:12px}
.dots{display:flex;gap:4px;flex-wrap:wrap;justify-content:flex-end;max-width:50%}
.dots i{width:12px;height:12px;border-radius:50%;background:rgba(255,255,255,.2);font-style:normal}
.dots i.cur{box-shadow:0 0 0 2px #fff}
.dots i.ok{background:#7fbf6f}.dots i.ng{background:#e0675e}
.qcol{max-width:960px;margin:0 auto;padding:18px 16px 80px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:18px 20px;font-family:var(--serif);font-size:19px;line-height:1.75;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.qcard u.ul{text-decoration:underline;text-decoration-color:var(--red);text-decoration-thickness:2px;text-underline-offset:4px}
.qbox{display:inline-block;border:1px solid var(--ink);padding:0 8px;margin-right:6px;font-size:.85em;font-family:var(--sans)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.opts.k4{grid-template-columns:repeat(4,1fr)}
.op{position:relative;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:14px 16px;font-size:17px;text-align:left;min-height:58px;line-height:1.45;transition:background .15s,border-color .15s}
.opts.k4 .op{text-align:center;font-family:var(--serif);font-size:22px;padding:10px 4px}
.opts.k4 .op.rv{font-size:13px;font-family:var(--sans)}
.opts.k4 .op.rv b{display:block;font-family:var(--serif);font-size:18px}
.op:not(:disabled):hover{border-color:var(--ink2)}
.op.right{background:var(--okbg);border-color:var(--ok);font-weight:700}
.op.wrong{background:var(--ngbg);border-color:var(--red)}
.op.right::after{content:"○";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--ok);font-size:20px;font-weight:700}
.op.wrong::after{content:"×";position:absolute;right:10px;top:50%;transform:translateY(-50%);color:var(--red);font-size:20px;font-weight:700}
@media (max-width:620px){.opts{grid-template-columns:1fr}.opts.k4{grid-template-columns:repeat(4,1fr)}.qcard{font-size:17px;padding:14px 16px}}
.note{margin-top:16px;background:var(--card);border:1px solid var(--line);border-left:6px solid var(--ok);border-radius:8px;padding:14px 18px;animation:up .25s ease}
.note.ng{border-left-color:var(--red)}
.note h4{margin:0;font-size:18px;color:var(--ok)}
.note.ng h4{color:var(--red)}
.note .sub{margin:2px 0 8px;font-weight:700}
.note .ex{font-size:15px;line-height:1.8;margin:0}
.note .pt{display:block;margin-top:8px;padding:8px 12px;background:var(--paper);border-radius:6px;font-size:14px}
.note .pt::before{content:"見るポイント　";font-weight:700;color:var(--ink2)}
.btn{background:var(--ink);color:#fff;border:0;border-radius:8px;padding:10px 22px;font-size:16px;min-height:46px}
.btn.red{background:var(--red)}
.btn.light{background:var(--paper2);color:var(--ink)}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.row.end{justify-content:flex-end}
@keyframes up{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 結果 */
.res{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:22px 22px 18px}
.res h2{font-family:var(--serif);margin:0 0 4px;font-size:26px}
.res .sc{font-size:15px;color:var(--mute);margin:0 0 12px}
.wl{border-top:1px solid var(--line);margin-top:10px}
.wl .it{padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px}
.wl .it b{color:var(--red)}

/* 図版・地図 */
.zv{position:relative;margin:14px auto 0;width:100%;max-width:900px;height:min(56vh,560px);min-height:240px;background:#2a2622;border-radius:8px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.15)}
.zv.zm{height:auto;background:#d5e2e6}
.zv svg.zmap{width:100%;height:100%;display:block;background:#d5e2e6;touch-action:manipulation}
.zv .zland{fill:#f7f5ec;stroke:#7d8790;stroke-width:1;vector-effect:non-scaling-stroke}
.zv .zlk{fill:#d5e2e6;stroke:#7d8790;stroke-width:.8;vector-effect:non-scaling-stroke}
.zv .zrv path{fill:none;stroke:#6f9fbf;stroke-width:1.4;vector-effect:non-scaling-stroke;stroke-linejoin:round;stroke-linecap:round}
.zv .zrvl text{font-family:var(--serif);font-style:italic;fill:#3f6f8f;text-anchor:middle;dominant-baseline:central;paint-order:stroke;stroke:#f7f5ec;stroke-linejoin:round}
.zv .mk .dot{fill:#b5302a}
.zv .mk .hit{fill:transparent;cursor:pointer}
.zv .mk .lbl circle{fill:#fff;stroke:#2a2320}
.zv .mk .lbl text{font-family:var(--serif);fill:#2a2320;text-anchor:middle;dominant-baseline:central}
.zv .mk.ok .lbl circle{fill:#dcefe1;stroke:#5d8a46}
.zv .mk.ng .lbl circle{fill:#f6dcd9;stroke:#b5302a}
.zv .mk .nm{font-family:var(--sans);fill:#2a2320;paint-order:stroke;stroke:#fff;stroke-linejoin:round;opacity:0;transition:opacity .3s}
.zv.revealed .mk .nm{opacity:1}
.zv .zph{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;display:block}
.zv .zcr{position:absolute;right:6px;bottom:4px;font-size:10px;color:#ddd;text-shadow:0 0 2px #000;pointer-events:none;max-width:90%;text-align:right}
.g4{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:minmax(0,1fr) minmax(0,1fr);gap:6px;width:100%;height:100%;padding:6px;background:#3a332c}
.g4 button{position:relative;border:2px solid #8a7a5c;padding:0;overflow:hidden;background:#2a2622;border-radius:4px}
.g4 .zcr{display:none}
.g4 .k{position:absolute;left:6px;top:6px;z-index:2;width:30px;height:30px;border-radius:50%;background:#fffdf6;border:1px solid #2a2320;font-family:var(--serif);font-size:17px;display:flex;align-items:center;justify-content:center;color:#2a2320}
.g4 .cap{position:absolute;left:0;right:0;bottom:0;z-index:2;background:rgba(42,35,32,.82);color:#fff;font-size:12px;padding:4px 6px;opacity:0;transition:opacity .3s}
.zv.revealed .g4 .cap{opacity:1}
.g4 button.ok{border-color:#5d8a46;box-shadow:0 0 0 3px #5d8a46}
.g4 button.ng{border-color:#b5302a;box-shadow:0 0 0 3px #b5302a}

/* 記述対策 */
.kj-tt{font-family:var(--serif);font-size:22px;margin:0 0 10px}
.steps{display:flex;gap:8px;margin:0 0 12px;font-size:13px}
.steps span{padding:4px 12px;border-radius:14px;background:var(--paper2);color:var(--mute)}
.steps span.cur{background:var(--ink);color:#fff}
.steps span.done{background:var(--okbg);color:var(--ok)}
.kq{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 18px;font-family:var(--serif);font-size:17px;line-height:1.8}
.kq p{margin:0}
.terms{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-family:var(--sans)}
.terms span{border:1px solid var(--ink2);border-radius:4px;padding:2px 10px;font-size:14px;background:#fff;transition:background .2s}
.terms span.on{background:var(--ink2);color:#fff}
.khd{display:flex;justify-content:space-between;margin:18px 0 6px;font-size:13px;color:var(--mute);font-weight:700}
.kask{font-size:17px;font-weight:700;margin:0 0 4px}
.hint{font-size:14px;color:var(--mute);margin:6px 0}
.ksort{display:flex;flex-direction:column;gap:6px;margin-top:8px;user-select:none;-webkit-user-select:none}
.srt{display:flex;align-items:center;gap:12px;background:#fff;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;font-size:16px;touch-action:pan-y;-webkit-touch-callout:none}
.srt .grip{color:var(--mute);font-size:18px;width:20px;text-align:center}
.srt.drag{position:relative;z-index:5;box-shadow:0 6px 16px rgba(0,0,0,.2);border-color:var(--ink2);touch-action:none}
.srt.right{background:var(--okbg);border-color:var(--ok)}
.srt.wrong{background:var(--ngbg);border-color:var(--red)}
.paper{background:#fff;border:1px solid var(--line);border-radius:8px;padding:16px 18px;font-family:var(--serif);font-size:17px;line-height:2;margin-top:8px}
.paper .s{cursor:pointer;border-radius:3px;transition:background .15s}
.paper .s:hover{background:#f3eedc}
.paper .s.sel{background:#fbe3a6}
.paper .s.lock{cursor:default;background:none}
.paper .s.fixed s{color:#9a8f80;text-decoration-color:var(--red)}
.paper .s.fixed em{font-style:normal;color:var(--red);font-weight:700}
.kcard{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:12px;animation:up .25s ease}
.kcard h3{margin:0 0 6px;font-family:var(--serif)}
.kpick{font-family:var(--serif);background:var(--paper);padding:8px 12px;border-radius:6px;margin:0 0 8px}
.klbl{font-weight:700;margin:8px 0 4px}
.kopts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.kopts .op b{color:var(--red)}
.kscore{font-size:15px;text-align:center}.kscore b{font-size:30px;font-family:var(--serif)}
.ta{width:100%;min-height:240px;font-family:var(--serif);font-size:17px;line-height:1.9;padding:14px 16px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink);resize:vertical}
.meter{margin-top:6px}
.meter .mb{position:relative;height:8px;background:var(--paper2);border-radius:4px}
.meter .mb i{display:block;height:100%;width:0;background:var(--mute);border-radius:4px;transition:width .2s}
.meter .mb i.good{background:var(--ok)}.meter .mb i.over{background:var(--red)}
.meter .mb .m8{position:absolute;left:80%;top:-4px;width:2px;height:16px;background:var(--gold)}
.meter .tx{display:flex;justify-content:space-between;font-size:14px;margin-top:4px}
.meter .ok{color:var(--ok)}.meter .ng{color:var(--red)}
.p-ng{color:var(--red);margin:4px 0}.p-ok{color:var(--ok);margin:4px 0}
.rub{display:flex;flex-direction:column;gap:6px;margin-top:8px}
.rub label{display:flex;gap:10px;align-items:flex-start;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px;cursor:pointer}
.rub label.minus{border-style:dashed}
.rub label span{flex:1;font-size:15px}
.rub label small{display:block;color:var(--mute);font-size:13px}
.rub label b{white-space:nowrap}
.rub input{width:20px;height:20px;margin-top:2px}
.model{margin-top:12px;background:var(--paper);border-radius:8px;padding:10px 14px}
.model summary{cursor:pointer;font-weight:700}
.model p{font-family:var(--serif);line-height:1.9;margin:8px 0 4px}
.model u{text-decoration-color:var(--red);text-decoration-thickness:2px}
.klist{display:flex;flex-direction:column;gap:6px;max-height:60vh;overflow:auto;margin:8px 0}
.kit{display:grid;grid-template-columns:1fr auto;gap:2px 10px;text-align:left;background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kit .nm{font-family:var(--serif);font-weight:700}
.kit .st{font-size:13px;color:var(--mute);text-align:right}
.kit small{grid-column:1/-1;color:var(--mute);font-size:12px}

/* モーダル・トースト */
.mbg{position:fixed;inset:0;z-index:50;background:rgba(20,24,40,.55);display:flex;align-items:center;justify-content:center;padding:16px;animation:fade .2s}
.mbox{background:var(--card);border-radius:12px;max-width:640px;width:100%;max-height:90vh;overflow:auto;padding:18px 20px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
.mbox h3{font-family:var(--serif);margin:0 0 6px;font-size:20px}
.mbox .sub{color:var(--mute);font-size:14px;line-height:1.7;margin:0 0 8px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.chk{display:flex;flex-direction:column;gap:4px;max-height:52vh;overflow:auto;margin:8px 0;padding-right:4px}
.chk details{background:#fff;border:1px solid var(--line);border-radius:8px}
.chk summary{padding:8px 12px;cursor:pointer;list-style:none;display:flex;align-items:center}
.chk summary::-webkit-details-marker{display:none}
.chk summary::after{content:"▸";margin-left:auto;color:var(--mute)}
.chk details[open] summary::after{content:"▾"}
.chk .all{display:flex;gap:8px;align-items:center;font-weight:700}
.chk .u{display:flex;gap:8px;align-items:center;padding:6px 12px 6px 34px;border-top:1px dashed var(--paper2);font-size:14px;cursor:pointer}
.chk .u span{flex:1}.chk .u small{color:var(--mute)}
.chk input{width:18px;height:18px}
.mix{display:flex;gap:8px;align-items:center;font-size:14px;margin:6px 0}
.mix small{color:var(--mute)}
.toast{position:fixed;left:50%;top:calc(64px + env(safe-area-inset-top));transform:translateX(-50%);z-index:60;background:rgba(28,37,64,.94);color:#fff;padding:10px 18px;border-radius:20px;font-size:14px;max-width:90vw;text-align:center;animation:up .2s}
.stat{width:100%;border-collapse:collapse;font-size:14px;margin:6px 0 10px}
.stat td{padding:6px 4px;border-bottom:1px solid var(--paper2)}
.stat td:last-child{text-align:right}
.load{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;gap:14px;color:var(--mute)}
.load .sp{width:36px;height:36px;border:3px solid var(--paper2);border-top-color:var(--red);border-radius:50%;animation:rot 1s linear infinite}
@keyframes rot{to{transform:rotate(360deg)}}
.foot{text-align:center;font-size:12px;color:var(--mute);margin-top:30px}
.foot a{color:var(--mute)}
</style>
</head>
<body>
<div id="app"><div class="load"><div class="sp"></div><div>問題を読み込んでいます…</div></div></div>
<script>
/* =====================================================================
   エラータ 問題演習（単体版）
   ・問題データは本体（../index.html）の errata-data をその場で読み込む。
     本体の問題を直せば、ここにもそのまま反映される（このファイルの書きかえは不要）
   ・ストーリー・ガチャ・栞・紙魚の一言・学校アカウント保存はなし
   ・記録はこの端末（localStorage の errata_enshu_v1）だけに残る。
     形は本体の記録 S と同じ（qs / jq / zq / kj / qmy / jk）なので、あとで本体に移しやすい
   ===================================================================== */
const BASE='../';
const SAVE_KEY='errata_enshu_v1',DRAFT_KEY='errata_enshu_kj_drafts';
/* 図版・地図：写真がそろった問題だけを出す（本体の ZH_TEST を false にしたのと同じ） */
const ZH_SHOW_UNREADY=false;

const QSEC={'ORI-Q01':'先史の人類','ORI-Q02':'メソポタミア','ORI-Q03':'エジプト','ORI-Q04':'東地中海の諸民族','ORI-Q05':'オリエントの統一と四王国','ORI-Q06':'エーゲ文明',
 'IND-Q01':'インダス文明とアーリヤ人','IND-Q02':'仏教とジャイナ教','IND-Q03':'マウリヤ朝・クシャーナ朝','IND-Q04':'グプタ朝・ヴァルダナ朝と南インド',
 'CHN-Q01':'中国文明・殷・周','CHN-Q02':'春秋・戦国と諸子百家','CHN-Q03':'秦','CHN-Q04':'前漢','CHN-Q05':'後漢','CHN-Q06':'三国・晋・五胡十六国','CHN-Q07':'南北朝と文化',
 'GRM-Q01':'ポリスの成立','GRM-Q02':'アテネ民主政の歩み','GRM-Q03':'ペルシア戦争と民主政の完成','GRM-Q04':'ペロポネソス戦争とアレクサンドロス','GRM-Q05':'ギリシアの文化','GRM-Q06':'ヘレニズム文化',
 'GRM-Q07':'イランの諸国家','GRM-Q08':'共和政ローマ','GRM-Q09':'ポエニ戦争と内乱の1世紀','GRM-Q10':'帝政ローマ','Q01':'ローマ帝国の変容',
 'Q02':'キリスト教とローマ文化','Q03':'ゲルマン人の移動とフランク王国','Q04':'封建社会とノルマン人','Q05':'イスラームの成立と拡大','Q06':'アッバース朝とイスラーム諸王朝',
 'CHN-Q08':'隋','CHN-Q09':'唐の成立と制度','CHN-Q10':'唐の盛衰','CHN-Q11':'唐の文化','Q07':'ビザンツ帝国と十字軍','Q08':'教会と中世都市','Q09':'英仏の王権と百年戦争',
 'EAS-Q01':'五代十国と北宋','EAS-Q02':'北方民族の国家（遼・西夏・金）','EAS-Q03':'南宋と宋の社会・文化','EAS-Q04':'モンゴル帝国','EAS-Q05':'元',
 'EAS-Q06':'明の成立','EAS-Q07':'明の後半','EAS-Q08':'清','EAS-Q09':'東西の交流と宣教師',

/* ---------- 共通：問題の状態（0未回答・1正解・2不正解） ---------- */
const secOf=q=>q.id.replace(/-\d+$/,'');
function jkGroup(u){return u[0]==='M'?'M':u==='P1'?'1':u==='P2'?'6':u.split('-')[0]}
function jkShown(q){return q.ok===1||(!!JCFG.pending&&!q.ok)}
function jqIdx(q){return Math.max(0,parseInt(q.id.split('-').pop(),10)-1)}
function strSet(obj,u,i,v){let s=obj[u]||'';if(s.length<=i)s=s.padEnd(i+1,'0');obj[u]=s.slice(0,i)+v+s.slice(i+1)}
function qst(q){if(q.z)return +(((S.zq||{})[q.u]||'')[jqIdx(q)]||0);if(!q.u)return S.qs[q.id]||0;return +(((S.jq||{})[q.u]||'')[jqIdx(q)]||0)}
function qSet(q,v){if(q.z)return strSet(S.zq,q.u,jqIdx(q),v);if(!q.u){S.qs[q.id]=v;return}strSet(S.jq,q.u,jqIdx(q),v)}
function chName(g){return (JCH.find(c=>c[0]===g)||[])[1]||g}
function chNo(g){return g==='M'?'序':'第'+g+'章'}

/* ---------- 出題範囲 ---------- */
function jkPool(key){const c=S.jk,g=String(key).slice(2);const base=JK.filter(q=>jkShown(q)&&(c.lv==='all'||q.lv==='標準'));
 if(g!=='my')return base.filter(q=>jkGroup(q.u)===g);
 const us=new Set(c.my);const out=base.filter(q=>us.has(q.u));
 if(c.mix){const chs=new Set();for(const u of us)for(const ch of (JMAP[u]||[]))chs.add(ch);out.push(...Q.filter(q=>chs.has(q.ch)))}
 return out}
function zhHas(k){return !!(ZI[k]&&ZI[k].f)}
function zhReady(q){return q.t==='img-name'?zhHas(q.img):q.t==='img-pick'?[q.a,...q.d].every(zhHas):true}
function zhPool(key){const g=String(key).slice(2);return ZQS.filter(q=>(ZH_SHOW_UNREADY||zhReady(q))&&(g==='all'||jkGroup(q.u)===g))}
function poolOf(key){key=String(key);
 if(key.startsWith('Z:'))return zhPool(key);
 if(key.startsWith('J:'))return jkPool(key);
 if(key==='T:my'){const ss=new Set(S.qmy.secs);return Q.filter(q=>ss.has(secOf(q)))}
 if(key.startsWith('T:'))return Q.filter(q=>q.ch===+key.slice(2));return []}
function labelOf(key){key=String(key);const g=key.slice(2);
 if(key.startsWith('Z:'))return ['図版・地図',g==='all'?'全範囲から':chNo(g)+'　'+chName(g)];
 if(key.startsWith('J:'))return ['受験対策',g==='my'?'マイ範囲':chNo(g)+'　'+chName(g)];
 if(key==='T:my')return ['試験範囲','マイ範囲'];
 return ['試験範囲','第'+g+'章　'+CHT[g]]}
function stat(list){return {n:list.length,done:list.filter(q=>qst(q)===1).length}}

let QZ=null;
function drillPick(key){const pool=poolOf(key);
 const fr=shuffle(pool.filter(q=>qst(q)===0)),wr=shuffle(pool.filter(q=>qst(q)===2)),dn=shuffle(pool.filter(q=>qst(q)===1));
 const list=fr.concat(wr,dn).slice(0,S.n||10);const mode=fr.length?'fresh':wr.length?'wrong':'random';
 const msg=mode==='fresh'?`まだ解いていない問題から出します（残り${fr.length}問）`:mode==='wrong'?`一周しました。間違えた問題を復習します（残り${wr.length}問）`:'全部正解済み。ランダムに出します';

   const e=x.e;let opts;
   if(x.ins)opts=[{t:'この一文を消す',ok:1},{t:'この一文を答案の最初に移す'},{t:'この一文を答案の最後に移す'},{t:'この一文の前の文を消す'}];
   else{const base=p.ms[x.i];const mk=rep=>esc(base.split(e.c).join('\u0001')).split('\u0001').join(`<b>${esc(rep)}</b>`);opts=[{h:mk(e.c),ok:1},...e.d.map(d=>({h:mk(d)}))]}
   opts=shuffle(opts);
   F.innerHTML=`<p class="klbl">どう修正する？</p><div class="kopts">${opts.map((o,j)=>`<button class="op" data-j="${j}"><span>${o.h||esc(o.t)}</span></button>`).join('')}</div><div id="kjX"></div>`;
   F.querySelectorAll('.op').forEach(b=>b.onclick=()=>{const o=opts[+b.dataset.j];if(!o.ok){b.classList.add('wrong');b.disabled=true;return}
    F.querySelectorAll('.op').forEach(z=>z.disabled=true);b.classList.add('right');
    $('#kjX').innerHTML=`<div class="note"><h4>訂正</h4><p class="sub">${esc(e.k||'')}</p><p class="ex">${esc(e.x||'')}</p><div class="row end"><button class="btn" id="nx">答案に赤を入れる</button></div></div>`;
    $('#nx').onclick=()=>{KJ.fixed[x.n]=1;kjFix(true)};setTimeout(()=>{const n=$('#nx');if(n)n.scrollIntoView({block:'nearest',behavior:'smooth'})},60)})};
  setTimeout(()=>pn.scrollIntoView({block:'nearest',behavior:'smooth'}),40)})}
function kjWrite(){const p=KJ.p,r=kjRec(p.id),l8=Math.ceil(p.lim*.8);
 kjFrame(`<p class="hint">指定語句は、書くと上の枠で色が付きます（下線は引いた扱い）。書き上げてから、自分で採点しよう。</p>
  <textarea class="ta" id="kjTa" placeholder="ここに答案を書く">${esc(kjDrafts()[p.id]||'')}</textarea>
  <div class="meter"><div class="mb"><i id="kjBi"></i><span class="m8"></span></div><div class="tx"><span><b id="kjCn">0</b> / ${p.lim}字</span><span id="kjCm"></span></div></div>
  <div class="row end"><button class="btn red" id="kjGo">書けたので自己採点する</button></div><div id="kjG"></div>`);
 const ta=$('#kjTa');
 const upd=()=>{const v=ta.value,n=kjLen(v);kjDraftSet(p.id,v);$('#kjCn').textContent=n;const bi=$('#kjBi');bi.style.width=Math.min(100,n/p.lim*100)+'%';bi.className=n>p.lim?'over':n>=l8?'good':'';
  document.querySelectorAll('#kjTerms span').forEach(s=>s.classList.toggle('on',v.includes(s.dataset.t)));
  const cm=$('#kjCm');cm.textContent=n>p.lim?`${n-p.lim}字オーバー`:n<l8?`8割（${l8}字）まであと${l8-n}字`:'字数OK';cm.className=n>p.lim?'ng':n>=l8?'ok':'';
  return {v,n,miss:(p.terms||[]).filter(t=>!v.includes(t))}};
 ta.oninput=upd;upd();
 $('#kjGo').onclick=()=>{const {n,miss}=upd();const G=$('#kjG');const warn=[];
  if(!n)warn.push('まだ何も書いていません。');if(n>p.lim)warn.push(`字数オーバー（${n}字）。入試では採点されないこともあります。`);else if(n&&n<p.lim*.5)warn.push('制限字数の半分以下。入試では採点されないこともあります。');
  if(miss.length)warn.push('使っていない指定語句：'+miss.join('、'));
  const RB=p.rb.concat(KJ_MINUS),max=kjMax(p),chk={};
  G.innerHTML=`<div class="kcard"><h3>機械チェック</h3>${warn.length?warn.map(w=>`<p class="p-ng">${esc(w)}</p>`).join(''):'<p class="p-ok">字数・指定語句はOK。ここから先は中身の採点。</p>'}</div>
   <div class="kcard"><h3>自己採点</h3><p class="hint">模範解答と見比べて、書けているものにチェック。点線の項目は当てはまったらチェック（減点）。</p>
   <div class="rub">${RB.map((x,i)=>`<label class="${x[0]<0?'minus':''}"><input type="checkbox" data-i="${i}"><span>${esc(x[1])}<small>${esc(x[2])}</small></span><b>${x[0]>0?'+':''}${x[0]}</b></label>`).join('')}</div>
   <p class="kscore"><b id="kjSc">0</b> / ${max}点</p>
   <details class="model"><summary>模範解答を見る</summary><p>${(()=>{let h=esc(p.ms.join(''));(p.terms||[]).forEach(t=>{h=h.split(esc(t)).join(`<u>${esc(t)}</u>`)});return h})()}</p><small>${kjLen(p.ms.join(''))}字</small></details>
   <div class="row end"><button class="btn light" id="kjBk2">棚にもどる</button><button class="btn red" id="kjDone">採点を記録する</button></div></div>`;
  const calc=()=>{let s=0;RB.forEach((x,i)=>{if(chk[i])s+=x[0]});return Math.max(0,s)};
  G.querySelectorAll('.rub input').forEach(c=>c.onchange=()=>{chk[c.dataset.i]=c.checked;$('#kjSc').textContent=calc()});
  $('#kjBk2').onclick=kjBack;
  $('#kjDone').onclick=()=>{const s=calc(),rr=kjRec(p.id);if(s>rr[2]||rr[2]<0)kjSet(p.id,2,s);save();
   modal(`<h3>自己採点を記録しました</h3><p style="line-height:1.8">${s}／${max}点（これまでの最高：${kjRec(p.id)[2]}点）</p><div class="row end"><button class="btn red" data-close>棚にもどる</button></div>`,kjBack)};
  setTimeout(()=>G.scrollIntoView({block:'start',behavior:'smooth'}),60)}}

boot();
</script>
