<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>中世の巻 一問一答ドリル</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<style>
/* 一列のノート型レイアウト：章の一覧 → 10問 → 結果。答えは赤ペンの添削で示す */
:root{
  --bg:#f3f4f1; --card:#ffffff; --fg:#1d2433; --sub:#5d6475; --line:#d9dcd4;
  --ink:#24365e; --ink-soft:#e4e9f3; --red:#b8322c; --red-soft:#f8e4e1; --ok:#2f6b45; --ok-soft:#e1efe5;
  --display:"Shippori Mincho","Hiragino Mincho ProN","Yu Mincho",serif;
  --body:"Zen Kaku Gothic New","Hiragino Sans","Yu Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#14171e; --card:#1d212b; --fg:#e8e9ec; --sub:#9aa1b0; --line:#323846;
  --ink:#a9bde6; --ink-soft:#26304a; --red:#ef7d74; --red-soft:#3a2224; --ok:#7cc79a; --ok-soft:#1f3328; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14171e; --card:#1d212b; --fg:#e8e9ec; --sub:#9aa1b0; --line:#323846;
  --ink:#a9bde6; --ink-soft:#26304a; --red:#ef7d74; --red-soft:#3a2224; --ok:#7cc79a; --ok-soft:#1f3328; color-scheme:dark}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.7;padding:0 16px}
.wrap{max-width:760px;margin:0 auto;padding-block:24px 48px;display:flex;flex-direction:column;gap:20px}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
h1{font-family:var(--display);font-size:clamp(26px,5vw,34px);line-height:1.3;margin:0;text-wrap:balance;letter-spacing:.04em}
.lead{color:var(--sub);margin:4px 0 0;font-size:15px}
.tabs{font-variant-numeric:tabular-nums}
/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 20px;border-radius:6px;font-weight:700;font-size:16px}
.btn.pri{background:var(--ink);color:var(--bg)}
.btn.sec{background:var(--card);border:1px solid var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.row{display:flex;flex-wrap:wrap;gap:10px}
/* chapter list */
.all{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:520px){.all{grid-template-columns:1fr}}
.all .btn{width:100%}
.chs{display:flex;flex-direction:column;border-top:1px solid var(--line)}
.ch{display:grid;grid-template-columns:3.2em 1fr auto;gap:4px 12px;align-items:center;padding:14px 4px;border-bottom:1px solid var(--line);text-align:left;width:100%}
.ch:hover{background:var(--ink-soft)}
.ch .no{font-family:var(--display);font-size:15px;color:var(--sub);grid-row:span 2}
.ch .nm{font-weight:700;font-size:17px;min-width:0}
.ch .ct{font-size:14px;color:var(--sub);font-variant-numeric:tabular-nums;text-align:right;grid-row:span 2}
.ch .ct b{color:var(--fg);font-size:16px}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden;display:flex}
.bar i{display:block;height:100%;background:var(--ok)}
.bar i.ng{background:var(--red)}
.note{font-size:13px;color:var(--sub);margin:0}
.reset{color:var(--sub);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px 0;align-self:flex-start}
/* question */
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.top .where{font-weight:700;flex:1;min-width:0}
.top .num{font-variant-numeric:tabular-nums;color:var(--sub)}
.dots{display:flex;gap:6px;flex-wrap:wrap}
.dots i{width:22px;height:6px;border-radius:3px;background:var(--line)}
.dots i.ok{background:var(--ok)}.dots i.ng{background:var(--red)}.dots i.cur{outline:2px solid var(--ink);outline-offset:1px}
.qcard{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:22px 20px}
.qid{font-size:12px;color:var(--sub);letter-spacing:.08em;font-variant-numeric:tabular-nums}
.qtext{font-family:var(--display);font-size:clamp(19px,3.6vw,23px);line-height:1.75;margin:6px 0 0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;min-height:58px;padding:12px 14px;border-radius:6px;background:var(--card);border:1px solid var(--line);font-size:17px;line-height:1.45}
.opt .k{flex:none;width:26px;height:26px;border-radius:50%;border:1px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--sub);font-variant-numeric:tabular-nums}
.opt:not(:disabled):hover{border-color:var(--ink)}
.opt:disabled{cursor:default}
.opt.right{background:var(--ok-soft);border-color:var(--ok)}
.opt.right .k{background:var(--ok);border-color:var(--ok);color:var(--card)}
.opt.wrong{background:var(--red-soft);border-color:var(--red)}
.opt.wrong .k{background:var(--red);border-color:var(--red);color:var(--card)}
.fb{border-left:4px solid var(--ok);background:var(--card);border-radius:0 8px 8px 0;padding:14px 18px}
.fb.ng{border-left-color:var(--red)}
.fb .h{font-weight:700;margin:0;color:var(--ok)}
.fb.ng .h{color:var(--red)}
.fb .ans{margin:2px 0 0}
.fb .x{margin:6px 0 0;color:var(--fg)}
/* result */
.score{display:flex;align-items:baseline;gap:8px;font-family:var(--display)}
.score b{font-size:56px;line-height:1;font-variant-numeric:tabular-nums}
.score span{font-size:20px;color:var(--sub)}
.wl{display:flex;flex-direction:column;gap:10px}
.wl .it{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:12px 16px}
.wl .it p{margin:0}
.wl .it .a{color:var(--red);font-weight:700;margin-top:4px}
.wl .it .x{color:var(--sub);font-size:14px;margin-top:4px}
/* in-page confirm */
.sheet{background:var(--card);border:1px solid var(--red);border-radius:8px;padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.sheet p{margin:0}
@media (prefers-reduced-motion:no-preference){.qcard,.fb{animation:in .18s ease-out}@keyframes in{from{opacity:.4;transform:translateY(4px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<main class="wrap" id="app" aria-live="polite"></main>
<script type="application/json" id="data">{"chapters":{"1": "ローマ帝国の終焉", "2": "キリスト教の成立", "3": "フランク王国", "4": "ノルマン人と封建社会", "5": "イスラームの成立", "6": "イスラーム世界の広がり", "7": "ビザンツ帝国と十字軍", "8": "教皇権の盛衰と中世都市", "9": "英仏の中央集権化", "10": "テューダー朝と海への道", "11": "中世文化とルネサンス"},
"Q":[
{"id": "Q01-001", "ch": 1, "q": "235〜284年、各地の軍団が次々と皇帝を立てて争った時代を何という？", "a": "軍人皇帝時代", "d": ["五賢帝時代", "三頭政治", "元首政"], "x": "約50年で26人もの皇帝が立った。"},
{"id": "Q01-002", "ch": 1, "q": "コンスタンティヌスが都を移した、コンスタンティノープルのもとの名前は？", "a": "ビザンティウム", "d": ["ラヴェンナ", "ミラノ", "アレクサンドリア"], "x": "ギリシア人の植民市であった。ビザンツ帝国の名前の由来である。"},
{"id": "Q01-003", "ch": 1, "q": "325年、アタナシウス派を正統としたのは？", "a": "ニケーア公会議", "d": ["エフェソス公会議", "クレルモン公会議", "コンスタンツ公会議"], "x": "アリウス派はここで異端とされ、ゲルマン人に広まった。"},
{"id": "Q01-004", "ch": 1, "q": "4世紀後半、ゲルマン人の大移動のきっかけとなった、アジア系民族の西進は？", "a": "フン人", "d": ["マジャール人", "ノルマン人", "アヴァール人"], "x": "375年、西ゴート人がドナウ川を渡ってローマ領に入った。"},
{"id": "Q01-005", "ch": 1, "q": "ローマ帝国末期、土地に縛られ移動の自由を制限された小作人を何という？", "a": "コロヌス", "d": ["奴隷", "農奴", "騎士"], "x": "コロヌスは中世の農奴の先駆けとされる。"},
{"id": "Q01-006", "ch": 1, "q": "ローマ帝国末期に広まった、移動の自由を奪われた小作人（コロヌス）を使う大土地経営を何という？", "a": "コロナトゥス", "d": ["ラティフンディア", "荘園制", "イクター制"], "x": "奴隷を使うラティフンディアから、小作人を使うコロナトゥスへ。中世の荘園制の先駆けである。"},
{"id": "Q01-007", "ch": 1, "q": "ディオクレティアヌス帝について誤っているものは？", "a": "キリスト教を公認した", "d": ["専制君主制を始めた", "帝国を四分割して統治した", "キリスト教徒を大規模に迫害した"], "x": "公認したのはコンスタンティヌス。ディオクレティアヌスは最後の大迫害を行った。"},
{"id": "Q01-008", "ch": 1, "q": "次の出来事を古い順に並べたとき、3番目にくるのは？（ミラノ勅令／ニケーア公会議／キリスト教の国教化／帝国の東西分割）", "a": "キリスト教の国教化", "d": ["ミラノ勅令", "ニケーア公会議", "帝国の東西分割"], "x": "313年→325年→392年→395年の順である。"},
{"id": "Q01-009", "ch": 1, "q": "ニケーア公会議で異端とされたが、のちにゲルマン人の間に広まった派は？", "a": "アリウス派", "d": ["アタナシウス派", "ネストリウス派", "カタリ派"], "x": "キリストは神ではなく人間だとする考え方である。正統になったのはアタナシウス派。"},
{"id": "Q01-010", "ch": 1, "q": "ゲルマン民族の大移動が始まった年は？", "a": "375年", "d": ["313年", "395年", "476年"], "x": "フン人に押された西ゴート人が、ドナウ川を越えてローマ領に移動した。"},
{"id": "Q01-011", "ch": 1, "q": "コンスタンティヌスが行ったこととして誤っているものは？", "a": "キリスト教を国教とした", "d": ["ミラノ勅令を出した", "ニケーア公会議を開いた", "ビザンティウムに遷都した"], "x": "国教化はテオドシウス。二人の皇帝の業績は混ざりやすいので要注意である。"},
{"id": "Q01-012", "ch": 1, "q": "【ディオクレティアヌス】次の文の「元首政を復活させ、元老院と協力して統治した」の部分を正しく直すと？　――3世紀末、軍人皇帝時代を終わらせた皇帝は、元首政を復活させ、元老院と協力して統治した", "a": "専制君主政を始め、皇帝を神のように崇めさせた", "d": ["元首政を復活させ、元老院と協力して統治した", "共和政に戻し、執政官に統治を任せた", "三頭政治を始め、権力を3人で分け合った"], "x": "皇帝の前ではひざまずき、衣の裾に口づけする礼が定められた。退位後は故郷でキャベツを育てて暮らしたと伝えられる。"},
{"id": "Q01-013", "ch": 1, "q": "【コンスタンティヌス】次の文の「国教となった」の部分を正しく直すと？　――313年のミラノ勅令によって、キリスト教はローマ帝国の国教となった", "a": "公認された", "d": ["国教となった", "禁止された", "異端とされた"], "x": "313年は公認であり、国教化は392年である。コンスタンティヌス自身が洗礼を受けたのは、死の直前であったという。"},
{"id": "Q01-014", "ch": 1, "q": "【テオドシウス】次の文の「南北に分割された」の部分を正しく直すと？　――キリスト教を国教とした皇帝の死後、395年に帝国は南北に分割された", "a": "東西に分割された", "d": ["南北に分割された", "四つに分割された", "ゲルマン人に譲り渡された"], "x": "二人の息子に東西を分けて継がせた。兄が東、弟が西を継ぎ、弟はまだ10歳ほどであった。"},
{"id": "Q01-015", "ch": 1, "q": "【オドアケル】次の文の「ゲルマン人の侵入を退け、その後も存続した」の部分を正しく直すと？　――476年、西ローマ帝国はゲルマン人の侵入を退け、その後も存続した", "a": "ゲルマン人傭兵隊長に皇帝を廃位され、滅亡した", "d": ["ゲルマン人の侵入を退け、その後も存続した", "フン人に征服され、滅亡した", "東ローマ帝国に併合され、消滅した"], "x": "最後の皇帝は幼く、退位後は年金を受けて暮らしたという。オドアケル自身は皇帝を名乗らなかった。"},
{"id": "Q02-001", "ch": 2, "q": "イエスの言行や使徒の活動をまとめた、キリスト教の聖典は？", "a": "新約聖書", "d": ["旧約聖書", "コーラン", "タルムード"], "x": "旧約聖書はユダヤ教から受け継いだ部分である。"},
{"id": "Q02-002", "ch": 2, "q": "キリスト教の五本山に含まれないのは？", "a": "ミラノ", "d": ["ローマ", "アンティオキア", "アレクサンドリア"], "x": "残りはコンスタンティノープルとイェルサレムである。"},
{"id": "Q02-003", "ch": 2, "q": "431年、ネストリウス派を異端としたのは？", "a": "エフェソス公会議", "d": ["ニケーア公会議", "クレルモン公会議", "トリエント公会議"], "x": "ネストリウス派はその後、東方へ広まった。"},
{"id": "Q02-004", "ch": 2, "q": "唐代の中国に伝わったネストリウス派は何と呼ばれた？", "a": "景教", "d": ["祆教", "摩尼教", "回教"], "x": "祆教はゾロアスター教、摩尼教はマニ教である。"},
{"id": "Q02-005", "ch": 2, "q": "ローマ最古の成文法は？", "a": "十二表法", "d": ["ローマ法大全", "万民法", "大憲章"], "x": "貴族と平民の対立の中で作られた。"},
{"id": "Q02-006", "ch": 2, "q": "ローマ建国の伝説を描いた叙事詩『アエネイス』の作者は？", "a": "ウェルギリウス", "d": ["リウィウス", "タキトゥス", "プルタルコス"], "x": "ローマ文学の最高傑作とされる。"},
{"id": "Q02-007", "ch": 2, "q": "『ローマ建国史』を書いた歴史家は？", "a": "リウィウス", "d": ["タキトゥス", "ウェルギリウス", "プルタルコス"], "x": "アウグストゥスの時代の歴史家である。"},
{"id": "Q02-008", "ch": 2, "q": "ギリシアとローマの英雄を比べて描いた『対比列伝』（英雄伝）の作者は？", "a": "プルタルコス", "d": ["リウィウス", "タキトゥス", "セネカ"], "x": "ギリシア人だが、ローマ時代に活躍した。"},
{"id": "Q02-009", "ch": 2, "q": "ストア派の哲学者でもあった「哲人皇帝」が書いた作品は？", "a": "『自省録』", "d": ["『幸福論』", "『ゲルマニア』", "『神の国』"], "x": "五賢帝の最後、マルクス＝アウレリウス＝アントニヌスの著作である。"},
{"id": "Q02-010", "ch": 2, "q": "『幸福論』を書いたストア派の哲学者は？", "a": "セネカ", "d": ["マルクス＝アウレリウス＝アントニヌス", "キケロ", "プトレマイオス"], "x": "暴君ネロの家庭教師でもあった。"},
{"id": "Q02-011", "ch": 2, "q": "作品と作者の組み合わせとして誤っているものは？", "a": "『ゲルマニア』―プルタルコス", "d": ["『アエネイス』―ウェルギリウス", "『天文学大全』―プトレマイオス", "『神の国』―アウグスティヌス"], "x": "『ゲルマニア』はタキトゥスである。"},
{"id": "Q02-012", "ch": 2, "q": "「キリスト」とはどういう意味の言葉？", "a": "救世主（メシア）", "d": ["神の子", "預言者", "使徒"], "x": "イエスを救世主と信じる、というのがキリスト教の核心である。"},
{"id": "Q02-013", "ch": 2, "q": "初代ローマ教皇とされるペテロの墓の上に建つとされる、サン＝ピエトロ大聖堂がある国は？", "a": "ヴァチカン市国", "d": ["イタリア", "サンマリノ共和国", "モナコ公国"], "x": "世界で最も小さな国で、現在もローマ教皇がいる。"},
{"id": "Q02-014", "ch": 2, "q": "イエスと12人の弟子の最後の食事の場面を描いた『最後の晩餐』の画家は？", "a": "レオナルド＝ダ＝ヴィンチ", "d": ["ラファエロ", "ボッティチェリ", "ジョット"], "x": "弟子の誰かが裏切る、と告げた瞬間を描いている。"},
{"id": "Q02-015", "ch": 2, "q": "パウロについて正しいものは？", "a": "回心する前は、キリスト教徒を迫害していた", "d": ["初代ローマ教皇とされる", "聖書をラテン語に翻訳した", "ミラノ勅令を出した"], "x": "初代ローマ教皇とされるのはペテロである。"},
{"id": "Q02-016", "ch": 2, "q": "【イエス】次の文の「パリサイ派の教えを広めた」の部分を正しく直すと？　――ユダヤ教の律法を厳格に守るパリサイ派の教えを広めた人物は、ローマへの反逆者として処刑された", "a": "パリサイ派を批判し、神の愛と隣人愛を説いた", "d": ["パリサイ派の教えを広めた", "皇帝崇拝を説いた", "多神教の復興を説いた"], "x": "パリサイ派は律法を厳格に守ることを重んじた。イエスは安息日に病人を癒やし、彼らにとがめられたことがある。"},
{"id": "Q02-017", "ch": 2, "q": "【パウロ】次の文の「ユダヤ人だけに伝道を限った」の部分を正しく直すと？　――元パリサイ派で回心した使徒は、ユダヤ人だけに伝道を限った", "a": "異邦人（ユダヤ人以外）への伝道に尽くした", "d": ["ユダヤ人だけに伝道を限った", "ローマ皇帝にだけ伝道した", "伝道そのものを禁じた"], "x": "パウロはもともとキリスト教徒を迫害する側にいた。地中海各地を回って信徒に手紙を書き、その多くが新約聖書に収められている。"},
{"id": "Q02-018", "ch": 2, "q": "【アウグスティヌス】次の文の「『ゲルマニア』」の部分を正しく直すと？　――最大の教父とされる人物は、『ゲルマニア』を著して神の国の到来を説いた", "a": "『告白録』『神の国』", "d": ["『ゲルマニア』", "『天文学大全』", "『博物誌』"], "x": "『告白録』には、若い頃に友人と梨を盗んだ逸話が記されている。空腹だったわけではない、と本人が振り返っている。"},
{"id": "Q02-019", "ch": 2, "q": "【プトレマイオス】次の文の「地動説」の部分を正しく直すと？　――2世紀の天文学者は、『天文学大全』で地動説を唱えた", "a": "天動説", "d": ["地動説", "太陽を神とする説", "大地が平らだという説"], "x": "アレクサンドリアの学者である。地理書も著し、地点を緯度と経度で示した。天動説はおよそ1400年にわたって信じられた。"},
{"id": "Q02-020", "ch": 2, "q": "【タキトゥス】次の文の「ローマ人の暮らし」の部分を正しく直すと？　――歴史家は『ゲルマニア』で、ローマ人の暮らしを記録した", "a": "ゲルマン人の社会", "d": ["ローマ人の暮らし", "ギリシア人の神話", "エジプトの王朝"], "x": "ゲルマン人を質素で勇敢な人々として描いた。ローマ人の奢侈を間接的に批判する意図があったとする見方もある。"},
{"id": "Q03-001", "ch": 3, "q": "フランク王国の宮廷で、メロヴィング朝末期に実権を握った最高職は？", "a": "宮宰", "d": ["巡察使", "伯", "執政官"], "x": "カール＝マルテルもピピン3世も宮宰であった。"},
{"id": "Q03-002", "ch": 3, "q": "カール大帝が地方の監督のために派遣した役人は？", "a": "巡察使", "d": ["伯", "宮宰", "総督"], "x": "地方を治める伯を、巡察使が見張る仕組みである。"},
{"id": "Q03-003", "ch": 3, "q": "843年、フランク王国を三つに分けた条約は？", "a": "ヴェルダン条約", "d": ["メルセン条約", "ヴォルムス協約", "トルデシリャス条約"], "x": "870年のメルセン条約で、ほぼ今の独・仏・伊の原型ができる。"},
{"id": "Q03-004", "ch": 3, "q": "870年、ヴェルダン条約の境界を引き直した条約は？", "a": "メルセン条約", "d": ["ヴェルダン条約", "ヴォルムス協約", "カルマル同盟"], "x": "中部フランクの北半分を東西で分け合った。"},
{"id": "Q03-005", "ch": 3, "q": "6世紀、東ゴート王国を滅ぼしたのは？", "a": "ビザンツ帝国", "d": ["フランク王国", "ランゴバルド王国", "ヴァンダル王国"], "x": "ユスティニアヌスの地中海再征服の一つである。"},
{"id": "Q03-006", "ch": 3, "q": "北アフリカのカルタゴの故地に建国したゲルマン人は？", "a": "ヴァンダル人", "d": ["西ゴート人", "ブルグント人", "ランゴバルド人"], "x": "のちにビザンツ帝国（ユスティニアヌス）に滅ぼされる。"},
{"id": "Q03-007", "ch": 3, "q": "イベリア半島に建国し、711年にウマイヤ朝に滅ぼされたゲルマン人の国は？", "a": "西ゴート王国", "d": ["東ゴート王国", "ヴァンダル王国", "ブルグント王国"], "x": "ここからイベリア半島のイスラーム時代が始まる。"},
{"id": "Q03-008", "ch": 3, "q": "ガリア東南部に建国し、6世紀にフランク王国に滅ぼされたのは？", "a": "ブルグント王国", "d": ["ランゴバルド王国", "西ゴート王国", "東ゴート王国"], "x": "ブルゴーニュという地名に名前が残っている。"},
{"id": "Q03-009", "ch": 3, "q": "大ブリテン島に渡り、七王国を建てたゲルマン人は？", "a": "アングロ＝サクソン人", "d": ["ノルマン人", "デーン人", "フランク人"], "x": "イングランドは「アングル人の土地」という意味である。"},
{"id": "Q03-010", "ch": 3, "q": "北イタリアに建国し、8世紀にカール大帝に滅ぼされたのは？", "a": "ランゴバルド王国", "d": ["東ゴート王国", "ブルグント王国", "ヴァンダル王国"], "x": "ロンバルディアという地名の由来である。"},
{"id": "Q03-011", "ch": 3, "q": "ゲルマン人の社会で、成年男性の自由民が集まって重要なことを決めた最高機関は？", "a": "民会", "d": ["元老院", "三部会", "ウンマ"], "x": "タキトゥスの『ゲルマニア』に記録されている。"},
{"id": "Q03-012", "ch": 3, "q": "キリスト教に改宗する前の、ゲルマン人のもともとの信仰は？", "a": "自然崇拝（多神教）", "d": ["一神教", "祖先崇拝のみ", "ゾロアスター教"], "x": "曜日の英語名には、ゲルマンの神々の名前が残っている。"},
{"id": "Q03-013", "ch": 3, "q": "ローマ教皇がビザンツ皇帝ではなくフランク王国と結びついた背景として正しいものは？", "a": "聖像禁止令でローマ教会がビザンツ皇帝と対立したから", "d": ["ビザンツ帝国がすでに滅亡していたから", "フランク王国がアリウス派だったから", "イスラーム勢力がローマを支配したから"], "x": "守ってくれる新しい後ろ盾が必要になったのである。"},
{"id": "Q03-014", "ch": 3, "q": "ピピンの寄進で教皇に与えられたラヴェンナ地方は、どこから奪った土地？", "a": "ランゴバルド王国", "d": ["東ゴート王国", "ビザンツ帝国", "ウマイヤ朝"], "x": "これが教皇領の始まりである。"},
{"id": "Q03-015", "ch": 3, "q": "カールの戴冠の歴史的な意義として正しいものは？", "a": "ローマ文化・キリスト教・ゲルマン人が融合した西ヨーロッパ世界が成立した", "d": ["東西のキリスト教会が統一された", "ビザンツ帝国が滅亡した", "イスラーム世界が東西に分裂した"], "x": "この三つの要素の融合が、西ヨーロッパの土台になる。"},
{"id": "Q03-016", "ch": 3, "q": "カール大帝が全国を分けて置いた、地方の行政や軍事の長官は？", "a": "伯", "d": ["巡察使", "宮宰", "カリフ"], "x": "伯を監督するのが巡察使である。"},
{"id": "Q03-017", "ch": 3, "q": "メルセン条約によって、のちの何という3国の原型ができた？", "a": "フランス・ドイツ・イタリア", "d": ["イギリス・フランス・スペイン", "ドイツ・ポーランド・ロシア", "イタリア・スペイン・ポルトガル"], "x": "西フランク・東フランク・イタリアがそれぞれの原型である。"},
{"id": "Q03-018", "ch": 3, "q": "【クローヴィス】次の文の「アリウス派」の部分を正しく直すと？　――メロヴィング朝を開いた王は、アリウス派に改宗してローマ人の支持を得た", "a": "アタナシウス派（正統派）", "d": ["アリウス派", "ネストリウス派", "マニ教"], "x": "戦いで追い詰められた際、妃が信じる神に祈って勝利したことが改宗のきっかけとされる。妃はもともと正統派の信者であった。"},
{"id": "Q03-019", "ch": 3, "q": "【カール＝マルテル】次の文の「アッバース朝」の部分を正しく直すと？　――732年、トゥール・ポワティエ間の戦いでフランク王国はアッバース朝を破った", "a": "ウマイヤ朝", "d": ["アッバース朝", "ファーティマ朝", "ササン朝"], "x": "「マルテル」は「鉄槌」を意味するあだ名である。王ではなく宮宰であった。"},
{"id": "Q03-020", "ch": 3, "q": "【ピピン3世】次の文の「ビザンツ皇帝」の部分を正しく直すと？　――カロリング朝を開いた王は、ラヴェンナ地方をビザンツ皇帝に寄進した", "a": "ローマ教皇", "d": ["ビザンツ皇帝", "ランゴバルド王", "イスラームのカリフ"], "x": "背が低かったことから「小ピピン」と呼ばれた。寄進したのは、ランゴバルド王国から奪った土地である。"},
{"id": "Q03-021", "ch": 3, "q": "【アルクイン】次の文の「ギリシア語」の部分を正しく直すと？　――カール大帝の宮廷に招かれた学者は、ギリシア語による学芸の復興を担った", "a": "ラテン語", "d": ["ギリシア語", "アラビア語", "ゲルマン語"], "x": "アルクインはイングランド出身である。カロリング＝ルネサンスの時期に小文字を用いた読みやすい書体が広まり、現在のアルファベットの小文字のもとになった。"},
{"id": "Q03-022", "ch": 3, "q": "【レオ3世】次の文の「ビザンツ皇帝」の部分を正しく直すと？　――800年、ローマ教皇はカール大帝にビザンツ皇帝の冠を授けた", "a": "西ローマ皇帝", "d": ["ビザンツ皇帝", "ランゴバルド王", "イングランド王"], "x": "ビザンツ皇帝レオン3世と教皇レオ3世は別人である。レオ3世は戴冠の前年、ローマで襲撃を受け、カールのもとへ逃れていた。"},
{"id": "Q03-023", "ch": 3, "q": "【カール大帝】次の文の「教皇に冠を授けた」の部分を正しく直すと？　――800年、フランク王はローマで教皇に冠を授けた", "a": "教皇から西ローマ皇帝の冠を授けられた", "d": ["教皇に冠を授けた", "ビザンツ皇帝から冠を奪った", "自ら冠をかぶった"], "x": "伝記には、カールは戴冠を知らされていなかったと記されているが、真偽は定かでない。カールは枕の下に板を置き、字の練習をしていたという。"},
{"id": "Q04-001", "ch": 4, "q": "封建制で、主君が家臣に与える土地を何という？", "a": "封土", "d": ["荘園", "イクター", "屯田"], "x": "土地の代わりに、家臣は軍事奉仕をする。"},
{"id": "Q04-002", "ch": 4, "q": "荘園で、農民が領主の直営地を耕す義務を何という？", "a": "賦役", "d": ["貢納", "十分の一税", "人頭税"], "x": "自分の保有地の収穫の一部を納めるのが貢納である。"},
{"id": "Q04-003", "ch": 4, "q": "農民が教会に納めた、収穫の10分の1の税は？", "a": "十分の一税", "d": ["賦役", "人頭税", "ジズヤ"], "x": "領主だけでなく、教会にも納めていた。"},
{"id": "Q04-004", "ch": 4, "q": "領主が国王の役人の立ち入りや課税を拒否できる権利は？", "a": "不輸不入権", "d": ["叙任権", "自治権", "拒否権"], "x": "王の力が荘園の中まで届かない理由である。"},
{"id": "Q04-005", "ch": 4, "q": "987年、パリ伯ユーグ＝カペーが開いた王朝は？", "a": "カペー朝", "d": ["カロリング朝", "ノルマン朝", "ヴァロワ朝"], "x": "最初は王の力が弱く、パリ周辺しか支配していなかった。"},
{"id": "Q04-006", "ch": 4, "q": "8〜11世紀にヨーロッパ各地に進出したノルマン人の別名は？", "a": "ヴァイキング", "d": ["マジャール人", "スラヴ人", "デーン朝"], "x": "「入り江の民」という意味だという説がある。"},
{"id": "Q04-007", "ch": 4, "q": "9世紀、リューリクが東スラヴの地に建てた国は？", "a": "ノヴゴロド国", "d": ["キエフ公国", "モスクワ大公国", "両シチリア王国"], "x": "のちにキエフ公国へと中心が移る。"},
{"id": "Q04-008", "ch": 4, "q": "1016年、デンマークの王子クヌートがイングランドを征服して開いた王朝は？", "a": "デーン朝", "d": ["ノルマン朝", "プランタジネット朝", "テューダー朝"], "x": "クヌートはデンマーク・ノルウェーの王も兼ねた。"},
{"id": "Q04-009", "ch": 4, "q": "9世紀にデーン人の侵入を撃退した、アングロ＝サクソンの王は？", "a": "アルフレッド大王", "d": ["クヌート", "ウィリアム1世", "ヘンリ2世"], "x": "イングランド統一の基礎を築いた王である。"},
{"id": "Q04-010", "ch": 4, "q": "アングロ＝サクソン人が大ブリテン島に建てた七つの国をまとめて何という？", "a": "七王国（ヘプターキー）", "d": ["デーン朝", "ノルマン朝", "三部会"], "x": "9世紀にウェセックス王国のもとで統一される。"},
{"id": "Q04-011", "ch": 4, "q": "封建制度のもとになった二つの制度と、その起源の組み合わせとして正しいものは？", "a": "恩貸地制（ローマ）・従士制（ゲルマン）", "d": ["恩貸地制（ゲルマン）・従士制（ローマ）", "イクター制（ローマ）・従士制（ゲルマン）", "恩貸地制（ローマ）・軍管区制（ゲルマン）"], "x": "土地を貸すローマの仕組みと、主君に仕えるゲルマンの仕組みが合わさった。"},
{"id": "Q04-012", "ch": 4, "q": "西ヨーロッパの封建制度について誤っているものは？", "a": "家臣は主君に一方的に服従し、主君には何の義務もなかった", "d": ["主君と家臣は双務的な契約で結ばれていた", "一人の家臣が複数の主君に仕えることもあった", "主君は家臣に封土を与え、家臣は軍事奉仕をした"], "x": "主君が約束を破れば、家臣は従わなくてよいのが西ヨーロッパの特徴である。"},
{"id": "Q04-013", "ch": 4, "q": "荘園で、農民が自分の保有地でとれた収穫物の一部を領主に納めることを何という？", "a": "貢納", "d": ["賦役", "十分の一税", "ジズヤ"], "x": "領主の土地で働くのが賦役、作物を納めるのが貢納である。"},
{"id": "Q04-014", "ch": 4, "q": "神聖ローマ皇帝がイタリア政策にこだわった結果として正しいものは？", "a": "ドイツ国内で諸侯が自立し、統一が遅れた", "d": ["ドイツが早くに中央集権国家となった", "イタリアが統一された", "教皇がドイツに移った"], "x": "皇帝がアルプスの南ばかり見ている間に、足元が崩れていった。"},
{"id": "Q04-015", "ch": 4, "q": "955年、オットー1世がレヒフェルトの戦いで撃退したのは？", "a": "マジャール人", "d": ["ノルマン人", "フン人", "アヴァール人"], "x": "マジャール人はのちにハンガリー王国を建てた。"},
{"id": "Q04-016", "ch": 4, "q": "【ロロ】次の文の「北イタリア」の部分を正しく直すと？　――ノルマン人の首長は、北イタリアにノルマンディー公国を建てた", "a": "北フランス", "d": ["北イタリア", "南イタリア", "ロシア"], "x": "フランス王から土地を与えられる代わりに、キリスト教に改宗した。臣従の礼で王の足に口づけすることを拒んだという逸話も残る。"},
{"id": "Q04-017", "ch": 4, "q": "【ウラディミル1世】次の文の「ローマ＝カトリック」の部分を正しく直すと？　――キエフ公国の君主は、ローマ＝カトリックを国教とした", "a": "ギリシア正教", "d": ["ローマ＝カトリック", "イスラーム", "ゾロアスター教"], "x": "イスラームやカトリックとも比較したうえで、ギリシア正教を選んだと伝えられる。コンスタンティノープルの聖堂の壮麗さに使者が感嘆したことが決め手とされる。"},
{"id": "Q04-018", "ch": 4, "q": "【オットー1世】次の文の「フランス王国」の部分を正しく直すと？　――962年、ザクセン朝の王は教皇から戴冠され、これがフランス王国の起源となった", "a": "神聖ローマ帝国", "d": ["フランス王国", "ノルマン朝", "カロリング朝"], "x": "955年にマジャール人を撃退したことが大きい。マジャール人はその後定住し、ハンガリー王国を建てた。"},
{"id": "Q04-019", "ch": 4, "q": "【ウィリアム1世】次の文の「敗れ、北フランスに退いた」の部分を正しく直すと？　――1066年、ノルマンディー公はヘースティングズの戦いに敗れ、北フランスに退いた", "a": "勝利し、イングランドを征服した", "d": ["敗れ、北フランスに退いた", "デーン人と和平を結んだ", "教皇に破門された"], "x": "ウィリアムはもともとノルマンディー公であり、フランス王の家臣であった。イングランド王となってもその立場は変わらなかった。征服後には全国の土地を調べた台帳を作成させている。"},
{"id": "Q05-001", "ch": 5, "q": "ムハンマドがメッカで偶像を破壊し、アッラーの聖殿とした建物は？", "a": "カーバ神殿", "d": ["岩のドーム", "ハギア＝ソフィア聖堂", "アズハル学院"], "x": "現在もイスラームの最高の聖地である。"},
{"id": "Q05-002", "ch": 5, "q": "ムハンマドが属していた、メッカの有力部族は？", "a": "クライシュ族", "d": ["ウマイヤ族", "ハーシム族", "ベルベル人"], "x": "ハーシム家はクライシュ族の中の一族である。"},
{"id": "Q05-003", "ch": 5, "q": "イスラームの五行に含まれるものは？", "a": "断食", "d": ["天使", "来世", "預言者"], "x": "天使・来世・預言者は「六信（信じるもの）」である。"},
{"id": "Q05-004", "ch": 5, "q": "ウマイヤ朝で、イスラームに改宗した非アラブ人は何と呼ばれた？", "a": "マワーリー", "d": ["ズィンミー", "ウラマー", "スルタン"], "x": "改宗しても人頭税を課され、不満を持った。"},
{"id": "Q05-005", "ch": 5, "q": "イスラーム国家で、征服地の土地にかけられた税は？", "a": "ハラージュ", "d": ["ジズヤ", "ザカート", "イクター"], "x": "ジズヤは人頭税である。"},
{"id": "Q05-006", "ch": 5, "q": "前6世紀にオリエントを統一した、イラン人の王朝は？", "a": "アケメネス朝ペルシア", "d": ["ササン朝ペルシア", "パルティア", "セレウコス朝シリア"], "x": "ダレイオス1世のもとで最盛期を迎えた。"},
{"id": "Q05-007", "ch": 5, "q": "アケメネス朝とギリシアのポリスとの間で起きた戦争は？", "a": "ペルシア戦争", "d": ["ペロポネソス戦争", "ポエニ戦争", "百年戦争"], "x": "アテネなどのギリシア側が勝利した。"},
{"id": "Q05-008", "ch": 5, "q": "アケメネス朝ペルシアを滅ぼしたのは？", "a": "アレクサンドロス大王", "d": ["ホスロー1世", "ダレイオス1世", "ムハンマド"], "x": "大王の死後、帝国は分裂する。"},
{"id": "Q05-009", "ch": 5, "q": "アレクサンドロス大王の死後、西アジアを支配したギリシア系の王朝は？", "a": "セレウコス朝シリア", "d": ["パルティア", "ササン朝ペルシア", "アケメネス朝ペルシア"], "x": "この王朝から独立したのがパルティアである。"},
{"id": "Q05-010", "ch": 5, "q": "イランの王朝を古い順に並べたとき、3番目にくるのは？", "a": "ササン朝ペルシア", "d": ["アケメネス朝ペルシア", "パルティア", "セレウコス朝シリア"], "x": "アケメネス朝→（セレウコス朝）→パルティア→ササン朝の順である。"},
{"id": "Q05-011", "ch": 5, "q": "6世紀にササン朝の最盛期を築き、ビザンツのユスティニアヌスとも戦った王は？", "a": "ホスロー1世", "d": ["アレクサンドロス大王", "ダレイオス1世", "ヘラクレイオス1世"], "x": "ササン朝とビザンツの抗争で交易路が危うくなり、メッカが栄えるきっかけになった。"},
{"id": "Q05-012", "ch": 5, "q": "ムスリムが信じるべき6つのことと、行うべき5つの義務をまとめて何という？", "a": "六信五行", "d": ["五行六信", "四書五経", "十戒"], "x": "五行は信仰告白・礼拝・断食・喜捨・巡礼である。"},
{"id": "Q05-013", "ch": 5, "q": "ヒジュラの日本語訳は？", "a": "聖遷", "d": ["聖戦", "巡礼", "断食"], "x": "622年の、メッカからメディナへの移住のことである。"},
{"id": "Q05-014", "ch": 5, "q": "ムハンマドがメディナでつくった、イスラーム教徒（ムスリム）の共同体を何という？", "a": "ウンマ", "d": ["ミスル", "スーク", "マドラサ"], "x": "血縁や部族を超えた、信仰による共同体である。"},
{"id": "Q05-015", "ch": 5, "q": "コーランとハディースをもとにした、イスラームの法を何という？", "a": "シャリーア", "d": ["ハディース", "スンナ", "ジズヤ"], "x": "信仰だけでなく、生活の決まりまで定めている。"},
{"id": "Q05-016", "ch": 5, "q": "ムハンマドの言行を伝える記録を何という？", "a": "ハディース", "d": ["コーラン", "シャリーア", "スーフィズム"], "x": "コーランに次ぐ大切な典拠である。"},
{"id": "Q05-017", "ch": 5, "q": "アラブ人が征服地に建設した軍営都市を何という？", "a": "ミスル", "d": ["スーク", "ウンマ", "マドラサ"], "x": "カイロ（フスタート）やバスラなどが代表である。"},
{"id": "Q05-018", "ch": 5, "q": "イスラーム世界で、ジズヤを払えば信仰を認められた「啓典の民」にあたるのは？", "a": "ユダヤ教徒とキリスト教徒", "d": ["仏教徒とゾロアスター教徒", "すべての多神教徒", "アラブ人だけ"], "x": "同じ一神教の聖典を持つ人々として扱われた。"},
{"id": "Q05-019", "ch": 5, "q": "イスラームで厳しく禁じられているものは？", "a": "偶像崇拝", "d": ["断食", "巡礼", "喜捨"], "x": "だからこそ、モスクの装飾は幾何学文様や文字になる。"},
{"id": "Q05-020", "ch": 5, "q": "正統カリフの時代が終わり、ウマイヤ朝が始まった年は？", "a": "661年", "d": ["622年", "732年", "750年"], "x": "アリーが暗殺された年である。"},
{"id": "Q05-021", "ch": 5, "q": "【ムハンマド】次の文の「ダマスクス」の部分を正しく直すと？　――622年、迫害を受けた預言者は、メッカからダマスクスへ移住した", "a": "メディナ", "d": ["ダマスクス", "バグダード", "イェルサレム"], "x": "メディナはもとヤスリブという町で、「預言者の町」の意からメディナと呼ばれるようになった。イスラーム暦はこの移住の年を元年とする。"},
{"id": "Q05-022", "ch": 5, "q": "【アブー＝バクル】次の文の「ムハンマドの娘婿」の部分を正しく直すと？　――ムハンマドの死後、初代カリフに選ばれたのはムハンマドの娘婿だった", "a": "ムハンマドの親友（義父）", "d": ["ムハンマドの娘婿", "ムハンマドの息子", "ウマイヤ家の総督"], "x": "アブー＝バクルの娘はムハンマドの妻であり、アブー＝バクルは親友であると同時に義父でもあった。娘婿は第4代カリフのアリーである。"},
{"id": "Q05-023", "ch": 5, "q": "【ウマル】次の文の「ビザンツ帝国」の部分を正しく直すと？　――642年、第2代正統カリフの軍はニハーヴァンドの戦いでビザンツ帝国を破った", "a": "ササン朝", "d": ["ビザンツ帝国", "西ゴート王国", "フランク王国"], "x": "ササン朝は651年に最後の王が殺害されて滅亡した。ウマルの時代には、エジプトやシリアもイスラームの支配下に入っている。"},
{"id": "Q05-024", "ch": 5, "q": "【ウスマーン】次の文の「コーランを処分した」の部分を正しく直すと？　――ウマイヤ家出身の第3代正統カリフは、コーランを処分した", "a": "コーランを編纂し、現在の形に定めた", "d": ["コーランを処分した", "コーランをペルシア語に翻訳させた", "ハディースだけを聖典とした"], "x": "処分されたのはコーランそのものではなく、統一以前の写本である。各地で伝わるコーランに異同があったため、ウスマーンは一つの形に定め、ほかの写本を処分させたとされる。"},
{"id": "Q05-025", "ch": 5, "q": "【アリー】次の文の「スンナ派」の部分を正しく直すと？　――第4代正統カリフとその子孫だけを正統な指導者と認める人々は、スンナ派と呼ばれる", "a": "シーア派", "d": ["スンナ派", "スーフィー", "ウラマー"], "x": "「シーア」は「党派」を意味し、もとは「アリーの党派」と呼ばれた。現在のイランはシーア派が多数を占める。"},
{"id": "Q05-026", "ch": 5, "q": "【ムアーウィヤ】次の文の「バグダード」の部分を正しく直すと？　――シリア総督は、バグダードを都としてウマイヤ朝を開いた", "a": "ダマスクス", "d": ["バグダード", "メッカ", "カイロ"], "x": "バグダードはアッバース朝の都である。ムアーウィヤはカリフの位を息子に継がせ、以後カリフは世襲となった。"},
{"id": "Q06-001", "ch": 6, "q": "750年に成立し、アラブ人の特権を廃止した王朝は？", "a": "アッバース朝", "d": ["ウマイヤ朝", "ファーティマ朝", "セルジューク朝"], "x": "ムスリムであれば平等、という「イスラーム帝国」になった。"},
{"id": "Q06-002", "ch": 6, "q": "アッバース朝第2代カリフのマンスールが建設した都は？", "a": "バグダード", "d": ["ダマスクス", "カイロ", "コルドバ"], "x": "円形の城壁で囲まれた都市であった。"},
{"id": "Q06-003", "ch": 6, "q": "軍人に、給与の代わりに土地の徴税権を与える制度は？", "a": "イクター制", "d": ["恩貸地制", "屯田制", "封土"], "x": "ブワイフ朝が始め、セルジューク朝に受け継がれた。"},
{"id": "Q06-004", "ch": 6, "q": "1055年にバグダードに入り、カリフからスルタンの称号を受けた王朝は？", "a": "セルジューク朝", "d": ["ブワイフ朝", "ファーティマ朝", "マムルーク朝"], "x": "カリフは宗教的権威、スルタンは政治的支配者、という分担である。"},
{"id": "Q06-005", "ch": 6, "q": "1258年、アッバース朝を滅ぼしたのは？", "a": "フラグ率いるモンゴル軍", "d": ["セルジューク朝", "マムルーク朝", "オスマン帝国"], "x": "フラグはその後、イル＝ハン国を建てた。"},
{"id": "Q06-006", "ch": 6, "q": "751年、アッバース朝軍が唐軍を破った戦いは？", "a": "タラス河畔の戦い", "d": ["トゥール・ポワティエ間の戦い", "ニハーヴァンドの戦い", "ヘースティングズの戦い"], "x": "この戦いをきっかけに、製紙法が西方へ伝わったとされる。"},
{"id": "Q06-007", "ch": 6, "q": "タラス河畔の戦いをきっかけにイスラーム世界に伝わったとされる技術は？", "a": "製紙法", "d": ["火薬", "羅針盤", "活版印刷術"], "x": "紙が、知恵の館での翻訳事業を支えることになる。"},
{"id": "Q06-008", "ch": 6, "q": "イスラーム都市の市場を何という？", "a": "スーク（バザール）", "d": ["ミスル", "マドラサ", "ウンマ"], "x": "モスクの近くに広がり、商業の中心であった。"},
{"id": "Q06-009", "ch": 6, "q": "バグダードの「知恵の館」のアラビア語名は？", "a": "バイト＝アル＝ヒクマ", "d": ["ニザーミーヤ", "アズハル", "マドラサ"], "x": "ギリシア語の文献が次々とアラビア語に翻訳された。"},
{"id": "Q06-010", "ch": 6, "q": "インド・イラン・アラビアなどの説話を集めた、「アラビアン＝ナイト」とも呼ばれる作品は？", "a": "千夜一夜物語", "d": ["集史", "三大陸周遊記", "医学典範"], "x": "ハールーン＝アッラシードも登場する。"},
{"id": "Q06-011", "ch": 6, "q": "モスクの壁面などを飾る、植物や文字を組み合わせた幾何学的な文様は？", "a": "アラベスク", "d": ["モザイク", "ステンドグラス", "フレスコ"], "x": "偶像崇拝が禁じられているので、人や動物の像の代わりに発達した。"},
{"id": "Q06-012", "ch": 6, "q": "預言者や諸王の歴史をまとめた、アッバース朝の歴史家は？", "a": "タバリー", "d": ["ラシード＝アッディーン", "イブン＝バットゥータ", "ウマル＝ハイヤーム"], "x": "『預言者たちと諸王の歴史』が代表作である。"},
{"id": "Q06-013", "ch": 6, "q": "四行詩集『ルバイヤート』を残し、正確な暦の作成にも関わった詩人・天文学者は？", "a": "ウマル＝ハイヤーム", "d": ["フワーリズミー", "イブン＝シーナー", "タバリー"], "x": "セルジューク朝の時代の人物である。"},
{"id": "Q06-014", "ch": 6, "q": "後ウマイヤ朝の都はどこ？", "a": "コルドバ", "d": ["ダマスクス", "グラナダ", "カイロ"], "x": "アッバース朝成立後、ウマイヤ家の生き残りがイベリア半島で建てた王朝である。"},
{"id": "Q06-015", "ch": 6, "q": "キリスト教徒がイベリア半島をイスラーム勢力から取り戻そうとした運動は？", "a": "レコンキスタ（国土回復運動）", "d": ["十字軍", "アルビジョワ十字軍", "ジハード"], "x": "1492年のグラナダ陥落で完了する。"},
{"id": "Q06-016", "ch": 6, "q": "イベリア半島最後のイスラーム王朝で、1492年にスペイン王国に滅ぼされたのは？", "a": "ナスル朝", "d": ["後ウマイヤ朝", "ムラービト朝", "ムワッヒド朝"], "x": "都グラナダには、アルハンブラ宮殿が残っている。"},
{"id": "Q06-017", "ch": 6, "q": "ファーティマ朝が属していた宗派は？", "a": "シーア派（イスマイール派）", "d": ["スンナ派", "スーフィー", "ハワーリジュ派"], "x": "カイロを建設し、アズハル学院を建てた。"},
{"id": "Q06-018", "ch": 6, "q": "946年にバグダードに入ったブワイフ朝の君主が、カリフから与えられた称号は？", "a": "大アミール", "d": ["スルタン", "カリフ", "シャー"], "x": "のちのセルジューク朝の君主はスルタンの称号を得る。"},
{"id": "Q06-019", "ch": 6, "q": "マムルークとは何のこと？", "a": "トルコ人などの奴隷出身の軍人", "d": ["イスラームの法学者", "聖職者の位", "遊牧民の首長"], "x": "エジプトではマムルークが王朝を建てた。"},
{"id": "Q06-020", "ch": 6, "q": "マムルーク朝のスルタンで、モンゴル軍の侵入を撃退したのは？", "a": "バイバルス", "d": ["サラディン", "フラグ", "トゥグリル＝ベク"], "x": "これでモンゴルの西進は止まった。"},
{"id": "Q06-021", "ch": 6, "q": "イスラーム世界の、学問を教える学院の一般的な名前は？", "a": "マドラサ", "d": ["モスク", "ミスル", "スーク"], "x": "ニザーミーヤ学院はマドラサの代表例である。"},
{"id": "Q06-022", "ch": 6, "q": "13世紀前半にチンギス＝ハンに滅ぼされた、中央アジアのイスラーム王朝は？", "a": "ホラズム朝", "d": ["セルジューク朝", "ガズナ朝", "マムルーク朝"], "x": "モンゴルの使節を殺したことが、侵攻の引き金になった。"},
{"id": "Q06-023", "ch": 6, "q": "インドに進出したイスラーム王朝を古い順に並べたとき、3番目にくるのは？", "a": "奴隷王朝", "d": ["ガズナ朝", "ゴール朝", "ムガル帝国"], "x": "ガズナ朝→ゴール朝→奴隷王朝の順である（ムガル帝国はずっと後）。"},
{"id": "Q06-024", "ch": 6, "q": "1206年、アイバクがデリーに建てた、インド最初のイスラーム王朝は？", "a": "奴隷王朝", "d": ["ゴール朝", "ガズナ朝", "マムルーク朝"], "x": "ここから続く5王朝をまとめてデリー＝スルタン朝と呼ぶ。"},
{"id": "Q06-025", "ch": 6, "q": "北アフリカのベルベル人が建てた王朝の組み合わせとして正しいものは？", "a": "ムラービト朝・ムワッヒド朝", "d": ["ガズナ朝・ゴール朝", "ブワイフ朝・セルジューク朝", "ナスル朝・後ウマイヤ朝"], "x": "どちらもイベリア半島にも進出した。"},
{"id": "Q06-026", "ch": 6, "q": "イル＝ハン国でイスラームを国教とした君主は？", "a": "ガザン＝ハン", "d": ["フラグ", "バイバルス", "トゥグリル＝ベク"], "x": "宰相にラシード＝アッディーンを起用した。"},
{"id": "Q06-027", "ch": 6, "q": "【ニザーム＝アル＝ムルク】次の文の「アズハル学院」の部分を正しく直すと？　――セルジューク朝の宰相は、各地にアズハル学院を建てた", "a": "ニザーミーヤ学院", "d": ["アズハル学院", "知恵の館", "ボローニャ大学"], "x": "アズハル学院はファーティマ朝がカイロに建てた学院で、現在も大学として存続している。ニザーミーヤ学院はスンナ派の学問を広めるために設立された。"},
{"id": "Q06-028", "ch": 6, "q": "【ガザーリー】次の文の「ゾロアスター教の教え」の部分を正しく直すと？　――ニザーミーヤ学院の教授は、ゾロアスター教の教えを理論化した", "a": "神秘主義（スーフィズム）", "d": ["ゾロアスター教の教え", "ギリシア哲学", "代数学"], "x": "ガザーリーは学院教授の地位を捨て、約10年間にわたり修行の旅に出た。"},
{"id": "Q06-029", "ch": 6, "q": "【フワーリズミー】次の文の「天動説」の部分を正しく直すと？　――知恵の館で活躍した学者は、天動説を大きく発展させた", "a": "代数学", "d": ["天動説", "医学", "歴史学"], "x": "「アルゴリズム」という語は、フワーリズミーの名に由来する。インドから伝わった数字の用法も、彼の著作を通じてヨーロッパに広まった。"},
{"id": "Q06-030", "ch": 6, "q": "【イブン＝シーナー】次の文の「『集史』」の部分を正しく直すと？　――イスラームの医学者・哲学者は『集史』を著し、ヨーロッパの医学にも影響を与えた", "a": "『医学典範』", "d": ["『集史』", "『三大陸周遊記』", "『神学大全』"], "x": "『医学典範』はラテン語に翻訳され、ヨーロッパの大学で数百年にわたり教科書として用いられた。"},
{"id": "Q06-031", "ch": 6, "q": "【イブン＝バットゥータ】次の文の「『東方見聞録』」の部分を正しく直すと？　――モロッコ出身の旅行家は、アジアやアフリカを巡って『東方見聞録』を残した", "a": "『三大陸周遊記』", "d": ["『東方見聞録』", "『集史』", "『医学典範』"], "x": "『東方見聞録』はマルコ＝ポーロの旅行記である。イブン＝バットゥータは30年近く旅を続け、中国の泉州にまで至った。"},
{"id": "Q06-032", "ch": 6, "q": "【ラシード＝アッディーン】次の文の「アラビア語」の部分を正しく直すと？　――イル＝ハン国の宰相は、アラビア語で『集史』を書いた", "a": "ペルシア語", "d": ["アラビア語", "ラテン語", "トルコ語"], "x": "『集史』はモンゴルの歴史を中心に、中国やヨーロッパについても記した書物であり、世界史叙述の早い例とされる。"},
{"id": "Q07-001", "ch": 7, "q": "7世紀以降、ビザンツ帝国の公用語となったのは？", "a": "ギリシア語", "d": ["ラテン語", "アラビア語", "スラヴ語"], "x": "ローマ帝国の後継者だが、言葉はギリシア語になっていく。"},
{"id": "Q07-002", "ch": 7, "q": "ビザンツ帝国で、帝国を軍管区に分け、司令官に軍事と行政を任せた制度は？", "a": "軍管区制（テマ制）", "d": ["イクター制", "封建制", "四帝分治制"], "x": "農民に土地を与えて兵士にする屯田兵制と組み合わされた。"},
{"id": "Q07-003", "ch": 7, "q": "1054年に起きた出来事は？", "a": "キリスト教会の東西分裂", "d": ["第1回十字軍", "ノルマン＝コンクエスト", "カノッサの屈辱"], "x": "ローマ＝カトリックとギリシア正教に分かれた。"},
{"id": "Q07-004", "ch": 7, "q": "第4回十字軍がコンスタンティノープルを占領して建てた国は？", "a": "ラテン帝国", "d": ["イェルサレム王国", "アイユーブ朝", "両シチリア王国"], "x": "ヴェネツィア商人の思惑で、聖地ではなくキリスト教国を攻めた。"},

{"id": "Q09-013", "ch": 9, "q": "【ジョン】次の文の「権利の請願」の部分を正しく直すと？　――1215年、イングランド王は貴族に迫られ、権利の請願を認めた", "a": "大憲章（マグナ＝カルタ）", "d": ["権利の請願", "権利の章典", "国王至上法"], "x": "ジョンは「欠地王」と呼ばれ、フランスにあった領地の多くをフィリップ2世に奪われた。大憲章の原本は現在もイギリスに複数残っている。"},

{"id": "Q11-020", "ch": 11, "q": "多くの聖母子像や『アテネの学堂』を描いた画家は？", "a": "ラファエロ", "d": ["ボッティチェリ", "ジョット", "レオナルド＝ダ＝ヴィンチ"], "x": "『アテネの学堂』には、古代ギリシアの哲学者たちが描かれている。"},
{"id": "Q11-021", "ch": 11, "q": "【トマス＝アクィナス】次の文の「『神の国』」の部分を正しく直すと？　――スコラ学を大成した神学者は、『神の国』で信仰と理性の調和をめざした", "a": "『神学大全』", "d": ["『神の国』", "『愚神礼賛』", "『告白録』"], "x": "『神の国』はアウグスティヌスの著作である。トマスは大柄で寡黙であったため、「シチリアの黙った牛」とあだ名された。『神学大全』は未完に終わっている。"},
{"id": "Q11-022", "ch": 11, "q": "【ダンテ】次の文の「ラテン語」の部分を正しく直すと？　――フィレンツェ出身の詩人は、『神曲』をラテン語で書いた", "a": "トスカーナ語（イタリア語の口語）", "d": ["ラテン語", "ギリシア語", "フランス語"], "x": "ダンテは政争に巻き込まれてフィレンツェを追放され、生涯戻ることはなかった。『神曲』は追放後に書かれた。"},
{"id": "Q11-023", "ch": 11, "q": "【ボッカチオ】次の文の「『カンタベリ物語』」の部分を正しく直すと？　――ペストが流行したフィレンツェを舞台に、『カンタベリ物語』が書かれた", "a": "『デカメロン』", "d": ["『カンタベリ物語』", "『神曲』", "『君主論』"], "x": "ペストを逃れて郊外の屋敷に集まった10人が、10日間で100の物語を語るという構成である。『デカメロン』は「10日物語」を意味する。"},
{"id": "Q11-024", "ch": 11, "q": "【マキャベリ】次の文の「『ユートピア』」の部分を正しく直すと？　――フィレンツェの外交官は『ユートピア』で、強力な君主によるイタリア統一を説いた", "a": "『君主論』", "d": ["『ユートピア』", "『愚神礼賛』", "『神学大全』"], "x": "マキャベリはメディチ家の復帰によって職を失い、郊外に退いていた時期に『君主論』を書き、メディチ家に献上した。"},
{"id": "Q11-025", "ch": 11, "q": "【ボッティチェリ】次の文の「『最後の晩餐』」の部分を正しく直すと？　――メディチ家の保護を受けた画家は、『最後の晩餐』を描いた", "a": "『ヴィーナスの誕生』", "d": ["『最後の晩餐』", "『最後の審判』", "『アテネの学堂』"], "x": "『ヴィーナスの誕生』は、貝殻の上に立つ女神が岸に流れ着く場面を描く。現在はフィレンツェのウフィツィ美術館に所蔵されている。"},
{"id": "Q11-026", "ch": 11, "q": "【エラスムス】次の文の「『ドン＝キホーテ』」の部分を正しく直すと？　――ネーデルラントの人文主義者は、『ドン＝キホーテ』で聖職者の腐敗を風刺した", "a": "『愚神礼賛』", "d": ["『ドン＝キホーテ』", "『デカメロン』", "『ハムレット』"], "x": "『愚神礼賛』は、エラスムスがトマス＝モアの家に滞在していた際に書かれた。二人は親しい友人であった。"},
{"id": "Q11-027", "ch": 11, "q": "【トマス＝モア】次の文の「ばら戦争」の部分を正しく直すと？　――イングランドの人文主義者は『ユートピア』で、ばら戦争を批判した", "a": "囲い込み", "d": ["ばら戦争", "百年戦争", "修道院の解散"], "x": "「羊が人間を食べる」という表現で囲い込みを批判した。モアはのちに、ヘンリ8世の離婚に反対して処刑された。"},
{"id": "Q11-028", "ch": 11, "q": "【シェイクスピア】次の文の「『カンタベリ物語』」の部分を正しく直すと？　――エリザベス1世の時代の劇作家は、『カンタベリ物語』を書いた", "a": "『ハムレット』", "d": ["『カンタベリ物語』", "『ドン＝キホーテ』", "『愚神礼賛』"], "x": "シェイクスピアの劇はロンドンのグローブ座で上演された。セルバンテスと没年が同じ1616年である。"},
{"id": "Q11-029", "ch": 11, "q": "【セルバンテス】次の文の「新しく台頭した商人」の部分を正しく直すと？　――スペインの作家は『ドン＝キホーテ』で、新しく台頭した商人を風刺した", "a": "時代遅れの騎士道", "d": ["新しく台頭した商人", "教皇の権威", "絶対王政"], "x": "セルバンテスは若い頃レパントの海戦に参加し、左手の自由を失った。その後海賊に捕らえられ、約5年間捕虜となった。"},
{"id": "Q11-030", "ch": 11, "q": "【イブン＝ルシュド】次の文の「ルネサンスまで誰も読まなかった」の部分を正しく直すと？　――中世のヨーロッパではギリシアの学問は完全に忘れられ、ルネサンスまで誰も読まなかった", "a": "12世紀にイスラーム世界からラテン語に訳され、研究された", "d": ["ルネサンスまで誰も読まなかった", "教会がすべて焼き捨てた", "ビザンツ帝国だけが独占した"], "x": "イブン＝ルシュドはアリストテレスの注釈書を数多く著し、ヨーロッパでは「注釈者」と呼ばれた。トマス＝アクィナスも、その思想と向き合いながら神学を体系化した。"}
]}</script>
<script>
const D=JSON.parse(document.getElementById('data').textContent);
const Q=D.Q, CH=D.chapters, CHS=Object.keys(CH).map(Number);
const KEY='chusei_drill_v1';
let REC={};try{REC=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){REC={}}
function saveRec(){try{localStorage.setItem(KEY,JSON.stringify(REC))}catch(e){}}
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const chName=c=>`第${c}章　${CH[c]}`;
function stat(list){return{n:list.length,ok:list.filter(q=>REC[q.id]===1).length,ng:list.filter(q=>REC[q.id]===2).length}}
let RUN=null,confirmReset=false;

function Home(){RUN=null;const all=stat(Q);const wrong=Q.filter(q=>REC[q.id]===2);
 app.innerHTML=`<header><h1>中世の巻　一問一答ドリル</h1><p class="lead">世界史探究　2学期中間考査の範囲（ローマ帝国の終焉〜ルネサンス）。章を選ぶと10問出題します。</p></header>
 <div class="all"><button class="btn pri" id="mix">全範囲から10問</button><button class="btn sec" id="wr" ${wrong.length?'':'disabled'}>間違えた問題を解き直す（${wrong.length}問）</button></div>
 <p class="note tabs">全${all.n}問のうち、正解済み ${all.ok}問・間違えたまま ${all.ng}問</p>
 <nav class="chs" aria-label="章の一覧">${CHS.map(c=>{const s=stat(Q.filter(q=>q.ch===c));
  return `<button class="ch" data-ch="${c}"><span class="no">第${c}章</span><span class="nm">${esc(CH[c])}</span><span class="ct tabs"><b>${s.ok}</b>／${s.n}</span>
   <span class="bar" aria-hidden="true"><i style="width:${100*s.ok/s.n}%"></i><i class="ng" style="width:${100*s.ng/s.n}%"></i></span></button>`}).join('')}</nav>
 <p class="note">緑は正解済み、赤は直前に間違えた問題の割合です。記録はこの端末のブラウザにだけ保存されます。</p>
 ${confirmReset?`<div class="sheet" role="alert"><p>すべての記録を消去します。元には戻せません。</p><div class="row"><button class="btn pri" id="rsY" style="background:var(--red)">消去する</button><button class="btn sec" id="rsN">やめる</button></div></div>`:`<button class="reset" id="rs">記録をすべて消去する</button>`}`;
 document.querySelectorAll('[data-ch]').forEach(b=>b.onclick=()=>start(Q.filter(q=>q.ch===+b.dataset.ch),chName(+b.dataset.ch)));
 document.getElementById('mix').onclick=()=>start(Q,'全範囲');
 document.getElementById('wr').onclick=()=>start(wrong,'間違えた問題',true);
 const rs=document.getElementById('rs');if(rs)rs.onclick=()=>{confirmReset=true;Home()};
 const y=document.getElementById('rsY');if(y){y.onclick=()=>{REC={};saveRec();confirmReset=false;Home()};document.getElementById('rsN').onclick=()=>{confirmReset=false;Home()}}
 window.scrollTo(0,0)}

function start(pool,label,all){const list=shuffle(pool).slice(0,all?pool.length:10);if(!list.length){Home();return}
 RUN={label,pool,all,list,i:0,res:[],picked:null,order:list.map(q=>shuffle([q.a,...q.d]))};Ques()}

function Ques(){const r=RUN,q=r.list[r.i],opts=r.order[r.i],done=r.picked!==null;
 app.innerHTML=`<div class="top"><button class="btn sec" id="quit">一覧へ</button><span class="where">${esc(r.label)}</span><span class="num tabs">${r.i+1} / ${r.list.length}</span></div>
 <div class="dots" aria-hidden="true">${r.list.map((_,k)=>`<i class="${r.res[k]===true?'ok':r.res[k]===false?'ng':''} ${k===r.i?'cur':''}"></i>`).join('')}</div>
 <section class="qcard"><div class="qid">${esc(q.id.replace(/^Q(\d+)-/,(m,c)=>'第'+(+c)+'章　'))}</div><p class="qtext">${esc(q.q)}</p></section>
 <div class="opts">${opts.map((o,k)=>{let cls='';if(done){if(o===q.a)cls='right';else if(o===r.picked)cls='wrong'}
  return `<button class="opt ${cls}" data-o="${k}" ${done?'disabled':''}><span class="k">${k+1}</span><span>${esc(o)}</span></button>`}).join('')}</div>
 ${done?`<div class="fb ${r.picked===q.a?'':'ng'}"><p class="h">${r.picked===q.a?'正解':'不正解'}</p>${r.picked===q.a?'':`<p class="ans">正答：<b>${esc(q.a)}</b></p>`}<p class="x">${esc(q.x)}</p></div>
  <div class="row"><button class="btn pri" id="next">${r.i+1<r.list.length?'次の問題へ':'結果を見る'}</button></div>`:''}`;
 document.getElementById('quit').onclick=Home;
 document.querySelectorAll('[data-o]').forEach(b=>b.onclick=()=>pick(+b.dataset.o));
 const n=document.getElementById('next');if(n){n.onclick=next;n.focus({preventScroll:true})}}
function pick(k){const r=RUN;if(r.picked!==null)return;const q=r.list[r.i];r.picked=r.order[r.i][k];const ok=r.picked===q.a;
 r.res[r.i]=ok;REC[q.id]=ok?1:2;saveRec();Ques()}
function next(){const r=RUN;r.i++;r.picked=null;r.i<r.list.length?Ques():Result();window.scrollTo(0,0)}
function Result(){const r=RUN;const ok=r.res.filter(Boolean).length;const wl=r.list.filter((_,k)=>r.res[k]===false);
 app.innerHTML=`<header><p class="lead">${esc(r.label)}</p><div class="score"><b>${ok}</b><span>／ ${r.list.length}問 正解</span></div></header>
 <div class="row"><button class="btn pri" id="again">${r.all?'もう一度解き直す':'同じ範囲から10問'}</button>${wl.length?'<button class="btn sec" id="wrongOnly">今回間違えた問題だけ</button>':''}<button class="btn sec" id="home">章の一覧へ</button></div>
 ${wl.length?`<h2 style="font-family:var(--display);font-size:20px;margin:8px 0 0">間違えた問題</h2><div class="wl">${wl.map(q=>`<div class="it"><p>${esc(q.q)}</p><p class="a">正答：${esc(q.a)}</p><p class="x">${esc(q.x)}</p></div>`).join('')}</div>`:'<p>全問正解です。</p>'}`;
 document.getElementById('again').onclick=()=>start(r.all?r.pool.filter(q=>REC[q.id]===2):r.pool,r.label,r.all);
 const w=document.getElementById('wrongOnly');if(w)w.onclick=()=>start(wl,'今回間違えた問題',true);
 document.getElementById('home').onclick=Home}
document.addEventListener('keydown',e=>{if(!RUN||!document.querySelector('.opts'))return;
 if(RUN.picked===null&&/^[1-4]$/.test(e.key))pick(+e.key-1);else if(RUN.picked!==null&&e.key==='Enter'&&document.activeElement?.id!=='next')next()});
Home();
</script>
</body>
</html>
