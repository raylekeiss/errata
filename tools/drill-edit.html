<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>ドリルの編集</title>
<style>
:root{--bg:#1c2540;--pa:#f3ead6;--ink:#2a2320;--red:#c4302b;--gold:#c9a24a;--line:#c8b58e}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--pa);font-family:"Hiragino Sans","Noto Sans JP",sans-serif}
header{position:sticky;top:0;z-index:5;display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:10px 16px;background:#141b30;box-shadow:0 4px 12px rgba(0,0,0,.4)}
header h1{font-size:17px;margin:0 8px 0 0}
input,select,textarea{font:inherit;font-size:16px;border-radius:4px;border:1px solid var(--line);padding:8px 10px;background:#fffdf7;color:var(--ink)}
header input{flex:1;min-width:160px}header select{max-width:100%}
button{font:inherit;font-size:15px;border:0;border-radius:4px;padding:8px 14px;cursor:pointer;background:var(--pa);color:var(--ink);min-height:44px}
button.red{background:var(--red);color:#fff}button.on{background:var(--gold);color:#1c2540;font-weight:700}
.note{font-size:13px;opacity:.85;padding:8px 16px;line-height:1.8;margin:0}
.count{font-size:13px;opacity:.85;padding:0 16px 6px}
.list{padding:0 16px 60px;display:flex;flex-direction:column;gap:8px}
.row{display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;background:var(--pa);color:var(--ink);border-radius:4px;padding:10px 12px;cursor:pointer}
.row .id{font-size:11px;color:#7a6a4e;font-family:ui-monospace,Menlo,monospace}
.row .q{font-size:15px;line-height:1.6;margin:2px 0}
.row .a{font-size:14px;color:#8a2a25;font-weight:700}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:4px}
.tag{font-size:11px;padding:1px 8px;border-radius:9px;background:#3a3f55;color:#fff}
.tag.ch{background:#c4302b}.tag.del{background:#000}.row.del{opacity:.55}.row.del .q{text-decoration:line-through}.tag.n{background:#5a7a4a}.tag.adv{background:#6b4f8a}
.yn{display:flex;gap:6px}.yn button{min-width:52px;padding:6px 10px;font-size:18px;background:#e2d6bc}
.yn button.yes.on{background:#2f6a3f;color:#fff}.yn button.no.on{background:#8a2a25;color:#fff}
.ed{position:fixed;inset:0;z-index:9;background:rgba(10,14,28,.92);overflow:auto;padding:16px}
.ed .box{max-width:760px;margin:0 auto;background:var(--pa);color:var(--ink);border-radius:6px;padding:16px 18px 20px}
.ed h2{margin:0 0 4px;font-size:16px;font-family:ui-monospace,Menlo,monospace}
.ed label{display:block;font-size:13px;font-weight:700;margin:12px 0 4px;color:#5a4a30}
.ed label small{font-weight:400;color:#7a6a4e}
.ed textarea{width:100%;min-height:72px;line-height:1.7;resize:vertical}
.ed input[type=text]{width:100%}
.ed .ds{display:grid;grid-template-columns:1fr 1fr 1fr;gap:6px}
@media (max-width:600px){.ed .ds{grid-template-columns:1fr}}
.ed .opts{display:flex;gap:14px;flex-wrap:wrap;align-items:center;margin-top:12px;font-size:14px}
.ed .opts label{display:flex;align-items:center;gap:6px;margin:0;font-weight:400}
.ed .opts input[type=checkbox]{width:22px;height:22px}
.ed .btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}
.warn{color:#b5302a;font-size:13px;margin:8px 0 0;min-height:1em}
.orig{font-size:12px;color:#7a6a4e;margin:4px 0 0;line-height:1.6;white-space:pre-wrap}
.pv{margin-top:14px;border:1px solid var(--line);border-radius:4px;padding:12px 14px;background:#fbf4e3}
.pv .hd{font-weight:700;color:#2f6a3f;margin:0 0 4px}
.pv .tx{margin:0;line-height:1.75}.pv .who{font-size:12px;font-weight:700;color:#8a2a25;margin-right:6px;letter-spacing:.1em}
.pv .exn{display:block;margin-top:8px;padding-top:8px;border-top:1px dashed rgba(138,42,37,.35)}
.exp pre{white-space:pre-wrap;word-break:break-all;background:#0c1122;color:#dfe6ff;padding:10px;border-radius:4px;max-height:50vh;overflow:auto;font-size:11px}
</style></head><body>
<header><h1>ドリルの編集</h1>
<select id="set" aria-label="範囲"></select>
<input id="q" placeholder="問題文・答え・解説で絞りこむ" aria-label="絞りこみ">
<button id="fCh">直した分だけ</button><button id="fN">一言あり</button><button id="fUn">採否未定</button><button id="fDel">削除した分</button>
<button id="imp">読み込む</button><button class="red" id="exp">書き出す</button></header>
<p class="note">問題をタップして直す → 「保存」。直した分はこの端末のゲームにすぐ反映されます（同じブラウザで開いたとき）。全員に反映するには「書き出す」でできたファイルを送ってください。受験対策の問題は、行の右の ○ / × で採否を決められます（採用にした問題だけが、のちに受験対策タブに出ます）。問題を削除するときは、問題を開いて右下の「この問題を削除」。</p>
<div class="count" id="cnt"></div>
<div class="list" id="g"></div>
<input type="file" id="file" accept=".json,application/json" hidden>
<script>
const KEY='errata_drill';let LOCAL={},ORIG={},ALL=[],VOLS=[],JU={},F={ch:false,n:false,un:false,del:false};
try{LOCAL=JSON.parse(localStorage.getItem(KEY)||'{}')}catch(e){}
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const $=s=>document.querySelector(s);
const FIELDS=['q','a','d','x','n','lv','ok'];
function save(){try{localStorage.setItem(KEY,JSON.stringify(LOCAL))}catch(e){alert('この端末に保存できませんでした（プライベートブラウズなどでは保存できません）')}}
const cur=id=>Object.assign({},ORIG[id],LOCAL[id]||{});
fetch('../index.html').then(r=>r.text()).then(t=>{
 const d=JSON.parse(t.match(/<script[^>]*id="errata-data"[^>]*>([\s\S]*?)<\/script>/)[1]);
 VOLS=d.vols;JU=d.JU||{};
 for(const q of d.Q){q._set='v:'+q.v;ORIG[q.id]=q;ALL.push(q.id)}
 for(const q of d.JQ||[]){q._set='u:'+q.u;q._jk=1;ORIG[q.id]=q;ALL.push(q.id)}
 const o=[['all','すべての問題']];for(const v of VOLS)o.push(['v:'+v.code,'ドリル：'+v.name]);
 if(d.JQ&&d.JQ.length){o.push(['jk','受験対策：すべて']);for(const[k,n]of Object.entries(JU))o.push(['u:'+k,'受験対策：'+n])}
 $('#set').innerHTML=o.map(([v,n])=>`<option value="${v}">${esc(n)}</option>`).join('');
 try{const s=sessionStorage.getItem('de_set');if(s)$('#set').value=s}catch(e){}
 draw()}).catch(()=>{$('#g').innerHTML='<p class="note">ゲームのデータを読み込めませんでした。GitHub Pages上のこのページを開いてください。</p>'});
function hit(q,w){return !w||[q.id,q.q,q.a,q.x,q.n||'',...(q.d||[])].some(s=>String(s).includes(w))}
function draw(){const set=$('#set').value,w=$('#q').value.trim();try{sessionStorage.setItem('de_set',set)}catch(e){}
 const ids=ALL.filter(id=>{const o=ORIG[id],q=cur(id);
  if(set==='jk'?!o._jk:set!=='all'&&o._set!==set)return false;
  if(F.ch&&!LOCAL[id])return false;if(F.del&&!q.del)return false;if(F.n&&!q.n)return false;
  if(F.un&&!(o._jk&&!LOCAL[id]?.hasOwnProperty('ok')))return false;
  return hit(q,w)});
 const MAX=300;
 $('#cnt').textContent=`${ids.length}問${ids.length>MAX?`（先頭の${MAX}問を表示。絞りこむとほかの問題も出ます）`:''}　／　この端末で直した問題：${Object.keys(LOCAL).length}問（うち削除${Object.values(LOCAL).filter(v=>v.del).length}問）`;
 $('#g').innerHTML=ids.slice(0,MAX).map(id=>{const o=ORIG[id],q=cur(id);
  const del=q.del,tags=[o._jk?`<span class="tag ${q.lv==='発展'?'adv':''}">${esc(JU[o.u]||o.u)}・${esc(q.lv)}</span>`:`<span class="tag">第${o.ch}章</span>`,q.del?'<span class="tag del">削除</span>':LOCAL[id]?'<span class="tag ch">直した</span>':'',q.n?'<span class="tag n">紙魚の一言</span>':''].join('');
  const yn=o._jk?`<div class="yn"><button class="yes ${q.ok===1&&LOCAL[id]&&'ok' in LOCAL[id]?'on':''}" data-yn="1" aria-label="採用">○</button><button class="no ${q.ok===0&&LOCAL[id]&&'ok' in LOCAL[id]?'on':''}" data-yn="0" aria-label="不採用">×</button></div>`:'';
  return `<div class="row${q.del?' del':''}" data-id="${esc(id)}"><div><div class="id">${esc(id)}</div><div class="q">${esc(q.q)}</div><div class="a">${esc(q.a)}</div><div class="tags">${tags}</div></div>${yn}</div>`}).join('');
 document.querySelectorAll('.row').forEach(r=>r.onclick=e=>{const b=e.target.closest('[data-yn]');const id=r.dataset.id;
  if(b){e.stopPropagation();setField(id,{ok:+b.dataset.yn});draw();return}edit(id)})}
/* 元と同じ値になった項目は消して、直した分だけを残す */
function setField(id,ch){const o=ORIG[id];const L=Object.assign({},LOCAL[id]||{},ch);
 for(const k of Object.keys(L)){if(JSON.stringify(L[k])===JSON.stringify(o[k]??(k==='n'?'':undefined))&&!(o._jk&&k==='ok'))delete L[k]}
 if(Object.keys(L).length)LOCAL[id]=L;else delete LOCAL[id];save()}
$('#q').oninput=draw;$('#set').onchange=draw;
for(const[k,b]of[['ch','#fCh'],['n','#fN'],['un','#fUn'],['del','#fDel']])$(b).onclick=e=>{F[k]=!F[k];e.target.classList.toggle('on',F[k]);draw()};
function edit(id){const o=ORIG[id],q=cur(id);const ed=document.createElement('div');ed.className='ed';
 ed.innerHTML=`<div class="box"><h2>${esc(id)}${q.del?'　<span style="color:#b5302a">（削除済み）</span>':''}</h2>
 <label>問題</label><textarea id="eq">${esc(q.q)}</textarea>${q.q!==o.q?`<p class="orig">元：${esc(o.q)}</p>`:''}
 <label>正解</label><input type="text" id="ea" value="${esc(q.a)}">${q.a!==o.a?`<p class="orig">元：${esc(o.a)}</p>`:''}
 <label>誤答（3つ）</label><div class="ds">${[0,1,2].map(i=>`<input type="text" class="ed-d" value="${esc((q.d||[])[i])}">`).join('')}</div>
 <label>解説 <small>（硬い文章で事実だけ。全問必須）</small></label><textarea id="ex">${esc(q.x)}</textarea>${q.x!==o.x?`<p class="orig">元：${esc(o.x)}</p>`:''}
 <label>紙魚の一言 <small>（任意。小ネタがあるときだけ。空にすると出ません）</small></label><textarea id="en">${esc(q.n||'')}</textarea>${(q.n||'')!==(o.n||'')?`<p class="orig">元：${esc(o.n||'（なし）')}</p>`:''}
 ${o._jk?`<div class="opts"><label>難易度 <select id="elv"><option${q.lv==='標準'?' selected':''}>標準</option><option${q.lv==='発展'?' selected':''}>発展</option></select></label>
 <label><input type="checkbox" id="eok"${q.ok===1?' checked':''}>採用する</label></div>`:''}
 <div class="pv" id="pv"></div><p class="warn" id="warn"></p>
 <div class="btns">${q.del?'<button class="red" id="ud">削除を取り消す</button>':'<button class="red" id="ok">保存</button>'}${LOCAL[id]&&!q.del?'<button id="rs">直す前に戻す</button>':''}<button id="cl">閉じる</button>${q.del?'':'<button id="dl" style="margin-left:auto;background:#3a2a28;color:#f3ead6">この問題を削除</button>'}</div></div>`;
 document.body.appendChild(ed);document.body.style.overflow='hidden';
 const val=()=>{const v={q:$('#eq').value.trim(),a:$('#ea').value.trim(),d:[...ed.querySelectorAll('.ed-d')].map(i=>i.value.trim()),x:$('#ex').value.trim(),n:$('#en').value.trim()};
  if(o._jk){v.lv=$('#elv').value;v.ok=$('#eok').checked?1:0}return v};
 const check=v=>{const w=[];if(!v.q)w.push('問題が空です');if(!v.a)w.push('正解が空です');if(v.d.some(x=>!x))w.push('誤答を3つ入れてください');
  if(v.d.includes(v.a))w.push('誤答に正解と同じものがあります');if(new Set(v.d).size<v.d.length)w.push('誤答が重複しています');if(!v.x)w.push('解説が空です');return w};
 const upd=()=>{const v=val();$('#pv').innerHTML=`<p class="hd">正解！　<small style="color:#6d5f4a;font-weight:400">正しくは「${esc(v.a)}」</small></p><p class="tx">${esc(v.x)}${v.n?`<span class="exn"><span class="who">シミ</span>${esc(v.n)}</span>`:''}</p>`;$('#warn').textContent=check(v).join('　')};
 ed.addEventListener('input',upd);ed.addEventListener('change',upd);upd();
 const close=()=>{ed.remove();document.body.style.overflow='';draw()};
 const ok=ed.querySelector('#ok');if(ok)ok.onclick=()=>{const v=val();const w=check(v);if(w.length){$('#warn').textContent=w.join('　');return}
  if(!o._jk){delete v.lv;delete v.ok}
  else if(!(LOCAL[id]&&'ok' in LOCAL[id])&&v.ok===o.ok)delete v.ok;/* 採否に触れていなければ未定のまま */
  setField(id,v);close()};
 const rs=ed.querySelector('#rs');if(rs)rs.onclick=()=>{if(confirm('この問題を直す前の状態に戻しますか？')){delete LOCAL[id];save();close()}};
 ed.querySelector('#cl').onclick=close;
 const dl=ed.querySelector('#dl');if(dl)dl.onclick=()=>{if(confirm(`「${q.q.slice(0,30)}${q.q.length>30?'…':''}」を削除しますか？\n（書き出して本体に取り込むまでは「削除した分」から取り消せます）`)){setField(id,{del:1});close()}};
 const ud=ed.querySelector('#ud');if(ud)ud.onclick=()=>{const L=Object.assign({},LOCAL[id]);delete L.del;if(Object.keys(L).length)LOCAL[id]=L;else delete LOCAL[id];save();close()}}
/* 書き出す：直した分だけを1問1行のJSONで。tools/apply_drill_edits.py で本体に取り込む */
$('#exp').onclick=()=>{const ids=Object.keys(LOCAL).filter(id=>ORIG[id]);if(!ids.length){alert('まだ直した問題がありません');return}
 const body='{\n'+ids.map(id=>JSON.stringify(id)+':'+JSON.stringify(LOCAL[id])).join(',\n')+'\n}\n';
 const ed=document.createElement('div');ed.className='ed exp';
 ed.innerHTML=`<div class="box"><h2>書き出し（${ids.length}問）</h2><p style="font-size:14px;line-height:1.7">「ファイルに保存」で保存したファイルを送ってください。コピーして貼りつけてもかまいません。</p>
 <div class="btns"><button class="red" id="dl">ファイルに保存</button><button id="cp">コピー</button><button id="cl">閉じる</button></div><pre>${esc(body)}</pre></div>`;
 document.body.appendChild(ed);
 ed.querySelector('#dl').onclick=()=>{const a=document.createElement('a');const d=new Date();a.download=`drill-edits_${d.getFullYear()}${String(d.getMonth()+1).padStart(2,'0')}${String(d.getDate()).padStart(2,'0')}.json`;
  a.href=URL.createObjectURL(new Blob([body],{type:'application/json'}));a.click();setTimeout(()=>URL.revokeObjectURL(a.href),2000)};
 ed.querySelector('#cp').onclick=async e=>{try{await navigator.clipboard.writeText(body);e.target.textContent='コピーしました'}catch(_){alert('コピーできませんでした。下の文字を長押しして選んでください')}};
 ed.querySelector('#cl').onclick=()=>ed.remove()};
/* 読み込む：別の端末で書き出したファイルを、この端末の直した分に重ねる */
$('#imp').onclick=()=>$('#file').click();
$('#file').onchange=e=>{const f=e.target.files[0];if(!f)return;f.text().then(t=>{let o;try{o=JSON.parse(t)}catch(_){alert('読み込めないファイルです');return}
 let n=0;for(const[id,v]of Object.entries(o))if(ORIG[id]&&v&&typeof v==='object'){LOCAL[id]=Object.assign({},LOCAL[id]||{},v);n++}
 save();alert(`${n}問ぶんの直しを読み込みました`);draw()});e.target.value=''};
</script>
</body></html>
